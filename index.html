      const ok = await UI.confirm({ title: 'Fechou!', text: `No Mapa 360, ${U.esc(nomeCurto(it.c))} passou a ter ${U.esc(it.produto.toLowerCase())} com você. Cadastrar o contrato agora?`, ok: 'Cadastrar contrato', danger: false });
      if (ok) { const ar = Cl.area(it.area), pid = (ar.prods[0] || '').split(':')[0], tipo = (ar.prods[0] || '').split(':')[1]; App.Forms.contrato(null, { produto: pid !== 'mb' ? pid : undefined, clienteId: it.c.id, ...(tipo ? { tipo } : {}) }); }
    }
  };
  Fu.abrir = it => {
    if (it.fonte === 'negocio') return App.Forms.detalhes(it.a.id);
    if (it.fonte === 'indicacao' && !C().ehCliente(it.c)) return App.Forms.indicacao({ existenteId: it.c.id });
    App.go('clientes', { cliente: it.clienteId }, { origem: true });
  };
  Fu.nova = () => App.Forms.atividade(null, { categoria: 'Negócios', prioridade: 'alta', responsabilidadeId: assessoria().id, respIds: [], _neg: true });

  /* ---------- Card do Painel ---------- */
  /* opts.topo = versão compacta no topo do Painel (junto dos indicadores); opts.rodape = HTML extra no fim do resumo */
  Fu.card = (filtroResp = [], opts = {}) => {
    const ass = assessoria().id, soNeg = filtroResp.length && !filtroResp.includes(ass);
    const l = Fu.itens().filter(it => it.fonte === 'negocio' ? M.noFiltro(it.a, filtroResp) : !soNeg);
    const tot = l.reduce((s, x) => s + (x.valor || 0), 0), liq = l.reduce((s, x) => s + (x.liq || 0), 0);
    return `<section class="card fu-card${opts.topo ? ' fu-top' : ''}" aria-label="Oportunidades"><div class="card-h"><h2>Oportunidades</h2><span class="grow"></span>${l.length ? `<span class="count">${l.length}</span>` : ''}<a class="link" href="#funil" data-go="funil">Abrir funil</a></div>
      ${l.length ? `<div class="fu-mini">${Fu.ETAPAS.map(e => { const xs = l.filter(x => x.etapa === e.id), v = xs.reduce((s, x) => s + (x.valor || 0), 0);
        return `<a href="#funil" data-go="funil" data-q="etapa=${e.id}" class="fu-mc${xs.length ? '' : ' vazio'}"><span>${e.label}</span><b>${xs.length}</b><small>${v ? U.brlShort(v) : '—'}</small></a>`; }).join('')}</div>
      <p class="fu-res">${tot ? `<b>${U.brlShort(tot)}</b> em aberto` : 'Sem valores estimados'}${liq ? ` · ≈ ${U.brlShort(liq)} ficam com você` : ''}${opts.rodape || ''}</p>`
      : `<div class="empty sm"><p>Nenhuma oportunidade aberta. Negócios das atividades, indicações em conversa e o Mapa 360 aparecem aqui.</p>${opts.rodape ? `<p class="fu-res">${opts.rodape}</p>` : ''}</div>`}</section>`;
  };

  /* ---------- Tela ---------- */
  const V = { titulo: 'Funil de oportunidades' };
  let fOrig = '', fEtapaMob = null;
  V.setParams = p => { if (p && p.etapa) fEtapaMob = p.etapa; };
  const cartao = it => `<li class="fu-it${it.atrasada ? ' is-late' : ''}" data-k="${U.esc(it.key)}">
      <button class="fu-main" data-fa="abrir"><b>${U.esc(it.nome)}</b><span class="fu-prod">${U.esc(it.produto)}</span>
        <span class="fu-org o-${it.origem}">${U.esc(it.origemTxt)}</span>
        ${it.valor != null ? `<span class="fu-val">${U.brl(it.valor)}${it.mensal ? ` <small>(${U.brl(it.valorMes)}/mês × 12)</small>` : ''}${it.liq != null ? `<small>fica ≈ ${U.brlC(it.liq)}</small>` : ''}</span>` : ''}
        ${it.prox || it.prazo ? `<span class="fu-prox">${it.prazo && it.fonte === 'negocio' ? `<em class="${it.atrasada ? 'late' : ''}">${U.relDue(it.prazo)}</em> ` : ''}${U.esc(it.prox || '')}</span>` : ''}</button>
      <div class="fu-acts"><select data-fa="etapa" aria-label="Etapa">${Fu.ETAPAS.map(e => `<option value="${e.id}"${e.id === it.etapa ? ' selected' : ''}>${e.label}</option>`).join('')}</select>
        <button class="fu-ok" data-fa="ganhou" title="Fechou">${UI.icon('check')}Fechou</button><button class="fu-no" data-fa="perdeu" title="Perdeu">Perdeu</button></div></li>`;

  V.render = el => {
    const todos = Fu.itens(), lista = todos.filter(it => !fOrig || it.origem === fOrig);
    const cont = o => todos.filter(it => it.origem === o).length;
    const tot = lista.reduce((s, x) => s + (x.valor || 0), 0), liq = lista.reduce((s, x) => s + (x.liq || 0), 0);
    const mesIni = U.today().slice(0, 8) + '01';
    const ganhosMes = Store.all('atividades').filter(a => a.status === 'concluida' && (a.concluidaEm || '').slice(0, 10) >= mesIni).flatMap(a => M.negociosDa(a).filter(n => n.resultado === 'ganho'));
    if (!fEtapaMob || !Fu.ETAPAS.some(e => e.id === fEtapaMob)) fEtapaMob = (Fu.ETAPAS.find(e => lista.some(x => x.etapa === e.id)) || Fu.ETAPAS[0]).id;
    el.innerHTML = `
      <div class="page-h"><div><h1>Funil de oportunidades</h1><p class="muted">Negócios das atividades, indicações em conversa e o Mapa 360 num lugar só. Mudar a etapa aqui atualiza a origem.</p></div>
        <button class="btn primary" id="fuNova">${UI.icon('mais')}Nova oportunidade</button></div>
      <section class="kpis k4">
        <div class="kpi"><span>Em aberto</span><b>${lista.length}</b></div>
        <div class="kpi"><span>Valor estimado</span><b>${U.brlShort(tot)}</b>${liq ? `<em>≈ ${U.brlShort(liq)} ficam com você</em>` : ''}</div>
        <div class="kpi"><span>Em proposta</span><b>${lista.filter(x => x.etapa === 'proposta').length}</b></div>
        <a class="kpi" href="#negocios" data-go="negocios"><span>Fechados no mês</span><b>${ganhosMes.length}</b><em>${ganhosMes.length ? U.brlShort(ganhosMes.reduce((s, n) => s + (+n.valor || 0), 0)) : 'negócios ganhos'}</em></a>
      </section>
      <div class="tchips"><button class="tchip${!fOrig ? ' on' : ''}" data-o="">Todas <b>${todos.length}</b></button>${Fu.ORIGENS.filter(o => cont(o.id)).map(o => `<button class="tchip${fOrig === o.id ? ' on' : ''}" data-o="${o.id}">${o.label} <b>${cont(o.id)}</b></button>`).join('')}</div>
      <div class="fu-tabs" role="tablist">${Fu.ETAPAS.map(e => `<button role="tab" data-et="${e.id}" aria-selected="${e.id === fEtapaMob}">${e.label}<b>${lista.filter(x => x.etapa === e.id).length}</b></button>`).join('')}</div>
      <div class="fu-board">${Fu.ETAPAS.map(e => { const xs = lista.filter(x => x.etapa === e.id).sort(Fu.ordem), v = xs.reduce((s, x) => s + (x.valor || 0), 0);
        return `<section class="fu-col${e.id === fEtapaMob ? ' on' : ''}" data-col="${e.id}"><div class="fu-ch"><b>${e.label}</b><span class="count">${xs.length}</span><span class="grow"></span><small>${v ? U.brlShort(v) : ''}</small></div>
          ${xs.length ? `<ul class="fu-list">${xs.map(cartao).join('')}</ul>` : '<p class="fu-vazio">Nada nesta etapa.</p>'}</section>`; }).join('')}</div>
      ${!todos.length ? `<div class="empty card"><b>Nenhuma oportunidade aberta.</b><p>Crie um negócio, registre uma indicação em conversa ou marque "Não tem" / "Mapeado" no Mapa 360 de um cliente.</p></div>` : ''}`;
    el.querySelector('#fuNova').onclick = Fu.nova;
    el.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { fOrig = b.dataset.o; V.render(el); });
    el.querySelectorAll('[data-et]').forEach(b => b.onclick = () => { fEtapaMob = b.dataset.et; el.querySelectorAll('[data-et]').forEach(x => x.setAttribute('aria-selected', x === b)); el.querySelectorAll('.fu-col').forEach(c => c.classList.toggle('on', c.dataset.col === fEtapaMob)); });
    const porKey = Object.fromEntries(lista.map(x => [x.key, x]));
    el.querySelectorAll('.fu-it').forEach(li => {
      const it = porKey[li.dataset.k];
      li.querySelector('[data-fa="abrir"]').onclick = () => Fu.abrir(it);
      li.querySelector('[data-fa="etapa"]').onchange = e => { fEtapaMob = e.target.value; Fu.mover(it, e.target.value); };
      li.querySelector('[data-fa="ganhou"]').onclick = () => Fu.fechar(it, true);
      li.querySelector('[data-fa="perdeu"]').onclick = () => Fu.fechar(it, false);
    });
  };

  App.Funil = Fu;
  App.Views = App.Views || {};
  App.Views.funil = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/faturamento.js */
/*
 * Tela: Faturamento. Fica só no menu lateral.
 * Abas: Resumo · Produção · Recebimentos (conferência do dia 15) · Recorrências e histórico · Linhas e produtos
 */
(function (App) {
  const { U, UI, Store, Fat } = App;
  const V = { titulo: 'Receitas' };
  const ABAS = [['resumo', 'Resumo'], ['producao', 'Produção'], ['recebimentos', 'Recebimentos'], ['recorrencias', 'Recorrências e histórico'], ['linhas', 'Linhas e produtos']];
  let aba = 'resumo', ano = new Date().getFullYear(), mesProd = null, mesRec = null, fLinha = '', rank = 'recebido';

  V.setParams = q => { if (q && q.aba) aba = q.aba; };

  const ldot = id => `<i class="ldot" style="background:${Fat.linhaCor(id)}"></i>`;
  const navMes = (id, ym) => `<div class="mnav"><button class="icon-btn" data-nav="${id}" data-d="-1" aria-label="Mês anterior">${UI.icon('voltar')}</button><b>${Fat.nomeMes(ym, true)}</b><button class="icon-btn flip" data-nav="${id}" data-d="1" aria-label="Próximo mês">${UI.icon('voltar')}</button></div>`;
  const linhaFiltro = () => `<select id="fLinha" aria-label="Linha de negócio">${UI.options(Fat.linhas(true).map(l => ({ id: l.id, label: l.nome })), fLinha, { vazio: 'Todas as linhas' })}</select>`;

  /* ---------- Resumo ---------- */
  function resumo() {
    const prox = Fat.proximoPagamento(), rp = Fat.resumoMes(prox), hoje = Fat.ymHoje();
    const prodMes = Fat.producoesDoMes(hoje), liqMes = prodMes.reduce((s, p) => s + Fat.liquidoTotal(p), 0), brMes = prodMes.reduce((s, p) => s + (+p.bruto || 0), 0);
    const meses = Array.from({ length: 12 }, (_, i) => { const ym = ano + '-' + String(i + 1).padStart(2, '0'); return { ym, ...Fat.totalMes(ym) }; });
    const anoAtual = String(new Date().getFullYear());
    let recAno = 0; for (let i = 1; i <= 12; i++) { const ym = anoAtual + '-' + String(i).padStart(2, '0'); if (ym <= hoje) recAno += Fat.totalMes(ym).recebido; }
    let futuro = 0; for (let i = 1; i <= 12; i++) futuro += Fat.totalMes(Fat.addMes(hoje, i)).aberto;
    const pend = Store.all('recebiveis').filter(Fat.pendente), pendV = pend.reduce((s, r) => s + (+r.previsto || 0), 0);
    const maxM = Math.max(...meses.map(m => m.recebido + m.aberto), 1);
    /* ranking das linhas no ano */
    const rk = {};
    if (rank === 'recebido') meses.forEach(m => Object.entries(Fat.resumoMes(m.ym).porLinha).forEach(([l, v]) => { rk[l] = (rk[l] || 0) + v.recebido; }));
    else Fat.producaoEntre(ano + '-01', ano + '-12').forEach(p => { rk[p.linhaId] = (rk[p.linhaId] || 0) + Fat.liquidoTotal(p); });
    const rkArr = Object.entries(rk).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]), rkTot = rkArr.reduce((s, [, v]) => s + v, 0) || 1;
    const linhasProx = Object.entries(rp.porLinha).sort((a, b) => (b[1].recebido + b[1].aberto) - (a[1].recebido + a[1].aberto));

    return `
      <div class="fat-top">
        <section class="card hero-pay">
          <span class="eyebrow">Você recebe em 15 de ${Fat.nomeMes(prox, true).replace(/ de \d+$/, '')}</span>
          <b class="big">${U.brlC(rp.recebido + rp.aberto)}</b>
          <span class="muted small">${rp.recebido ? `${U.brlC(rp.recebido)} já conferido · ` : ''}${U.plural(rp.itens.length, 'lançamento previsto', 'lançamentos previstos')}</span>
          ${linhasProx.length ? `<ul class="plin">${linhasProx.map(([l, v]) => `<li><span>${ldot(l)}${U.esc(Fat.linhaNome(l))}</span><b>${U.brlC(v.recebido + v.aberto)}</b></li>`).join('')}</ul>` : '<p class="muted small">Nenhum valor previsto. Lance a produção do mês para ver a previsão.</p>'}
          <button class="btn ghost sm" data-aba="recebimentos" data-mes="${prox}">Conferir recebimentos</button>
        </section>
        <div class="kpis k2">
          <div class="kpi"><span>Produção de ${Fat.nomeMes(hoje, true).replace(/ de \d+$/, '')} (líquido)</span><b>${U.brlShort(liqMes)}</b><em>${U.brlShort(brMes)} bruto · ${U.plural(prodMes.length, 'lançamento', 'lançamentos')}</em></div>
          <div class="kpi k-brand"><span>Recebido em ${new Date().getFullYear()}</span><b>${U.brlShort(recAno)}</b><em>até ${Fat.nomeMes(hoje)}</em></div>
          <div class="kpi"><span>A receber nos próximos 12 meses</span><b>${U.brlShort(futuro)}</b><em>parcelas e recorrências já previstas</em></div>
          <div class="kpi ${pend.length ? 'k-warn' : ''}"><span>Pendências</span><b>${pend.length}</b><em>${pend.length ? U.brlC(pendV) + ' previstos que não foram conferidos' : 'Nada atrasado'}</em></div>
        </div>
      </div>
      <div class="grid-main">
        <section class="card">
          <div class="card-h"><h2>Recebimentos de ${ano}</h2><div class="mnav"><button class="icon-btn" data-ano="-1" aria-label="Ano anterior">${UI.icon('voltar')}</button><b>${ano}</b><button class="icon-btn flip" data-ano="1" aria-label="Próximo ano">${UI.icon('voltar')}</button></div></div>
          <div class="mbars">${meses.map(m => { const t = m.recebido + m.aberto; return `<button class="mb${m.ym === hoje ? ' now' : ''}" data-aba="recebimentos" data-mes="${m.ym}" title="${Fat.nomeMes(m.ym, true)}: ${U.brlC(m.recebido)} recebido${m.aberto ? ' · ' + U.brlC(m.aberto) + ' em aberto' : ''}"><span class="mv">${t ? U.brlShort(t).replace('R$ ', '') : ''}</span><span class="stack" style="height:${t / maxM * 100}%"><i class="ab" style="flex:${m.aberto}"></i><i class="rc" style="flex:${m.recebido}"></i></span><small>${Fat.nomeMes(m.ym).slice(0, 3)}</small></button>`; }).join('')}</div>
          <div class="legend-l"><span><i class="rc"></i>Recebido</span><span><i class="ab"></i>Previsto em aberto</span></div>
        </section>
        <section class="card">
          <div class="card-h"><h2>Linhas de negócio</h2><div class="seg" role="group"><button data-rank="recebido" aria-pressed="${rank === 'recebido'}">Recebido</button><button data-rank="producao" aria-pressed="${rank === 'producao'}">Produção</button></div></div>
          ${rkArr.length ? `<ul class="tbars">${rkArr.map(([l, v], i) => `<li><div class="mrow"><span><b class="rkpos">${i + 1}º</b>${ldot(l)}${U.esc(Fat.linhaNome(l))}</span><b>${U.brlShort(v)} <span class="muted small">${Math.round(v / rkTot * 100)}%</span></b></div>${UI.bar(v / rkArr[0][1], Fat.linhaCor(l))}</li>`).join('')}</ul>` : `<p class="muted small">Sem ${rank === 'recebido' ? 'recebimentos' : 'produção'} em ${ano}.</p>`}
        </section>
      </div>`;
  }

  /* ---------- Produção ---------- */
  function producao() {
    const ym = mesProd || Fat.ymHoje();
    const lista = Fat.producoesDoMes(ym).filter(p => !fLinha || p.linhaId === fLinha).sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    const liq = lista.reduce((s, p) => s + Fat.liquidoTotal(p), 0), br = lista.reduce((s, p) => s + (+p.bruto || 0), 0);
    const grupos = {};
    lista.forEach(p => { const k = p.linhaId + '|' + p.produtoId; (grupos[k] = grupos[k] || []).push(p); });
    const ordem = Object.keys(grupos).sort((a, b) => { const la = Fat.linha(a.split('|')[0]) || {}, lb = Fat.linha(b.split('|')[0]) || {}; return (la.ordem || 50) - (lb.ordem || 50) || a.localeCompare(b); });
    return `
      <div class="toolbar">${navMes('prod', ym)}${linhaFiltro()}<span class="grow"></span><button class="btn primary" id="novaProd">${UI.icon('mais')}Lançar produção</button></div>
      <section class="kpis k3"><div class="kpi k-brand"><span>Líquido gerado</span><b>${U.brlShort(liq)}</b></div><div class="kpi"><span>Resultado bruto</span><b>${U.brlShort(br)}</b></div><div class="kpi"><span>Lançamentos</span><b>${lista.length}</b></div></section>
      ${ordem.length ? ordem.map(k => { const [l, pId] = k.split('|'), arr = grupos[k], tl = arr.reduce((s, p) => s + Fat.liquidoTotal(p), 0), tb = arr.reduce((s, p) => s + (+p.bruto || 0), 0);
        return `<section class="card pblock" style="--c:${Fat.linhaCor(l)}"><div class="card-h"><h2>${ldot(l)}${U.esc(Fat.linhaNome(l))} · ${U.esc(Fat.produtoNome(pId))}</h2><span class="muted small">${U.brlC(tb)} bruto · <b class="ink">${U.brlC(tl)} líquido</b></span></div>
          <div class="tw"><table class="ftable"><thead><tr><th>Data</th><th>Cliente</th><th class="r">Valor / aporte</th><th class="r">Comissão</th><th class="r">Bruto</th><th class="r">Líquido</th><th>Recebe</th></tr></thead><tbody>
          ${arr.map(p => { const ds = Fat.datas(p.data, p.regra, p.parcelas, p.grupo), v = Fat.valores(p), rec = Fat.recebidosDaProducao(p.id);
            return `<tr data-prod="${p.id}"><td>${U.fmtDate(p.data)}</td><td><b>${U.esc(p.cliente || '—')}</b>${p.observacoes ? `<br><span class="muted small">${U.esc(p.observacoes)}</span>` : ''}</td><td class="r">${p.valor != null ? U.brlC(p.valor) : '—'}</td><td class="r">${p.comissaoPct != null ? U.num(p.comissaoPct) + '%' : '—'}</td><td class="r">${p.bruto != null ? U.brlC(p.bruto) : '—'}</td>
              <td class="r"><b>${U.brlC(v.liq.reduce((s, x) => s + x, 0))}</b>${v.estimado ? '<br><span class="tag t-aviso">sem líquido</span>' : ''}${v.n > 1 ? `<br><span class="muted small">${v.n}x ${U.brlC(v.liq[0])}</span>` : ''}</td>
              <td><span class="small">${Fat.regraTxt(p.regra, p.parcelas, p.grupo)}</span><br><span class="muted small">${v.n > 1 ? `de ${U.fmtDate(ds[0])} a ${U.fmtDate(ds[ds.length - 1])}` : U.fmtDate(ds[0])}${rec ? ` · ${rec}/${v.n} recebida${rec > 1 ? 's' : ''}` : ''}</span></td></tr>`; }).join('')}
          </tbody></table></div></section>`; }).join('')
      : `<div class="empty card"><b>Nenhuma produção em ${Fat.nomeMes(ym, true)}.</b><p>Lance cada negócio com o cliente, o valor, o resultado bruto e o líquido. O faturamento calcula quando cada valor entra.</p><button class="btn primary" id="novaProd2">${UI.icon('mais')}Lançar produção</button></div>`}`;
  }

  /* ---------- Recebimentos (conferência do dia 15) ---------- */
  const TIPO_TAG = { recorrente: 'Recorrente', avulso: 'Avulso', historico: 'Histórico' };
  function recebimentos() {
    const ym = mesRec || Fat.proximoPagamento(), r = Fat.resumoMes(ym);
    const itens = r.itens.filter(x => !fLinha || x.linhaId === fLinha);
    const porL = {}; itens.forEach(x => (porL[x.linhaId] = porL[x.linhaId] || []).push(x));
    const linhasOrd = Object.keys(porL).sort((a, b) => ((Fat.linha(a) || {}).ordem || 50) - ((Fat.linha(b) || {}).ordem || 50));
    const abertos = itens.filter(x => x.status !== 'recebido');
    return `
      <div class="toolbar">${navMes('rec', ym)}${linhaFiltro()}<span class="grow"></span><button class="btn ghost" id="novoAv">${UI.icon('mais')}Avulso</button>${abertos.length ? `<button class="btn primary" id="todos">${UI.icon('check')}Marcar todos como recebidos</button>` : ''}</div>
      <section class="kpis k4"><div class="kpi"><span>Previsto</span><b>${U.brlShort(r.previsto)}</b><em>${U.brlC(r.previsto)}</em></div><div class="kpi k-brand"><span>Recebido</span><b>${U.brlShort(r.recebido)}</b></div><div class="kpi"><span>Em aberto</span><b>${U.brlShort(r.aberto)}</b></div><div class="kpi ${r.pendentes ? 'k-warn' : ''}"><span>Pendentes</span><b>${r.pendentes}</b><em>${r.pendentes ? 'passou da data e não foi conferido' : 'nada atrasado'}</em></div></section>
      ${linhasOrd.length ? linhasOrd.map(l => { const arr = porL[l].sort((a, b) => (a.cliente || a.descricao || '').localeCompare(b.cliente || b.descricao || '')), tp = arr.reduce((s, x) => s + (+x.previsto || 0), 0), tr = arr.reduce((s, x) => s + Fat.valorRecebido(x), 0);
        return `<section class="card"><div class="card-h"><h2>${ldot(l)}${U.esc(Fat.linhaNome(l))}</h2><span class="muted small">previsto ${U.brlC(tp)} · <b class="ink">recebido ${U.brlC(tr)}</b></span></div>
          <ul class="rlist">${arr.map(x => { const ok = x.status === 'recebido', dif = ok && x.recebido != null && Math.abs(x.recebido - x.previsto) >= 0.01;
            return `<li class="${ok ? 'ok' : Fat.pendente(x) ? 'late' : ''}" data-rid="${x.id}"><button class="check${ok ? ' on' : ''}" data-act="toggle" aria-label="${ok ? 'Desmarcar' : 'Marcar como recebido'}">${UI.icon('check')}</button>
              <div class="amain" data-act="${x.producaoId ? 'prod' : x.tipo === 'recorrente' ? 'rec' : x.tipo === 'avulso' ? 'av' : 'hist'}"><b>${U.esc(x.cliente || x.descricao)}</b><div class="pmeta"><span>${U.esc(x.cliente ? x.descricao : '')}</span>${x.total > 1 ? `<span class="tag t-neutro">${x.numero}/${x.total}</span>` : ''}${TIPO_TAG[x.tipo] ? `<span class="tag t-neutro">${TIPO_TAG[x.tipo]}</span>` : ''}${x.estimado ? '<span class="tag t-aviso">sem líquido</span>' : ''}${Fat.pendente(x) ? '<span class="tag t-erro">Pendente</span>' : ''}<span>${U.fmtDate(x.previstoEm)}</span></div></div>
              <div class="rvals"><span class="muted small">previsto</span><b>${U.brlC(x.previsto)}</b></div>
              <div class="rvals">${ok ? `<span class="muted small">recebido</span><input class="rin${dif ? ' dif' : ''}" data-num inputmode="decimal" value="${String(x.recebido ?? x.previsto).replace('.', ',')}" aria-label="Valor recebido" ${x.virtual ? 'disabled' : ''}>` : ''}</div></li>`; }).join('')}</ul></section>`; }).join('')
      : `<div class="empty card"><b>Nada previsto para ${Fat.nomeMes(ym, true)}.</b><p>Os valores aparecem aqui conforme você lança produção, recorrências e avulsos.</p></div>`}`;
  }

  /* ---------- Recorrências e histórico ---------- */
  function recorrencias() {
    const rcs = Store.all('recorrencias').slice().sort((a, b) => a.descricao.localeCompare(b.descricao));
    const hist = Store.all('recebiveis').filter(r => r.tipo === 'historico'), meses = [...new Set(hist.map(h => Fat.ym(h.previstoEm)))].sort().reverse();
    const ativa = rc => Fat.recorrenciaAtiva(rc, Fat.ymHoje()) || Fat.ym(rc.inicio) > Fat.ymHoje();
    return `
      <section class="card"><div class="card-h"><h2>Recorrências</h2><button class="btn primary sm" id="novaRc">${UI.icon('mais')}Nova recorrência</button></div>
        <p class="muted small" style="margin-top:-6px">Valores fixos todo mês, como Mensal Eqseed ou Recorrência Vida.</p>
        ${rcs.length ? `<ul class="rlist">${rcs.map(rc => `<li data-rc="${rc.id}" class="${ativa(rc) ? '' : 'ok'}"><span class="ldot big" style="background:${Fat.linhaCor(rc.linhaId)}"></span><div class="amain"><b>${U.esc(rc.descricao)}</b><div class="pmeta"><span>${U.esc(Fat.linhaNome(rc.linhaId))}</span><span>de ${Fat.nomeMes(Fat.ym(rc.inicio))}${rc.fim ? ' a ' + Fat.nomeMes(Fat.ym(rc.fim)) : ' sem fim definido'} · dia ${rc.dia || 15}</span>${ativa(rc) ? '' : '<span class="tag t-neutro">Encerrada</span>'}</div></div><div class="rvals"><span class="muted small">por mês</span><b>${U.brlC(rc.valor)}</b></div><button class="icon-btn" aria-label="Editar">${UI.icon('editar')}</button></li>`).join('')}</ul>` : '<p class="muted small">Nenhuma recorrência cadastrada.</p>'}
      </section>
      <section class="card"><div class="card-h"><h2>Histórico de recebimentos</h2><button class="btn primary sm" id="novoHi">${UI.icon('mais')}Lançar mês</button></div>
        <p class="muted small" style="margin-top:-6px">Quanto você recebeu em meses anteriores, por linha, para completar o ano.</p>
        ${meses.length ? `<div class="tw"><table class="ftable"><thead><tr><th>Mês</th>${Fat.linhas(true).map(l => `<th class="r">${U.esc(l.nome)}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
          ${meses.map(m => { const hs = hist.filter(h => Fat.ym(h.previstoEm) === m); return `<tr data-hi="${m}"><td><b>${Fat.nomeMes(m, true)}</b></td>${Fat.linhas(true).map(l => { const h = hs.find(x => x.linhaId === l.id); return `<td class="r">${h ? U.brlC(h.recebido) : '<span class="muted">—</span>'}</td>`; }).join('')}<td class="r"><b>${U.brlC(hs.reduce((s, h) => s + (+h.recebido || 0), 0))}</b></td></tr>`; }).join('')}
        </tbody></table></div>` : '<p class="muted small">Nenhum mês lançado.</p>'}
      </section>`;
  }

  /* ---------- Linhas e produtos ---------- */
  function linhas() {
    return `<div class="toolbar"><p class="muted small" style="margin:0">Cada produto define o % de comissão e quando você recebe. No lançamento você pode mudar.</p><span class="grow"></span><button class="btn primary" id="novaLinha">${UI.icon('mais')}Nova linha</button></div>
      <div class="lgrid">${Fat.linhas(true).map(l => `<section class="card lcard${l.ativa === false ? ' off' : ''}" style="--c:${l.cor}"><div class="card-h"><h2>${ldot(l.id)}${U.esc(l.nome)}</h2><div><button class="icon-btn" data-ed-linha="${l.id}" aria-label="Editar linha">${UI.icon('editar')}</button><button class="icon-btn" data-arq-linha="${l.id}" title="${l.ativa === false ? 'Reativar' : 'Arquivar'}" aria-label="${l.ativa === false ? 'Reativar' : 'Arquivar'}">${UI.icon('arquivo')}</button></div></div>
        <ul class="prods">${Store.all('produtos').filter(p => p.linhaId === l.id).sort((a, b) => a.nome.localeCompare(b.nome)).map(p => `<li data-ed-prod="${p.id}" class="${p.ativo === false ? 'off' : ''}"><b>${U.esc(p.nome)}</b><span class="muted small">${Fat.regraTxt(p.regra, p.parcelas, p.grupo)}${p.comissaoPct != null ? ' · ' + U.num(p.comissaoPct) + '% comissão' : ''}${p.pctComigo != null ? ' · fica ' + U.num(p.pctComigo) + '%' : ''}</span></li>`).join('')}</ul>
        <button class="link" data-novo-prod="${l.id}">+ Produto</button></section>`).join('')}</div>`;
  }

  V.render = el => {
    const corpo = { resumo, producao, recebimentos, recorrencias, linhas }[aba]();
    el.innerHTML = `<div class="page-h"><div><h1>Receitas</h1><p class="muted">O que você produziu, quando recebe e quanto já entrou.</p></div>${aba === 'resumo' ? `<button class="btn primary" id="novaProdTop">${UI.icon('mais')}Lançar produção</button>` : ''}</div>
      <nav class="tabs" role="tablist">${ABAS.map(([k, t]) => `<button role="tab" data-aba="${k}" aria-selected="${aba === k}">${t}</button>`).join('')}</nav>${corpo}`;

    const q = s => el.querySelector(s), on = (s, fn) => { const x = q(s); if (x) x.onclick = fn; };
    el.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { aba = b.dataset.aba; if (b.dataset.mes) mesRec = b.dataset.mes; V.render(el); });
    el.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { const d = +b.dataset.d; if (b.dataset.nav === 'prod') mesProd = Fat.addMes(mesProd || Fat.ymHoje(), d); else mesRec = Fat.addMes(mesRec || Fat.proximoPagamento(), d); V.render(el); });
    el.querySelectorAll('[data-ano]').forEach(b => b.onclick = () => { ano += +b.dataset.ano; V.render(el); });
    el.querySelectorAll('[data-rank]').forEach(b => b.onclick = () => { rank = b.dataset.rank; V.render(el); });
    const fl = q('#fLinha'); if (fl) fl.onchange = () => { fLinha = fl.value; V.render(el); };
    ['#novaProd', '#novaProd2', '#novaProdTop'].forEach(s => on(s, () => App.Forms.producao(null, mesProd && mesProd !== Fat.ymHoje() ? { data: mesProd + '-01' } : {})));
    el.querySelectorAll('[data-prod]').forEach(tr => tr.onclick = () => App.Forms.producao(tr.dataset.prod));
    on('#novoAv', () => App.Forms.avulso(null, { previstoEm: Fat.dia15(mesRec || Fat.proximoPagamento()) }));
    on('#todos', async () => {
      const ym = mesRec || Fat.proximoPagamento(), ab = Fat.doMes(ym).filter(x => x.status !== 'recebido' && (!fLinha || x.linhaId === fLinha));
      if (!(await UI.confirm({ title: 'Marcar todos como recebidos?', text: `${U.plural(ab.length, 'lançamento', 'lançamentos')} de ${Fat.nomeMes(ym, true)} somando <b>${U.brlC(ab.reduce((s, x) => s + (+x.previsto || 0), 0))}</b> serão marcados com o valor previsto. Você pode corrigir cada valor depois.`, ok: 'Marcar todos', danger: false }))) return;
      ab.forEach(x => Fat.marcarRecebido(x, null, true)); Store.commit(); UI.toast('Recebimentos conferidos');
    });
    el.querySelectorAll('.rlist [data-rid]').forEach(li => {
      const achar = () => Fat.doMes(mesRec || Fat.proximoPagamento()).find(x => x.id === li.dataset.rid);
      li.addEventListener('click', e => {
        const b = e.target.closest('[data-act]'); if (!b) return; const x = achar(); if (!x) return;
        if (b.dataset.act === 'toggle') { if (x.status === 'recebido') Fat.desmarcar(x); else { Fat.marcarRecebido(x); Store.commit(); } return; }
        if (b.dataset.act === 'prod') App.Forms.producao(x.producaoId);
        if (b.dataset.act === 'rec') App.Forms.recorrencia(x.recorrenciaId);
        if (b.dataset.act === 'av') App.Forms.avulso(x.id);
        if (b.dataset.act === 'hist') App.Forms.historico(Fat.ym(x.previstoEm));
      });
      const inp = li.querySelector('.rin');
      if (inp) inp.addEventListener('change', () => { const v = U.parseNum(inp.value); const x = achar(); if (v != null && x && !x.virtual) { Store.update('recebiveis', x.id, { recebido: v }); UI.toast('Valor recebido ajustado'); } });
    });
    on('#novaRc', () => App.Forms.recorrencia(null));
    el.querySelectorAll('[data-rc]').forEach(li => li.onclick = () => App.Forms.recorrencia(li.dataset.rc));
    on('#novoHi', () => App.Forms.historico());
    el.querySelectorAll('[data-hi]').forEach(tr => tr.onclick = () => App.Forms.historico(tr.dataset.hi));
    on('#novaLinha', () => App.Forms.linha(null));
    el.querySelectorAll('[data-ed-linha]').forEach(b => b.onclick = () => App.Forms.linha(b.dataset.edLinha));
    el.querySelectorAll('[data-arq-linha]').forEach(b => b.onclick = () => { const l = Fat.linha(b.dataset.arqLinha); Store.update('linhas', l.id, { ativa: l.ativa === false }); UI.toast(l.ativa === false ? 'Linha arquivada' : 'Linha reativada'); });
    el.querySelectorAll('[data-ed-prod]').forEach(li => li.onclick = () => App.Forms.produto(li.dataset.edProd));
    el.querySelectorAll('[data-novo-prod]').forEach(b => b.onclick = () => App.Forms.produto(null, b.dataset.novoProd));
  };

  App.Views = App.Views || {};
  App.Views.faturamento = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/metas.js */
/* Tela: Metas e indicadores. Atividade realizada ≠ resultado alcançado. */
(function (App) {
  const { U, M, UI, Store, Charts } = App;
  const V = { titulo: 'Metas' };
  let fResp = '', fPer = '', verEncerradas = false;

  V.setParams = q => { if (q && q.resp) fResp = q.resp; };

  const cartao = m => {
    const atual = M.metaAtual(m), p = M.metaPct(m), s = M.metaSituacao(m), t = M.metaTempo(m), cor = M.respCor(m.responsabilidadeId);
    const ats = M.metaAtividades(m.id), feitas = ats.filter(a => a.status === 'concluida');
    const regs = m.modo === 'manual' ? M.metaRegistros(m.id) : feitas.sort((a, b) => (a.concluidaEm || '').localeCompare(b.concluidaEm || '')).reduce((acc, a) => { acc.push((acc[acc.length - 1] || 0) + (M.resMeta(a, m.id) || 0)); return acc; }, []);
    const vals = m.modo === 'manual' ? regs.map(r => r.valor) : regs;
    const falta = Math.max(0, m.alvo - atual);
    return `<article class="card meta" data-id="${m.id}" style="--c:${cor}">
      <div class="meta-h"><div>${UI.respChip(m.responsabilidadeId)}<h3>${U.esc(m.nome)}</h3></div><span class="tag t-${s.id}">${s.label}</span></div>
      <div class="meta-num"><b>${U.num(atual)}</b><span>de ${U.num(m.alvo)} ${U.esc(m.unidade || '')}</span><em>${U.pct(p)}</em></div>
      <div class="meta-bar">${UI.bar(p, cor)}${t != null ? `<i class="tmark" style="left:${t * 100}%" title="Tempo decorrido do período"></i>` : ''}</div>
      <div class="meta-info small muted"><span>${M.period(m.periodicidade).label}${m.inicio && m.fim ? ' · ' + U.fmtDate(m.inicio) + ' a ' + U.fmtDate(m.fim) : ''}</span>${p < 1 ? `<span>Faltam ${U.num(falta)}</span>` : ''}</div>
      ${vals.length > 1 ? Charts.spark(vals, m.alvo) : ''}
      ${m.modo === 'atividades' ? `<div class="meta-acts-info"><span><b>${ats.length}</b> atividades vinculadas</span><span><b>${feitas.length}</b> realizadas</span><span><b>${U.num(atual)}</b> ${U.esc(m.unidade || 'resultados')} obtidos</span></div>` : ''}
      ${m.descricao ? `<p class="small muted">${U.esc(m.descricao)}</p>` : ''}
      <div class="meta-f">
        ${m.modo === 'manual' ? `<button class="btn primary sm" data-act="atualizar">Atualizar resultado</button>` : `<button class="btn ghost sm" data-act="nova-at">${UI.icon('mais')}Atividade para esta meta</button>`}
        <span class="grow"></span>
        <button class="icon-btn" data-act="ver" title="Ver atividades" aria-label="Ver atividades">${UI.icon('atividades')}</button>
        <button class="icon-btn" data-act="editar" title="Editar" aria-label="Editar">${UI.icon('editar')}</button>
        <button class="icon-btn" data-act="excluir" title="Excluir" aria-label="Excluir">${UI.icon('lixo')}</button>
      </div></article>`;
  };

  V.render = el => {
    const hoje = U.today();
    const todas = Store.all('metas').filter(m => (!fResp || m.responsabilidadeId === fResp) && (!fPer || m.periodicidade === fPer));
    const ativas = todas.filter(m => !(m.fim && m.fim < hoje)), enc = todas.filter(m => m.fim && m.fim < hoje);
    const lista = verEncerradas ? enc : ativas;
    el.innerHTML = `
      <div class="page-h"><div><h1>Metas</h1><p class="muted">Atividades são o que você faz. Metas medem o resultado que você alcança.</p></div>
        <button class="btn primary" id="novaMeta">${UI.icon('mais')}Nova meta</button></div>
      <div class="filters">
        <select id="mResp" aria-label="Responsabilidade">${UI.options(Store.all('responsabilidades').map(x => ({ id: x.id, label: x.nome })), fResp, { vazio: 'Todas as responsabilidades' })}</select>
        <select id="mPer" aria-label="Periodicidade">${UI.options(M.PERIODICIDADES, fPer, { vazio: 'Qualquer periodicidade' })}</select>
        <div class="seg" role="group"><button data-enc="0" aria-pressed="${!verEncerradas}">Ativas · ${ativas.length}</button><button data-enc="1" aria-pressed="${verEncerradas}">Encerradas · ${enc.length}</button></div>
      </div>
      ${lista.length ? `<div class="mgrid">${lista.map(cartao).join('')}</div>` : `<div class="empty card"><b>${verEncerradas ? 'Nenhuma meta encerrada.' : 'Nenhuma meta ativa.'}</b><p>Exemplos: conseguir 30 indicações, realizar 15 reuniões, prospectar 50 pessoas.</p>${verEncerradas ? '' : `<button class="btn primary" id="novaMeta2">${UI.icon('mais')}Criar meta</button>`}</div>`}`;
    el.querySelector('#novaMeta').onclick = () => App.Forms.meta(null);
    const n2 = el.querySelector('#novaMeta2'); if (n2) n2.onclick = () => App.Forms.meta(null);
    el.querySelector('#mResp').onchange = e => { fResp = e.target.value; V.render(el); };
    el.querySelector('#mPer').onchange = e => { fPer = e.target.value; V.render(el); };
    el.querySelectorAll('[data-enc]').forEach(b => b.onclick = () => { verEncerradas = b.dataset.enc === '1'; V.render(el); });
    el.querySelectorAll('.meta').forEach(c => c.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const id = c.dataset.id, mt = Store.get('metas', id);
      if (b.dataset.act === 'atualizar') App.Forms.atualizarMeta(id);
      if (b.dataset.act === 'editar') App.Forms.meta(id);
      if (b.dataset.act === 'nova-at') App.Forms.atividade(null, { responsabilidadeId: mt.responsabilidadeId, metaIds: [id] });
      if (b.dataset.act === 'ver') App.go('atividades', { status: '', resp: mt.responsabilidadeId, categoria: '', metaId: id }, { origem: true });
      if (b.dataset.act === 'excluir') {
        const n = M.metaAtividades(id).length;
        if (await UI.confirm({ title: 'Excluir meta?', text: `"${U.esc(mt.nome)}" e a evolução registrada serão apagadas.${n ? ` As ${n} atividades vinculadas continuam, só perdem o vínculo.` : ''}`, ok: 'Excluir meta' })) { M.excluirMeta(id); UI.toast('Meta excluída'); }
      }
    }));
  };

  App.Views = App.Views || {};
  App.Views.metas = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/responsabilidades.js */
/* Tela: Responsabilidades (cadastrar, editar, arquivar e excluir). */
(function (App) {
  const { U, M, UI, Store } = App;
  const V = { titulo: 'Responsabilidades' };
  let verArq = false;

  V.render = el => {
    const todas = Store.all('responsabilidades'), arq = todas.filter(r => r.status === 'arquivada'), ativas = todas.filter(r => r.status !== 'arquivada');
    const lista = verArq ? arq : ativas;
    el.innerHTML = `
      <div class="page-h"><div><h1>Responsabilidades</h1><p class="muted">As frentes da sua vida profissional e pessoal. Cada uma tem suas atividades e metas.</p></div>
        <button class="btn primary" id="novaResp">${UI.icon('mais')}Nova responsabilidade</button></div>
      <div class="filters"><div class="seg" role="group"><button data-arq="0" aria-pressed="${!verArq}">Ativas · ${ativas.length}</button><button data-arq="1" aria-pressed="${verArq}">Arquivadas · ${arq.length}</button></div></div>
      ${lista.length ? `<div class="respgrid">${lista.map(r => {
        const at = Store.where('atividades', a => M.temResp(a, r.id)), ab = at.filter(M.aberta), l = at.filter(M.atrasada).length, c = at.length - ab.length;
        const mts = Store.where('metas', m => m.responsabilidadeId === r.id);
        return `<article class="card resp" data-id="${r.id}" style="--c:${r.cor}">
          <div class="resp-h"><i class="dot"></i><h3>${U.esc(r.nome)}</h3>${r.status === 'arquivada' ? '<span class="tag t-neutro">Arquivada</span>' : ''}</div>
          ${r.descricao ? `<p class="muted small">${U.esc(r.descricao)}</p>` : ''}
          <div class="resp-nums"><div><b>${ab.length}</b><span>em aberto</span></div><div class="${l ? 'late' : ''}"><b>${l}</b><span>atrasadas</span></div><div><b>${c}</b><span>concluídas</span></div><div><b>${mts.length}</b><span>metas</span></div></div>
          ${UI.bar(at.length ? c / at.length : 0, r.cor)}
          <div class="meta-f">
            <button class="btn ghost sm" data-act="ativ">Atividades</button><button class="btn ghost sm" data-act="metas">Metas</button><span class="grow"></span>
            <button class="icon-btn" data-act="editar" title="Editar" aria-label="Editar">${UI.icon('editar')}</button>
            <button class="icon-btn" data-act="arquivar" title="${r.status === 'arquivada' ? 'Reativar' : 'Arquivar'}" aria-label="${r.status === 'arquivada' ? 'Reativar' : 'Arquivar'}">${UI.icon('arquivo')}</button>
            <button class="icon-btn" data-act="excluir" title="Excluir" aria-label="Excluir">${UI.icon('lixo')}</button>
          </div></article>`;
      }).join('')}</div>` : `<div class="empty card"><b>${verArq ? 'Nenhuma responsabilidade arquivada.' : 'Nenhuma responsabilidade cadastrada.'}</b><p>${verArq ? 'Arquive uma responsabilidade quando ela deixar de ser sua, sem perder o histórico.' : 'Comece pelas suas frentes, como Assessoria de Investimentos.'}</p></div>`}`;

    el.querySelector('#novaResp').onclick = () => App.Forms.resp(null);
    el.querySelectorAll('[data-arq]').forEach(b => b.onclick = () => { verArq = b.dataset.arq === '1'; V.render(el); });
    el.querySelectorAll('.resp').forEach(c => c.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const r = Store.get('responsabilidades', c.dataset.id);
      if (b.dataset.act === 'editar') App.Forms.resp(r.id);
      if (b.dataset.act === 'ativ') App.go('atividades', { resp: r.id, status: '' }, { origem: true });
      if (b.dataset.act === 'metas') App.go('metas', { resp: r.id }, { origem: true });
      if (b.dataset.act === 'arquivar') {
        const arquivar = r.status !== 'arquivada';
        if (arquivar && !(await UI.confirm({ title: 'Arquivar responsabilidade?', text: `"${U.esc(r.nome)}" sai do painel e dos cadastros novos. As atividades e metas continuam guardadas, e você pode reativar quando quiser.`, ok: 'Arquivar', danger: false }))) return;
        Store.update('responsabilidades', r.id, { status: arquivar ? 'arquivada' : 'ativa' }); UI.toast(arquivar ? 'Responsabilidade arquivada' : 'Responsabilidade reativada');
      }
      if (b.dataset.act === 'excluir') {
        const na = Store.where('atividades', a => M.temResp(a, r.id)).length, nm = Store.where('metas', m => m.responsabilidadeId === r.id).length;
        const ok = await UI.confirm({ title: 'Excluir responsabilidade?', text: `"${U.esc(r.nome)}" será apagada${na || nm ? ` junto com <b>${U.plural(na, 'atividade', 'atividades')}</b> e <b>${U.plural(nm, 'meta', 'metas')}</b>` : ''}. Isso não pode ser desfeito. Se quiser só tirar do caminho, use Arquivar.`, ok: 'Excluir tudo' });
        if (ok) { M.excluirResp(r.id); UI.toast('Responsabilidade excluída'); }
      }
    }));
  };

  App.Views = App.Views || {};
  App.Views.responsabilidades = V;
})(window.App = window.App || {});

</script>

        if (ok) { Backup.restaurar(r.dados); UI.toast('Backup restaurado'); App.go('painel'); }

    const ad = el.querySelector('#addDemo');

<script>
/* js/views/emails.js */
/* E-mails para responder: triados pelo Claude a partir do Outlook e gravados na tabela "emails".
   Registro: { msgId, remetente, remetenteEmail, assunto, resumo, motivo, prioridade, recebidoEm, link,
               sugestao, status: 'novo' | 'respondido' | 'arquivado', atividadeId, cliente, triadoEm,
               tipo: 'email' | 'convite', eventoId, evento: { inicio, fim, local, organizador }, conflito,
               rascunhoId, rascunhoLink,
               acao: { tipo: 'aceitar' | 'talvez' | 'recusar' | 'enviar', texto, comentario, status: 'pendente' | 'feito' | 'erro', pedidoEm, feitoEm, erro } }
   O painel só registra o pedido em "acao"; o Claude executa no Outlook na próxima leitura. */
(function (App) {
  const { U, M, UI, Store } = App;
  const E = {};
  const PESO = { alta: 3, media: 2, baixa: 1 };
  const PRIO = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };

  E.todos = () => Store.all('emails');
  E.pendente = e => !!(e.acao && e.acao.status === 'pendente');
  E.novos = () => E.todos().filter(e => (e.status || 'novo') === 'novo').sort((a, b) => E.pendente(a) - E.pendente(b) || E.ordem(a, b));
  /* Para responder = novos que ainda não estão na fila do Claude */
  E.paraResponder = () => E.novos().filter(e => !E.pendente(e));
  const ACAO = { aceitar: 'aceitar o convite', talvez: 'responder talvez', recusar: 'recusar o convite', enviar: 'enviar a resposta' };
  const ACAO_FEITA = { aceitar: 'Convite aceito', talvez: 'Respondido talvez', recusar: 'Convite recusado', enviar: 'Resposta enviada' };
  const DSEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  /* "sex 21/11 · 10:00–11:00" (horário como veio do Outlook) */
  E.quandoEvento = ev => {
    if (!ev || !ev.inicio) return '';
    const [d, h] = String(ev.inicio).split('T'), [y, m, dd] = d.split('-').map(Number), dt = new Date(y, m - 1, dd);
    const hf = ev.fim ? String(ev.fim).split('T')[1] : '';
    return `${DSEM[dt.getDay()]} ${String(dd).padStart(2, '0')}/${String(m).padStart(2, '0')}${h ? ' · ' + h.slice(0, 5) + (hf ? '–' + hf.slice(0, 5) : '') : ''}`;
  };
  E.pedir = (id, acao) => {
    Store.update('emails', id, { acao: { ...acao, status: 'pendente', pedidoEm: U.nowISO() } });
    UI.toast('Pedido registrado: o Claude vai ' + ACAO[acao.tipo] + ' na próxima leitura.', 'ok', { label: 'Cancelar', fn: () => E.cancelar(id) });
  };
  E.cancelar = id => Store.update('emails', id, { acao: null });
  const fila = e => {
    const a = e.acao; if (!a) return '';
    if (a.status === 'pendente') return `<span class="em-mfila">${UI.icon('adiar')}Na fila do Claude: ${ACAO[a.tipo] || a.tipo}</span>`;
    if (a.status === 'erro') return `<span class="em-mfila erro" title="${U.esc(a.erro || '')}">Não deu para ${ACAO[a.tipo] || a.tipo}${a.erro ? ': ' + U.esc(a.erro) : ''}</span>`;
    if (a.status === 'feito') return `<span class="em-mfila ok">${UI.icon('check')}${ACAO_FEITA[a.tipo] || 'Feito'} pelo Claude</span>`;
    return '';
  };
  const convite = e => e.tipo === 'convite' ? `<span class="em-mconv">${UI.icon('calendario')}Convite${e.evento ? ' · ' + U.esc(E.quandoEvento(e.evento)) : ''}</span>${e.conflito ? `<span class="em-mconf" title="${U.esc(e.conflito)}">Conflita: ${U.esc(e.conflito)}</span>` : ''}` : '';
  E.ordem = (a, b) => (PESO[b.prioridade] || 2) - (PESO[a.prioridade] || 2) || (b.recebidoEm || '').localeCompare(a.recebidoEm || '');
  E.ultimaLeitura = () => E.todos().reduce((m, e) => (e.triadoEm || '') > m ? e.triadoEm : m, '');
  /* Só abre links https (Outlook na web) */
  E.link = e => /^https:\/\//i.test(e.link || '') ? e.link : 'https://outlook.office.com/mail/';
  /* Com rascunho pronto, abre o rascunho; senão, o e-mail */
  E.linkAbrir = e => /^https:\/\//i.test(e.rascunhoLink || '') && (e.status || 'novo') === 'novo' ? e.rascunhoLink : E.link(e);

  /* "há 2 h", "ontem 14:10", "12 nov" */
  E.quando = iso => {
    if (!iso) return '';
    const d = new Date(iso), agora = new Date(), min = Math.round((agora - d) / 6e4);
    if (min < 1) return 'agora';
    if (min < 60) return 'há ' + min + ' min';
    if (min < 60 * 12 && d.toDateString() === agora.toDateString()) return 'há ' + Math.round(min / 60) + ' h';
    const hm = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === agora.toDateString()) return 'hoje ' + hm;
    const ont = new Date(agora); ont.setDate(agora.getDate() - 1);
    if (d.toDateString() === ont.toDateString()) return 'ontem ' + hm;
    return U.fmtDate(U.iso(d));
  };
  const ini = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();

  E.marcar = (id, status, msg) => {
    const e = Store.get('emails', id); if (!e) return;
    const antes = e.status || 'novo';
    Store.update('emails', id, { status, tratadoEm: status === 'novo' ? null : U.nowISO() });
    if (msg) UI.toast(msg, 'ok', { label: 'Desfazer', fn: () => Store.update('emails', id, { status: antes }) });
  };

  /* Linha de e-mail (compacta no Painel, completa na tela E-mails) */
  E.item = (e, compacto) => `<li class="em-mrow em-mp-${e.prioridade || 'media'}${(e.status || 'novo') !== 'novo' ? ' is-done' : ''}" data-eid="${e.id}">
      <span class="em-mav" aria-hidden="true">${U.esc(ini(e.remetente))}</span>
      <div class="em-mmain" data-ea="abrir">
        <div class="em-mtop"><b>${U.esc(e.remetente || e.remetenteEmail || 'Remetente')}</b><span class="em-mwhen">${E.quando(e.recebidoEm)}</span></div>
        <div class="em-msub">${U.esc(e.assunto || '(sem assunto)')}</div>
        <p class="em-mresumo">${U.esc(e.resumo || '')}</p>
        ${!compacto && e.motivo ? `<p class="em-mwhy">${UI.icon('seta')}${U.esc(e.motivo)}</p>` : ''}
        <div class="em-mtags">${convite(e)}${fila(e)}${e.rascunhoLink && !E.pendente(e) && (e.status || 'novo') === 'novo' ? '<span class="em-mdraft">rascunho pronto no Outlook</span>' : ''}${e.atividadeId && Store.get('atividades', e.atividadeId) ? `<span class="lig">virou atividade</span>` : ''}</div>
      </div>
      <div class="em-mact">
        <a class="icon-btn" href="${U.esc(E.linkAbrir(e))}" target="_blank" rel="noopener" title="Abrir no Outlook" aria-label="Abrir no Outlook">${UI.icon('externo')}</a>
        ${(e.status || 'novo') === 'novo'
          ? (E.pendente(e) ? `<button class="icon-btn" data-ea="cancelar" title="Cancelar pedido" aria-label="Cancelar pedido">${UI.icon('x')}</button>`
            : e.tipo === 'convite' && e.eventoId ? `<button class="em-mbtn" data-ea="aceitar" title="Pedir ao Claude para aceitar">Aceitar</button>`
            : `<button class="icon-btn" data-ea="ok" title="Já respondi" aria-label="Já respondi">${UI.icon('check')}</button>`)
            + (compacto ? '' : `<button class="icon-btn" data-ea="arq" title="Não precisa de resposta" aria-label="Não precisa de resposta">${UI.icon('arquivo')}</button>`)
          : `<button class="icon-btn" data-ea="volta" title="Voltar para responder" aria-label="Voltar para responder">${UI.icon('voltar')}</button>`}
      </div></li>`;

  E.ligar = root => root.querySelectorAll('.em-mrow').forEach(li => li.addEventListener('click', ev => {
    const b = ev.target.closest('[data-ea]'); if (!b) return; const id = li.dataset.eid;
    if (b.dataset.ea === 'abrir') E.detalhe(id);
    if (b.dataset.ea === 'ok') E.marcar(id, 'respondido', 'Marcado como respondido');
    if (b.dataset.ea === 'arq') E.marcar(id, 'arquivado', 'E-mail descartado');
    if (b.dataset.ea === 'volta') E.marcar(id, 'novo');
    if (b.dataset.ea === 'aceitar') E.pedir(id, { tipo: 'aceitar' });
    if (b.dataset.ea === 'cancelar') { E.cancelar(id); UI.toast('Pedido cancelado'); }
  }));

  /* Quadro do Painel */
  E.quadro = () => {
    const ns = E.novos(), ult = E.ultimaLeitura(), falta = E.paraResponder().length;
    return `<section class="card mail-card" aria-label="E-mails para responder">
      <div class="card-h"><h2>${UI.icon('email')}E-mails para responder</h2>${falta ? `<span class="count">${falta}</span>` : ''}</div>
      ${ns.length ? `<ul class="em-mlist">${ns.slice(0, 5).map(e => E.item(e, true)).join('')}</ul>`
        : `<div class="empty sm"><b>Caixa em dia.</b><p>Nenhum e-mail pedindo resposta${ult ? '' : ' ainda'}. No chat, peça: “olha meus e-mails”.</p></div>`}
      <div class="em-mfoot"><span class="muted small">${ult ? 'Lidos pelo Claude ' + E.quando(ult) : 'Aguardando a primeira leitura'}</span><a class="link" href="#emails" data-go="emails">${ns.length > 5 ? 'Ver todos (' + ns.length + ')' : 'Abrir e-mails'}</a></div>
    </section>`;
  };

  /* Detalhe: resumo, motivo, sugestão de resposta e ações */
  E.detalhe = id => {
    const e = Store.get('emails', id); if (!e) return;
    const novo = (e.status || 'novo') === 'novo', pend = E.pendente(e), conv = e.tipo === 'convite' && e.eventoId;
    const ev = e.evento || {};
    UI.modal({
      title: e.assunto || '(sem assunto)', size: 'md',
      body: `<div class="em-mdet">
        <div class="em-mdet-h"><span class="em-mav lg">${U.esc(ini(e.remetente))}</span><div><b>${U.esc(e.remetente || '')}</b>${e.remetenteEmail ? `<small>${U.esc(e.remetenteEmail)}</small>` : ''}</div>
          <div class="em-mdet-m"><span class="pill p-${e.prioridade || 'media'}">${PRIO[e.prioridade] || 'Média'}</span><small>${E.quando(e.recebidoEm)}</small></div></div>
        ${e.resumo ? `<div class="em-mbox"><span>Resumo</span><p>${U.esc(e.resumo)}</p></div>` : ''}
        ${e.motivo ? `<div class="em-mbox why"><span>Por que precisa de você</span><p>${U.esc(e.motivo)}</p></div>` : ''}
        ${fila(e) ? `<div class="em-mfila-box">${fila(e)}${pend ? '<small>O Claude executa na próxima leitura (por volta das 9h ou das 18h, em dias úteis). Com pressa? Diga “executa” num chat.</small>' : ''}</div>` : ''}
        ${conv ? `<div class="em-mbox ev"><span>Convite de reunião</span>
            <p><b>${U.esc(E.quandoEvento(ev))}</b>${ev.local ? '<br>' + U.esc(ev.local) : ''}${ev.organizador ? '<br>Organizador: ' + U.esc(ev.organizador) : ''}</p>
            ${e.conflito ? `<p class="em-mconf-t">${UI.icon('adiar')}Conflita com: ${U.esc(e.conflito)}</p>` : '<p class="em-mok-t">Sem conflito na sua agenda.</p>'}</div>
          <label class="f full"><span>Comentário para o organizador <em class="muted">opcional</em></span><input id="mCom" maxlength="300" placeholder="Ex.: Confirmado, levo a proposta impressa." value="${U.esc((e.acao && e.acao.comentario) || '')}"></label>`
        : `<label class="f full"><span>Resposta <em class="muted">${e.rascunhoLink ? 'o rascunho já está no Outlook; se editar aqui, o Claude atualiza antes de enviar' : 'edite à vontade'}</em></span><textarea id="mSug" rows="7">${U.esc((e.acao && e.acao.texto) || e.sugestao || '')}</textarea></label>`}
        <div class="em-mdet-b">${conv ? '' : `<button class="btn ghost sm" id="mCopy">${UI.icon('copiar')}Copiar resposta</button>`}${e.rascunhoLink && novo ? `<a class="btn ghost sm" href="${U.esc(e.rascunhoLink)}" target="_blank" rel="noopener">${UI.icon('editar')}Abrir rascunho no Outlook</a>` : ''}<a class="btn ghost sm" href="${U.esc(E.link(e))}" target="_blank" rel="noopener">${UI.icon('externo')}Abrir no Outlook</a>
          ${e.atividadeId && Store.get('atividades', e.atividadeId) ? `<button class="btn ghost sm" id="mAt">${UI.icon('seta')}Ver atividade</button>` : `<button class="btn ghost sm" id="mAt">${UI.icon('mais')}Virar atividade</button>`}</div>
      </div>`,
      footer: !novo ? `<button class="btn ghost" data-a="volta">${UI.icon('voltar')}Voltar para responder</button><button class="btn primary" data-close>Fechar</button>`
        : pend ? `<button class="btn ghost" data-a="cancelar">Cancelar pedido</button><button class="btn primary" data-close>Fechar</button>`
        : conv ? `<button class="btn ghost" data-a="recusar">Recusar</button><button class="btn ghost" data-a="talvez">Talvez</button><button class="btn primary" data-a="aceitar">${UI.icon('check')}Aceitar</button>`
        : `<button class="btn ghost" data-a="arq">Não precisa</button><button class="btn ghost" data-a="ok">Já respondi</button><button class="btn primary" data-a="enviar">${UI.icon('seta')}Enviar como está</button>`,
      onMount(el, api) {
        const sug = el.querySelector('#mSug') || { value: e.sugestao || '', addEventListener() {}, select() {} }, com = el.querySelector('#mCom');
        sug.addEventListener('change', () => Store.update('emails', id, { sugestao: sug.value }));
        const cp = el.querySelector('#mCopy'); if (cp) cp.onclick = async () => {
          try { await navigator.clipboard.writeText(sug.value); UI.toast('Resposta copiada. Cole no Outlook.'); }
          catch (er) { sug.select(); document.execCommand && document.execCommand('copy'); UI.toast('Resposta selecionada. Use Ctrl+C.'); }
        };
        el.querySelector('#mAt').onclick = () => {
          const at = e.atividadeId && Store.get('atividades', e.atividadeId);
          api.close();
          if (at) return App.Forms.detalhes(at.id);
          App.Forms.atividade(null, { titulo: 'Responder: ' + (e.assunto || e.remetente || 'e-mail'), descricao: [e.remetente && 'De: ' + e.remetente, e.resumo].filter(Boolean).join('\n'), cliente: e.cliente || null, prioridade: e.prioridade === 'alta' ? 'alta' : 'media', prazo: U.today(), _emailId: id });
        };
        el.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
          const a = b.dataset.a;
          if (a === 'enviar') {
            if (!sug.value.trim()) { UI.toast('Escreva a resposta antes de enviar.', 'aviso'); return; }
            const okEnv = await UI.confirm({ title: 'Enviar esta resposta?', text: `O Claude vai responder <b>${U.esc(e.remetente || e.remetenteEmail || '')}</b> no Outlook, na mesma conversa, com o texto que está aqui. Você pode cancelar até ele executar.`, ok: 'Pedir envio', danger: false });
            if (!okEnv) return;
          }
          if (sug.value !== (e.sugestao || '') && !conv) Store.update('emails', id, { sugestao: sug.value }, { silent: true });
          api.close();
          if (a === 'enviar') return E.pedir(id, { tipo: 'enviar', texto: sug.value });
          if (['aceitar', 'talvez', 'recusar'].includes(a)) return E.pedir(id, { tipo: a, comentario: com && com.value.trim() ? com.value.trim() : null });
          if (a === 'cancelar') { E.cancelar(id); return UI.toast('Pedido cancelado'); }
          if (b.dataset.a === 'ok') E.marcar(id, 'respondido', 'Marcado como respondido');
          if (b.dataset.a === 'arq') E.marcar(id, 'arquivado', 'E-mail descartado');
          if (b.dataset.a === 'volta') E.marcar(id, 'novo');
        });
      }
    });
  };

  /* Tela E-mails */
  let aba = 'novo', busca = '';
  const V = { titulo: 'E-mails' };
  V.render = el => {
    const todos = E.todos();
    const cont = { novo: 0, respondido: 0, arquivado: 0 };
    todos.forEach(e => { cont[e.status || 'novo'] = (cont[e.status || 'novo'] || 0) + 1; });
    const naFila = todos.filter(e => (e.status || 'novo') === 'novo' && E.pendente(e)).length;
    const q = M.norm(busca);
    const lista = todos.filter(e => (e.status || 'novo') === aba && (!q || M.norm([e.remetente, e.remetenteEmail, e.assunto, e.resumo, e.cliente].join(' ')).includes(q)))
      .sort(aba === 'novo' ? E.ordem : (a, b) => (b.tratadoEm || b.recebidoEm || '').localeCompare(a.tratadoEm || a.recebidoEm || ''));
    const ult = E.ultimaLeitura();
    el.innerHTML = `
      <div class="page-h"><div><h1>E-mails</h1><p class="muted">O Claude lê o seu Outlook e traz aqui só o que precisa de resposta sua, com resumo e sugestão de resposta.</p></div>
        <span class="muted small">${ult ? 'Última leitura: ' + E.quando(ult) : 'Ainda sem leitura'}${naFila ? ' · ' + U.plural(naFila, 'pedido na fila', 'pedidos na fila') : ''}</span></div>
      <div class="toolbar">
        <div class="seg-tabs">${[['novo', 'Para responder'], ['respondido', 'Respondidos'], ['arquivado', 'Descartados']].map(([k, l]) => `<button class="${aba === k ? 'on' : ''}" data-aba="${k}">${l} <b>${cont[k] || 0}</b></button>`).join('')}</div>
        <label class="search">${UI.icon('busca')}<input id="mBusca" placeholder="Buscar remetente, assunto ou cliente" value="${U.esc(busca)}"></label>
      </div>
      <section class="card">
        ${lista.length ? `<ul class="em-mlist full">${lista.map(e => E.item(e, false)).join('')}</ul>`
          : `<div class="empty"><b>${aba === 'novo' ? 'Nenhum e-mail pedindo resposta.' : 'Nada por aqui.'}</b><p>${aba === 'novo' ? 'Quando o Claude ler sua caixa, o que precisar de você aparece aqui. No chat, peça: “olha meus e-mails”.' : ''}</p></div>`}
      </section>`;
    el.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { aba = b.dataset.aba; V.render(el); });
    const inp = el.querySelector('#mBusca');
    inp.oninput = () => { busca = inp.value; const pos = inp.selectionStart; V.render(el); const n = el.querySelector('#mBusca'); n.focus(); n.setSelectionRange(pos, pos); };
    E.ligar(el);
  };

  App.Emails = E;
  App.Views = App.Views || {};
  App.Views.emails = V;
})(window.App = window.App || {});

</script>
