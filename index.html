  /* Ordem dos cards: investimentos, internacionais, proteção, outros */
  const ORDEM_P = ['mb', 'eqseed', 'zentis', 'previdencia', 'ita', 'stonex', 'dominion', 'vida', 're', 'auto', 'consorcio', 'cambio', 'credito'];
  C.PRODUTOS.sort((a, b) => (ORDEM_P.indexOf(a.id) + 1 || 99) - (ORDEM_P.indexOf(b.id) + 1 || 99));
  C.produto = id => C.PRODUTOS.find(p => p.id === id) || { id, nome: id, cor: '#5A6474', campos: [] };
  /* Todo produto (menos MB) tem o link do documento: a apólice/contrato fica no OneDrive, o painel guarda só o endereço */
  C.CAMPO_LINK = { k: 'link', l: 'Link da apólice / contrato (OneDrive)', t: 'url' };
  C.PRODUTOS.forEach(p => { if (!p.especial && !p.campos.some(c => c.k === 'link')) p.campos.push(C.CAMPO_LINK); });

  /* ---------- Produtos visíveis (Ajustes) e seguradoras ---------- */
  const OCULTOS_PADRAO = ['cambio', 'credito'];
  C.ocultos = () => { const o = Store.config('produtosOcultos'); return Array.isArray(o) ? o : OCULTOS_PADRAO; };
  C.visivel = pid => { const p = C.produto(pid); return !p.oculto && !C.ocultos().includes(pid); };
  C.alternarVisivel = (pid, on) => { const o = C.ocultos().filter(x => x !== pid); if (!on) o.push(pid); Store.config('produtosOcultos', o); };
  C.SEGURADORAS_PADRAO = ['Porto', 'Prudential', 'MAG', 'MetLife', 'Icatu', 'Azos', 'Omint', 'SulAmérica', 'Bradesco Seguros', 'Allianz', 'Tokio Marine', 'HDI', 'Mapfre', 'Zurich', 'Amil', 'Unimed', 'Brasilprev'];
  C.seguradoras = () => { const l = Store.config('seguradoras'); return Array.isArray(l) ? l : C.SEGURADORAS_PADRAO; };
  C.salvarSeguradoras = l => Store.config('seguradoras', [...new Set(l.map(x => String(x).trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR')));

  /* ---------- Mapa 360: o que o cliente tem em cada área ----------
     Situação por área: 'comigo' (vem sozinha quando há contrato ativo, ou marcada à mão) · 'mapeado' (tem com outro corretor/banco)
     · 'nao' (não tem = oportunidade) · 'na' (não se aplica) · sem registro = 'sem' (ainda não perguntado).
     Fica no cliente: mapa = { [area]: { sit, onde, venc, valor, etapa, obs, em } }. etapa (para 'nao' e 'mapeado'): a_abordar · abordado · proposta. */
  C.AREAS = [
    { id: 'vida', nome: 'Seguro de vida', prods: ['vida'], seguro: true },
    { id: 'saude', nome: 'Plano de saúde', prods: ['re:Plano de saúde', 'saude'], seguro: true },
    { id: 'auto', nome: 'Seguro auto', prods: ['auto'], seguro: true },
    { id: 'residencial', nome: 'Residencial', prods: ['re:Residencial'], seguro: true },
    { id: 'rc', nome: 'RC', prods: ['re:RC pessoal', 're:RC profissional', 'rc'], seguro: true },
    { id: 'vidagrupo', nome: 'Vida em grupo', prods: ['re:Seguro de vida em grupo'], seguro: true },
    { id: 'previdencia', nome: 'Previdência', prods: ['previdencia'] },
    { id: 'consorcio', nome: 'Consórcio', prods: ['consorcio'] },
    { id: 'internacional', nome: 'Internacional', prods: ['ita', 'stonex', 'dominion'] },
    { id: 'cripto', nome: 'Cripto (MB)', prods: ['mb'] },
    { id: 'startups', nome: 'Startups (Eqseed)', prods: ['eqseed'] },
    { id: 'zentis', nome: 'Zentis', prods: ['zentis'] },
    { id: 'cambio', nome: 'Câmbio', prods: ['cambio'] },
    { id: 'credito', nome: 'Crédito', prods: ['credito'] }
  ];
  C.SITS = { comigo: { label: 'Comigo', cor: '#23864F' }, mapeado: { label: 'Mapeado', cor: '#2B6CB0' }, nao: { label: 'Não tem', cor: '#C2611A' }, na: { label: 'Não se aplica', cor: '#8F88A6' }, sem: { label: 'Sem informação', cor: '#B9B3CC' } };
  /* Mesmas etapas do funil (Parte 3): a_abordar = Lead, abordado = Contato, reuniao, proposta; perdido = "Não quis agora" (sai do funil, volta quando mudar) */
  C.ETAPAS = [{ id: 'a_abordar', label: 'A abordar' }, { id: 'abordado', label: 'Abordado' }, { id: 'reuniao', label: 'Reunião' }, { id: 'proposta', label: 'Em proposta' }, { id: 'perdido', label: 'Não quis agora' }];
  C.area = id => C.AREAS.find(a => a.id === id);
  const prodDe = ref => ref.split(':')[0];
  C.areaVisivel = a => a.prods.some(r => C.visivel(prodDe(r)));
  C.areasVisiveis = () => C.AREAS.filter(C.areaVisivel);
  C.areasDoProduto = pid => C.AREAS.filter(a => a.prods.some(r => prodDe(r) === pid));
  /* Contratos ativos do cliente que contam para a área */
  C.contratosDaArea = (cli, a) => Store.all('contratos').filter(ct => ct.clienteId === cli.id && (ct.status || 'ativo') === 'ativo' && a.prods.some(r => { const [pid, tipo] = r.split(':'); return ct.produto === pid && (!tipo || ct.tipo === tipo); }));
  C.mapa = (cli, aid) => {
    const a = C.area(aid), cts = C.contratosDaArea(cli, a), reg = (cli.mapa || {})[aid] || null;
    if (cts.length) return { sit: 'comigo', auto: true, cts, reg };
    return reg && reg.sit ? { ...reg, auto: false, cts: [] } : { sit: 'sem', auto: false, cts: [] };
  };
  C.salvarMapa = (cliId, aid, dados) => {
    const c = C.cliente(cliId); if (!c) return;
    const mapa = { ...(c.mapa || {}) };
    if (!dados || !dados.sit || dados.sit === 'sem') delete mapa[aid];
    else mapa[aid] = { ...dados, em: U.today() };
    Store.update('clientes', cliId, { mapa });
  };
  /* Base para o Mapa 360: clientes de verdade (sem prospects e ex-clientes) */
  C.base360 = () => C.clientes().filter(c => !c.saiu);
  C.resumoArea = aid => { const r = { comigo: 0, mapeado: 0, nao: 0, na: 0, sem: 0 }; C.base360().forEach(c => r[C.mapa(c, aid).sit]++); return r; };
  /* Potenciais de um produto: quem não tem ou tem com outro, nas áreas desse produto (inclui prospects) */
  C.potenciais = pid => {
    const areas = C.areasDoProduto(pid), out = [];
    Store.all('clientes').filter(c => !c.saiu).forEach(c => areas.forEach(a => { const m = C.mapa(c, a.id); if (m.sit === 'nao' || m.sit === 'mapeado') out.push({ cli: c, area: a, m }); }));
    const peso = x => ({ proposta: 0, reuniao: 1, abordado: 2, a_abordar: 3, perdido: 5 }[x.m.etapa] ?? 4);
    return out.sort((a, b) => peso(a) - peso(b) || String(a.m.venc || '9').localeCompare(String(b.m.venc || '9')) || a.cli.nome.localeCompare(b.cli.nome, 'pt-BR'));
  };
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  C.MESES = MESES;

  /* Formata um campo para exibir */
  C.fmt = (campo, v) => {
    if (v == null || v === '') return '';
    switch (campo.t) {
      case 'brl': return U.brl(v);
      case 'usd': return 'US$ ' + (+v).toLocaleString('pt-BR', { minimumFractionDigits: +v % 1 ? 2 : 0, maximumFractionDigits: 2 });
      case 'num': return U.num(v);
      case 'data': return U.fmtDate(v);
      case 'sim': return v ? 'Sim' : 'Não';
      case 'mes': return MESES[(+v || 1) - 1] || '';
      default: return String(v);
    }
  };

  /* ---------- clientes ---------- */
  C.clientes = (todos) => Store.all('clientes').filter(c => todos || C.ehCliente(c)).slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  C.cliente = id => Store.get('clientes', id);
  C.contratos = (filtro = {}) => Store.all('contratos').filter(c => (!filtro.produto || c.produto === filtro.produto) && (!filtro.clienteId || c.clienteId === filtro.clienteId) && (filtro.todos || (c.status || 'ativo') === 'ativo'));
  C.apelido = c => c.apelido || (c.nome || '').split(' ')[0];
  C.porNome = nome => { const n = norm(nome); return n ? Store.all('clientes').find(c => norm(c.nome) === n) : null; };
  C.criar = (dados, opts) => Store.insert('clientes', { nome: dados.nome.trim(), apelido: dados.apelido || null, telefone: dados.telefone || null, email: dados.email || null, nascimento: dados.nascimento || null, observacoes: dados.observacoes || null }, opts);

  /* O texto "cliente" das atividades bate com este cliente? (nome completo, apelido ou primeiro nome único) */
  C.casa = (cli, texto) => {
    const t = norm(texto); if (!t) return false;
    const n = norm(cli.nome), ap = norm(C.apelido(cli));
    if (t === n || t === ap) return true;
    if (n.startsWith(t + ' ') && t.length >= 3) return Store.all('clientes').filter(o => norm(o.nome).startsWith(t + ' ') || norm(C.apelido(o)) === t).length === 1;
    return false;
  };
  C.atividadesDo = cli => Store.all('atividades').filter(a => a.clienteId ? a.clienteId === cli.id : a.cliente && C.casa(cli, a.cliente));
  C.emailsDo = cli => Store.all('emails').filter(e => (e.cliente && C.casa(cli, e.cliente)) || (cli.email && norm(e.remetenteEmail) === norm(cli.email)));
  C.receitaDo = cli => Store.all('producoes').filter(p => p.cliente && C.casa(cli, p.cliente)).reduce((s, p) => s + (+p.liquido || +p.bruto || 0), 0);

  /* ---------- vencimentos e avisos ---------- */
  /* Próxima data relevante do contrato (renovação, fim de vigência, reajuste) */
  /* Campo do contrato que define o vencimento (renovacao, fimVigencia, reajuste, pagoAte) */
  C.campoVenc = ct => { const p = C.produto(ct.produto); if (!p.venc) return null; return ct.produto === 're' && !ct.fimVigencia && ct.reajuste ? 'reajuste' : p.venc; };
  C.proxData = ct => {
    if ((ct.status || 'ativo') !== 'ativo') return null;
    const venc = C.campoVenc(ct); if (!venc) return null;
    const v = ct[venc]; if (!v) return null;
    if (venc === 'reajuste') { const hoje = new Date(), m = +v - 1; let y = hoje.getFullYear(); if (m < hoje.getMonth()) y++; return U.iso(new Date(y, m, 1)); }
    return v;
  };
  /* ITA: aportes pagos = anos entre a efetividade e o "pago até" */
  C.aportesITA = ct => { if (!ct.efetividade || !ct.pagoAte) return null; const a = U.parse(ct.efetividade), b = U.parse(ct.pagoAte); return Math.max(0, Math.round((b - a) / (365.25 * 864e5))); };
  C.extras = ct => { if (ct.produto !== 'ita') return []; const n = C.aportesITA(ct); return n == null ? [] : [['Aportes pagos', n + (ct.prazoAnos ? ' de ' + ct.prazoAnos : '') + (ct.contribuicao ? ' · US$ ' + (+ct.contribuicao * n).toLocaleString('pt-BR') + ' aportados' : '')]]; };
  C.rotuloVenc = ct => {
    if (ct.produto === 'ita') return 'Próximo aporte anual do plano' + (ct.contribuicao ? ' · US$ ' + (+ct.contribuicao).toLocaleString('pt-BR') : '');
    if (ct.produto === 're') return (ct.tipo || 'Ramos elementares') + (!ct.fimVigencia && ct.reajuste ? ' · reajuste' : ' · renovação');
    if (ct.produto === 'auto') return 'Renovação do seguro auto' + (ct.veiculo ? ' · ' + ct.veiculo : '');
    return ({ renovacao: 'Renovação do seguro de vida', fimVigencia: 'Fim da vigência do seguro RC', reajuste: 'Reajuste do plano de saúde' }[C.produto(ct.produto).venc] || 'Vencimento');
  };
  C.vencimentos = (dias = 60) => {
    const hoje = U.today(), lim = U.addDays(hoje, dias), out = [];
    Store.all('contratos').forEach(ct => {
      const d = C.proxData(ct); if (d && d >= U.addDays(hoje, -7) && d <= lim) out.push({ ct, data: d, cli: C.cliente(ct.clienteId), rotulo: C.rotuloVenc(ct) });
    });
    /* MB: renda fixa vencendo */
    const mb = C.mbAtual();
    if (mb) (mb.positions || []).forEach(ps => {
      const d = C.dataMB(ps.venc); if (!d || d < hoje || d > lim) return;
      const cl = (mb.clients || []).find(c => String(c.id) === String(ps.cid)); if (!cl) return;
      const cli = C.porMbId(ps.cid);
      out.push({ mb: true, data: d, cli, nomeMB: cl.nome, rotulo: `${ps.ativo} vence no MB · ${U.brl(ps.saldo)}` });
    });
    /* Mapa 360: o que o cliente tem com outro corretor e vence (oportunidade de trazer) */
    Store.all('clientes').forEach(cli => Object.entries(cli.mapa || {}).forEach(([aid, r]) => {
      if (r.sit !== 'mapeado' || !r.venc || r.venc < U.addDays(hoje, -7) || r.venc > lim) return; const a = C.area(aid); if (!a) return;
      out.push({ mapa: true, data: r.venc, cli, rotulo: `${a.nome} com ${r.onde || 'outro corretor'} · mapeado, oportunidade` });
    }));
    out.push(...C.avisosConsorcio());
    return out.sort((a, b) => a.data.localeCompare(b.data));
  };
  /* Consórcio na última parcela (aviso, não é renovação) */
  C.avisosConsorcio = () => Store.all('contratos').filter(c => c.produto === 'consorcio' && (c.status || 'ativo') === 'ativo' && c.prazo && c.pagas != null && +c.prazo - +c.pagas <= 1 && +c.prazo - +c.pagas >= 0)
    .map(ct => ({ ct, data: U.today(), cli: C.cliente(ct.clienteId), rotulo: 'Consórcio na última parcela', aviso: true }));

  /* ---------- MB ---------- */
  C.dataMB = s => { const m = /^(\d{2})\/(\d{2})\/(\d{2,4})$/.exec(String(s || '').trim()); if (!m) return null; const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2]}-${m[1]}`; };
  C.mbMeses = () => Store.all('mb').slice().sort((a, b) => b.id.localeCompare(a.id));
  C.mbAtual = () => C.mbMeses()[0] || null;
  C.porMbId = mbId => { const ct = Store.all('contratos').find(c => c.produto === 'mb' && String(c.mbId) === String(mbId)); return ct ? C.cliente(ct.clienteId) : null; };
  C.mbDoCliente = cli => { const mb = C.mbAtual(); if (!mb) return null; const ct = Store.all('contratos').find(c => c.produto === 'mb' && c.clienteId === cli.id); if (!ct) return null; return (mb.clients || []).find(c => String(c.id) === String(ct.mbId)) || null; };
  const MES_ID = { janeiro: '01', fevereiro: '02', marco: '03', abril: '04', maio: '05', junho: '06', julho: '07', agosto: '08', setembro: '09', outubro: '10', novembro: '11', dezembro: '12' };
  C.idDoRef = ref => { const m = /([a-zç]+)\s*\/\s*(\d{4})/i.exec(norm(ref)); return m && MES_ID[m[1]] ? m[2] + '-' + MES_ID[m[1]] : null; };

  /* Lê o arquivo do mês: o dashboard HTML do MB (const D = {...}) ou um JSON no mesmo formato */
  C.lerArquivoMB = texto => {
    let d = null;
    try { d = JSON.parse(texto); } catch (e) {
      const m = /const\s+D\s*=\s*(\{[\s\S]*?\});\s*\n/.exec(texto);
      if (m) try { d = JSON.parse(m[1]); } catch (e2) { d = null; }
    }
    if (!d || !Array.isArray(d.clients) || !d.ref) throw new Error('Não encontrei os dados da carteira neste arquivo.');
    const id = C.idDoRef(d.ref); if (!id) throw new Error('Não consegui ler o mês de referência ("' + d.ref + '").');
    return { id, dados: d };
  };
  C.importarMB = ({ id, dados }) => {
    const ja = Store.get('mb', id);
    const rec = { ref: dados.ref, cdi: dados.cdi || null, ipca: dados.ipca ?? null, clients: dados.clients, positions: dados.positions || [], importadoEm: U.nowISO() };
    if (ja) Store.update('mb', id, rec, { silent: true }); else Store.insert('mb', { id, ...rec }, { silent: true });
    const novos = C.ligarClientesMB(dados, { silent: true });
    Store.commit();
    return { substituiu: !!ja, novos };
  };
  /* Cada cliente do MB vira (ou se liga a) um cliente da base, com o produto MB */
  C.ligarClientesMB = (dados, opts = {}) => {
    let novos = 0;
    (dados.clients || []).forEach(c => {
      if (Store.all('contratos').some(ct => ct.produto === 'mb' && String(ct.mbId) === String(c.id))) return;
      let cli = C.porNome(c.nome);
      if (!cli) { cli = C.criar({ nome: titulo(c.nome) }, { silent: true }); novos++; }
      Store.insert('contratos', { clienteId: cli.id, produto: 'mb', mbId: String(c.id), status: 'ativo' }, { silent: true });
    });
    if (!opts.silent) Store.commit();
    return novos;
  };
  const MIN = ['de', 'da', 'do', 'das', 'dos', 'e'];
  const titulo = s => String(s).toLowerCase().split(' ').map((w, i) => i && MIN.includes(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

  /* Resumo de cada produto para os cards */
  C.resumo = pid => {
    const p = C.produto(pid);
    if (pid === 'mb') {
      const mb = C.mbAtual(); if (!mb) return { n: 0, linhas: ['Importe o primeiro mês'] };
      const pl = mb.clients.reduce((s, c) => s + (+c.pl || 0), 0), cdi = mb.cdi ? mb.cdi[0] : null;
      return { n: mb.clients.length, valor: pl, linhas: ['Posição de ' + mb.ref, cdi != null ? `CDI do mês ${U.num(cdi)}%` : ''].filter(Boolean) };
    }
    const cts = C.contratos({ produto: pid }), clis = new Set(cts.map(c => c.clienteId));
    const soma = p.principal ? cts.reduce((s, c) => s + (+c[p.principal] || 0), 0) : 0;
    const linhas = [];
    if (pid === 'consorcio') linhas.push(U.plural(cts.length, 'cota', 'cotas'), `${cts.filter(c => c.contemplado).length} contemplada(s)`);
    if (pid === 'vida') linhas.push(U.plural(cts.length, 'apólice', 'apólices'), 'Prêmio ' + U.brl(cts.reduce((s, c) => s + (+c.premio || 0), 0)) + '/mês');
    if (pid === 're') { const t = {}; cts.forEach(c => { const k = c.tipo || 'Outros'; t[k] = (t[k] || 0) + 1; }); linhas.push(...(Object.keys(t).length ? Object.entries(t).map(([k, n]) => n + ' ' + k) : ['RC, saúde e vida em grupo']));
      const mes = cts.reduce((a, c) => a + (+c.premio || 0) / (c.periodicidade === 'Anual' ? 12 : 1), 0); if (mes) linhas.push('≈ ' + U.brl(mes) + '/mês em prêmios'); }
    if (pid === 'rc') linhas.push(U.plural(cts.length, 'apólice', 'apólices'));
    if (pid === 'saude') linhas.push(U.plural(cts.reduce((s, c) => s + (+c.vidas || 0), 0), 'vida', 'vidas'));
    if (pid === 'eqseed') linhas.push(U.plural(cts.length, 'investimento', 'investimentos'), U.plural(new Set(cts.map(c => c.startup).filter(Boolean)).size, 'startup', 'startups'));
    if (pid === 'ita') linhas.push('US$ ' + cts.reduce((s, c) => s + (+c.valorConta || 0), 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' em conta', 'US$ ' + cts.reduce((s, c) => s + (+c.contribuicao || 0), 0).toLocaleString('pt-BR') + '/ano de aportes');
    const avisos = App.Ren ? App.Ren.abertas().filter(r => r.produto === pid).length : C.vencimentos(30).filter(v => v.ct && v.ct.produto === pid).length;
    return { n: clis.size, valor: soma, linhas, avisos };
  };


  /* ---------- Indicações ----------
     No cliente: indicadoPor (id de quem indicou), situacao ('sim' rodou | 'parcial' | 'nao' não rodou | 'conversa'),
     relacao ('cliente' | 'prospect': indicado que ainda não é cliente), dataIndicacao, geracao (só quando o indicador é desconhecido). */
  C.SITUACOES = [{ id: 'sim', label: 'Rodou', cor: '#23864F' }, { id: 'parcial', label: 'Rodou em parte', cor: '#7FA83A' }, { id: 'conversa', label: 'Em conversa', cor: '#6E3FF0' }, { id: 'nao', label: 'Não rodou', cor: '#C2611A' }];
  C.situacao = id => C.SITUACOES.find(s => s.id === id) || null;
  C.ehCliente = c => c.relacao !== 'prospect';
  C.indicador = c => c && c.indicadoPor ? C.cliente(c.indicadoPor) : null;
  C.filhosDe = id => Store.all('clientes').filter(x => x.indicadoPor === id).sort((a, b) => (a.dataIndicacao || a.criadoEm || '').localeCompare(b.dataIndicacao || b.criadoEm || '') || a.nome.localeCompare(b.nome, 'pt-BR'));
  /* Cadeia até a raiz: [quem indicou, quem indicou quem indicou, ...] */
  C.cadeia = c => { const out = [], vis = new Set([c.id]); let x = C.indicador(c); while (x && !vis.has(x.id)) { out.push(x); vis.add(x.id); x = C.indicador(x); } return out; };
  C.geracao = c => c.geracao && !c.indicadoPor ? +c.geracao : C.cadeia(c).length + 1;
  /* Todos os descendentes (filhos, netos...) */
  C.rede = c => { const out = [], fila = [c.id], vis = new Set([c.id]); while (fila.length) { const id = fila.shift(); C.filhosDe(id).forEach(f => { if (!vis.has(f.id)) { vis.add(f.id); out.push(f); fila.push(f.id); } }); } return out; };
  C.converteu = c => c.situacao === 'sim' || c.situacao === 'parcial' || (!c.situacao && C.ehCliente(c));
  /* Patrimônio com você (R$): MB + Eqseed ativos */
  /* XP (24/11): por compliance não entra carteira; só o PL total digitado pelo usuário. clientes.dados.xp = { pl, em }, xpHist = [{ ref: 'AAAA-MM', pl, cap, em }] (cap = captação líquida do mês, Parte 5b) */
  C.plXp = c => c && c.xp && c.xp.pl != null && c.xp.pl !== '' ? +c.xp.pl : null;
  /* cap = captação líquida do mês na XP (opcional, Parte 5b); undefined mantém a já gravada no mesmo mês */
  C.salvarXp = (cid, pl, em, opts, cap) => {
    const c = C.cliente(cid); if (!c) return; const data = em || U.today();
    if (pl == null || pl === '') { Store.update('clientes', cid, { xp: null }, opts); return; }
    const ja = (c.xpHist || []).find(h => h.ref === data.slice(0, 7)), capF = cap === undefined ? (ja ? ja.cap : undefined) : cap;
    const hist = (c.xpHist || []).filter(h => h.ref !== data.slice(0, 7)).concat({ ref: data.slice(0, 7), pl: +pl, em: data, ...(capF != null && capF !== '' ? { cap: +capF } : {}) }).sort((a, b) => b.ref.localeCompare(a.ref)).slice(0, 36);
    Store.update('clientes', cid, { xp: { pl: +pl, em: data }, xpHist: hist }, opts);
  };
  /* Patrimônio com você (R$): MB + Eqseed ativos + PL da XP (manual) */
  C.patrimonio = c => { const m = C.mbDoCliente(c); const eq = C.contratos({ clienteId: c.id, produto: 'eqseed' }).reduce((s, x) => s + (+x.valor || 0), 0); return (m ? +m.pl : 0) + eq + (C.plXp(c) || 0); };
  C.rankingIndicacoes = () => Store.all('clientes').map(c => {
    const dir = C.filhosDe(c.id); if (!dir.length) return null;
    const rede = C.rede(c), conv = rede.filter(C.converteu);
    return { c, diretas: dir.length, diretasConv: dir.filter(C.converteu).length, rede: rede.length, redeConv: conv.length, patrimonio: conv.reduce((s, x) => s + C.patrimonio(x), 0), geracoes: Math.max(...rede.map(x => C.geracao(x) - C.geracao(c))) };
  }).filter(Boolean).sort((a, b) => b.rede - a.rede || b.redeConv - a.redeConv || b.diretas - a.diretas);
  /* Salva uma indicação: cria a pessoa (se não existir) ligada a quem indicou */
  C.registrarIndicacao = ({ nome, indicadorId, situacao, data, observacoes, existenteId }) => {
    const rel = situacao === 'sim' || situacao === 'parcial' ? 'cliente' : 'prospect';
    if (existenteId) { const x = C.cliente(existenteId), temProduto = C.contratos({ clienteId: existenteId, todos: true }).length > 0;
      Store.update('clientes', existenteId, { indicadoPor: indicadorId || null, situacao, dataIndicacao: data || x.dataIndicacao || null, relacao: temProduto ? 'cliente' : rel, observacoes: observacoes || x.observacoes || null }); return C.cliente(existenteId); }
    return Store.insert('clientes', { nome: nome.trim(), indicadoPor: indicadorId || null, situacao, relacao: rel, dataIndicacao: data || U.today(), observacoes: observacoes || null });
  };

  App.Cli = C;
})(window.App = window.App || {});

</script>
<script>
/* js/core/patrimonio.js */
/* Parte 5b · Patrimônio mês a mês e captação líquida, por cliente e plataforma.
   Nada novo no banco: lê o que já existe.
   - MB: retrato do mês importado (tabela mb, id 'AAAA-MM') ou o histórico de 12 meses que vem dentro do retrato mais recente
         (cliente.hist = [['Out/26', saldo inicial, aportes, resgates, saldo final], ...]). Captação = aportes − resgates.
   - XP: clientes.dados.xpHist = [{ ref, pl, cap, em }] digitado pelo usuário (cap = captação líquida do mês, opcional).
   - Eqseed: valor investido (custo) dos investimentos com data até o fim do mês, sem "Saída"/"Perda". Captação = investido no mês.
   - Exterior (ITA, StoneX, Dominion) em US$: contratos.dados.posHist = [{ ref, v }] (gravado ao salvar o produto) ou o valor atual
     a partir do mês da "Posição em". Captação = aporte do ITA com baixa "Aporte pago" na renovação naquele mês (contribuição anual).
     Conversão pela cotação do mês: Store.config('cotacaoUsd') = { 'AAAA-MM': 5.40 }.
   Só contratos ativos (produto encerrado sai de todos os meses).
   Mês sem dado novo repete a última posição conhecida (marcado como "repetido"), e nesse caso a captação não conta. */
(function (App) {
  const { U, Store } = App;
  const P = {};
  const C = () => App.Cli;
  const MES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  P.INTL = ['ita', 'stonex', 'dominion'];
  /* cores validadas (claro, daltonismo e visão normal) no validador da skill de gráficos em 24/11 */
  P.PLATS = [
    { id: 'mb', nome: 'MB', cor: '#12938A' },
    { id: 'xp', nome: 'XP', cor: '#3A62D8' },
    { id: 'eqseed', nome: 'Eqseed', cor: '#C048B5' },
    { id: 'intl', nome: 'Exterior', sub: 'ITA · StoneX · Dominion', cor: '#E08A1E' }
  ];
  P.rotulo = ref => { const [y, m] = ref.split('-'); return MES[+m - 1] + '/' + y.slice(2); };
  P.refDoRotulo = s => { const m = /^([A-Za-zç]{3})\/(\d{2})$/.exec(String(s || '').trim()); if (!m) return null; const i = MES.findIndex(x => x.toLowerCase() === m[1].toLowerCase()); return i < 0 ? null : '20' + m[2] + '-' + String(i + 1).padStart(2, '0'); };
  P.mesAnt = ref => { let [y, m] = ref.split('-').map(Number); m--; if (!m) { m = 12; y--; } return y + '-' + String(m).padStart(2, '0'); };
  P.mesSeg = ref => { let [y, m] = ref.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return y + '-' + String(m).padStart(2, '0'); };
  P.fimDoMes = ref => { const [y, m] = ref.split('-').map(Number); return U.iso(new Date(y, m, 0, 12)); };
  P.nomeMes = ref => { const n = App.Fat ? App.Fat.nomeMes(ref, true) : ref; return n.charAt(0).toUpperCase() + n.slice(1); };

  /* ---------- Cotação do dólar ---------- */
  P.cotacoes = () => Store.config('cotacaoUsd') || {};
  /* { v, ref, exata } · usa a do mês; se não houver, a última anterior; se não, a primeira posterior */
  P.cotacao = ref => {
    const c = P.cotacoes(); if (c[ref]) return { v: +c[ref], ref, exata: true };
    const ks = Object.keys(c).filter(k => +c[k] > 0).sort();
    const ant = ks.filter(k => k < ref).pop(), dep = ks.find(k => k > ref), k = ant || dep;
    return k ? { v: +c[k], ref: k, exata: false } : null;
  };
  P.salvarCotacao = (ref, v) => { const c = { ...P.cotacoes() }; if (v == null || !(v > 0)) delete c[ref]; else c[ref] = +v; Store.config('cotacaoUsd', c); };

  /* ---------- MB ---------- */
  /* Mapa ref → { mbId → { pl, cap } }, montado a partir dos retratos importados e do histórico de 12 meses de cada um */
  let cacheMB = null, cacheMBKey = '';
  const serieMB = () => {
    const recs = C().mbMeses(), key = recs.map(r => r.id + (r.importadoEm || '')).join('|');
    if (cacheMB && key === cacheMBKey) return cacheMB;
    const out = {};
    /* do mais antigo para o mais recente: o retrato do próprio mês sempre vence o histórico */
    recs.slice().reverse().forEach(r => (r.clients || []).forEach(c => (c.hist || []).forEach(h => {
      const ref = P.refDoRotulo(h[0]); if (!ref || h[4] == null) return;
      (out[ref] = out[ref] || {})[String(c.id)] = { pl: +h[4] || 0, cap: (+h[2] || 0) - (+h[3] || 0), fonte: 'hist' };
    })));
    recs.forEach(r => (r.clients || []).forEach(c => {
      (out[r.id] = out[r.id] || {})[String(c.id)] = { pl: +c.pl || 0, cap: ((c.ap && +c.ap[0]) || 0) - ((c.rg && +c.rg[0]) || 0), fonte: 'mes' };
    }));
    cacheMB = out; cacheMBKey = key; return out;
  };
  const mbIdsDe = cli => Store.all('contratos').filter(ct => ct.produto === 'mb' && ct.clienteId === cli.id && ct.mbId != null).map(ct => String(ct.mbId));
  const mbCli = (cli, ref) => {
    const ids = mbIdsDe(cli); if (!ids.length) return null;
    const s = serieMB(), refs = Object.keys(s).filter(k => k <= ref && ids.some(id => s[k][id])).sort(), r = refs.pop();
    if (!r) return null;
    const pl = ids.reduce((t, id) => t + ((s[r][id] || {}).pl || 0), 0), cap = ids.reduce((t, id) => t + ((s[r][id] || {}).cap || 0), 0);
    return { pl, cap: r === ref ? cap : 0, ref: r, repetido: r !== ref };
  };

  /* ---------- XP ---------- */
  const xpCli = (cli, ref) => {
    const h = (cli.xpHist || []).filter(x => x.ref <= ref && x.pl != null).sort((a, b) => b.ref.localeCompare(a.ref))[0];
    if (!h) return null;
    const exato = h.ref === ref;
    return { pl: +h.pl || 0, cap: exato && h.cap != null && h.cap !== '' ? +h.cap : 0, capInformada: exato && h.cap != null && h.cap !== '', ref: h.ref, repetido: !exato };
  };

  /* ---------- Eqseed (valor investido) ---------- */
  const SAIU = ['Saída', 'Perda'];
  const eqCli = (cli, ref) => {
    const fim = P.fimDoMes(ref), ini = ref + '-01';
    const cts = C().contratos({ clienteId: cli.id, produto: 'eqseed' }).filter(ct => !SAIU.includes(ct.situacao) && (!ct.data || ct.data <= fim));
    if (!cts.length) return null;
    return { pl: cts.reduce((s, x) => s + (+x.valor || 0), 0), cap: cts.filter(x => x.data && x.data >= ini).reduce((s, x) => s + (+x.valor || 0), 0), ref, repetido: false };
  };

  /* ---------- Exterior (US$) ---------- */
  const campoUsd = pid => pid === 'stonex' ? 'valor' : 'valorConta';
  /* posição do contrato no mês: posHist (última ≤ ref) ou valor atual a partir do mês da "Posição em" */
  const posCt = (ct, ref) => {
    const h = (ct.posHist || []).filter(x => x.ref <= ref && x.v != null).sort((a, b) => b.ref.localeCompare(a.ref))[0];
    if (h) return { v: +h.v, ref: h.ref };
    const v = ct[campoUsd(ct.produto)]; if (v == null || v === '') return null;
    const desde = (ct.dataPosicao || ct.atualizadoEm || ct.criadoEm || U.today()).slice(0, 7);
    if ((ct.posHist || []).length && (ct.posHist || []).every(x => x.ref > ref)) return null;
    return desde <= ref ? { v: +v, ref: desde } : null;
  };
  /* Aportes do ITA no mês: baixa "Aporte pago" (status renovado) da renovação do contrato */
  const aportesITA = (ct, ref) => Store.all('renovacoes').filter(r => r.ctId === ct.id && r.status === 'renovado' && (r.baixaEm || '').slice(0, 7) === ref).length * (+ct.contribuicao || 0);
  const intlCli = (cli, ref) => {
    const cts = P.INTL.flatMap(pid => C().contratos({ clienteId: cli.id, produto: pid }));
    let usd = 0, cap = 0, achou = false, refPos = null;
    cts.forEach(ct => { const p = posCt(ct, ref); if (p) { usd += p.v; achou = true; if (!refPos || p.ref > refPos) refPos = p.ref; } if (ct.produto === 'ita') cap += aportesITA(ct, ref); });
    if (!achou && !cap) return null;
    return { usd, capUsd: cap, ref: refPos || ref, repetido: refPos ? refPos !== ref : false };
  };
  /* Ao salvar um produto do exterior, guarda a posição do mês (para o retrato dos meses seguintes não perder o passado) */
  P.posHistDe = (pid, antigo, d) => {
    if (!P.INTL.includes(pid)) return {};
    const k = campoUsd(pid), v = d[k] != null && d[k] !== '' ? +d[k] : null; if (v == null) return {};
    const ref = (d.dataPosicao || (antigo && antigo.dataPosicao) || U.today()).slice(0, 7);
    const hist = ((antigo && antigo.posHist) || []).filter(x => x.ref !== ref).concat({ ref, v }).sort((a, b) => b.ref.localeCompare(a.ref)).slice(0, 36);
    return { posHist: hist };
  };

  /* ---------- Retrato do mês ---------- */
  /* { ref, cot, linhas: [{ cli, mb, xp, eqseed, intl, total, cap }], plats: { id: { pl, cap, n, repetido } }, total, cap, xpSemCap } */
  P.retrato = ref => {
    const cot = P.cotacao(ref), usd2brl = v => cot ? v * cot.v : 0;
    const plats = Object.fromEntries(P.PLATS.map(p => [p.id, { pl: 0, cap: 0, n: 0, repetido: 0, usd: 0, capUsd: 0 }]));
    let xpSemCap = 0;
    const linhas = Store.all('clientes').map(cli => {
      const mb = mbCli(cli, ref), xp = xpCli(cli, ref), eq = eqCli(cli, ref), ix = intlCli(cli, ref);
      if (!mb && !xp && !eq && !ix) return null;
      const intl = ix ? { pl: usd2brl(ix.usd), cap: usd2brl(ix.capUsd), usd: ix.usd, capUsd: ix.capUsd, ref: ix.ref, repetido: ix.repetido } : null;
      const l = { cli, mb, xp, eqseed: eq, intl };
      l.total = [mb, xp, eq, intl].reduce((s, x) => s + (x ? x.pl : 0), 0);
      l.cap = [mb, xp, eq, intl].reduce((s, x) => s + (x ? x.cap : 0), 0);
      [['mb', mb], ['xp', xp], ['eqseed', eq], ['intl', intl]].forEach(([k, x]) => { if (!x) return; const p = plats[k]; p.pl += x.pl; p.cap += x.cap; p.n++; if (x.repetido) p.repetido++; if (k === 'intl') { p.usd += x.usd; p.capUsd += x.capUsd; } });
      if (xp && !xp.repetido && !xp.capInformada) xpSemCap++;
      return l;
    }).filter(Boolean).sort((a, b) => b.total - a.total);
    const total = linhas.reduce((s, l) => s + l.total, 0), cap = linhas.reduce((s, l) => s + l.cap, 0);
    return { ref, cot, linhas, plats, total, cap, xpSemCap };
  };

  /* Meses com algum dado (do mais recente para o mais antigo), até o mês atual */
  P.meses = () => {
    const hoje = U.today().slice(0, 7), set = new Set(Object.keys(serieMB()));
    Store.all('clientes').forEach(c => (c.xpHist || []).forEach(h => h.ref && set.add(h.ref)));
    Store.all('contratos').forEach(ct => { if (ct.produto === 'eqseed' && ct.data) set.add(ct.data.slice(0, 7)); if (P.INTL.includes(ct.produto)) (ct.posHist || []).forEach(h => set.add(h.ref)); });
    const ks = [...set].filter(k => /^\d{4}-\d{2}$/.test(k) && k <= hoje).sort();
    if (!ks.length) return [hoje];
    /* preenche os buracos entre o primeiro e o atual */
    const out = []; for (let r = ks[0]; r <= hoje; r = P.mesSeg(r)) out.push(r);
    return out.reverse();
  };
  /* Mês padrão: o mais recente com posição nova do MB ou da XP */
  P.mesPadrao = () => {
    const s = serieMB(), refs = Object.keys(s);
    Store.all('clientes').forEach(c => (c.xpHist || []).forEach(h => h.ref && refs.push(h.ref)));
    const hoje = U.today().slice(0, 7), r = refs.filter(k => k <= hoje).sort().pop();
    return r || hoje;
  };
  /* Variação do patrimônio contra o mês anterior, cliente a cliente e plataforma a plataforma, só onde já havia posição
     (a primeira posição de um cliente numa plataforma não é crescimento; quem saiu conta como queda). novas = posições novas */
  P.variacao = (r, ant) => {
    if (!ant.total) return null;
    const K = ['mb', 'xp', 'eqseed', 'intl'], antPor = Object.fromEntries(ant.linhas.map(l => [l.cli.id, l]));
    let v = 0, novas = 0;
    const vistos = new Set();
    r.linhas.forEach(l => { const a = antPor[l.cli.id]; vistos.add(l.cli.id);
      K.forEach(k => { const pa = a && a[k] ? a[k].pl : 0, pb = l[k] ? l[k].pl : 0; if (pa > 0) v += pb - pa; else if (pb > 0) novas++; }); });
    ant.linhas.forEach(a => { if (!vistos.has(a.cli.id)) v -= a.total; });
    return { v, novas };
  };
  /* Captação no ano até o mês (soma dos meses de janeiro até ref) */
  P.capAno = ref => { let s = 0; for (let r = ref.slice(0, 4) + '-01'; r <= ref; r = P.mesSeg(r)) s += P.retrato(r).cap; return s; };
  /* Série para o gráfico: últimos n meses até ref */
  P.serie = (ref, n = 12) => { const out = []; let r = ref; for (let i = 0; i < n; i++) { out.unshift(r); r = P.mesAnt(r); } return out.map(k => { const x = P.retrato(k); return { ref: k, total: x.total, cap: x.cap, plats: Object.fromEntries(Object.entries(x.plats).map(([id, v]) => [id, v.pl])) }; }); };
  /* Patrimônio de um cliente no mês (para a ficha) */
  P.doCliente = (cli, ref) => P.retrato(ref || P.mesPadrao()).linhas.find(l => l.cli.id === cli.id) || null;

  /* ---------- Visão consolidada de um cliente (ficha) ---------- */
  const IDX = s => { const x = String(s || '').toUpperCase(); return /CDI|DI\b|SELIC/.test(x) ? 'pós (CDI)' : /IPCA|INFL/.test(x) ? 'IPCA' : /PR[EÉ]/.test(x) ? 'prefixada' : s ? String(s) : 'outros'; };
  const classeMB = p => p.classe === 'rf' ? 'Renda fixa ' + IDX(p.idx) : p.classe === 'usd' ? 'Renda fixa em dólar' : p.classe === 'cripto' ? 'Cripto' : p.classe === 'caixa' ? 'Caixa' : p.classe === 'rv' || p.classe === 'cestas' ? 'Renda variável' : 'Outros';
  /* áreas do Mapa 360 que são investimento (o valor "mapeado" delas entra como "com outros") */
  P.AREAS_INV = ['previdencia', 'internacional', 'cripto', 'startups', 'zentis'];
  P.consolidado = (cli, ref) => {
    ref = ref || P.mesPadrao();
    const l = P.doCliente(cli, ref) || { mb: null, xp: null, eqseed: null, intl: null, total: 0, cap: 0 };
    const cot = P.cotacao(ref);
    /* classes de ativo: MB pelo retrato do mês (por classe e indexador); Eqseed = startups; exterior; XP sem detalhe */
    const classes = {};
    const add = (k, v) => { if (v > 0) classes[k] = (classes[k] || 0) + v; };
    if (l.mb) {
      const rec = Store.get('mb', l.mb.ref), ids = mbIdsDe(cli);
      const ps = rec ? (rec.positions || []).filter(p => ids.includes(String(p.cid))) : [];
      if (ps.length) ps.forEach(p => add(classeMB(p), +p.saldo || 0)); else add('MB (sem detalhe)', l.mb.pl);
    }
    if (l.xp) add('XP (sem detalhe)', l.xp.pl);
    if (l.eqseed) add('Startups', l.eqseed.pl);
    if (l.intl) add('Internacional', l.intl.pl);
    const usdR = l.intl ? l.intl.pl : 0, brl = l.total - usdR;
    /* fora: o que o Mapa 360 registrou como "mapeado" (com outro) em áreas de investimento, com valor */
    const fora = Object.entries(cli.mapa || {}).filter(([a, m]) => P.AREAS_INV.includes(a) && m && m.sit === 'mapeado' && +m.valor > 0).map(([a, m]) => ({ area: a, onde: m.onde || '', valor: +m.valor }));
    const ctsAtivos = pid => C().contratos({ clienteId: cli.id, produto: pid });
    const consorcio = ctsAtivos('consorcio').reduce((s, x) => s + (+x.carta || 0), 0), nCons = ctsAtivos('consorcio').length;
    const capital = ctsAtivos('vida').reduce((s, x) => s + (+x.capital || 0), 0), nVida = ctsAtivos('vida').length;
    return { ref, cot, l, total: l.total, brl, usd: l.intl ? l.intl.usd : 0, usdR, classes: Object.entries(classes).sort((a, b) => b[1] - a[1]),
      plats: P.PLATS.map(p => ({ ...p, v: l[p.id] ? l[p.id].pl : 0, repetido: l[p.id] ? l[p.id].repetido : false, refPos: l[p.id] ? l[p.id].ref : null })).filter(p => p.v > 0),
      fora, foraTot: fora.reduce((s, x) => s + x.valor, 0), consorcio, nCons, capital, nVida, meta: +cli.metaPatrimonio || 0 };
  };

  App.Pat = P;
})(window.App = window.App || {});

</script>
<script>
/* js/core/backup.js */
/* Backup e restauração em JSON. */
(function (App) {
  const { U, Store } = App;
  const B = {};
  const APP_ID = 'painel-gestao-pessoal';

  B.exportar = async () => {
    const pacote = { app: APP_ID, versao: 1, exportadoEm: U.nowISO(), dados: Store.snapshot() };
    const texto = JSON.stringify(pacote, null, 2);
    const nome = 'donna-backup-' + U.today() + '.json';
    const ok = await B.salvarArquivo(nome, texto, 'application/json');
    if (ok) Store.config('ultimoBackup', U.nowISO());
    return ok;
  };

  /* No navegador comum usa um link de download. Publicado no Claude, usa a permissão de download. */
  B.salvarArquivo = async (nome, texto, tipo) => {
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename: nome, data: new Blob([texto], { type: tipo }) }); return true; }
      } catch (e) { if (e && e.code === 'declined') return false; }
    }
    try {
      const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
      const a = document.createElement('a');
      a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    } catch (e) { return false; }
  };

  /* Lê e valida o arquivo. Retorna { dados, resumo } ou lança um erro com mensagem clara. */
  B.ler = file => new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    fr.onload = () => {
      let obj;
      try { obj = JSON.parse(fr.result); } catch (e) { return reject(new Error('O arquivo não é um JSON válido.')); }
      const dados = obj && obj.app === APP_ID ? obj.dados : obj;
      if (!dados || !Array.isArray(dados.atividades) || !Array.isArray(dados.responsabilidades)) return reject(new Error('Este arquivo não é um backup do Painel de Gestão.'));
      resolve({
        dados, exportadoEm: obj.exportadoEm || null,
        resumo: { responsabilidades: dados.responsabilidades.length, atividades: dados.atividades.length, metas: (dados.metas || []).length }
      });
    };
    fr.readAsText(file);
  });

  B.restaurar = dados => { Store.replaceAll(dados); Store.config('inicializado', true); if (App.Fat) App.Fat.garantir(); };

  /* ---------- Backup semanal numa pasta do computador (ex.: OneDrive), 24/11 ----------
     A pasta é escolhida uma vez (Chrome/Edge: File System Access); o "endereço" dela fica guardado neste navegador (IndexedDB).
     Cada backup vira um arquivo donna-backup-AAAA-MM-DD.json; ficam os 12 mais recentes. */
  const IDB = 'horus-fs', ST = 'pastas', CH = 'backup';
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open(IDB, 1); r.onupgradeneeded = () => r.result.createObjectStore(ST); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idbGet = async k => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction(ST).objectStore(ST).get(k); t.onsuccess = () => res(t.result || null); t.onerror = () => rej(t.error); }); };
  const idbSet = async (k, v) => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction(ST, 'readwrite'); v == null ? t.objectStore(ST).delete(k) : t.objectStore(ST).put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); };
  const NOME_LS = 'horus-backup-pasta';
  B.suportaPasta = () => typeof window.showDirectoryPicker === 'function' && typeof indexedDB !== 'undefined';
  B.pastaNome = () => { try { return localStorage.getItem(NOME_LS) || ''; } catch (e) { return ''; } };
  B.escolherPasta = async () => {
    const h = await window.showDirectoryPicker({ id: 'horus-backup', mode: 'readwrite' });
    await idbSet(CH, h); try { localStorage.setItem(NOME_LS, h.name); } catch (e) {}
    return h.name;
  };
  B.esquecerPasta = async () => { await idbSet(CH, null); try { localStorage.removeItem(NOME_LS); } catch (e) {} };
  const texto = () => JSON.stringify({ app: APP_ID, versao: 1, exportadoEm: U.nowISO(), dados: Store.snapshot() }, null, 2);
  /* Precisa ser chamado num clique (o navegador pede para confirmar o acesso à pasta uma vez por sessão) */
  B.salvarNaPasta = async () => {
    const h = await idbGet(CH); if (!h) throw new Error('sem pasta');
    let perm = await h.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') perm = await h.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') throw new Error('O navegador não liberou a pasta.');
    const nome = 'donna-backup-' + U.today() + '.json';
    const fh = await h.getFileHandle(nome, { create: true }), w = await fh.createWritable();
    await w.write(new Blob([texto()], { type: 'application/json' })); await w.close();
    /* mantém os 12 mais recentes (só os arquivos de backup da Donna; os antigos horus-backup-* ficam) */
    try { const nomes = []; for await (const [n, e] of h.entries()) if (e.kind === 'file' && /^donna-backup-\d{4}-\d{2}-\d{2}\.json$/.test(n)) nomes.push(n);
      for (const n of nomes.sort().reverse().slice(12)) await h.removeEntry(n); } catch (e) {}
    Store.config('ultimoBackup', U.nowISO());
    return nome;
  };
  /* O botão "Backup da semana": salva na pasta; sem pasta, pede para escolher; sem suporte, baixa o arquivo. Devolve a mensagem para o aviso. */
  B.semanal = async () => {
    try {
      if (B.suportaPasta()) {
        if (!B.pastaNome()) { const n = await B.escolherPasta(); App.UI.toast('Pasta escolhida: ' + n); }
        const arq = await B.salvarNaPasta();
        return 'Backup salvo em ' + B.pastaNome() + ' (' + arq + ')';
      }
      const ok = await B.exportar(); return ok ? 'Backup baixado. Guarde na pasta do OneDrive.' : 'O download não foi concluído';
    } catch (e) {
      if (e && e.name === 'AbortError') return null;
      if (e && e.message === 'sem pasta') { await B.esquecerPasta(); return 'A pasta não foi encontrada. Clique de novo para escolher.'; }
      return 'Não foi possível salvar: ' + (e && e.message || e);
    }
  };

  App.Backup = B;
})(window.App = window.App || {});

</script>
<script>
/* js/core/cloud.js */
/*
 * Nuvem: login (Supabase Auth) e adaptador que grava as tabelas no Supabase.
 * As telas não conhecem nada daqui; só o App.Store usa o adaptador.
 */
(function (App) {
  const { U, Store } = App;
  const C = {};
  let sb = null, usuario = null;

  /* Coleção do app -> tabela do banco, e os campos de cada uma */
  const TABELAS = { responsabilidades: 'responsabilidades', atividades: 'atividades', metas: 'metas', metaRegistros: 'meta_registros', historico: 'historico', faturamento: 'faturamento' };
  const CAMPOS = {
    responsabilidades: ['id', 'nome', 'descricao', 'cor', 'status', 'demo', 'criadoEm', 'atualizadoEm'],
    atividades: ['id', 'titulo', 'descricao', 'responsabilidadeId', 'categoria', 'inicio', 'prazo', 'prioridade', 'status', 'metaId', 'resultadoEsperado', 'resultado', 'resultadoTexto', 'observacoes', 'concluidaEm', 'adiamentos', 'tipoNegocio', 'cliente', 'valorNegocio', 'resultadoNegocio', 'demo', 'criadoEm', 'atualizadoEm'],
    metas: ['id', 'nome', 'responsabilidadeId', 'descricao', 'alvo', 'atual', 'unidade', 'inicio', 'fim', 'periodicidade', 'modo', 'demo', 'criadoEm', 'atualizadoEm'],
    metaRegistros: ['id', 'metaId', 'valor', 'nota', 'em', 'demo', 'criadoEm', 'atualizadoEm'],
    historico: ['id', 'atividadeId', 'tipo', 'descricao', 'em', 'demo', 'criadoEm', 'atualizadoEm'],
    faturamento: ['id', 'data', 'cliente', 'tipo', 'descricao', 'valor', 'receita', 'responsabilidadeId', 'atividadeId', 'observacoes', 'demo', 'criadoEm', 'atualizadoEm']
  };
  /* Tabelas do faturamento guardam o registro inteiro em JSON (fácil de evoluir sem mudar o banco) */
  const JSONT = { linhas: 'fat_linhas', produtos: 'fat_produtos', producoes: 'fat_producoes', recebiveis: 'fat_recebiveis', recorrencias: 'fat_recorrencias', emails: 'emails', clientes: 'clientes', contratos: 'contratos', mb: 'carteira_mb', renovacoes: 'renovacoes', agenda: 'agenda', resumos: 'resumos' };
  /* Tabelas novas: se ainda não existem no banco, o painel segue funcionando (guarda só neste aparelho) e avisa uma vez */
  const OPCIONAIS = { renovacoes: true, agenda: true, resumos: true }, ausentes = {};
  const faltaTabela = e => /does not exist|could not find the table|PGRST205|42P01/i.test(((e && (e.message || '')) + ' ' + (e && e.code || '')));
  Object.assign(TABELAS, JSONT);
  const DATAS = ['inicio', 'prazo', 'fim', 'data', 'concluidaEm', 'em', 'criadoEm', 'atualizadoEm'];
  const NUMEROS = ['resultadoEsperado', 'resultado', 'alvo', 'atual', 'valor', 'adiamentos', 'valorNegocio', 'receita'];
  const OBRIG = { responsabilidades: ['nome', 'Sem nome'], atividades: ['titulo', 'Sem título'], metas: ['nome', 'Sem nome'] };
  /* Campos que não têm coluna própria (várias metas, % que fica com você...) vão para "extras" (jsonb) */
  const COM_EXTRAS = { atividades: true, metas: true };
  const semExtras = {};
  let avisouExtras = false;
  const snake = k => k.replace(/[A-Z]/g, m => '_' + m.toLowerCase());
  const camel = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());

  C.paraLinha = (col, rec, uid) => {
    if (JSONT[col]) { const { id, demo, ...dados } = rec; return { user_id: uid, id, dados, demo: !!demo, atualizado_em: rec.atualizadoEm || U.nowISO() }; }
    const r = { user_id: uid };
    CAMPOS[col].forEach(k => {
      let v = rec[k];
      if (v === undefined || v === '') v = null;
      if (v !== null && NUMEROS.includes(k)) { v = Number(v); if (!isFinite(v)) v = null; }
      if (v !== null && k === 'adiamentos') v = Math.round(v);
      if (k === 'demo') v = !!v;
      r[snake(k)] = v;
    });
    const ob = OBRIG[col]; if (ob && !r[ob[0]]) r[ob[0]] = ob[1];
    if (COM_EXTRAS[col]) {
      const ex = {};
      Object.keys(rec).forEach(k => { if (!CAMPOS[col].includes(k) && k !== 'user_id' && k !== 'extras' && !k.startsWith('_') && rec[k] !== undefined) ex[k] = rec[k]; });
      r.extras = ex;
    }
    return r;
  };
  C.deLinha = row => {
    if (row.dados && typeof row.dados === 'object' && !('titulo' in row) && !('nome' in row)) return { ...row.dados, id: row.id, demo: !!row.demo };
    const o = {};
    Object.entries(row).forEach(([k, v]) => { if (k === 'user_id' || k === 'extras' || v === null) return; o[camel(k)] = v; });
    if (row.extras && typeof row.extras === 'object') Object.entries(row.extras).forEach(([k, v]) => { if (!(k in o) && v !== null) o[k] = v; });
    return o;
  };

  async function lerTudo(tabela) {
    const out = []; let de = 0;
    for (;;) {
      const { data, error } = await sb.from(tabela).select('*').range(de, de + 999);
      if (error) throw error;
      out.push(...data);
      if (data.length < 1000) break;
      de += 1000;
    }
    return out;
  }
  const lotes = (arr, n = 400) => { const r = []; for (let i = 0; i < arr.length; i += n) r.push(arr.slice(i, i + n)); return r; };
  /* Se o banco ainda não tem a coluna "extras" (SQL novo não rodou), grava sem ela e avisa uma vez */
  async function gravar(tabela, linhas) {
    if (ausentes[tabela]) return;
    for (let l of lotes(linhas)) {
      if (semExtras[tabela]) l = l.map(({ extras, ...r }) => r);
      let { error } = await sb.from(tabela).upsert(l, { onConflict: 'user_id,id' });
      if (error && OPCIONAIS[tabela] && faltaTabela(error)) { ausentes[tabela] = true; return; }
      if (error && !semExtras[tabela] && /extras/i.test(error.message || '')) {
        semExtras[tabela] = true;
        if (!avisouExtras) { avisouExtras = true; setTimeout(() => App.UI && App.UI.toast('Rode o supabase-schema.sql novo no Supabase para salvar várias metas e o % na nuvem.', 'aviso'), 500); }
        ({ error } = await sb.from(tabela).upsert(l.map(({ extras, ...r }) => r), { onConflict: 'user_id,id' }));
      }
      if (error) throw error;
    }
  }
  async function apagar(tabela, ids, uid) { if (ausentes[tabela]) return; for (const l of lotes(ids)) { const { error } = await sb.from(tabela).delete().eq('user_id', uid).in('id', l); if (error && OPCIONAIS[tabela] && faltaTabela(error)) { ausentes[tabela] = true; return; } if (error) throw error; } }

  C.adapter = user => ({
    name: 'Nuvem (Supabase)', remote: true, cacheKey: user.id, email: user.email,
    async load() {
      const out = { config: {} };
      for (const [col, t] of Object.entries(TABELAS)) {
        try { out[col] = (await lerTudo(t)).map(C.deLinha); delete ausentes[t]; }
        catch (e) { if (!OPCIONAIS[col] || !faltaTabela(e)) throw e; ausentes[t] = true; out[col] = (Store.all(col) || []).slice(); }
      }
      const { data, error } = await sb.from('configuracoes').select('dados').maybeSingle();
      if (error) throw error;
      out.config = data && data.dados ? data.dados : {};
      return out;
    },
    async push(p) {
      const uid = user.id;
      if (p.full) {
        for (const [col, t] of Object.entries(TABELAS)) {
          if (ausentes[t]) continue;
          const { error } = await sb.from(t).delete().eq('user_id', uid); if (error && OPCIONAIS[t] && faltaTabela(error)) { ausentes[t] = true; continue; } if (error) throw error;
          await gravar(t, p.db[col].map(r => C.paraLinha(col, r, uid)));
        }
      } else {
        for (const [col, c] of Object.entries(p.cols)) {
          const t = TABELAS[col]; if (!t) continue;
          if (c.up.length) await gravar(t, c.up.map(r => C.paraLinha(col, r, uid)));
          if (c.del.length) await apagar(t, c.del, uid);
        }
      }
      if (p.config) {
        const { error } = await sb.from('configuracoes').upsert({ user_id: uid, dados: p.config, atualizado_em: U.nowISO() }, { onConflict: 'user_id' });
        if (error) throw error;
      }
    }
  });

  /* ---------- Conexão e sessão ---------- */
  C.configurado = () => { const c = window.HORUS_CONFIG || {}; return !!(c.supabaseUrl && c.supabaseAnonKey); };
  C.init = () => {
    const c = window.HORUS_CONFIG;
    sb = window.supabase.createClient(c.supabaseUrl.trim(), c.supabaseAnonKey.trim(), { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(C.novaSenha, 300); });
    return sb;
  };
  C.sessao = async () => { const { data } = await sb.auth.getSession(); usuario = data.session ? data.session.user : null; return data.session; };
  C.usuario = () => usuario;
  C.sb = () => sb;

  const traduz = e => {
    const m = (e && (e.message || e.error_description || String(e))) || '';
    if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/email not confirmed/i.test(m)) return 'Confirme o seu e-mail pelo link que enviamos e entre de novo.';
    if (/already registered|already exists/i.test(m)) return 'Esse e-mail já tem conta. Use "Entrar".';
    if (/password should be at least|weak/i.test(m)) return 'A senha precisa ter pelo menos 8 caracteres, com letras e números.';
    if (/signups not allowed|signup is disabled/i.test(m)) return 'Novos cadastros estão desativados neste painel.';
    if (/rate limit|too many/i.test(m)) return 'Muitas tentativas. Espere um minuto e tente de novo.';
    if (/fetch|network/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
    return 'Não foi possível concluir: ' + m;
  };

  /* ---------- Tela de login ---------- */
  C.telaLogin = aoEntrar => {
    let modo = 'entrar';
    const el = document.createElement('div');
    el.className = 'auth';
    document.body.appendChild(el);
    const desenhar = (msg = '', tipo = 'erro') => {
      el.innerHTML = `<div class="auth-card">
        <b class="logo dark">Donna <span>AI</span></b>
        <h1>${modo === 'entrar' ? 'Entrar no painel' : modo === 'criar' ? 'Criar sua conta' : 'Recuperar senha'}</h1>
        <p class="muted small">${modo === 'esqueci' ? 'Enviamos um link para você criar uma nova senha.' : 'Seus dados ficam salvos na nuvem e aparecem em qualquer aparelho.'}</p>
        <form class="form" id="fAuth">
          <label class="f full"><span>E-mail</span><input type="email" name="email" autocomplete="email" required autofocus></label>
          ${modo !== 'esqueci' ? `<label class="f full"><span>Senha</span><input type="password" name="senha" autocomplete="${modo === 'criar' ? 'new-password' : 'current-password'}" required minlength="8"></label>` : ''}
          ${msg ? `<p class="${tipo === 'ok' ? 'fok' : 'ferr'}">${U.esc(msg)}</p>` : ''}
          <button class="btn primary full" type="submit">${modo === 'entrar' ? 'Entrar' : modo === 'criar' ? 'Criar conta' : 'Enviar link'}</button>
        </form>
        <div class="auth-links">
          ${modo === 'entrar' ? '<button class="link" data-m="criar">Criar conta</button><button class="link" data-m="esqueci">Esqueci minha senha</button>' : '<button class="link" data-m="entrar">Voltar para entrar</button>'}
        </div></div>`;
      el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { modo = b.dataset.m; desenhar(); });
      const f = el.querySelector('#fAuth');
      setTimeout(() => f.email.focus(), 30);
      f.onsubmit = async e => {
        e.preventDefault();
        const email = f.email.value.trim(), senha = f.senha ? f.senha.value : '';
        const bt = f.querySelector('button[type=submit]'); bt.disabled = true; bt.textContent = 'Aguarde...';
        try {
          if (modo === 'entrar') {
            const { error } = await sb.auth.signInWithPassword({ email, password: senha });
            if (error) throw error;
            el.remove(); aoEntrar();
          } else if (modo === 'criar') {
            const { data, error } = await sb.auth.signUp({ email, password: senha, options: { emailRedirectTo: location.href.split('#')[0] } });
            if (error) throw error;
            if (data.session) { el.remove(); aoEntrar(); }
            else { modo = 'entrar'; desenhar('Conta criada. Abra o e-mail de confirmação que enviamos para ' + email + ' e depois entre aqui.', 'ok'); }
          } else {
            const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
            if (error) throw error;
            modo = 'entrar'; desenhar('Se esse e-mail tiver conta, você vai receber um link para criar uma nova senha.', 'ok');
          }
        } catch (err) { desenhar(traduz(err)); const fe = el.querySelector('[name=email]'); if (fe) fe.value = email; }
      };
    };
    desenhar();
  };

  C.novaSenha = () => {
    App.UI.modal({
      title: 'Criar nova senha', size: 'sm',
      body: `<form class="form" id="fNs"><label class="f full"><span>Nova senha</span><input type="password" name="senha" minlength="8" required autofocus autocomplete="new-password"></label><p class="ferr" id="errNs" hidden></p></form>`,
      footer: `<button class="btn primary" form="fNs" type="submit">Salvar senha</button>`,
      onMount(el, api) {
        el.querySelector('#fNs').onsubmit = async e => {
          e.preventDefault();
          const { error } = await sb.auth.updateUser({ password: e.target.senha.value });
          if (error) { const er = el.querySelector('#errNs'); er.textContent = traduz(error); er.hidden = false; return; }
          api.close(); App.UI.toast('Senha atualizada');
        };
      }
    });
  };

  C.sair = async () => {
    if (Store.pendente()) {
      const ok = await App.UI.confirm({ title: 'Sair com alterações pendentes?', text: 'Algumas alterações ainda não foram enviadas para a nuvem. Se sair agora, elas se perdem. Conecte-se à internet e espere aparecer "Salvo na nuvem".', ok: 'Sair mesmo assim' });
      if (!ok) return;
    }
    try { await sb.auth.signOut(); } catch (e) {}
    Store.limparCopiaLocal();
    location.reload();
  };

  /* ---------- Primeiro acesso: banco vazio ---------- */
  C.boasVindas = () => {
    const m = App.UI.modal({
      title: 'Bem-vindo à Donna AI', size: 'md',
      body: `<p>Sua conta está pronta e ainda não tem dados. Como você quer começar?</p>
        <div class="welcome">
          <label class="wopt"><b>Trazer meus dados do painel antigo</b><span>Escolha o backup (.json) baixado em "Backup e dados" do arquivo que você já usava.</span><input type="file" accept=".json,application/json" id="wFile"></label>
          <button class="wopt" data-w="resp"><b>Começar com as minhas 4 responsabilidades</b><span>Assessoria, Capitão de Vida, Capitão de Xceed e Projetos pessoais, sem atividades.</span></button>
          <button class="wopt" data-w="demo"><b>Ver com exemplos</b><span>Inclui a Campanha de indicações 2027. Você apaga depois em "Backup e dados".</span></button>
        </div><p class="ferr" id="wErr" hidden></p>`,
      onMount(el, api) {
        el.querySelector('#wFile').onchange = async e => {
          const file = e.target.files[0]; if (!file) return;
          try { const r = await App.Backup.ler(file); App.Backup.restaurar(r.dados); api.close(); App.UI.toast(`Backup importado: ${r.resumo.atividades} atividades e ${r.resumo.metas} metas`); }
          catch (err) { const er = el.querySelector('#wErr'); er.textContent = err.message; er.hidden = false; }
        };
        el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
          if (b.dataset.w === 'demo') App.Demo.seed();
          else { App.Demo.RESP.forEach(r => Store.insert('responsabilidades', { ...r, status: 'ativa' }, { silent: true })); Store.commit(); Store.config('inicializado', true); }
          api.close(); App.UI.toast('Tudo pronto');
        });
      }
    });
    return m;
  };

  /* Atualiza ao voltar para a aba e a cada minuto, para ver o que foi feito em outro aparelho */
  C.vigiar = () => {
    const tentar = async () => {
      if (document.visibilityState !== 'visible' || document.querySelector('.modal-wrap') || document.querySelector('.mfa-tela')) return;
      if (App.Seg && await App.Seg.precisaCodigo()) return App.Seg.telaCodigo(() => location.reload());
      Store.sincronizar().catch(() => {});
    };
    document.addEventListener('visibilitychange', tentar);
    setInterval(tentar, 60000);
  };

  App.Cloud = C;
})(window.App = window.App || {});

</script>
<script>
/* js/core/seguranca.js */
/* Segurança e rotina (24/11):
   - Verificação em duas etapas (TOTP do Supabase Auth: app autenticador no celular). Ativar/desativar em Ajustes; ao abrir o painel
     numa sessão sem código (aal1) de quem tem fator verificado, pede o código antes de carregar os dados.
     O banco também exige: política restritiva "exige_2_etapas" em todas as tabelas (aal2 quando o usuário tem fator verificado).
     Perdeu o celular? O Claude remove o fator pelo conector: delete from auth.mfa_factors where user_id = ...
   - Backup semanal com 1 clique: a pasta do OneDrive (sincronizada no computador) é escolhida uma vez (File System Access, Chrome/Edge)
     e o painel grava o arquivo nela. Sem suporte, baixa o arquivo.
   - Lembretes de rotina no Painel: backup da semana, fechamento do MB (a partir do dia 7) e ativar as 2 etapas. */
(function (App) {
  const { U, Store } = App;
  const S = {};
  const sb = () => App.Cloud && App.Cloud.sb && App.Cloud.sb();
  S.nuvem = () => !!(App.Cloud && App.Cloud.configurado() && sb() && sb().auth && sb().auth.mfa);

  /* ---------- Duas etapas ---------- */
  S.nivel = async () => { if (!S.nuvem()) return null; const { data, error } = await sb().auth.mfa.getAuthenticatorAssuranceLevel(); if (error) throw error; return data; };
  S.precisaCodigo = async () => { try { const n = await S.nivel(); return !!(n && n.nextLevel === 'aal2' && n.currentLevel !== 'aal2'); } catch (e) { return false; } };
  S.fatores = async () => { if (!S.nuvem()) return []; const { data, error } = await sb().auth.mfa.listFactors(); if (error) throw error; return (data && data.totp || []).filter(f => f.status === 'verified'); };
  let ativoCache = null;
  S.ativo = () => ativoCache;
  S.atualizar = async () => { try { ativoCache = (await S.fatores()).length > 0; } catch (e) { ativoCache = null; } return ativoCache; };

  const traduz = e => { const m = (e && e.message) || String(e || ''); if (/invalid|expired|code/i.test(m)) return 'Código inválido ou vencido. Confira o app e digite o código atual (ele muda a cada 30 segundos).'; if (/rate|many/i.test(m)) return 'Muitas tentativas. Espere um minuto.'; return 'Não foi possível concluir: ' + m; };
  const verificar = async (factorId, code) => {
    const ch = await sb().auth.mfa.challenge({ factorId }); if (ch.error) throw ch.error;
    const v = await sb().auth.mfa.verify({ factorId, challengeId: ch.data.id, code }); if (v.error) throw v.error;
  };
  const campoCodigo = '<input name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" required placeholder="000000" class="mfa-code" autofocus>';

  S.ativar = () => {
    const UI = App.UI; let fator = null, ok = false;
    UI.modal({
      title: 'Ativar verificação em duas etapas', size: 'sm',
      body: `<div class="mfa-box" id="mfaBox"><p class="muted small">Gerando o código...</p></div>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fMfa" type="submit" id="mfaOk" disabled>Ativar</button>`,
      async onMount(el, api) {
        const box = el.querySelector('#mfaBox');
        /* fator não verificado de tentativa anterior atrapalha o novo cadastro */
        try { const { data } = await sb().auth.mfa.listFactors(); for (const f of (data && data.all || []).filter(f => f.status !== 'verified')) await sb().auth.mfa.unenroll({ factorId: f.id }); } catch (e) {}
        const r = await sb().auth.mfa.enroll({ factorType: 'totp', friendlyName: 'Celular ' + U.today(), issuer: 'Donna AI' });
        if (r.error) { box.innerHTML = `<p class="ferr">${U.esc(traduz(r.error))}</p>`; return; }
        fator = r.data;
        box.innerHTML = `<form class="form" id="fMfa">
          <ol class="mfa-passos"><li>No celular, abra um app autenticador (Microsoft Authenticator ou Google Authenticator) e toque em <b>adicionar conta</b>.</li>
            <li>Leia este QR code com a câmera do app:</li></ol>
          <img class="mfa-qr" src="${U.esc(fator.totp.qr_code)}" alt="QR code para o app autenticador">
          <details class="mfa-sec"><summary>Não consegue ler? Digite a chave</summary><code>${U.esc(fator.totp.secret)}</code></details>
          <label class="f full"><span>3. Digite o código de 6 números que aparece no app</span>${campoCodigo}</label>
          <p class="ferr" id="mfaErr" hidden></p></form>`;
        el.querySelector('#mfaOk').disabled = false;
        el.querySelector('#fMfa').onsubmit = async e => {
          e.preventDefault(); const bt = el.querySelector('#mfaOk'); bt.disabled = true;
          try { await verificar(fator.id, e.target.codigo.value.trim()); ok = true; ativoCache = true; api.close(); UI.toast('Verificação em duas etapas ativada'); App.render && App.render(); }
          catch (err) { const er = el.querySelector('#mfaErr'); er.textContent = traduz(err); er.hidden = false; bt.disabled = false; }
        };
      },
      onClose() { if (!ok && fator) sb().auth.mfa.unenroll({ factorId: fator.id }).catch(() => {}); }
    });
  };

  S.desativar = async () => {
    const UI = App.UI;
    const sim = await UI.confirm({ title: 'Desativar a verificação em duas etapas?', text: 'O login volta a pedir só a senha, e quem tiver a sua senha consegue ver os dados dos clientes. Para desativar, você digita o código do app agora.', ok: 'Continuar', danger: true });
    if (!sim) return;
    const fs = await S.fatores(); if (!fs.length) { ativoCache = false; return; }
    UI.modal({
      title: 'Confirme com o código', size: 'sm',
      body: `<form class="form" id="fMfaD"><label class="f full"><span>Código do app autenticador</span>${campoCodigo}</label><p class="ferr" id="mfaDErr" hidden></p></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn danger" form="fMfaD" type="submit">Desativar</button>`,
      onMount(el, api) {
        el.querySelector('#fMfaD').onsubmit = async e => {
          e.preventDefault();
          try {
            const n = await S.nivel(); if (!n || n.currentLevel !== 'aal2') await verificar(fs[0].id, e.target.codigo.value.trim());
            for (const f of fs) { const r = await sb().auth.mfa.unenroll({ factorId: f.id }); if (r.error) throw r.error; }
            ativoCache = false; api.close(); UI.toast('Verificação em duas etapas desativada', 'aviso'); App.render && App.render();
          } catch (err) { const er = el.querySelector('#mfaDErr'); er.textContent = traduz(err); er.hidden = false; }
        };
      }
    });
  };

  /* Tela cheia pedindo o código (depois da senha, ou ao voltar com uma sessão antiga) */
  S.telaCodigo = aoOk => {
    if (document.querySelector('.auth.mfa-tela')) return;
    const el = document.createElement('div'); el.className = 'auth mfa-tela'; document.body.appendChild(el);
    el.innerHTML = `<div class="auth-card"><b class="logo dark">Donna <span>AI</span></b><h1>Verificação em duas etapas</h1>
      <p class="muted small">Abra o app autenticador no celular e digite o código de 6 números (conta Donna AI ou a que você cadastrou).</p>
      <form class="form" id="fMfaL"><label class="f full"><span>Código</span>${campoCodigo}</label><p class="ferr" id="mfaLErr" hidden></p>
        <button class="btn primary full" type="submit">Entrar</button></form>
      <div class="auth-links"><button class="link" id="mfaSair">Sair</button><span class="muted small">Perdeu o celular? Peça ao Claude para remover o código.</span></div></div>`;
    const f = el.querySelector('#fMfaL'); setTimeout(() => f.codigo.focus(), 30);
    el.querySelector('#mfaSair').onclick = async () => { try { await sb().auth.signOut(); } catch (e) {} location.reload(); };
    f.onsubmit = async e => {
      e.preventDefault(); const bt = f.querySelector('button'); bt.disabled = true;
      try { const fs = await S.fatores(); if (!fs.length) throw new Error('nenhum fator'); await verificar(fs[0].id, f.codigo.value.trim()); ativoCache = true; el.remove(); aoOk(); }
      catch (err) { const er = el.querySelector('#mfaLErr'); er.textContent = traduz(err); er.hidden = false; bt.disabled = false; f.codigo.select(); }
    };
  };

  /* ---------- Rotina: o que mostrar no Painel ---------- */
  S.MB_DIA = 7;
  S.lembretes = () => {
    const out = [], hoje = U.today();
    /* backup da semana */
    /* no celular o navegador não grava em pasta: o lembrete do backup fica para o computador */
    const celular = !App.Backup.suportaPasta() && window.matchMedia && matchMedia('(max-width: 760px)').matches;
    if (App.Backup && !celular) {
      const ult = Store.config('ultimoBackup'), dias = ult ? U.diff(hoje, ult.slice(0, 10)) : null;
      if (dias == null || dias >= 7) out.push({ id: 'backup', tom: dias != null && dias >= 14 ? 'late' : 'warn', titulo: 'Backup da semana', texto: ult ? `Último há ${dias} dias.` : 'Nenhum backup feito ainda.', acao: App.Backup.pastaNome() ? 'Salvar no OneDrive' : App.Backup.suportaPasta() ? 'Escolher pasta e salvar' : 'Baixar backup' });
    }
    /* fechamento do MB do mês anterior */
    const [ya, ma] = hoje.slice(0, 7).split('-').map(Number), mesAnt = ma === 1 ? (ya - 1) + '-12' : ya + '-' + String(ma - 1).padStart(2, '0');
    const usaMB = Store.all('mb').length > 0, dia = +hoje.slice(8, 10);
    if (usaMB && dia >= S.MB_DIA && !Store.get('mb', mesAnt)) {
      const nome = App.Fat ? App.Fat.nomeMes(mesAnt, true) : mesAnt;
      out.push({ id: 'mb', tom: dia >= 15 ? 'late' : 'warn', titulo: 'Fechamento do MB', texto: `Falta importar ${nome}. Baixe os relatórios do MB e mande no chat; depois importe o arquivo.`, acao: 'Importar mês' });
    }
    /* duas etapas */
    if (S.nuvem() && ativoCache === false) out.push({ id: 'mfa', tom: 'info', titulo: 'Proteja os dados dos clientes', texto: 'Ative a verificação em duas etapas: o login passa a pedir um código do celular.', acao: 'Ativar' });
    return out;
  };
  S.executar = async id => {
    if (id === 'backup') { const r = await App.Backup.semanal(); if (r) App.UI.toast(r); }
    if (id === 'mb') App.go('clientes', { produto: 'mb' }, { origem: true });
    if (id === 'mfa') S.ativar();
  };

  App.Seg = S;
})(window.App = window.App || {});

</script>

    copiar: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'

  /* ---------- Aviso rápido ---------- */

    el.innerHTML = `<span>${U.esc(msg)}</span>${acoes.map((x, i) => `<button class="toast-act" data-i="${i}">${U.esc(x.label)}</button>`).join('')}`;
    el.hidden = false;
    el.querySelectorAll('.toast-act').forEach(b => b.onclick = () => { el.hidden = true; acoes[+b.dataset.i].fn(); });
    clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, acao ? 6000 : 3000);
  };

  /* ---------- Janela (modal) ---------- */
  let pilha = [];
  UI.modal = ({ title, body, footer = '', size = '', onMount, onClose }) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal-bd"></div><div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${U.esc(title)}">
      <div class="modal-h"><h2>${U.esc(title)}</h2><button class="icon-btn" data-close aria-label="Fechar">${UI.icon('x')}</button></div>
      <div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
    document.body.appendChild(wrap);
    const last = document.activeElement;
    const api = {
      el: wrap.querySelector('.modal'),
      close() { wrap.remove(); pilha = pilha.filter(x => x !== api); if (onClose) onClose(); if (last && last.focus) last.focus(); }
    };
    pilha.push(api);
    wrap.querySelector('.modal-bd').onclick = () => api.close();
    wrap.querySelectorAll('[data-close]').forEach(b => b.onclick = () => api.close());
    if (onMount) onMount(api.el, api);
    const f = api.el.querySelector('[autofocus]') || api.el.querySelector('input,select,textarea,button:not([data-close])');
    if (f) setTimeout(() => f.focus(), 30);
    return api;
  };
  UI.closeTop = () => { const t = pilha[pilha.length - 1]; if (t) { t.close(); return true; } return false; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.closeTop()) e.preventDefault(); });

  /* ---------- Confirmação antes de excluir ---------- */
  UI.confirm = ({ title, text, ok = 'Confirmar', danger = true }) => new Promise(resolve => {
    let done = false;
    const m = UI.modal({
      title, size: 'sm',
      body: `<p class="confirm-text">${text}</p>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${U.esc(ok)}</button>`,
      onMount: el => { el.querySelector('[data-ok]').onclick = () => { done = true; m.close(); resolve(true); }; setTimeout(() => el.querySelector('[data-ok]').focus(), 40); },
      onClose: () => { if (!done) resolve(false); }
    });
  });

  /* ---------- Etiquetas ---------- */
  UI.respChip = id => `<span class="rchip"><i style="background:${M.respCor(id)}"></i>${U.esc(M.respNome(id))}</span>`;
  UI.respChips = a => App.M.respsDe(a).map(UI.respChip).join('') || UI.respChip(a.responsabilidadeId);
  UI.prioPill = id => `<span class="prio p-${id}">${M.prio(id).label}</span>`;
  UI.statusPill = id => `<span class="st s-${id}">${M.status(id).label}</span>`;
  UI.due = a => {
    if (a.status === 'concluida') return `<span class="due done">${a.prazo ? U.fmtDate(a.prazo) : 'Concluída'}</span>`;
    const cls = M.atrasada(a) ? 'late' : M.hoje(a) ? 'today' : a.prazo && U.diff(a.prazo, U.today()) <= 2 ? 'soon' : '';
    return `<span class="due ${cls}">${UI.icon('adiar')}${U.relDue(a.prazo)}</span>`;
  };
  /* Etiqueta de negócio: tipo, cliente e valor */
  UI.negChip = a => { const ns = M.negociosDa(a); if (!ns.length) return '';
    return ns.map(n => `<span class="neg${n.resultado === 'perdido' ? ' perdido' : ''}">${UI.icon('negocio')}${U.esc(M.tipoNeg(n.tipo).label)}${n.valor ? ' · ' + U.brlShort(n.valor) : ''}</span>`).join('') + (a.cliente ? `<span class="cli">${U.esc(a.cliente)}</span>` : ''); };
  /* Cliente de uma atividade que não é negócio (o negócio já mostra junto) */
  UI.cliChip = a => a.cliente && !M.negociosDa(a).length ? `<span class="cli">${U.esc(a.cliente)}</span>` : '';
  UI.bar = (pct, cor) => `<div class="pbar"><i style="width:${Math.min(100, Math.round(pct * 100))}%;${cor ? 'background:' + cor : ''}"></i></div>`;

  /* ---------- Formulários ---------- */
  UI.options = (list, sel, { vazio } = {}) => (vazio ? `<option value="">${U.esc(vazio)}</option>` : '') +
    list.map(o => `<option value="${U.esc(o.id)}"${o.id === sel ? ' selected' : ''}>${U.esc(o.label || o.nome)}</option>`).join('');
  UI.respOptions = (sel, vazio) => UI.options(App.Store.all('responsabilidades').filter(r => r.status !== 'arquivada' || r.id === sel), sel, { vazio });
  /* Campo de cliente com busca na base (clientes e prospects) e nos nomes já usados em atividades.
     Guarda o nome em name="cliente" e o id (quando escolhido da base) em name="clienteId". Aceita nome novo. */
  UI.clientePicker = (nome, id) => `<div class="clipick"><input name="cliente" value="${U.esc(nome || '')}" placeholder="Buscar na base ou digitar um nome" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list"><input type="hidden" name="clienteId" value="${U.esc(id || '')}"><ul class="clipick-l" role="listbox" hidden></ul></div>`;
  UI.ligarClientePicker = root => {
    const Store = App.Store;
    const box = root.querySelector('.clipick'); if (!box) return;
    const inp = box.querySelector('[name=cliente]'), hid = box.querySelector('[name=clienteId]'), ul = box.querySelector('.clipick-l');
    const Cli = App.Cli, norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const base = () => { const cl = Store.all('clientes').map(c => ({ id: c.id, nome: c.nome, tag: c.saiu ? 'Ex-cliente' : Cli && !Cli.ehCliente(c) ? 'Prospect' : 'Cliente' }));
      const nomes = new Set(cl.map(c => norm(c.nome)));
      const soAtiv = [...new Set(Store.all('atividades').map(a => a.cliente).filter(Boolean))].filter(n => !nomes.has(norm(n))).map(n => ({ id: '', nome: n, tag: 'Só em atividades' }));
      return cl.concat(soAtiv); };
    let itens = [], ativo = -1;
    const fechar = () => { ul.hidden = true; inp.setAttribute('aria-expanded', 'false'); ativo = -1; };
    const escolher = it => { inp.value = it.nome; hid.value = it.id || ''; fechar(); };
    const marcar = () => ul.querySelectorAll('li').forEach((li, i) => li.classList.toggle('on', i === ativo));
    const abrir = () => {
      const q = norm(inp.value), partes = q.split(/\s+/).filter(Boolean);
      itens = base().filter(c => partes.every(p => norm(c.nome).includes(p)))
        .sort((a, b) => (norm(a.nome).startsWith(q) ? 0 : 1) - (norm(b.nome).startsWith(q) ? 0 : 1) || a.nome.localeCompare(b.nome, 'pt-BR')).slice(0, 8);
      const exato = itens.some(c => norm(c.nome) === q);
      ul.innerHTML = itens.map((c, i) => `<li role="option" data-i="${i}"><b>${U.esc(c.nome)}</b><small>${c.tag}</small></li>`).join('')
        + (q && !exato ? `<li class="novo" data-novo="1"><b>Usar “${U.esc(inp.value.trim())}”</b><small>nome fora da base</small></li>` : '')
        + (!itens.length && !q ? '<li class="vazio">Nenhum cliente na base ainda</li>' : '');
      ul.hidden = !ul.children.length; inp.setAttribute('aria-expanded', String(!ul.hidden)); ativo = itens.length ? 0 : -1; marcar();
    };
    inp.addEventListener('input', () => { hid.value = ''; abrir(); });
    inp.addEventListener('focus', abrir);
    inp.addEventListener('keydown', e => {
      if (ul.hidden) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); ativo = Math.min(itens.length - 1, ativo + 1); marcar(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); ativo = Math.max(0, ativo - 1); marcar(); }
      else if (e.key === 'Enter' && ativo >= 0 && itens[ativo]) { e.preventDefault(); e.stopPropagation(); escolher(itens[ativo]); }
      else if (e.key === 'Escape') { e.stopPropagation(); fechar(); }
    });
    ul.addEventListener('mousedown', e => { e.preventDefault(); const li = e.target.closest('li'); if (!li) return;
      if (li.dataset.novo) { hid.value = ''; fechar(); } else if (li.dataset.i != null) escolher(itens[+li.dataset.i]); });
    inp.addEventListener('blur', () => { setTimeout(fechar, 120);
      /* Digitou o nome exato de alguém da base: liga ao cadastro */
      if (!hid.value && inp.value.trim()) { const m = Store.all('clientes').find(c => norm(c.nome) === norm(inp.value)); if (m) hid.value = m.id; } });
  };
  UI.formData = form => {
    const o = {};
    form.querySelectorAll('[name]').forEach(el => {
      if (el.type === 'radio' && !el.checked) return;
      let v = el.value;
      if (el.dataset.num !== undefined) v = U.parseNum(v);
      else v = v.trim();
      o[el.name] = v === '' ? null : v;
    });
    return o;
  };
  UI.segmented = (name, list, sel) => `<div class="segpick" role="radiogroup">${list.map(o => `<label class="sp sp-${o.id}"><input type="radio" name="${name}" value="${o.id}"${o.id === sel ? ' checked' : ''}><span>${U.esc(o.label)}</span></label>`).join('')}</div>`;

  App.UI = UI;
})(window.App = window.App || {});

</script>
<script>
/* js/ui/charts.js */
/* Gráficos simples em SVG, sem bibliotecas. */
(function (App) {
  const C = {};
  /* Anel de percentual */
  C.ring = (pct, size = 96, cor = 'var(--accent)') => {
    const r = size / 2 - 7, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p * 100)}%">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="8"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${cor}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size / 4.6}" font-weight="700" fill="var(--ink)">${Math.round(p * 100)}%</text></svg>`;
  };
  /* Linha de evolução com linha da meta */
  C.spark = (vals, alvo, w = 300, h = 70) => {
    if (!vals.length) return '';
    const mx = Math.max(alvo || 0, ...vals, 1), n = vals.length;
