    UI.modal({
      title: 'Não rodaram', size: 'sm',
      body: `<p class="muted small" style="margin:0 0 10px">Pessoas para retomar o contato no futuro. Clique num nome para ver o resumo.</p>
        ${nao.length ? `<div class="nr-list">${ord(nao).map(linha).join('')}</div>` : '<p class="muted">Ninguém nessa situação.</p>'}
        ${conv.length ? `<h3 class="nr-h">Em conversa · ${conv.length}</h3><div class="nr-list">${ord(conv).map(linha).join('')}</div>` : ''}`,
      onMount(el, api) { el.querySelectorAll('[data-pes2]').forEach(b => b.onclick = () => { api.close(); setTimeout(() => pessoa(b.dataset.pes2), 30); }); }
    });
  }

  /* Resumo de uma pessoa na rede (cliente ou não) */
  function pessoa(id) {
    const c = Cli.cliente(id); if (!c) return;
    const cad = Cli.cadeia(c), filhos = Cli.filhosDe(c.id), rede = Cli.rede(c), temFicha = Cli.ehCliente(c);
    UI.modal({
      title: c.nome, size: 'sm',
      body: `<div class="pes">
        <p>${sitChip(c)} ${temFicha ? '<span class="sit" style="--sc:#6E3FF0">Na base de clientes</span>' : ''}</p>
        <div class="pes-b"><small>Como chegou</small>${cad.length ? `<div class="chain">${cad.slice().reverse().map(x => `<button data-pes2="${x.id}">${U.esc(nomeCurto(x))}</button>`).join('<span>›</span>')}<span>›</span><b>${U.esc(nomeCurto(c))}</b></div><p class="muted small">${Cli.geracao(c)}ª geração</p>` : c.geracao > 1 ? `<p class="muted">Indicador não informado (${c.geracao}ª geração)</p>` : '<p class="muted">Contato direto, sem indicação.</p>'}</div>
        <div class="pes-b"><small>Indicou</small>${filhos.length ? `<p><b>${U.plural(filhos.length, 'pessoa', 'pessoas')}</b>${rede.length > filhos.length ? ' · ' + rede.length + ' na rede toda' : ''} · ${rodaram(rede.filter(Cli.converteu).length)}</p><div class="ind-chips">${filhos.map(f => `<button data-pes2="${f.id}">${U.esc(nomeCurto(f))} ${sitChip(f)}</button>`).join('')}</div>` : '<p class="muted">Ainda não indicou ninguém.</p>'}</div>
        ${c.observacoes ? `<p class="muted small">${U.esc(c.observacoes)}</p>` : ''}</div>`,
      footer: `<button class="btn ghost" id="pesEd">${UI.icon('editar')}Editar</button><button class="btn ghost" id="pesAdd">${UI.icon('mais')}Indicação de ${U.esc(Cli.apelido(c))}</button>${temFicha ? `<button class="btn primary" id="pesFicha">Abrir ficha</button>` : ''}`,
      onMount(el, api) {
        el.querySelectorAll('[data-pes2]').forEach(b => b.onclick = () => { api.close(); setTimeout(() => pessoa(b.dataset.pes2), 30); });
        el.querySelector('#pesEd').onclick = () => { api.close(); App.Forms.indicacao({ existenteId: c.id }); };
        el.querySelector('#pesAdd').onclick = () => { api.close(); App.Forms.indicacao({ indicadorId: c.id }); };
        const fi = el.querySelector('#pesFicha'); if (fi) fi.onclick = () => { api.close(); ir({ cliente: c.id, deInd: true }); };
      }
    });
  }
  function indicacoes(el) {
    const todos = Store.all('clientes');
    const indicados = todos.filter(c => c.indicadoPor || (c.geracao && +c.geracao > 1));
    const conv = indicados.filter(Cli.converteu);
    const rk = Cli.rankingIndicacoes();
    const raizes = todos.filter(c => !c.indicadoPor && !(c.geracao > 1) && Cli.filhosDe(c.id).length).sort((a, b) => Cli.rede(b).length - Cli.rede(a).length);
    const semInd = todos.filter(c => !c.indicadoPor && c.geracao > 1);
    const ger = {}; indicados.forEach(c => { const g = Cli.geracao(c); ger[g] = ger[g] || { n: 0, c: 0 }; ger[g].n++; if (Cli.converteu(c)) ger[g].c++; });
    const max = rk.length ? rk[0].rede : 1, TOP = 5;
    const emConv = todos.filter(c => c.situacao === 'conversa').sort((a, b) => (a.dataIndicacao || a.criadoEm || '').localeCompare(b.dataIndicacao || b.criadoEm || ''));
    const naoN = todos.filter(c => c.situacao === 'nao').length, convN = todos.filter(c => c.situacao === 'conversa').length;
    el.innerHTML = `${voltar('Clientes', {})}
      <div class="page-h"><div><h1>Rede de indicações</h1><p class="muted">Quem trouxe quem. O cliente vale pelo patrimônio e também pelo relacionamento que ele abre.</p></div>
        <div class="page-act"><button class="btn primary" id="indNova">${UI.icon('mais')}Registrar indicação</button></div></div>
      <div class="kpis k4">
        <div class="kpi"><span>Pessoas indicadas</span><b>${indicados.length}</b></div>
        <div class="kpi"><span>Rodaram</span><b>${conv.length}</b><em>${indicados.length ? Math.round(conv.length / indicados.length * 100) + '% de conversão' : ''}</em></div>
        <button class="kpi k-nao" id="indNao"><span>Não rodaram</span><b>${naoN}</b><em>${convN ? convN + ' em conversa · ' : ''}ver nomes ›</em></button>
        <div class="kpi k-brand"><span>Maior rede</span><b>${rk.length ? U.esc(nomeCurto(rk[0].c)) : '—'}</b><em>${rk.length ? U.plural(rk[0].rede, 'pessoa', 'pessoas') + ' na rede' : ''}</em></div></div>
      <div class="grid-2 ind-grid">
        <section class="card"><div class="card-h"><h2>Quem mais traz relacionamento</h2></div>
          ${rk.length ? `<div class="rk-head"><span>Quem indicou</span><span>Diretas</span><span>Rede</span><span>Rodaram</span></div><ul class="rk-list">${rk.map((r, i) => `<li${i >= TOP ? ' class="rk-mais" hidden' : ''} data-pes="${r.c.id}"><span class="rk-pos">${i + 1}</span><div class="rk-n"><b>${U.esc(nomeCurto(r.c))}</b><div class="pbar"><i style="width:${r.rede / max * 100}%"></i></div><small>${r.patrimonio ? 'Rede trouxe ' + U.brlShort(r.patrimonio) + ' · ' : ''}${r.geracoes > 1 ? r.geracoes + ' gerações' : '1 geração'}</small></div><span>${r.diretas}<small>${rodaram(r.diretasConv)}</small></span><span><b>${r.rede}</b></span><span>${r.redeConv}<small>${r.rede ? Math.round(r.redeConv / r.rede * 100) + '%' : ''}</small></span></li>`).join('')}</ul>${rk.length > TOP ? `<button class="rk-tog" id="rkTog" aria-expanded="false"><span>Ver mais ${rk.length - TOP}</span><i>▾</i></button>` : ''}`
            : '<div class="empty sm"><b>Nenhuma indicação registrada ainda.</b><p>Use “Registrar indicação” ou conte no chat: “a Ana me indicou a Carla, rodou”.</p></div>'}</section>
        <div class="stack">
          <section class="card"><div class="card-h"><h2>Por geração</h2></div>
            ${Object.keys(ger).length ? `<div class="gen-list">${Object.keys(ger).sort((a, b) => a - b).map(g => `<div><b>${g}ª</b><span>${U.plural(ger[g].n, 'pessoa', 'pessoas')}</span><div class="pbar"><i style="width:${ger[g].c / ger[g].n * 100}%;background:#23864F"></i></div><small>${rodaram(ger[g].c)}</small></div>`).join('')}</div>` : '<p class="muted small">Sem dados ainda.</p>'}
            <div class="sit-leg">${Cli.SITUACOES.map(s => `<span class="sit" style="--sc:${s.cor}">${s.label}</span>`).join('')}</div></section>
          <section class="card ec-card"><div class="card-h"><h2>Em conversa</h2><span class="ec-n">${emConv.length}</span><button class="btn ghost sm" id="ecNova">${UI.icon('mais')}Nova</button></div>
            <p class="muted small" style="margin:-4px 0 10px">Quem está no processo para entrar na base. Quando decidir, marque aqui.</p>
            ${emConv.length ? `<ul class="ec-list">${emConv.map(c => { const i = Cli.indicador(c), d = c.dataIndicacao ? U.diff(U.today(), c.dataIndicacao) : null;
              return `<li><button class="ec-nome" data-pes="${c.id}"><b>${U.esc(c.nome)}</b><small>${i ? 'Indicação de ' + U.esc(nomeCurto(i)) : 'Sem indicador'}${d != null && d >= 0 ? ' · ' + (d === 0 ? 'desde hoje' : d === 1 ? 'há 1 dia' : 'há ' + d + ' dias') : ''}</small>${c.observacoes ? `<em>${U.esc(c.observacoes)}</em>` : ''}</button>
                <div class="ec-acts"><button class="ec-sim" data-ecsit="sim" data-id="${c.id}" title="Virou cliente">Rodou</button><button class="ec-nao" data-ecsit="nao" data-id="${c.id}" title="Não vai rodar agora">Não rodou</button></div></li>`; }).join('')}</ul>`
              : '<div class="empty sm"><b>Ninguém em conversa agora.</b><p>Registre uma indicação com a situação “Em conversa”.</p></div>'}</section>
        </div></div>
      <section class="card"><div class="card-h"><h2>Árvore de indicações</h2><span class="muted small">escolha a rede · clique num nome para ver os detalhes</span></div>
        ${raizes.length ? `<div class="ot-tabs" role="tablist">${raizes.map((r, i) => `<button role="tab" data-raiz="${r.id}" aria-selected="${i === 0}"><b>${U.esc(nomeCurto(r))}</b><em>${Cli.rede(r).length}</em></button>`).join('')}</div><div id="otBox"></div>
          <div class="sit-leg">${[['#23864F', 'Rodou / cliente'], ['#7FA83A', 'Rodou em parte'], ['#6E3FF0', 'Em conversa'], ['#C2611A', 'Não rodou'], ['#8F88A6', 'Ex-cliente / sem situação']].map(([c, l]) => `<span class="sit" style="--sc:${c}">${l}</span>`).join('')}<span class="muted small">O número no cartão é quantas pessoas ela indicou.</span></div>` : '<p class="muted small">A árvore aparece quando houver indicações.</p>'}
        ${semInd.length ? `<p class="muted small" style="margin-top:12px">Indicador não informado: ${semInd.map(c => `<a href="#" data-pes="${c.id}">${U.esc(nomeCurto(c))}</a>`).join(', ')}</p>` : ''}</section>`;
    el.querySelector('#indNova').onclick = () => App.Forms.indicacao();
    el.querySelectorAll('[data-pes]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); pessoa(b.dataset.pes); }));
    el.querySelector('#indNao').onclick = naoRodaram;
    el.querySelector('#ecNova').onclick = () => App.Forms.indicacao();
    el.querySelectorAll('[data-ecsit]').forEach(b => b.onclick = () => { const c = Cli.cliente(b.dataset.id), sim = b.dataset.ecsit === 'sim';
      Cli.registrarIndicacao({ indicadorId: c.indicadoPor, situacao: b.dataset.ecsit, data: c.dataIndicacao, observacoes: c.observacoes, existenteId: c.id });
      UI.toast(sim ? Cli.apelido(c) + ' rodou! Agora conta como cliente.' : Cli.apelido(c) + ' foi para "Não rodaram".'); });
    const tog = el.querySelector('#rkTog'); if (tog) tog.onclick = () => { const ab = tog.getAttribute('aria-expanded') !== 'true'; tog.setAttribute('aria-expanded', ab); el.querySelectorAll('.rk-mais').forEach(li => li.hidden = !ab); tog.querySelector('span').textContent = ab ? 'Mostrar só os 5 primeiros' : 'Ver mais ' + (rk.length - TOP); };
    const box = el.querySelector('#otBox');
    if (box) { const abre = id => { el.querySelectorAll('[data-raiz]').forEach(b => b.setAttribute('aria-selected', b.dataset.raiz === id)); desenhaArvore(box, Cli.cliente(id)); };
      el.querySelectorAll('[data-raiz]').forEach(b => b.onclick = () => abre(b.dataset.raiz)); abre(raizes[0].id); }
    ligarComum(el);
  }

  /* ---------- Ficha do cliente: um bloco por plataforma/produto ---------- */
  const usd = v => 'US$ ' + (+v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  const CAT = { rf: ['Renda fixa', '#6E3FF0'], usd: ['Dólar', '#2B8AA6'], caixa: ['Caixa', '#A49CB8'], cripto: ['Cripto', '#D98A1E'], rv: ['Renda variável', '#2F855A'], cestas: ['Cestas', '#A0466B'] };
  const ORDEM = ['mb', 'eqseed', 'ita', 'stonex', 'dominion', 'zentis', 'previdencia', 'vida', 're', 'auto', 'consorcio', 'cambio', 'credito'];

  /* Conteúdo de cada bloco: { titulo, sub, valor, rotuloValor, linhas[], extra (html), acao } */
  function bloco(pid, cts, cli, m) {
    const p = Cli.produto(pid), at = cts.filter(x => (x.status || 'ativo') === 'ativo');
    const b = { p, n: cts.length, acao: 'Ver carteira' };
    if (pid === 'mb') {
      const tot = Object.values(m.cats || {}).reduce((s, v) => s + v, 0) || m.pl;
      Object.assign(b, { valor: U.brl(m.pl), rotuloValor: 'Patrimônio · ' + (Cli.mbAtual() || {}).ref,
        stats: [['No mês', U.num(m.rm) + '%', m.rm_cdi != null ? U.num(m.rm_cdi) + '% do CDI' : ''], ['12 meses', U.num(m.r12) + '%', m.r12_cdi != null ? U.num(m.r12_cdi) + '% do CDI' : ''], ['Resultado 12m', U.brl((m.res || [])[2] || 0), '']],
        extra: `<div class="pb-aloc">${Object.entries(m.cats || {}).map(([k, v]) => `<i style="width:${v / tot * 100}%;background:${(CAT[k] || [k, '#999'])[1]}" title="${(CAT[k] || [k])[0]} ${Math.round(v / tot * 100)}%"></i>`).join('')}</div>
          <div class="pb-leg">${Object.entries(m.cats || {}).map(([k, v]) => `<span><i style="background:${(CAT[k] || [k, '#999'])[1]}"></i>${(CAT[k] || [k])[0]} ${Math.round(v / tot * 100)}%</span>`).join('')}</div>` });
    } else if (pid === 'eqseed') {
      const g = {}; at.forEach(c => { g[c.startup || '—'] = (g[c.startup || '—'] || 0) + (+c.valor || 0); });
      Object.assign(b, { valor: U.brl(at.reduce((s, c) => s + (+c.valor || 0), 0)), rotuloValor: 'Total investido',
        stats: [['Startups', Object.keys(g).length, ''], ['Investimentos', at.length, ''], ['Primeiro', U.fmtDate(at.map(c => c.data).filter(Boolean).sort()[0] || ''), '']],
        extra: `<div class="pb-tags">${Object.entries(g).sort((a, c) => c[1] - a[1]).map(([k, v]) => `<span><b>${U.esc(k)}</b>${U.brlShort(v)}</span>`).join('')}</div>` });
    } else if (pid === 'ita') {
      const c = at[0] || cts[0], n = Cli.aportesITA(c), pz = +c.prazoAnos || null;
      Object.assign(b, { valor: c.valorConta != null ? 'US$ ' + (+c.valorConta).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—', rotuloValor: 'Valor de conta' + (c.dataPosicao ? ' · ' + U.fmtDate(c.dataPosicao) : ''),
        stats: [['Plano', (c.plano || '').split('·').slice(0, 3).join('·').trim() || '—', ''], ['Aporte anual', c.contribuicao ? usd(c.contribuicao) : '—', ''], ['Pago até', c.pagoAte ? U.fmtDate(c.pagoAte) : '—', '']],
        extra: n != null && pz ? `<div class="pb-prog"><div class="pbar"><i style="width:${Math.min(100, n / pz * 100)}%;background:${p.cor}"></i></div><small>${n} de ${pz} aportes pagos${c.contribuicao ? ' · ' + usd(c.contribuicao * n) + ' aportados' : ''}</small></div>` : '' });
      if (at.length > 1) b.extra += `<p class="muted small">+ ${at.length - 1} outro(s) plano(s)</p>`;
    } else if (pid === 'vida') {
      Object.assign(b, { valor: U.brl(at.reduce((s, c) => s + (+c.capital || 0), 0)), rotuloValor: 'Capital segurado',
        stats: [['Prêmio', U.brl(at.reduce((s, c) => s + (+c.premio || 0), 0)) + '/mês', ''], ['Seguradora', [...new Set(at.map(c => c.seguradora).filter(Boolean))].join(', ') || '—', ''], ['Renovação', U.fmtDate(at.map(c => c.renovacao).filter(Boolean).sort()[0] || '') || '—', '']] });
    } else if (pid === 're') {
      Object.assign(b, { valor: U.plural(at.length, 'apólice', 'apólices'), rotuloValor: 'Ramos elementares',
        lista: at.map(c => { const d = Cli.proxData(c); return `<li><b>${U.esc(c.tipo || 'Apólice')}</b><span>${U.esc(c.seguradora || '')}${c.cobertura ? ' · ' + U.brlShort(c.cobertura) : ''}</span>${d ? `<em class="${U.diff(d, U.today()) <= 30 ? 'warn' : ''}">${U.diff(d, U.today()) < 0 ? 'venceu ' : 'vence '}${U.fmtDate(d)}</em>` : ''}</li>`; }).join('') });
    } else if (pid === 'consorcio') {
      Object.assign(b, { valor: U.brl(at.reduce((s, c) => s + (+c.carta || 0), 0)), rotuloValor: 'Em cartas',
        lista: at.map(c => `<li><b>${U.esc(c.administradora || 'Consórcio')}${c.grupo ? ' · ' + U.esc(c.grupo) + (c.cota ? '/' + U.esc(c.cota) : '') : ''}</b><span>${c.carta ? U.brlShort(c.carta) : ''}${c.prazo ? ' · ' + (c.pagas || 0) + '/' + c.prazo + ' parcelas' : ''}</span>${c.contemplado ? '<em class="ok">contemplado</em>' : ''}</li>`).join('') });
    } else {
      /* Produtos sem bloco próprio: soma do valor principal e uma linha por contrato com os campos da lista */
      const cp = p.campos.find(x => x.k === p.principal), cols = p.campos.filter(x => x.lista && x.k !== p.principal);
      const usdK = p.campos.find(x => x.t === 'usd' && /valor/i.test(x.k));
      Object.assign(b, { valor: cp ? Cli.fmt(cp, at.reduce((s, c) => s + (+c[cp.k] || 0), 0)) : usdK ? Cli.fmt(usdK, at.reduce((s, c) => s + (+c[usdK.k] || 0), 0)) : U.plural(at.length, 'registro', 'registros'),
        rotuloValor: cp ? cp.l : usdK ? usdK.l : p.nome,
        lista: at.map(c => { const d = Cli.proxData(c); return `<li><b>${U.esc(Cli.fmt(cols[0] || {}, c[(cols[0] || {}).k]) || p.nome)}</b><span>${cols.slice(1, 3).map(x => Cli.fmt(x, c[x.k])).filter(Boolean).map(U.esc).join(' · ')}</span>${d ? `<em class="${U.diff(d, U.today()) <= 30 ? 'warn' : ''}">${U.diff(d, U.today()) < 0 ? 'venceu ' : 'vence '}${U.fmtDate(d)}</em>` : ''}</li>`; }).join('') });
    }
    return b;
  }
  const blocoHTML = (b, pid) => `<article class="pblock" style="--pc:${b.p.cor}" data-pb="${pid}">
      <header><span class="pb-dot"></span><div><b>${U.esc(b.p.nome)}</b>${b.p.sub ? `<small>${U.esc(b.p.sub)}</small>` : ''}</div><button class="pb-go" data-pb-go="${pid}">${U.esc(b.acao)}${UI.icon('seta')}</button></header>
      <div class="pb-val"><small>${U.esc(b.rotuloValor || '')}</small><b>${b.valor}</b></div>
      ${b.stats ? `<div class="pb-stats">${b.stats.map(([l, v, s]) => `<span><small>${U.esc(l)}</small><b>${U.esc(String(v))}</b>${s ? `<em>${U.esc(s)}</em>` : ''}</span>`).join('')}</div>` : ''}
      ${b.lista ? `<ul class="pb-list">${b.lista}</ul>` : ''}
      ${b.extra || ''}</article>`;

  /* Detalhe de um produto do cliente (todas as linhas, com editar) */
  function detalheProduto(cli, pid) {
    const p = Cli.produto(pid), cts = Cli.contratos({ clienteId: cli.id, produto: pid, todos: true })
      .sort((a, b) => ((a.status || 'ativo') === 'ativo' ? 0 : 1) - ((b.status || 'ativo') === 'ativo' ? 0 : 1) || String(b.data || b.inicio || '').localeCompare(String(a.data || a.inicio || '')));
    UI.modal({
      title: p.nome + ' · ' + Cli.apelido(cli), size: 'md',
      body: `<div class="pd-list">${cts.map(ct => `<div class="ct-card${(ct.status || 'ativo') === 'encerrado' ? ' off' : ''}" style="--pc:${p.cor}"><div class="ct-h"><b>${U.esc(pid === 'eqseed' ? (ct.startup || 'Investimento') : pid === 're' ? (ct.tipo || 'Apólice') : pid === 'consorcio' ? (ct.administradora || 'Cota') : p.nome)}</b>${(ct.status || 'ativo') === 'encerrado' ? '<span class="tag">Encerrado</span>' : ''}${ct.link ? `<a class="doc-link" href="${U.esc(ct.link)}" target="_blank" rel="noopener">${UI.icon('arquivo')}Documento</a>` : ''}<button class="icon-btn" data-ed="${ct.id}" title="Editar" aria-label="Editar">${UI.icon('editar')}</button></div>
          <div class="ct-kv">${p.campos.filter(cp => cp.t !== 'url' && !(pid === 'eqseed' && cp.k === 'startup') && !(pid === 're' && cp.k === 'tipo')).map(cp => { const t = Cli.fmt(cp, ct[cp.k]); return t ? `<span><small>${U.esc(cp.l)}</small>${U.esc(t)}</span>` : ''; }).join('')}${Cli.extras(ct).map(([l, t]) => `<span><small>${U.esc(l)}</small>${U.esc(t)}</span>`).join('')}</div>${ct.observacoes ? `<p class="muted small">${U.esc(ct.observacoes)}</p>` : ''}</div>`).join('')}</div>`,
      footer: `<button class="btn ghost" data-close>Fechar</button><button class="btn primary" id="pdAdd">${UI.icon('mais')}Adicionar ${U.esc(p.nome)}</button>`,
      onMount(el, api) {
        el.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { api.close(); App.Forms.contrato(b.dataset.ed); });
        el.querySelector('#pdAdd').onclick = () => { api.close(); App.Forms.contrato(null, { clienteId: cli.id, produto: pid }); };
      }
    });
  }

  /* Atividades e negócios do cliente (abre pelo indicador do topo) */
  function atividadesModal(cli, ats) {
    UI.modal({
      title: 'Atividades · ' + Cli.apelido(cli), size: 'md',
      body: ats.length ? `<ul class="cl-ats">${ats.slice(0, 30).map(a => `<li data-at="${a.id}" class="${M.aberta(a) ? '' : 'feita'}"><span class="dot-st ${M.aberta(a) ? (M.atrasada(a) ? 'late' : 'open') : 'done'}"></span><div><b>${U.esc(a.titulo)}</b><small>${M.aberta(a) ? U.esc(U.relDue(a.prazo)) : 'Concluída ' + U.esc(U.fmtDate((a.concluidaEm || '').slice(0, 10)))}${M.ehNegocio(a) ? ' · ' + M.negociosDa(a).map(n => U.esc(M.tipoNeg(n.tipo).label)).join(', ') : ''}</small></div></li>`).join('')}</ul>`
        : '<div class="empty sm"><b>Nenhuma atividade com este cliente.</b><p>Atividades aparecem aqui quando o campo Cliente tem o nome ou o apelido dele.</p></div>',
      footer: `<button class="btn ghost" data-close>Fechar</button><button class="btn primary" id="atNova">${UI.icon('mais')}Nova atividade</button>`,
      onMount(el, api) {
        el.querySelectorAll('[data-at]').forEach(li => li.onclick = () => { api.close(); App.Forms.detalhes(li.dataset.at); });
        el.querySelector('#atNova').onclick = () => { api.close(); App.Forms.atividade(null, { cliente: cli.nome, clienteId: cli.id }); };
      }
    });
  }

  /* ---------- XP: PL total manual (um cliente) ---------- */
  function xpModal(c) {
    const h = (c.xpHist || []).slice(0, 6), pl = Cli.plXp(c);
    UI.modal({
      title: 'PL na XP · ' + Cli.apelido(c), size: 'sm',
      body: `<form class="form" id="fXp"><p class="muted small" style="margin:0">Só o total, sem discriminar a carteira (compliance).</p>
        <div class="row2"><label class="f"><span>PL total na XP</span><input name="pl" data-num inputmode="decimal" value="${pl != null ? U.num(pl) : ''}" placeholder="R$" autofocus></label>
        <label class="f"><span>Posição em</span><input type="date" name="em" value="${U.today()}"></label></div>
        <label class="f"><span>Captação líquida no mês <em class="muted">opcional · aportes − resgates na XP</em></span><input name="cap" data-num inputmode="decimal" value="${(() => { const j = (c.xpHist || []).find(x => x.ref === U.today().slice(0, 7)); return j && j.cap != null ? U.num(j.cap) : ''; })()}" placeholder="R$ (negativo se saiu)"></label>
        ${h.length ? `<details class="rg-hist" open><summary>Histórico · ${(c.xpHist || []).length}</summary><ul>${h.map(x => `<li><time>${App.Fat ? App.Fat.nomeMes(x.ref) : x.ref}</time>${U.brl(x.pl)}${x.cap != null ? ` <small class="muted">· captação ${U.brl(x.cap)}</small>` : ''}</li>`).join('')}</ul></details>` : ''}</form>`,
      footer: `${pl != null ? '<button class="btn ghost danger-text" data-xp-del>Limpar</button><span class="grow"></span>' : ''}<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fXp" type="submit">Salvar</button>`,
      onMount(el, api) {
        el.querySelector('#fXp').onsubmit = e => { e.preventDefault(); const d = UI.formData(e.target); if (d.pl == null) return; Cli.salvarXp(c.id, d.pl, d.em, undefined, d.cap == null ? null : d.cap); api.close(); UI.toast('PL da XP atualizado'); };
        const del = el.querySelector('[data-xp-del]'); if (del) del.onclick = () => { Cli.salvarXp(c.id, null); api.close(); UI.toast('PL da XP removido'); };
      }
    });
  }
  /* ---------- XP: atualizar o PL de todos de uma vez (rotina mensal) ---------- */
  function xpBase(el) {
    const clis = Cli.clientes().filter(c => !c.saiu), tot = clis.reduce((s, c) => s + (Cli.plXp(c) || 0), 0), com = clis.filter(c => Cli.plXp(c) != null);
    /* Vindo de "Patrimônio e captação" de um mês passado: a posição já vem no último dia daquele mês */
    const hoje = U.today(), emIni = P.mes && P.mes < hoje.slice(0, 7) && App.Pat ? App.Pat.fimDoMes(P.mes) : hoje;
    const doMes = (c, ref) => (c.xpHist || []).find(h => h.ref === ref);
    const linha = (c, ref) => { const pl = Cli.plXp(c), h = doMes(c, ref), cap = h && h.cap != null ? U.num(h.cap) : '';
      const plv = h ? U.num(h.pl) : pl != null ? U.num(pl) : '';
      return `<li><div><b>${U.esc(c.nome)}</b><small>${pl != null ? 'Atual ' + U.brl(pl) + ' · ' + U.fmtDate(c.xp.em) : 'sem PL cadastrado'}</small></div>
        <input data-xp="${c.id}" data-num inputmode="decimal" value="${plv}" data-orig="${plv}" placeholder="PL R$" aria-label="PL de ${U.esc(c.nome)}">
        <input class="xp-cap" data-xpcap="${c.id}" data-num inputmode="decimal" value="${cap}" data-orig="${cap}" placeholder="Captação" aria-label="Captação líquida no mês de ${U.esc(c.nome)}"></li>`; };
    el.innerHTML = `${voltar(P.mes ? 'Patrimônio e captação' : 'Clientes', P.mes ? { patrimonio: true, mes: P.mes } : {})}
      <div class="page-h"><div><h1>PL na XP</h1><p class="muted">Só o total de cada cliente, digitado por você (a carteira da XP fica fora do painel por compliance). Preencha os que mudaram e salve. A captação líquida do mês (aportes − resgates) é opcional e alimenta a captação em Patrimônio.</p></div></div>
      <section class="kpis k4"><div class="kpi"><span>PL total na XP</span><b>${U.brlShort(tot)}</b></div><div class="kpi"><span>Clientes com PL</span><b>${com.length}</b><em>de ${clis.length}</em></div></section>
      <section class="card"><form id="fXpB"><div class="xp-top"><label class="f"><span>Posição em</span><input type="date" name="em" value="${emIni}"></label><span class="grow"></span><button class="btn primary" type="submit">Salvar alterados</button></div>
        <div class="xp-head"><span>Cliente</span><span>PL total</span><span>Captação no mês</span></div>
        <ul class="xp-list" id="xpL">${clis.map(c => linha(c, emIni.slice(0, 7))).join('')}</ul></form></section>`;
    const form = el.querySelector('#fXpB');
    /* trocar a data para outro mês recarrega os valores daquele mês */
    form.em.onchange = () => { const ref = (form.em.value || hoje).slice(0, 7); el.querySelector('#xpL').innerHTML = clis.map(c => linha(c, ref)).join(''); };
    form.onsubmit = e => {
      e.preventDefault(); const em = form.em.value || hoje; let n = 0;
      clis.forEach(c => {
        const ip = el.querySelector(`[data-xp="${c.id}"]`), ic = el.querySelector(`[data-xpcap="${c.id}"]`);
        const mudouPl = ip.value.trim() !== ip.dataset.orig, mudouCap = ic.value.trim() !== ic.dataset.orig;
        if (!mudouPl && !mudouCap) return;
        const pl = U.parseNum(ip.value), cap = U.parseNum(ic.value);
        if (pl == null && !mudouPl) return; /* captação sem PL não grava */
        Cli.salvarXp(c.id, pl, em, { silent: true }, mudouCap ? cap : undefined); n++;
      });
      if (!n) return UI.toast('Nada mudou.', 'aviso');
      Store.commit(); UI.toast(U.plural(n, 'cliente atualizado', 'clientes atualizados'));
    };
    ligarComum(el);
  }

  function ficha(el) {
    const c = Cli.cliente(P.cliente);
    if (!c) { el.innerHTML = `${voltar('Clientes', {})}<div class="empty card"><b>Cliente não encontrado.</b></div>`; return ligarComum(el); }
    const cts = Cli.contratos({ clienteId: c.id, todos: true }).filter(x => x.produto !== 'mb');
    const m = Cli.mbDoCliente(c);
    const porProd = {}; cts.forEach(x => { (porProd[x.produto] = porProd[x.produto] || []).push(x); });
    const pids = ORDEM.filter(pid => pid === 'mb' ? !!m : porProd[pid]).concat(Object.keys(porProd).filter(k => !ORDEM.includes(k)));
    const ats = Cli.atividadesDo(c).sort((a, b) => (M.aberta(b) - M.aberta(a)) || (b.prazo || '').localeCompare(a.prazo || ''));
    const abertas = ats.filter(M.aberta);
    const receita = Cli.receitaDo(c);
    const eq = (porProd.eqseed || []).filter(x => (x.status || 'ativo') === 'ativo').reduce((s, x) => s + (+x.valor || 0), 0);
    const plXp = Cli.plXp(c), brl = (m ? +m.pl : 0) + eq + (plXp || 0);
    const itaUsd = (porProd.ita || []).reduce((s, x) => s + (+x.valorConta || 0), 0);
    /* mesmo total do bloco Patrimônio (inclui o exterior convertido pela cotação do mês) */
    const totPat = App.Pat ? App.Pat.consolidado(c).total : brl;
    const falta = [];
    const de = P.deInd ? { indicacoes: true } : P.de ? { produto: P.de } : {};
    el.innerHTML = `${voltar(P.deInd ? 'Indicações' : P.de ? Cli.produto(P.de).nome : 'Clientes', de)}
      <section class="cl-hero">
        <div class="cl-hero-id"><span class="cl-av lg">${U.esc((Cli.apelido(c) || '?').slice(0, 2).toUpperCase())}</span><div><h1>${U.esc(c.nome)}</h1>
          <p>${[c.telefone, c.email, c.nascimento && 'Aniversário ' + U.fmtDate(c.nascimento).replace(/ \d{4}$/, '')].filter(Boolean).map(U.esc).join(' · ') || 'Sem contato cadastrado'}</p>
          <div class="cl-hero-tags">${pids.map(pid => `<span style="--pc:${Cli.produto(pid).cor}">${U.esc(Cli.produto(pid).nome)}</span>`).join('')}</div></div></div>
        <div class="cl-hero-act"><button class="btn ghost-d" id="clEd">${UI.icon('editar')}Editar</button><button class="btn primary" data-novo-ct data-cid="${c.id}">${UI.icon('mais')}Produto</button></div>
        <div class="cl-hero-kpis">
          <button class="kp-btn" id="clXp" title="Atualizar o PL da XP"><small>Investido com você</small><b>${totPat ? U.brl(totPat) : '—'}</b><em>${plXp != null ? 'XP ' + U.brlShort(plXp) + ' em ' + U.fmtDate(c.xp.em) + ' · atualizar ›' : 'MB + Eqseed · + PL da XP ›'}${!App.Pat && itaUsd ? ' · + ' + usd(itaUsd) + ' no exterior' : ''}</em></button>
          <div><small>Produtos</small><b>${pids.length}</b><em>${U.plural(cts.filter(x => (x.status || 'ativo') === 'ativo').length + (m ? 1 : 0), 'contrato ativo', 'contratos ativos')}</em></div>
          <button class="kp-btn" id="clAts"><small>Atividades em aberto</small><b>${abertas.length}</b><em>${ats.length ? 'Ver ' + U.plural(ats.length, 'atividade', 'atividades') : 'Criar atividade'} ›</em></button>
          <div><small>Receita gerada</small><b>${receita ? U.brl(receita) : '—'}</b><em>nas suas produções</em></div>
        </div>
      </section>
      ${App.Regua ? App.Regua.faixa(c) : ''}
      ${App.Agenda ? App.Agenda.ficha(c) : ''}
      ${App.PatView ? App.PatView.ficha(c) : ''}
      ${c.observacoes ? `<p class="cl-obs">${U.esc(c.observacoes)}</p>` : ''}
      ${(() => { if (!App.Ren) return ''; App.Ren.sincronizar(); const rs = App.Ren.doCliente(c.id), ab = rs.filter(r => !App.Ren.final(r.status)), fe = rs.filter(r => App.Ren.final(r.status));
        return rs.length ? `<section class="card ren-ficha"><div class="card-h"><h2>Renovações</h2>${ab.length ? `<span class="count">${ab.length}</span>` : ''}</div>
          ${ab.length ? `<ul class="cl-vlist ren-list">${ab.map(r => App.Ren.item(r, { semNome: true })).join('')}</ul>` : '<p class="muted small">Nenhuma em aberto.</p>'}
          ${fe.length ? `<details class="ren-mais"><summary>Baixadas · ${fe.length}</summary><ul class="cl-vlist ren-list">${fe.map(r => App.Ren.item(r, { semNome: true })).join('')}</ul></details>` : ''}</section>` : ''; })()}
      ${mapaFicha(c)}
      <div class="pblocks">${pids.map(pid => blocoHTML(bloco(pid, porProd[pid] || [], c, m), pid)).join('')}
        ${falta.map(pid => `<button class="pblock ghost" style="--pc:${Cli.produto(pid).cor}" data-novo-ct="${pid}" data-cid="${c.id}"><span>${UI.icon('mais')}</span><b>${U.esc(Cli.produto(pid).nome)}</b><small>Ainda não tem · adicionar</small></button>`).join('')}
      </div>`;
    el.querySelector('#clEd').onclick = () => App.Forms.cliente(c.id);
    if (App.Ren) App.Ren.ligar(el);
    el.querySelector('#clAts').onclick = () => atividadesModal(c, ats);
    el.querySelector('#clXp').onclick = () => xpModal(c);
    if (App.Regua) App.Regua.ligar(el);
    if (App.PatView) App.PatView.ligarFicha(el, c, ir);
    if (App.Agenda) App.Agenda.ligar(el);
    el.querySelectorAll('[data-m360]').forEach(b => b.onclick = () => editarArea(c, b.dataset.m360));
    el.querySelectorAll('[data-pb-go]').forEach(b => b.onclick = () => {
      const pid = b.dataset.pbGo;
      if (pid === 'mb') { const ct = Store.all('contratos').find(x => x.produto === 'mb' && x.clienteId === c.id); ir({ produto: 'mb', foco: ct ? ct.mbId : null, cliente: null, deCliente: c.id }); }
      else detalheProduto(c, pid);
    });
    ligarComum(el);
  }

  App.Views = App.Views || {};
  App.Views.clientes = V;
})(window.App = window.App || {});

</script>
<script>
/* js/app.js */
/* Inicialização, navegação entre telas e botão "+ Nova atividade". */
(function (App) {
  const { Store, UI, Demo } = App;
  const ROTAS = ['painel', 'clientes', 'atividades', 'negocios', 'funil', 'emails', 'metas', 'faturamento', 'responsabilidades', 'dados'];
  let atual = 'painel';
  const main = () => document.getElementById('view');

  /* origem: tela de onde viemos, para o botão Voltar */
  App.origem = null;
  App.go = (rota, params, opts = {}) => {
    if (!ROTAS.includes(rota)) rota = 'painel';
    App.origem = opts.origem && atual !== rota ? atual : null;
    const v = App.Views[rota];
    if (v.setParams) v.setParams(params || null);
    atual = rota;
    try { if (location.hash !== '#' + rota) history.replaceState(null, '', '#' + rota); } catch (e) {}
    document.querySelectorAll('[data-go]').forEach(a => a.classList.toggle('active', a.dataset.go === rota && !a.dataset.q));
    document.title = v.titulo + ' · Donna AI';
    render();
    window.scrollTo({ top: 0 });
  };
  /* Número de e-mails para responder no menu */
  function badge() { const b = document.getElementById('mailBadge'); if (!b || !App.Emails) return; const n = App.Emails.paraResponder().length; b.hidden = !n; b.textContent = n > 99 ? '99+' : n; }
  function render() {
    badge();
    App.Views[atual].render(main());
    if (App.origem) main().insertAdjacentHTML('afterbegin', `<button class="back" data-voltar>${UI.icon('voltar')}Voltar para ${App.Views[App.origem].titulo}</button>`);
  }
  App.render = () => render();
  document.addEventListener('click', e => { if (e.target.closest('[data-voltar]')) { const o = App.origem || 'painel'; App.go(o); } });

  /* Links internos: <a data-go="atividades" data-q="prazo=hoje"> */
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-go]');
    if (!a) return;
    e.preventDefault();
    const q = a.dataset.q ? Object.fromEntries(new URLSearchParams(a.dataset.q)) : null;
    App.go(a.dataset.go, q, { origem: !!a.closest('#view') });
  });
  document.addEventListener('click', e => { if (e.target.closest('[data-nova-atividade]')) App.Forms.atividade(null); });
  /* Atalho: tecla N abre "Nova atividade" */
  document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.querySelector('.modal-wrap')) { e.preventDefault(); App.Forms.atividade(null); }
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (!h || h.includes('=')) return; const r = h.split('?')[0]; if (r !== atual) App.go(r); });

  /* Ao mudar qualquer dado, a tela atual é redesenhada */
  Store.onChange(() => { if (!document.querySelector('.modal-wrap .modal')) render(); else pend = true; });
  let pend = false;
  new MutationObserver(() => { if (pend && !document.querySelector('.modal-wrap')) { pend = false; render(); } }).observe(document.body, { childList: true });

  /* Status de salvamento (rodapé do menu e ponto no topo do celular) */
  const ROT = { ok: 'Salvo na nuvem', salvando: 'Salvando...', offline: 'Sem internet · guardado no aparelho', erro: 'Erro ao salvar · tentando de novo', carregando: 'Carregando...', local: 'Salvo neste navegador' };
  function statusUI(st) {
    const el = document.getElementById('syncSt'), dot = document.getElementById('syncDot');
    if (el) { el.className = 'sync s-' + st.id; el.innerHTML = `<i></i><span>${ROT[st.id] || ''}</span>${st.id === 'erro' || st.id === 'offline' ? '<button class="link" id="syncRetry">Tentar agora</button>' : ''}`;
      const r = el.querySelector('#syncRetry'); if (r) r.onclick = () => Store.tentarDeNovo(); el.title = st.msg || ROT[st.id] || ''; }
    if (dot) { dot.className = 'syncdot s-' + st.id; dot.title = ROT[st.id] || ''; }
  }
  function conta(email) {
    const el = document.getElementById('account'); if (!el) return;
    el.hidden = false;
    el.innerHTML = email ? `<span class="acc-mail" title="${App.U.esc(email)}">${App.U.esc(email)}</span><button class="link" id="sair">Sair</button>` : '';
    const b = el.querySelector('#sair'); if (b) b.onclick = () => App.Cloud.sair();
  }
  const rotaInicial = () => { const h = location.hash.slice(1); return h && !h.includes('=') ? h.split('?')[0] : 'painel'; };

  async function iniciar() {
    const C = App.Cloud;
    if (C.configurado()) {
      if (!window.supabase) {
        document.getElementById('view').innerHTML = '<div class="empty card"><b>Não foi possível conectar.</b><p>Verifique a internet e recarregue a página.</p><button class="btn primary" onclick="location.reload()">Recarregar</button></div>';
        return;
      }
      C.init();
      let s = null;
      try { s = await C.sessao(); } catch (e) {}
      if (!s) { C.telaLogin(() => location.reload()); return; }
      /* duas etapas: quem tem código cadastrado e entrou só com a senha digita o código antes de ver os dados */
      if (App.Seg && await App.Seg.precisaCodigo()) { App.Seg.telaCodigo(() => location.reload()); return; }
      Store.useAdapter(C.adapter(s.user));
      Store.onStatus(statusUI);
      Store.init();
      conta(s.user.email);
      App.go(rotaInicial());
      try {
        const r = await Store.sincronizar();
        App.Fat.garantir();
        if (r.vazio && !Store.config('inicializado')) C.boasVindas();
      } catch (e) {
        console.error(e);
        UI.toast('Não foi possível carregar da nuvem. Mostrando a cópia deste aparelho.', 'erro');
      }
      C.vigiar();
      if (App.Seg) App.Seg.atualizar().then(() => render());
    } else {
      Store.onStatus(statusUI);
      const primeiro = Store.init();
      if (primeiro || !Store.config('inicializado')) Demo.seed();
      App.Fat.garantir();
      if (!Store.available()) setTimeout(() => UI.toast('O navegador está bloqueando o armazenamento. Os dados não serão guardados.', 'erro'), 500);
      App.go(rotaInicial());
    }
  }
  iniciar();
})(window.App = window.App || {});

</script>

</body>
