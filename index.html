adius:999px;padding:4px;overflow-x:auto;max-width:100%}\n.tabs button{border:0;background:none;font:600 14px var(--body);color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}\n.tabs button.on{background:var(--grad-btn);color:#fff;box-shadow:var(--glow)}\n.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.grid{display:grid;gap:16px}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;min-width:0}\n.card.main::before{content:\"\";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad);border-radius:var(--r) var(--r) 0 0}\n.card h2{font-size:16px;font-weight:600;margin:0 0 2px}\n.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}\n.lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}\n.hero{background:var(--dark);color:#fff;border-radius:var(--r);padding:22px 24px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:20px;box-shadow:var(--shadow)}\n.hero .lbl{color:#B5A9DA}\n.hero .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:6px}\n.hero .mid{font-family:var(--display);font-weight:700;font-size:22px;margin-top:6px}\n.hero .note{color:#B5A9DA;font-size:13px;margin-top:4px}\n.kpis{grid-template-columns:repeat(5,1fr)}\n.kpi .v{font-family:var(--display);font-weight:700;font-size:21px;margin-top:6px}\n.kpi .s{color:var(--muted);font-size:13px;margin-top:2px}\n.pos{color:var(--ok)}.neg{color:var(--late)}\n.two{grid-template-columns:1fr 1fr}\n.stack{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--track);margin:6px 0 14px}\n.stack span{display:block;height:100%}\n.legend{display:grid;gap:8px}\n.legend .row{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;font-size:14px}\n.dot{width:10px;height:10px;border-radius:3px}\n.legend .row .p{color:var(--muted);min-width:56px;text-align:right}\n.legend .row .val{font-family:var(--display);font-weight:600;min-width:94px;text-align:right}\n.tbl{width:100%;border-collapse:collapse;font-size:14px}\n.tbl th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}\n.tbl th.r,.tbl td.r{text-align:right}\n.tbl th.nosort{cursor:default}\n.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}\n.tbl tr.click{cursor:pointer}\n.tbl tr.click:hover td{background:var(--surface-2)}\n.tbl tr.total td{font-weight:700;background:var(--surface-2)}\n.tscroll{overflow-x:auto;margin:0 -18px;padding:0 18px}\n.bar{height:8px;border-radius:999px;background:var(--track);overflow:hidden;min-width:60px}\n.bar i{display:block;height:100%;background:var(--grad);border-radius:999px}\n.bar.warn i{background:linear-gradient(90deg,#E39A3A,#F2B865)}\n.bar.late i{background:linear-gradient(90deg,#D9583F,#EE8B6E)}\n.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}\n.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.late{background:var(--late-soft);color:var(--late)}.chip.pur{background:var(--accent-soft);color:var(--accent)}\n.mini{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--track);width:110px}\n.mini span{display:block;height:100%}\n.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}\n.ctrl input[type=search],.ctrl input[type=text],.ctrl select{font:15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}\n.ctrl input[type=search]{flex:1;min-width:180px}\n.ctrl .lim{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}\n.ctrl .lim input{width:70px;text-align:right;border-radius:10px}\n.pills{display:flex;gap:6px;flex-wrap:wrap}\n.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:600 13px var(--body);color:var(--muted);cursor:pointer}\n.pill.on{background:var(--accent-soft);border-color:#D6C8FC;color:var(--accent)}\n.alert{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}\n.alert:last-child{border-bottom:0}\n.alert .t{font-weight:700}\n.alert .chip{justify-self:start;text-align:center}\n.alert .d{color:var(--muted);font-size:14px}\n.chart svg{display:block;width:100%;height:auto}\n.chart text{font-family:var(--body);fill:var(--faint);font-size:11px}\n.foot{color:var(--faint);font-size:12.5px;margin-top:22px;line-height:1.5}\n/* modal */\n.ov{position:fixed;inset:0;background:rgba(20,12,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:50;overflow:hidden}\n.md{background:var(--bg);border-radius:18px;width:min(980px,100%);max-height:calc(100vh - 56px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(20,10,60,.35)}\n.md-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:18px 18px 0 0}\n.md-h h3{margin:0;font-size:18px}\n.md-b{padding:18px 20px;overflow:auto}\n.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font:600 14px var(--body);color:var(--ink);cursor:pointer}\n.btn.pr{background:var(--grad-btn);color:#fff;border:0}\n.btn.pr:hover{box-shadow:var(--glow)}\n.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}\n.kv .card{padding:14px}\n.kv .v{font-family:var(--display);font-weight:700;font-size:18px;margin-top:4px}\n.muted{color:var(--muted)}\n.show-m{display:none}\na{color:var(--accent);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}\n.small{font-size:13px}\n@media (max-width:980px){.hero{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}}\n@media (max-width:560px){\n  .wrap{padding:16px 12px 50px}.top h1{font-size:22px}\n  .hero{grid-template-columns:1fr 1fr;padding:18px;gap:16px}.hero .big{font-size:27px}.hero>div:first-child{grid-column:1/-1}\n  .kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:18px}\n  .hide-m{display:none}.show-m{display:inline}\n  .tbl{font-size:13px}.tbl td,.tbl th{padding:8px 6px}\n  .legend .row .p{min-width:44px}.legend .row .val{min-width:80px}\n  .ov{padding:0}.md{border-radius:0;max-height:100vh;height:100vh}.md-h{border-radius:0}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <div>\n      <div class=\"eyebrow\">Mercado Bitcoin · Assessoria<\/div>\n      <h1>Carteira de clientes<\/h1>\n      <div class=\"sub\" id=\"subt\"><\/div>\n    <\/div>\n    <nav class=\"tabs\" role=\"tablist\">\n      <button class=\"on\" data-tab=\"geral\">Visão geral<\/button>\n      <button data-tab=\"emissores\">Emissores<\/button>\n      <button data-tab=\"clientes\">Clientes<\/button>\n      <button data-tab=\"liquidez\">Vencimentos e alertas<\/button>\n    <\/nav>\n  <\/header>\n\n  <!-- GERAL -->\n  <section id=\"tab-geral\" class=\"grid\">\n    <div class=\"hero\" id=\"hero\"><\/div>\n    <div class=\"grid kpis\" id=\"kpis\"><\/div>\n    <div class=\"grid two\">\n      <div class=\"card main\"><h2>Alocação por classe<\/h2><p class=\"hint\">Quanto do PL total está em cada classe de ativo.<\/p><div id=\"aloc\"><\/div><\/div>\n      <div class=\"card main\"><h2>Evolução do PL (12 meses)<\/h2><p class=\"hint\">Soma do saldo final dos 16 clientes em cada mês. As barras mostram a captação líquida.<\/p><div class=\"chart\" id=\"evo\"><\/div><\/div>\n    <\/div>\n    <div class=\"grid two\">\n      <div class=\"card\"><h2>Maiores exposições por emissor<\/h2><p class=\"hint\">Top 6. Veja todos na aba Emissores.<\/p><div id=\"topEm\"><\/div><\/div>\n      <div class=\"card\"><h2>Rentabilidade no mês × CDI<\/h2><p class=\"hint\">Rentabilidade da carteira de cada cliente em out/26, em % do CDI (CDI do mês: <span id=\"cdiM\"><\/span>).<\/p><div id=\"rentBars\"><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- EMISSORES -->\n  <section id=\"tab-emissores\" class=\"grid\" hidden>\n    <div class=\"card main\">\n      <h2>Exposição consolidada por emissor<\/h2>\n      <p class=\"hint\">Renda fixa digital (BRL e USD) agrupada pelo emissor/cedente do crédito. Clique numa linha para ver os clientes e os ativos.<\/p>\n      <div class=\"ctrl\">\n        <div class=\"pills\" id=\"grpPills\">\n          <button class=\"pill on\" data-g=\"emissor\">Por emissor<\/button>\n          <button class=\"pill\" data-g=\"estrut\">Por estruturador<\/button>\n          <button class=\"pill\" data-g=\"ativo\">Por ativo<\/button>\n          <button class=\"pill\" data-g=\"idx\">Por indexador<\/button>\n        <\/div>\n        <label class=\"lim\">Limite de concentração <input type=\"text\" id=\"lim\" value=\"10\" inputmode=\"decimal\">% do PL<\/label>\n      <\/div>\n      <div class=\"tscroll\"><table class=\"tbl\" id=\"emTbl\"><\/table><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- CLIENTES -->\n  <section id=\"tab-clientes\" class=\"grid\" hidden>\n    <div class=\"card main\">\n      <h2>Clientes<\/h2>\n      <p class=\"hint\">Clique no cliente para ver a carteira completa. Clique no título da coluna para ordenar.<\/p>\n      <div class=\"ctrl\">\n        <input type=\"search\" id=\"q\" placeholder=\"Buscar cliente\">\n        <div class=\"pills\" id=\"fPills\">\n          <button class=\"pill on\" data-f=\"all\">Todos<\/button>\n          <button class=\"pill\" data-f=\"alert\">Com alerta<\/button>\n          <button class=\"pill\" data-f=\"cripto\">Com cripto<\/button>\n          <button class=\"pill\" data-f=\"usd\">Com dólar<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"tscroll\"><table class=\"tbl\" id=\"clTbl\"><\/table><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- LIQUIDEZ -->\n  <section id=\"tab-liquidez\" class=\"grid\" hidden>\n    <div class=\"grid two\">\n      <div class=\"card main\"><h2>Vencimentos por semestre<\/h2><p class=\"hint\">Saldo atual de renda fixa digital pela data de vencimento final do ativo. Ativos com amortização pagam parte antes do vencimento.<\/p><div class=\"chart\" id=\"vencChart\"><\/div><\/div>\n      <div class=\"card main\"><h2>Alertas da carteira<\/h2><p class=\"hint\">Pontos que pedem uma conversa ou acompanhamento.<\/p><div id=\"alerts\"><\/div><\/div>\n    <\/div>\n    <div class=\"card\"><h2>Vencimentos nos próximos 6 meses<\/h2><p class=\"hint\">Recursos que devem voltar para o caixa dos clientes até abr/27. São oportunidades de reinvestimento.<\/p><div class=\"tscroll\"><table class=\"tbl\" id=\"vencTbl\"><\/table><\/div><\/div>\n    <div class=\"card\"><h2>Ativos sem rentabilidade em outubro<\/h2><p class=\"hint\">O relatório do MB não mostra rentabilidade no mês para estes ativos (o preço só é atualizado em eventos de liquidez). Vale acompanhar com o MB.<\/p><div class=\"tscroll\"><table class=\"tbl\" id=\"semRent\"><\/table><\/div><\/div>\n  <\/section>\n\n  <p class=\"foot\">Fonte: relatórios de ganhos financeiros do Mercado Bitcoin de outubro/2026 (posição em 31/10/2026), um por cliente. Rentabilidades conforme o MB: brutas de impostos, método Time Weighted Return; a rentabilidade da carteira não considera saldo em reais. A rentabilidade consolidada da carteira de clientes é uma aproximação (resultado financeiro do mês ÷ saldo inicial mais aportes). Uso interno. Resultados passados não garantem resultados futuros.<\/p>\n<\/div>\n\n<div class=\"ov\" id=\"ov\" hidden><div class=\"md\" role=\"dialog\" aria-modal=\"true\"><div class=\"md-h\"><h3 id=\"mdT\"><\/h3><button class=\"btn\" id=\"mdX\">Voltar<\/button><\/div><div class=\"md-b\" id=\"mdB\"><\/div><\/div><\/div>\n\n<script>\nconst D = __DADOS__;\nconst brl = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});\nconst brl2 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});\nconst nf1 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});\nconst nf2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst R = v => v==null?'—':brl.format(v);\nconst short = v => { if(v==null) return '—'; const a=Math.abs(v); if(a>=1e6) return 'R$ '+nf1.format(v/1e6).replace(',0','')+' mi'; if(a>=1e3) return 'R$ '+nf1.format(v/1e3).replace(',0','')+' mil'; return brl.format(v); };\nconst P = (v,d=2) => v==null?'—':(d==1?nf1:nf2).format(v)+'%';\nconst esc = s => String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst CLS = {rf:['Renda fixa digital','var(--c-rf)'],usd:['Renda fixa digital (dólar)','var(--c-usd)'],cripto:['Criptoativos','var(--c-cripto)'],rv:['Renda variável digital','var(--c-rv)'],cestas:['Cestas inteligentes','var(--c-rv)'],caixa:['Caixa em reais','var(--c-caixa)']};\nconst nm2 = n => {const w=n.split(' '); const l=w[w.length-1]; return w[0]+' '+(/^(Filho|Junior|Júnior|Neto)$/.test(l)?w[w.length-2]+' '+l:l);};\nconst CDI = D.cdi; // [mês, ano, 12m]\nconst C = D.clients, POS = D.positions;\nconst byId = Object.fromEntries(C.map(c=>[c.id,c]));\nconst PL = C.reduce((s,c)=>s+c.pl,0);\nconst rfPos = POS.filter(p=>p.classe==='rf'||p.classe==='usd');\n\n// derived per client\nC.forEach(c=>{\n  const ps = POS.filter(p=>p.cid===c.id);\n  c.pos = ps;\n  const em = {}; ps.filter(p=>p.emissor).forEach(p=>em[p.emissor]=(em[p.emissor]||0)+p.saldo);\n  c.nEm = Object.keys(em).length;\n  const top = Object.entries(em).sort((a,b)=>b[1]-a[1])[0];\n  c.topEm = top?top[0]:null; c.topEmPct = top?top[1]/c.pl*100:0;\n  c.caixaPct = (c.cats.caixa||0)/c.pl*100;\n  c.semRent = ps.filter(p=>(p.classe==='rf')&&p.mes==null).reduce((s,p)=>s+p.saldo,0);\n  c.alerts=[];\n  if(c.r12_cdi!=null && c.r12_cdi<100) c.alerts.push(['warn','Abaixo do CDI em 12 meses ('+P(c.r12_cdi,1)+')']);\n  if(c.r12_cdi==null && c.r12!=null && c.r12<CDI[2]) c.alerts.push(['warn','Abaixo do CDI em 12 meses']);\n  if(c.caixaPct>=10) c.alerts.push(['warn','Caixa parado: '+P(c.caixaPct,0)+' do PL']);\n  if(c.topEmPct>=50) c.alerts.push(['late','Concentração: '+P(c.topEmPct,0)+' em '+c.topEm]);\n  if(c.pos.some(p=>p.venc&&(()=>{const [d,m,y]=p.venc.split('/').map(Number);return new Date(2000+y,m-1,d)<=new Date(2026,9,31);})())) c.alerts.push(['late','Ativo vencido ainda com saldo']);\n  if(c.semRent>0) c.alerts.push(['warn','Ativos sem rentabilidade no mês: '+short(c.semRent)]);\n});\n\n// ---------- tabs\ndocument.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));\n  document.querySelectorAll('section[id^=tab-]').forEach(s=>s.hidden = s.id!=='tab-'+b.dataset.tab);\n  window.scrollTo({top:0});\n});\n\n// ---------- overview\nconst sum = f => C.reduce((s,c)=>s+(f(c)||0),0);\nconst resM = sum(c=>c.res[0]), res12 = sum(c=>c.res[2]), resA=sum(c=>c.res[1]);\nconst apM=sum(c=>c.ap[0]), rgM=sum(c=>c.rg[0]), apA=sum(c=>c.ap[1]), rgA=sum(c=>c.rg[1]);\nconst baseM = sum(c=>c.si+c.ap[0]);\nconst rentM = resM/baseM*100;\nconst receb = POS.reduce((s,p)=>s+(p.receb||0),0);\ndocument.getElementById('subt').textContent = 'Posição em 31/10/2026 · '+C.length+' clientes';\ndocument.getElementById('cdiM').textContent = P(CDI[0]);\ndocument.getElementById('hero').innerHTML = `\n  <div><div class=\"lbl\">PL sob assessoria<\/div><div class=\"big\">${brl2.format(PL)}<\/div><div class=\"note\">${C.length} clientes · PL médio ${short(PL/C.length)}<\/div><\/div>\n  <div><div class=\"lbl\">Resultado em out/26<\/div><div class=\"mid\">${brl.format(resM)}<\/div><div class=\"note\">${short(res12)} em 12 meses<\/div><\/div>\n  <div><div class=\"lbl\">Rentabilidade consolidada<\/div><div class=\"mid\">${P(rentM)}<\/div><div class=\"note\">${P(rentM/CDI[0]*100,0)} do CDI (${P(CDI[0])})<\/div><\/div>\n  <div><div class=\"lbl\">Captação líquida em out/26<\/div><div class=\"mid\">${brl.format(apM-rgM)}<\/div><div class=\"note\">Aportes ${short(apM)} · resgates ${short(rgM)}<\/div><\/div>`;\nconst nAbove = C.filter(c=>c.rm_cdi!=null&&c.rm_cdi>=100).length, nWith = C.filter(c=>c.rm!=null).length;\nconst nAl = C.filter(c=>c.alerts.length).length;\nconst emAgg = agg('emissor');\ndocument.getElementById('kpis').innerHTML = [\n  ['Captação no ano', brl.format(apA-rgA), `Aportes ${short(apA)} · resgates ${short(rgA)}`],\n  ['Resultado no ano', brl.format(resA), 'Soma do ganho financeiro dos clientes'],\n  ['Clientes acima do CDI', nAbove+' de '+nWith, 'No mês, entre clientes com rentabilidade'],\n  ['Maior emissor', emAgg[0].k, P(emAgg[0].v/PL*100,1)+' do PL · '+emAgg[0].nc+' clientes'],\n  ['Recebimentos em out/26', brl.format(receb), 'Juros e amortizações pagos'],\n].map(k=>`<div class=\"card kpi\"><div class=\"lbl\">${k[0]}<\/div><div class=\"v\">${esc(k[1])}<\/div><div class=\"s\">${k[2]}<\/div><\/div>`).join('');\n\n// allocation\n(()=>{\n  const t={}; POS.forEach(p=>t[p.classe]=(t[p.classe]||0)+p.saldo);\n  const arr=Object.entries(t).sort((a,b)=>b[1]-a[1]);\n  const nCl = k => C.filter(c=>c.cats[k]).length;\n  document.getElementById('aloc').innerHTML = `<div class=\"stack\">${arr.map(([k,v])=>`<span style=\"width:${v/PL*100}%;background:${CLS[k][1]}\" title=\"${CLS[k][0]}\"><\/span>`).join('')}<\/div>\n  <div class=\"legend\">${arr.map(([k,v])=>`<div class=\"row\"><span class=\"dot\" style=\"background:${CLS[k][1]}\"><\/span><span>${CLS[k][0]} <span class=\"muted small\">· ${nCl(k)} cliente${nCl(k)>1?'s':''}<\/span><\/span><span class=\"p\">${P(v/PL*100,1)}<\/span><span class=\"val\">${R(v)}<\/span><\/div>`).join('')}<\/div>\n  <p class=\"small muted\" style=\"margin:14px 0 0\">Nenhum cliente tem renda variável digital ou cestas inteligentes nesta posição.<\/p>`;\n})();\n\n// evolution chart\n(()=>{\n  const months=['Nov/25','Dez/25','Jan/26','Fev/26','Mar/26','Abr/26','Mai/26','Jun/26','Jul/26','Ago/26','Set/26','Out/26'];\n  const rows = months.map(m=>{let sf=0,ap=0,rg=0; C.forEach(c=>{const h=c.hist.find(x=>x[0]===m); if(h){sf+=h[4]||0;ap+=h[2]||0;rg+=h[3]||0;}}); return {m,sf,net:ap-rg};});\n  const W=560,H=262,ml=70,mr=10,mt=14,mb=62,iw=W-ml-mr,ih=H-mt-mb;\n  const vs=rows.map(r=>r.sf).filter(v=>v>0); const maxV=Math.ceil(Math.max(...vs)*1.04/20000)*20000, minV=Math.floor(Math.min(...vs)*.92/20000)*20000;\n  const y=v=>mt+ih-(v-minV)/(maxV-minV)*ih;\n  const x=i=>ml+iw*(i+.5)/rows.length;\n  const maxN=Math.max(...rows.map(r=>Math.abs(r.net)))||1;\n  let g='';\n  for(let i=0;i<=4;i++){const v=minV+(maxV-minV)*i/4; g+=`<line x1=\"${ml}\" x2=\"${W-mr}\" y1=\"${y(v)}\" y2=\"${y(v)}\" stroke=\"#ECE7F6\"/><text x=\"${ml-8}\" y=\"${y(v)+4}\" text-anchor=\"end\">${short(v)}<\/text>`;}\n  const bw=iw/rows.length*.5, base=H-mb+42;\n  rows.forEach((r,i)=>{const h=Math.abs(r.net)/maxN*18; if(r.net) g+=`<rect x=\"${x(i)-bw/2}\" y=\"${r.net>0?base-h:base}\" width=\"${bw}\" height=\"${Math.max(h,1)}\" rx=\"2\" fill=\"${r.net>0?'#23864F':'#C8402E'}\" opacity=\".7\"><title>${r.m}: captação líquida ${brl.format(r.net)}<\/title><\/rect>`;\n    g+=`<text x=\"${x(i)}\" y=\"${H-mb+14}\" text-anchor=\"middle\">${r.m.slice(0,3)}<\/text>`;});\n  g+=`<line x1=\"${ml}\" x2=\"${W-mr}\" y1=\"${base}\" y2=\"${base}\" stroke=\"#E5E0F0\" stroke-dasharray=\"3 3\"/>`;\n  const pts=rows.map((r,i)=>`${x(i)},${y(r.sf)}`).join(' ');\n  g+=`<defs><linearGradient id=\"lg\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#8F6BFF\"/><stop offset=\"1\" stop-color=\"#C98CFF\"/><\/linearGradient><linearGradient id=\"la\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#8F6BFF\" stop-opacity=\".18\"/><stop offset=\"1\" stop-color=\"#8F6BFF\" stop-opacity=\"0\"/><\/linearGradient><\/defs>`;\n  g+=`<polygon points=\"${x(0)},${y(minV)} ${pts} ${x(rows.length-1)},${y(minV)}\" fill=\"url(#la)\"/>`;\n  g+=`<polyline points=\"${pts}\" fill=\"none\" stroke=\"url(#lg)\" stroke-width=\"3\" stroke-linejoin=\"round\"/>`;\n  rows.forEach((r,i)=>g+=`<circle cx=\"${x(i)}\" cy=\"${y(r.sf)}\" r=\"${i===rows.length-1?5:3}\" fill=\"${i===rows.length-1?'#6E3FF0':'#fff'}\" stroke=\"#6E3FF0\" stroke-width=\"2\"><title>${r.m}: ${brl.format(r.sf)}<\/title><\/circle>`);\n  const l=rows[rows.length-1]; g+=`<text x=\"${x(rows.length-1)-8}\" y=\"${y(l.sf)-10}\" text-anchor=\"end\" style=\"fill:#1D1630;font-weight:700;font-size:12px\">${short(l.sf)}<\/text>`;\n  document.getElementById('evo').innerHTML=`<svg viewBox=\"0 0 ${W} ${H+4}\">${g}<\/svg><div class=\"small muted\">Barras abaixo: captação líquida do mês (verde = entrada, vermelho = saída).<\/div>`;\n})();\n\n// rent bars\n(()=>{\n  const arr=C.filter(c=>c.rm_cdi!=null||c.rm!=null).sort((a,b)=>(b.rm_cdi??-999)-(a.rm_cdi??-999));\n  const mx=Math.max(...arr.map(c=>c.rm_cdi||0),150);\n  const sem=C.filter(c=>c.rm==null);\n  document.getElementById('rentBars').innerHTML = `<div style=\"position:relative\">${arr.map(c=>{\n    const v=c.rm_cdi; const cls=v==null?'late':v<100?'warn':'';\n    return `<div style=\"display:grid;grid-template-columns:minmax(0,150px) 1fr 64px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px;cursor:pointer\" onclick=\"openClient('${c.id}')\"><span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${esc(nm2(c.nome))}<\/span>\n      <div style=\"position:relative\"><div class=\"bar ${cls}\"><i style=\"width:${Math.max(v||0,2)/mx*100}%\"><\/i><\/div><span style=\"position:absolute;top:-3px;bottom:-3px;left:${100/mx*100}%;border-left:1.5px dashed #615A77\"><\/span><\/div>\n      <span class=\"r\" style=\"text-align:right;font-weight:600\">${v==null?P(c.rm):P(v,0)}<\/span><\/div>`;}).join('')}<\/div>\n    <p class=\"small muted\" style=\"margin:10px 0 0\">Linha tracejada = 100% do CDI.${sem.length?' Sem rentabilidade no mês: '+sem.map(c=>esc(c.nome.split(' ')[0])).join(', ')+' (carteira quase toda em caixa).':''} Valores negativos aparecem em %.<\/p>`;\n})();\n\n// ---------- aggregation helper\nfunction agg(key){\n  const m={};\n  rfPos.forEach(p=>{const k=p[key]||'—'; (m[k]=m[k]||{k,v:0,cl:new Set(),at:new Set(),ps:[]}); m[k].v+=p.saldo; m[k].cl.add(p.cid); m[k].at.add(p.ativo); m[k].ps.push(p);});\n  return Object.values(m).map(o=>({...o,nc:o.cl.size})).sort((a,b)=>b.v-a.v);\n}\nfunction lim(){const v=parseFloat(String(document.getElementById('lim').value).replace(',','.')); return isFinite(v)&&v>0?v:10;}\n// top emitters (overview)\nfunction renderTopEm(){\n  const a=agg('emissor').slice(0,6), L=lim();\n  document.getElementById('topEm').innerHTML = a.map(o=>{const pc=o.v/PL*100; const cls=pc>=L?'late':pc>=L*.8?'warn':'';\n    return `<div style=\"display:grid;grid-template-columns:110px 1fr 110px;gap:10px;align-items:center;margin:9px 0;cursor:pointer\" onclick=\"openEm('emissor',${JSON.stringify(o.k).replace(/\"/g,'&quot;')})\"><b style=\"font-size:14px\">${esc(o.k)}<\/b><div class=\"bar ${cls}\"><i style=\"width:${o.v/a[0].v*100}%\"><\/i><\/div><span style=\"text-align:right;font-size:13.5px\"><b>${P(pc,1)}<\/b> <span class=\"muted\">· ${o.nc} cl.<\/span><\/span><\/div>`}).join('');\n}\n// ---------- emitters table\nlet grp='emissor', emSort={k:'v',d:-1};\nconst GL={emissor:'Emissor',estrut:'Estruturador',ativo:'Ativo',idx:'Indexador'};\nfunction renderEm(){\n  const L=lim(); let a=agg(grp);\n  a.forEach(o=>{o.pc=o.v/PL*100; o.rm = o.ps.filter(p=>p.mes!=null).reduce((s,p)=>s+p.mes*p.saldo,0)/(o.ps.filter(p=>p.mes!=null).reduce((s,p)=>s+p.saldo,0)||1); o.hasR=o.ps.some(p=>p.mes!=null);\n    o.semR=o.ps.filter(p=>p.mes==null).reduce((s,p)=>s+p.saldo,0); o.maxCl=Math.max(...[...o.cl].map(id=>o.ps.filter(p=>p.cid===id).reduce((s,p)=>s+p.saldo,0)/byId[id].pl*100));});\n  const s=emSort; a.sort((x,y)=>{const A=x[s.k],B=y[s.k]; return (typeof A==='string'?A.localeCompare(B):(A-B))*s.d;});\n  const mx=Math.max(...a.map(o=>o.pc));\n  const th=(k,t,cl='')=>`<th class=\"${cl}\" data-k=\"${k}\">${t}${s.k===k?(s.d>0?' ↑':' ↓'):''}<\/th>`;\n  const totRF=rfPos.reduce((q,p)=>q+p.saldo,0);\n  document.getElementById('emTbl').innerHTML = `<thead><tr>${th('k',GL[grp])}${th('v','PL','r')}${th('pc','% do PL total','r')}<th class=\"nosort hide-m\"><\/th>${th('nc','Clientes','r')}${th('maxCl','Maior % num cliente','r hide-m')}${th('rm','Rent. mês','r hide-m')}<th class=\"nosort\">Situação<\/th><\/tr><\/thead><tbody>`+\n   a.map(o=>{const cls=o.pc>=L?'late':o.pc>=L*.8?'warn':'';\n    const chip = o.pc>=L?'<span class=\"chip late\">Acima do limite<\/span>':o.pc>=L*.8?'<span class=\"chip warn\">Perto do limite<\/span>':'<span class=\"chip ok\">Dentro<\/span>';\n    const extra = o.semR>0?' <span class=\"chip warn\" title=\"Saldo sem rentabilidade no mês\">Sem rent. '+short(o.semR)+'<\/span>':'';\n    return `<tr class=\"click\" onclick=\"openEm('${grp}',${JSON.stringify(o.k).replace(/\"/g,'&quot;')})\"><td><b>${esc(o.k)}<\/b>${grp!=='ativo'?`<div class=\"small muted\">${o.at.size} ativo${o.at.size>1?'s':''}<\/div>`:''}<\/td><td class=\"r\">${R(o.v)}<\/td><td class=\"r\"><b>${P(o.pc,1)}<\/b><\/td><td class=\"hide-m\" style=\"width:18%\"><div class=\"bar ${cls}\"><i style=\"width:${o.pc/mx*100}%\"><\/i><\/div><\/td><td class=\"r\">${o.nc}<\/td><td class=\"r hide-m\">${P(o.maxCl,0)}<\/td><td class=\"r hide-m\">${o.hasR?P(o.rm):'—'}<\/td><td>${chip}${extra}<\/td><\/tr>`;}).join('')+\n   `<tr class=\"total\"><td>Total renda fixa digital<\/td><td class=\"r\">${R(totRF)}<\/td><td class=\"r\">${P(totRF/PL*100,1)}<\/td><td class=\"hide-m\"><\/td><td class=\"r\">${new Set(rfPos.map(p=>p.cid)).size}<\/td><td class=\"hide-m\"><\/td><td class=\"hide-m\"><\/td><td><\/td><\/tr><\/tbody>`;\n  document.querySelectorAll('#emTbl th[data-k]').forEach(t=>t.onclick=()=>{const k=t.dataset.k; emSort = emSort.k===k?{k,d:-emSort.d}:{k,d:k==='k'?1:-1}; renderEm();});\n}\ndocument.querySelectorAll('#grpPills .pill').forEach(b=>b.onclick=()=>{grp=b.dataset.g;document.querySelectorAll('#grpPills .pill').forEach(x=>x.classList.toggle('on',x===b));renderEm();});\ndocument.getElementById('lim').addEventListener('input',()=>{renderEm();renderTopEm();});\n\nwindow.openEm=function(key,k){\n  const o=agg(key).find(x=>x.k===k); if(!o) return;\n  const per={}; o.ps.forEach(p=>{(per[p.cid]=per[p.cid]||[]).push(p);});\n  const rows=Object.entries(per).map(([id,ps])=>({c:byId[id],v:ps.reduce((s,p)=>s+p.saldo,0),ps})).sort((a,b)=>b.v-a.v);\n  const ativos={}; o.ps.forEach(p=>{(ativos[p.ativo]=ativos[p.ativo]||{p,v:0,n:0}); ativos[p.ativo].v+=p.saldo; ativos[p.ativo].n++;});\n  openModal(`${GL[key]}: ${k}`, `\n   <div class=\"kv\">\n    <div class=\"card\"><div class=\"lbl\">PL no ${GL[key].toLowerCase()}<\/div><div class=\"v\">${R(o.v)}<\/div><\/div>\n    <div class=\"card\"><div class=\"lbl\">% do PL total<\/div><div class=\"v\">${P(o.v/PL*100,1)}<\/div><\/div>\n    <div class=\"card\"><div class=\"lbl\">Clientes expostos<\/div><div class=\"v\">${o.nc} de ${C.length}<\/div><\/div>\n    <div class=\"card\"><div class=\"lbl\">Ativos<\/div><div class=\"v\">${o.at.size}<\/div><\/div>\n   <\/div>\n   <div class=\"card\" style=\"margin-bottom:14px\"><h2>Clientes expostos<\/h2><p class=\"hint\">Valor de cada cliente e quanto isso pesa na carteira dele.<\/p><div class=\"tscroll\"><table class=\"tbl\"><thead><tr><th class=\"nosort\">Cliente<\/th><th class=\"nosort r\">Valor<\/th><th class=\"nosort r\">% da carteira do cliente<\/th><th class=\"nosort hide-m\">Ativos<\/th><\/tr><\/thead><tbody>\n   ${rows.map(r=>{const pc=r.v/r.c.pl*100;return `<tr class=\"click\" onclick=\"openClient('${r.c.id}')\"><td>${esc(r.c.nome)}<\/td><td class=\"r\">${R(r.v)}<\/td><td class=\"r\">${pc>=50?`<span class=\"chip late\">${P(pc,1)}<\/span>`:P(pc,1)}<\/td><td class=\"hide-m small muted\">${[...new Set(r.ps.map(p=>p.ativo))].join(', ')}<\/td><\/tr>`}).join('')}\n   <\/tbody><\/table><\/div><\/div>\n   <div class=\"card\"><h2>Ativos<\/h2><div class=\"tscroll\"><table class=\"tbl\"><thead><tr><th class=\"nosort\">Ativo<\/th><th class=\"nosort hide-m\">Empresa/tipo<\/th><th class=\"nosort\">Taxa<\/th><th class=\"nosort\">Vencimento<\/th><th class=\"nosort r\">PL<\/th><th class=\"nosort r\">Clientes<\/th><\/tr><\/thead><tbody>\n   ${Object.entries(ativos).sort((a,b)=>b[1].v-a[1].v).map(([a,x])=>`<tr><td><b>${a}<\/b><\/td><td class=\"hide-m small\">${esc(x.p.empresa||'')}<\/td><td>${esc(x.p.taxa||'')}<\/td><td>${x.p.venc||''}<\/td><td class=\"r\">${R(x.v)}<\/td><td class=\"r\">${x.n}<\/td><\/tr>`).join('')}\n   <\/tbody><\/table><\/div><\/div>`);\n};\n\n// ---------- clients table\nlet clSort={k:'pl',d:-1}, clF='all';\nfunction renderCl(){\n  const q=document.getElementById('q').value.trim().toLowerCase();\n  let a=C.filter(c=>!q||c.nome.toLowerCase().includes(q));\n  if(clF==='alert') a=a.filter(c=>c.alerts.length); if(clF==='cripto') a=a.filter(c=>c.cats.cripto); if(clF==='usd') a=a.filter(c=>c.cats.usd);\n  const s=clSort; a=[...a].sort((x,y)=>{let A=x[s.k],B=y[s.k]; if(A==null) A=-1e9; if(B==null) B=-1e9; return (typeof A==='string'?A.localeCompare(B):(A-B))*s.d;});\n  const th=(k,t,cl='')=>`<th class=\"${cl}\" data-k=\"${k}\">${t}${s.k===k?(s.d>0?' ↑':' ↓'):''}<\/th>`;\n  const rc = (v,b)=>v==null?'<span class=\"muted\">—<\/span>':`<span class=\"${b!=null&&b<100?'neg':''}\">${P(v)}<\/span>`;\n  document.getElementById('clTbl').innerHTML = `<thead><tr>${th('nome','Cliente')}${th('pl','PL','r')}<th class=\"nosort hide-m\">Alocação<\/th>${th('rm','Mês','r')}${th('rm_cdi','% CDI mês','r hide-m')}${th('ra','Ano','r hide-m')}${th('r12','12 meses','r')}${th('r12_cdi','% CDI 12m','r hide-m')}${th('nEm','Emissores','r hide-m')}${th('topEmPct','Maior emissor','hide-m')}<th class=\"nosort\">Alertas<\/th><\/tr><\/thead><tbody>`+\n   a.map(c=>`<tr class=\"click\" onclick=\"openClient('${c.id}')\"><td><b class=\"hide-m\">${esc(c.nome)}<\/b><b class=\"show-m\">${esc(nm2(c.nome))}<\/b><div class=\"small muted\">${P(c.pl/PL*100,1)} do PL<\/div><\/td><td class=\"r\">${R(c.pl)}<\/td>\n     <td class=\"hide-m\"><div class=\"mini\">${Object.entries(c.cats).map(([k,v])=>`<span title=\"${CLS[k][0]}: ${R(v)}\" style=\"width:${v/c.pl*100}%;background:${CLS[k][1]}\"><\/span>`).join('')}<\/div><div class=\"small muted\" style=\"margin-top:3px\">${Object.keys(c.cats).map(k=>({rf:'RF',usd:'USD',cripto:'Cripto',caixa:'Caixa',rv:'RV',cestas:'Cestas'})[k]).join(' · ')}<\/div><\/td>\n     <td class=\"r\">${rc(c.rm,c.rm_cdi)}<\/td><td class=\"r hide-m\">${c.rm_cdi==null?'—':P(c.rm_cdi,0)}<\/td><td class=\"r hide-m\">${rc(c.ra,c.ra_cdi)}<\/td><td class=\"r\">${rc(c.r12,c.r12_cdi)}<\/td><td class=\"r hide-m\">${c.r12_cdi==null?'—':P(c.r12_cdi,0)}<\/td><td class=\"r hide-m\">${c.nEm}<\/td>\n     <td class=\"hide-m\">${c.topEm?`${esc(c.topEm)} <span class=\"muted\">${P(c.topEmPct,0)}<\/span>`:'—'}<\/td>\n     <td>${c.alerts.length?`<span class=\"chip ${c.alerts.some(x=>x[0]==='late')?'late':'warn'}\" title=\"${esc(c.alerts.map(x=>x[1]).join(' | '))}\">${c.alerts.length} alerta${c.alerts.length>1?'s':''}<\/span>`:'<span class=\"chip ok\">OK<\/span>'}<\/td><\/tr>`).join('')+\n   (a.length?'':`<tr><td colspan=\"11\" class=\"muted\">Nenhum cliente encontrado. Limpe a busca ou o filtro.<\/td><\/tr>`)+`<\/tbody>`;\n  document.querySelectorAll('#clTbl th[data-k]').forEach(t=>t.onclick=()=>{const k=t.dataset.k; clSort = clSort.k===k?{k,d:-clSort.d}:{k,d:k==='nome'?1:-1}; renderCl();});\n}\ndocument.getElementById('q').addEventListener('input',renderCl);\ndocument.querySelectorAll('#fPills .pill').forEach(b=>b.onclick=()=>{clF=b.dataset.f;document.querySelectorAll('#fPills .pill').forEach(x=>x.classList.toggle('on',x===b));renderCl();});\n\nwindow.openClient=function(id){\n  const c=byId[id];\n  const h=[...c.hist].reverse();\n  // mini chart\n  let svg='';\n  if(h.length){const W=600,H=170,ml=70,mr=10,mt=12,mb=26,iw=W-ml-mr,ih=H-mt-mb; const vals=h.map(x=>x[4]||0); const mx=Math.max(...vals)*1.1;\n    const x=i=>ml+iw*(i+.5)/h.length, y=v=>mt+ih-v/mx*ih;\n    for(let i=0;i<=3;i++){const v=mx*i/3; svg+=`<line x1=\"${ml}\" x2=\"${W-mr}\" y1=\"${y(v)}\" y2=\"${y(v)}\" stroke=\"#ECE7F6\"/><text x=\"${ml-6}\" y=\"${y(v)+4}\" text-anchor=\"end\">${short(v)}<\/text>`;}\n    const bw=iw/h.length*.55;\n    h.forEach((r,i)=>{svg+=`<rect x=\"${x(i)-bw/2}\" y=\"${y(r[4]||0)}\" width=\"${bw}\" height=\"${ih-(y(r[4]||0)-mt)}\" rx=\"3\" fill=\"${i===h.length-1?'#6E3FF0':'#CDBDFB'}\"><title>${r[0]}: ${R(r[4])} · rent. ${P(r[5])}<\/title><\/rect><text x=\"${x(i)}\" y=\"${H-8}\" text-anchor=\"middle\">${r[0].slice(0,3)}<\/text>`;});\n    svg=`<svg viewBox=\"0 0 ${W} ${H}\">${svg}<\/svg>`;}\n  const ps=[...c.pos].sort((a,b)=>b.saldo-a.saldo);\n  openModal(c.nome, `\n   <div class=\"kv\">\n    <div class=\"card\"><div class=\"lbl\">PL em 31/10<\/div><div class=\"v\">${R(c.pl)}<\/div><div class=\"small muted\">${P(c.pl/PL*100,1)} do seu PL<\/div><\/div>\n    <div class=\"card\"><div class=\"lbl\">Rentab. no mês<\/div><div class=\"v\">${P(c.rm)}<\/div><div class=\"small muted\">${c.rm_cdi==null?'—':P(c.rm_cdi,0)+' do CDI'}<\/div><\/div>\n    <div class=\"card\"><div class=\"lbl\">Rentab. 12 meses<\/div><div class=\"v\">${P(c.r12)}<\/div><div class=\"small muted\">${c.r12_cdi==null?'—':P(c.r12_cdi,0)+' do CDI'}<\/div><\/div>\n    <div class=\"card\"><div class=\"lbl\">Resultado 12 meses<\/div><div class=\"v\">${R(c.res[2])}<\/div><div class=\"small muted\">No mês: ${R(c.res[0])}<\/div><\/div>\n   <\/div>\n   ${c.alerts.length?`<div class=\"card\" style=\"margin-bottom:14px\"><h2>Alertas<\/h2>${c.alerts.map(a=>`<div style=\"margin-top:8px\"><span class=\"chip ${a[0]}\">${esc(a[1])}<\/span><\/div>`).join('')}<\/div>`:''}\n   <div class=\"grid two\" style=\"margin-bottom:14px\">\n    <div class=\"card\"><h2>Alocação<\/h2><div class=\"legend\" style=\"margin-top:10px\">${Object.entries(c.cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=\"row\"><span class=\"dot\" style=\"background:${CLS[k][1]}\"><\/span><span>${CLS[k][0]}<\/span><span class=\"p\">${P(v/c.pl*100,1)}<\/span><span class=\"val\">${R(v)}<\/span><\/div>`).join('')}<\/div>\n      <p class=\"small muted\" style=\"margin:14px 0 0\">Movimentação 12 meses: aportes ${R(c.ap[2])} · resgates ${R(c.rg[2])}. Cliente desde: ${c.inicio==='Anterior a 12m'?'mais de 12 meses':c.inicio}.<\/p><\/div>\n    <div class=\"card chart\"><h2>Saldo mês a mês<\/h2>${svg}<\/div>\n   <\/div>\n   <div class=\"card\"><h2>Posições<\/h2><div class=\"tscroll\"><table class=\"tbl\"><thead><tr><th class=\"nosort\">Ativo<\/th><th class=\"nosort hide-m\">Emissor<\/th><th class=\"nosort\">Taxa<\/th><th class=\"nosort hide-m\">Vencimento<\/th><th class=\"nosort r\">Saldo<\/th><th class=\"nosort r\">%<\/th><th class=\"nosort r\">Mês<\/th><th class=\"nosort r hide-m\">Ano<\/th><\/tr><\/thead><tbody>\n   ${ps.map(p=>`<tr><td><b>${p.ativo}<\/b><div class=\"small muted\">${CLS[p.classe][0]}<\/div><\/td><td class=\"hide-m\">${esc(p.emissor||'—')}<\/td><td class=\"small\">${esc(p.taxa||'—')}<\/td><td class=\"hide-m\">${p.venc||'—'}<\/td><td class=\"r\">${R(p.saldo)}${p.usd?`<div class=\"small muted\">US$ ${nf2.format(p.usd).replace(',00','')}<\/div>`:''}<\/td><td class=\"r\">${P(p.saldo/c.pl*100,1)}<\/td><td class=\"r\">${p.classe==='caixa'?'—':p.mes==null?'<span class=\"chip warn\">sem<\/span>':`<span class=\"${p.mes<0?'neg':''}\">${P(p.mes)}<\/span>`}<\/td><td class=\"r hide-m\">${p.ano==null?'—':P(p.ano)}<\/td><\/tr>`).join('')}\n   <\/tbody><\/table><\/div><\/div>`);\n};\n\n// ---------- modal\nconst ov=document.getElementById('ov');\nfunction openModal(t,html){document.getElementById('mdT').textContent=t;document.getElementById('mdB').innerHTML=html;ov.hidden=false;document.body.style.overflow='hidden';document.getElementById('mdB').scrollTop=0;}\nfunction closeModal(){ov.hidden=true;document.body.style.overflow='';}\ndocument.getElementById('mdX').onclick=closeModal;\nov.addEventListener('click',e=>{if(e.target===ov)closeModal();});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});\n\n// ---------- liquidity & alerts\nlet c_venc=[];\nconst toDate=s=>{const [d,m,y]=s.split('/').map(Number);return new Date(2000+y,m-1,d);};\n(()=>{\n  // semester chart\n  const m={}; rfPos.forEach(p=>{if(!p.venc)return; const d=toDate(p.venc); const k=d.getFullYear()+'-'+(d.getMonth()<6?1:2); m[k]=(m[k]||0)+p.saldo;});\n  const keys=Object.keys(m).sort(); const mx=Math.max(...Object.values(m));\n  const W=560,H=230,ml=70,mr=10,mt=16,mb=34,iw=W-ml-mr,ih=H-mt-mb; const x=i=>ml+iw*(i+.5)/keys.length,y=v=>mt+ih-v/mx/1.1*ih;\n  let g=''; for(let i=0;i<=3;i++){const v=mx*1.1*i/3; g+=`<line x1=\"${ml}\" x2=\"${W-mr}\" y1=\"${y(v)}\" y2=\"${y(v)}\" stroke=\"#ECE7F6\"/><text x=\"${ml-6}\" y=\"${y(v)+4}\" text-anchor=\"end\">${short(v)}<\/text>`;}\n  const bw=iw/keys.length*.6;\n  keys.forEach((k,i)=>{const [yr,s]=k.split('-'); g+=`<rect x=\"${x(i)-bw/2}\" y=\"${y(m[k])}\" width=\"${bw}\" height=\"${mt+ih-y(m[k])}\" rx=\"4\" fill=\"url(#vg)\"><title>${s}º sem/${yr}: ${R(m[k])}<\/title><\/rect><text x=\"${x(i)}\" y=\"${y(m[k])-5}\" text-anchor=\"middle\" style=\"fill:#1D1630;font-weight:600\">${short(m[k]).replace('R$ ','')}<\/text><text x=\"${x(i)}\" y=\"${H-mb+16}\" text-anchor=\"middle\">${s}S${yr.slice(2)}<\/text>`;});\n  document.getElementById('vencChart').innerHTML=`<svg viewBox=\"0 0 ${W} ${H}\"><defs><linearGradient id=\"vg\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#8F6BFF\"/><stop offset=\"1\" stop-color=\"#C98CFF\"/><\/linearGradient><\/defs>${g}<\/svg><div class=\"small muted\">1S26 = 1º semestre de 2026, e assim por diante.<\/div>`;\n  // next 6 months\n  const lim6=new Date(2027,3,30), now=new Date(2026,9,31);\n  const nx=rfPos.filter(p=>p.venc&&toDate(p.venc)>now&&toDate(p.venc)<=lim6).sort((a,b)=>toDate(a.venc)-toDate(b.venc));\n  document.getElementById('vencTbl').innerHTML=`<thead><tr><th class=\"nosort\">Vencimento<\/th><th class=\"nosort\">Cliente<\/th><th class=\"nosort\">Ativo<\/th><th class=\"nosort hide-m\">Emissor<\/th><th class=\"nosort r\">Saldo atual<\/th><\/tr><\/thead><tbody>${nx.map(p=>`<tr class=\"click\" onclick=\"openClient('${p.cid}')\"><td>${p.venc}<\/td><td>${esc(byId[p.cid].nome)}<\/td><td><b>${p.ativo}<\/b><\/td><td class=\"hide-m\">${esc(p.emissor)}<\/td><td class=\"r\">${R(p.saldo)}<\/td><\/tr>`).join('')}<tr class=\"total\"><td colspan=\"4\">Total até abr/27<\/td><td class=\"r\">${R(nx.reduce((s,p)=>s+p.saldo,0))}<\/td><\/tr><\/tbody>`;\n  // sem rent\n  const sr={}; rfPos.filter(p=>p.mes==null).forEach(p=>{(sr[p.ativo]=sr[p.ativo]||{p,v:0,cl:[]}); sr[p.ativo].v+=p.saldo; sr[p.ativo].cl.push(byId[p.cid].nome.split(' ')[0]);});\n  const srA=Object.entries(sr).sort((a,b)=>b[1].v-a[1].v);\n  document.getElementById('semRent').innerHTML=`<thead><tr><th class=\"nosort\">Ativo<\/th><th class=\"nosort\">Emissor<\/th><th class=\"nosort r\">PL<\/th><th class=\"nosort r\">Rent. ano<\/th><th class=\"nosort r hide-m\">% CDI ano<\/th><th class=\"nosort hide-m\">Clientes<\/th><\/tr><\/thead><tbody>${srA.map(([a,x])=>`<tr><td><b>${a}<\/b><\/td><td>${esc(x.p.emissor)}<\/td><td class=\"r\">${R(x.v)}<\/td><td class=\"r\">${P(x.p.ano)}<\/td><td class=\"r hide-m\">${x.p.ano_bm!=null&&x.p.ano_bm<50?`<span class=\"chip late\">${P(x.p.ano_bm,0)}<\/span>`:P(x.p.ano_bm,0)}<\/td><td class=\"hide-m small\">${x.cl.join(', ')}<\/td><\/tr>`).join('')}<tr class=\"total\"><td colspan=\"2\">Total<\/td><td class=\"r\">${R(srA.reduce((s,x)=>s+x[1].v,0))}<\/td><td colspan=\"3\"><\/td><\/tr><\/tbody>`;\n  // alerts list\n  const L=lim(); const em=agg('emissor').filter(o=>o.v/PL*100>=L);\n  const below=C.filter(c=>c.r12_cdi!=null&&c.r12_cdi<100);\n  const cash=C.filter(c=>c.caixaPct>=10);\n  const conc=C.filter(c=>c.topEmPct>=50);\n  const srT=srA.reduce((s,x)=>s+x[1].v,0);\n  const nxT=nx.reduce((s,p)=>s+p.saldo,0);\n  const it=[];\n  if(em.length) it.push(['late','Concentração em emissor',`${em.map(o=>`<b>${esc(o.k)}<\/b> ${P(o.v/PL*100,1)} (${o.nc} clientes)`).join(', ')} acima do limite de ${P(L,0)} do PL.`]);\n  if(srT) it.push(['warn','Ativos sem rentabilidade no mês',`${short(srT)} (${P(srT/PL*100,1)} do PL) em ${srA.length} ativos, principalmente UpVendas e MB Antecipa. Alguns rendem menos de 50% do CDI no ano.`]);\n  if(below.length) it.push(['warn','Clientes abaixo do CDI em 12 meses',below.map(c=>`<a href=\"javascript:openClient('${c.id}')\">${esc(c.nome.split(' ')[0])}<\/a> (${P(c.r12_cdi,0)})`).join(', ')+'.']);\n  if(cash.length) it.push(['warn','Caixa parado',cash.map(c=>`<a href=\"javascript:openClient('${c.id}')\">${esc(c.nome.split(' ')[0])}<\/a> ${short(c.cats.caixa)} (${P(c.caixaPct,0)})`).join(', ')+'.']);\n  if(conc.length) it.push(['warn','Cliente com metade ou mais num só emissor',conc.map(c=>`<a href=\"javascript:openClient('${c.id}')\">${esc(c.nome.split(' ')[0])}<\/a>: ${esc(c.topEm)} ${P(c.topEmPct,0)}`).join(', ')+'.']);\n  const venc=rfPos.filter(p=>p.venc&&toDate(p.venc)<=now);\n  if(venc.length) it.push(['late','Ativo vencido ainda com saldo',venc.map(p=>`<b>${p.ativo}<\/b> (venceu em ${p.venc}) · <a href=\"javascript:openClient('${p.cid}')\">${esc(byId[p.cid].nome.split(' ')[0])}<\/a> ${R(p.saldo)}`).join('; ')+'. Confirmar com o MB a situação do pagamento.']);\n  c_venc=venc;\n  if(nxT) it.push(['pur','Vencimentos até abr/27',`${short(nxT)} voltam ao caixa dos clientes. Bom momento para preparar a recomendação de reinvestimento.`]);\n  document.getElementById('alerts').innerHTML=it.map(a=>`<div class=\"alert\"><span class=\"chip ${a[0]}\">${a[0]==='late'?'Risco':a[0]==='pur'?'Oportunidade':'Atenção'}<\/span><div><div class=\"t\">${a[1]}<\/div><div class=\"d\">${a[2]}<\/div><\/div><\/div>`).join('');\n})();\n\nrenderTopEm(); renderEm(); renderCl();\n<\/script>\n<\/body>\n<\/html>\n";

<script>
/* js/views/patrimonio.js */
/* Parte 5b · Tela "Patrimônio e captação" (abre por Clientes, com Voltar). Cálculo em js/core/patrimonio.js (App.Pat). */
(function (App) {
  const { U, UI, Store } = App;
  const PV = {};
  let ordem = { k: 'total', d: -1 };
  const usd = v => 'US$ ' + (+v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
  const sinal = v => (v > 0 ? '+' : v < 0 ? '−' : '') + U.brlShort(Math.abs(v)).replace('R$ ', 'R$ ');
  const capCls = v => v > 0 ? 'pt-pos' : v < 0 ? 'pt-neg' : 'muted';

  /* Card na tela Clientes */
  PV.card = () => {
    const P = App.Pat, ref = P.mesPadrao(), r = P.retrato(ref);
    return `<button class="pcard pc-pat" id="clPat" style="--pc:#1D1438"><span class="pc-top"><b>Patrimônio e captação</b></span><small class="pc-sub">MB, XP, Eqseed e exterior · mês a mês</small>
      <span class="pc-n"><b>${r.linhas.length}</b> ${r.linhas.length === 1 ? 'cliente' : 'clientes'}</span>${r.total ? `<span class="pc-v">${U.brlShort(r.total)}</span>` : ''}
      <span class="pc-l">${P.rotulo(ref)} · captação <span class="${capCls(r.cap)}">${sinal(r.cap)}</span> ›</span></button>`;
  };

  /* Gráfico: patrimônio total (linha) + captação do mês (barras) */
  const grafico = serie => {
    const W = 640, H = 240, ml = 64, mr = 12, mt = 14, ih = 150, z = mt + ih + 34, bh = 20;
    const iw = W - ml - mr, vs = serie.map(s => s.total).filter(v => v > 0);
    const mx = Math.max(...vs, 1), mn = Math.min(...vs, mx), pad = (mx - mn) * .15 || mx * .1;
    const lo = Math.max(0, mn - pad), hi = mx + pad;
    const x = i => ml + iw * (i + .5) / serie.length, y = v => mt + ih - (v - lo) / (hi - lo || 1) * ih;
    const maxC = Math.max(...serie.map(s => Math.abs(s.cap)), 1), bw = iw / serie.length * .5;
    let g = '';
    for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3; g += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="#ECE7F6"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${U.brlShort(v)}</text>`; }
    g += `<line x1="${ml}" x2="${W - mr}" y1="${z}" y2="${z}" stroke="#E5E0F0" stroke-dasharray="3 3"/><text x="${ml - 8}" y="${z + 4}" text-anchor="end">captação</text>`;
    serie.forEach((s, i) => {
      const h = Math.max(Math.abs(s.cap) / maxC * bh, 1.5);
      if (s.cap) g += `<rect x="${x(i) - bw / 2}" y="${s.cap > 0 ? z - h : z}" width="${bw}" height="${h}" rx="2" fill="${s.cap > 0 ? '#23864F' : '#C8402E'}" opacity=".75"><title>${App.Pat.rotulo(s.ref)}: captação ${U.brl(s.cap)}</title></rect>`;
      g += `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${App.Pat.rotulo(s.ref).slice(0, 3)}</text>`;
    });
    const pts = serie.map((s, i) => s.total ? `${x(i)},${y(s.total)}` : null).filter(Boolean);
    if (pts.length) {
      g += `<polyline points="${pts.join(' ')}" fill="none" stroke="#6E3FF0" stroke-width="2.5" stroke-linejoin="round"/>`;
      serie.forEach((s, i) => { if (s.total) g += `<circle cx="${x(i)}" cy="${y(s.total)}" r="${i === serie.length - 1 ? 4.5 : 3}" fill="${i === serie.length - 1 ? '#6E3FF0' : '#fff'}" stroke="#6E3FF0" stroke-width="2"><title>${App.Pat.rotulo(s.ref)}: ${U.brl(s.total)}</title></circle>`; });
    }
    return `<svg class="pt-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do patrimônio e captação mês a mês">${g}</svg>`;
  };

  const cel = (x, l) => {
    if (!x) return '<td class="r muted hide-m">—</td>';
    const t = x.repetido ? `posição de ${App.Pat.rotulo(x.ref)}` : '';
    return `<td class="r hide-m${x.repetido ? ' pt-rep' : ''}"${t ? ` title="${t}"` : ''}>${U.brlShort(x.pl)}${l === 'intl' && x.usd ? `<small>${usd(x.usd)}</small>` : ''}</td>`;
  };

  PV.tela = (el, params, { voltar, ligarComum, ir }) => {
    const P = App.Pat, meses = P.meses();
    let ref = params.mes && meses.includes(params.mes) ? params.mes : P.mesPadrao();
    if (!meses.includes(ref)) ref = meses[0];
    const r = P.retrato(ref), ant = P.retrato(P.mesAnt(ref)), capAno = P.capAno(ref), serie = P.serie(ref, 12);
    const vr = P.variacao(r, ant), varPl = vr ? vr.v : null;
    const i = meses.indexOf(ref), prev = meses[i + 1], next = meses[i - 1];
    const cot = r.cot, intl = r.plats.intl;
    const linhas = r.linhas.slice().sort((a, b) => {
      const v = l => ordem.k === 'nome' ? l.cli.nome : ordem.k === 'total' ? l.total : ordem.k === 'cap' ? l.cap : (l[ordem.k] ? l[ordem.k].pl : -1);
      const A = v(a), B = v(b); return (typeof A === 'string' ? A.localeCompare(B, 'pt-BR') : A - B) * ordem.d;
    });
    const th = (k, t, cls = '') => `<th class="${cls}" data-ord="${k}" aria-sort="${ordem.k === k ? (ordem.d > 0 ? 'ascending' : 'descending') : 'none'}">${t}${ordem.k === k ? (ordem.d > 0 ? ' ↑' : ' ↓') : ''}</th>`;
    const rep = Object.values(r.plats).some(p => p.repetido);

    el.innerHTML = `${voltar('Clientes', {})}
      <div class="page-h"><div><h1>Patrimônio e captação</h1><p class="muted">O que seus clientes têm com você em cada plataforma, mês a mês, e quanto entrou de dinheiro novo.</p></div>
        <div class="pt-mes"><button class="pv-arr" data-mes="${prev || ''}" ${prev ? '' : 'disabled'} aria-label="Mês anterior">${UI.icon('voltar')}</button>
          <select id="ptMes" aria-label="Mês">${meses.map(m => `<option value="${m}"${m === ref ? ' selected' : ''}>${U.esc(P.nomeMes(m))}</option>`).join('')}</select>
          <button class="pv-arr" data-mes="${next || ''}" ${next ? '' : 'disabled'} aria-label="Próximo mês">${UI.icon('seta')}</button></div></div>

      <section class="kpis k4 pt-kpis">
        <div class="kpi k-neg"><span>Patrimônio com você</span><b>${U.brlShort(r.total)}</b><em>${varPl == null ? r.linhas.length + ' clientes' : `<span class="${capCls(varPl)}">${sinal(varPl)}</span> vs ${P.rotulo(P.mesAnt(ref))}${vr.novas ? ` · sem contar ${vr.novas === 1 ? '1 posição nova' : vr.novas + ' posições novas'}` : ''}`}</em></div>
        <div class="kpi"><span>Captação líquida no mês</span><b class="${capCls(r.cap)}">${sinal(r.cap)}</b><em>${r.xpSemCap ? `XP sem captação em ${r.xpSemCap}` : 'aportes − resgates'}</em></div>
        <div class="kpi"><span>Captação no ano</span><b class="${capCls(capAno)}">${sinal(capAno)}</b><em>jan a ${P.rotulo(ref).slice(0, 3).toLowerCase()}/${ref.slice(2, 4)}</em></div>
        <div class="kpi"><span>Clientes</span><b>${r.linhas.length}</b><em>com patrimônio no mês</em></div>
      </section>

      <div class="grid-2 pt-g2">
        <section class="card"><div class="card-h"><h2>Por plataforma</h2><span class="muted small">${U.esc(P.nomeMes(ref))}</span></div>
          <div class="pt-stack">${P.PLATS.map(p => r.total && r.plats[p.id].pl ? `<span style="width:${r.plats[p.id].pl / r.total * 100}%;background:${p.cor}" title="${p.nome}"></span>` : '').join('')}</div>
          <ul class="pt-plats">${P.PLATS.map(p => { const x = r.plats[p.id];
            return `<li><i style="background:${p.cor}"></i><div><b>${p.nome}</b><small>${p.id === 'intl' ? (x.usd ? usd(x.usd) + (cot ? ' × ' + cot.v.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : ' · sem cotação') : p.sub) : U.plural(x.n, 'cliente', 'clientes')}${x.repetido ? ` · ${x.repetido} com posição anterior` : ''}</small></div>
              <span class="pt-pc">${r.total ? U.pct(x.pl / r.total) : '—'}</span><span class="pt-v">${U.brlShort(x.pl)}<small class="${capCls(x.cap)}">${x.cap ? sinal(x.cap) : 'sem captação'}</small></span></li>`; }).join('')}</ul>
          <form class="pt-cot" id="ptCot"><label for="ptCotV">Dólar de ${U.esc(P.nomeMes(ref))}</label><input id="ptCotV" data-num inputmode="decimal" placeholder="Ex.: 5,40" value="${cot && cot.exata ? cot.v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 4 }) : ''}"><button class="btn ghost sm" type="submit">Salvar</button>
            <small class="muted">${cot ? (cot.exata ? 'Converte o exterior para R$.' : `Usando a de ${P.rotulo(cot.ref)} (${cot.v.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}). Informe a deste mês.`) : intl.usd ? 'Sem cotação: o exterior ainda não entra no total.' : 'Para converter o exterior para R$.'}</small></form>
        </section>
        <section class="card"><div class="card-h"><h2>Evolução</h2><span class="muted small">12 meses</span></div>
          ${grafico(serie)}
          <p class="muted small pt-leg"><i class="pt-l"></i>Patrimônio total <i class="pt-b"></i>Captação do mês (verde entrou, vermelho saiu)</p>${(() => { const inicio = P.PLATS.map(p => { const k = serie.findIndex(s => s.plats[p.id] > 0); return k > 0 ? `${p.nome} a partir de ${P.rotulo(serie[k].ref).toLowerCase()}` : null; }).filter(Boolean); return inicio.length ? `<p class="muted small pt-nota">Antes disso não há posição: ${inicio.join(' · ')}. Os saltos nesses meses são a plataforma entrando no total, não crescimento.</p>` : ''; })()}</section>
      </div>

      <section class="card"><div class="card-h"><h2>Por cliente</h2><span class="count">${linhas.length}</span><span class="grow"></span>${r.xpSemCap ? `<button class="link" id="ptXp">Informar captação da XP</button>` : ''}</div>
        ${linhas.length ? `<div class="tscroll"><table class="tbl pt-tbl"><thead><tr>${th('nome', 'Cliente')}${th('mb', 'MB', 'r hide-m')}${th('xp', 'XP', 'r hide-m')}${th('eqseed', 'Eqseed', 'r hide-m')}${th('intl', 'Exterior', 'r hide-m')}${th('total', 'Total', 'r')}${th('cap', 'Captação', 'r')}</tr></thead>
          <tbody>${linhas.map(l => `<tr class="click" data-cli="${l.cli.id}"><td><b>${U.esc(l.cli.nome)}</b>${l.cli.saiu ? ' <small class="muted">ex-cliente</small>' : ''}</td>${cel(l.mb)}${cel(l.xp)}${cel(l.eqseed)}${cel(l.intl, 'intl')}<td class="r"><b>${U.brlShort(l.total)}</b></td><td class="r ${capCls(l.cap)}">${l.cap ? sinal(l.cap) : '—'}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>Total</td>${['mb', 'xp', 'eqseed', 'intl'].map(k => `<td class="r hide-m">${U.brlShort(r.plats[k].pl)}</td>`).join('')}<td class="r">${U.brlShort(r.total)}</td><td class="r ${capCls(r.cap)}">${sinal(r.cap)}</td></tr></tfoot></table></div>`
          : `<div class="empty sm"><b>Nenhum patrimônio neste mês.</b><p>Importe o mês do MB, atualize o PL da XP ou cadastre os produtos da Eqseed e do exterior.</p></div>`}
        ${rep ? '<p class="muted small pt-nota"><span class="pt-rep-k">Valor em itálico</span> = a plataforma não tem posição deste mês; repete a última conhecida (passe o mouse para ver de quando) e não conta captação.</p>' : ''}
      </section>
      <p class="muted small pt-nota">Fontes: MB pelo relatório mensal importado (captação = aportes − resgates). XP pelo PL e pela captação que você digita (sem carteira, por compliance). Eqseed pelo valor investido, não pelo valor de mercado; a captação é o que foi investido no mês. Exterior pela posição em US$ de cada produto, convertida pela cotação do mês; a captação do ITA é o aporte anual com baixa "Aporte pago" na renovação.</p>`;

    const irMes = m => { if (m) ir({ patrimonio: true, mes: m }); };
    el.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => irMes(b.dataset.mes));
    el.querySelector('#ptMes').onchange = e => irMes(e.target.value);
    el.querySelectorAll('[data-ord]').forEach(t => t.onclick = () => { const k = t.dataset.ord; ordem = { k, d: ordem.k === k ? -ordem.d : (k === 'nome' ? 1 : -1) }; PV.tela(el, { mes: ref }, { voltar, ligarComum, ir }); });
    el.querySelector('#ptCot').onsubmit = e => { e.preventDefault(); const v = U.parseNum(el.querySelector('#ptCotV').value); P.salvarCotacao(ref, v); UI.toast(v ? 'Cotação de ' + P.nomeMes(ref) + ' salva' : 'Cotação removida'); };
    const bx = el.querySelector('#ptXp'); if (bx) bx.onclick = () => ir({ xp: true, mes: ref });
    ligarComum(el);
  };

  /* ---------- Ficha do cliente: tudo o que ele tem com você (e o que se sabe que tem fora) ---------- */
  const COR_BRL = '#6E3FF0', COR_USD = '#E08A1E', COR_CLASSE = '#6E3FF0';
  const pct = (v, t) => t ? Math.round(v / t * 100) + '%' : '—';
  const meterList = (rows, total) => `<ul class="pf-ml">${rows.map(r => `<li title="${U.esc(r.nome)}: ${U.brl(r.v)} (${pct(r.v, total)})"><span class="pf-ml-n"><i style="background:${r.cor}"></i>${U.esc(r.nome)}${r.nota ? `<small>${U.esc(r.nota)}</small>` : ''}</span><span class="pf-ml-b"><b style="width:${total ? Math.max(r.v / total * 100, 1.5) : 0}%;background:${r.cor}"></b></span><span class="pf-ml-v">${U.brlShort(r.v)}<small>${pct(r.v, total)}</small></span></li>`).join('')}</ul>`;
  PV.ficha = cli => {
    const P = App.Pat, x = P.consolidado(cli);
    if (!x.total && !x.consorcio && !x.capital && !x.foraTot) return '';
    const NOMES = { previdencia: 'Previdência', internacional: 'Internacional', cripto: 'Cripto', startups: 'Startups', zentis: 'Zentis' };
    const m = x.meta, pm = m ? Math.min(x.total / m, 1) : 0;
    const rep = x.plats.filter(p => p.repetido);
    return `<section class="card pf-card"><div class="card-h"><h2>Patrimônio</h2><span class="muted small">${U.esc(P.nomeMes(x.ref))}</span><span class="grow"></span><button class="link" id="pfMes">Mês a mês ›</button></div>
      <div class="pf-top">
        <div class="pf-hero"><small>Com você</small><b class="pf-big">${U.brlShort(x.total)}</b>
          ${m ? `<div class="pf-meter" role="meter" aria-valuemin="0" aria-valuemax="${m}" aria-valuenow="${Math.round(x.total)}" aria-label="Patrimônio em relação à meta"><i style="width:${pm * 100}%"></i></div>
            <p class="small"><b>${Math.round(x.total / m * 100)}%</b> da meta de ${U.brlShort(m)}${x.total < m ? ` · faltam ${U.brlShort(m - x.total)}` : ' · meta atingida'} <button class="link" id="pfMeta">editar</button></p>`
            : `<button class="link pf-defmeta" id="pfMeta">${UI.icon('mais')}Definir meta de patrimônio</button>`}
          ${x.foraTot ? `<p class="pf-fora" title="Do Mapa 360: áreas de investimento marcadas como &quot;Mapeado&quot; com valor">+ ${U.brlShort(x.foraTot)} com outros · ${x.fora.map(f => U.esc(NOMES[f.area] || f.area) + (f.onde ? ' (' + U.esc(f.onde) + ')' : '')).join(', ')}</p>` : ''}
        </div>
        <div class="pf-tiles">
          <div><small>Em reais</small><b>${U.brlShort(x.brl)}</b><em>${x.total ? pct(x.brl, x.total) + ' do total' : '—'}</em></div>
          <div><small>Em dólar</small><b>${x.usd ? usd(x.usd) : '—'}</b><em>${x.usd ? (x.cot ? '≈ ' + U.brlShort(x.usdR) + ' a ' + x.cot.v.toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : 'sem cotação do mês') : 'nada no exterior'}</em></div>
          <div><small>Consórcio</small><b>${x.consorcio ? U.brlShort(x.consorcio) : '—'}</b><em>${x.nCons ? U.plural(x.nCons, 'cota', 'cotas') + ' · em cartas' : 'nenhuma cota'}</em></div>
          <div><small>Seguro de vida</small><b>${x.capital ? U.brlShort(x.capital) : '—'}</b><em>${x.nVida ? 'capital segurado' : 'sem apólice'}</em></div>
        </div>
      </div>
      ${x.total ? `<div class="pf-cols">
        <div><h3>Moedas</h3>${meterList([{ nome: 'Real', v: x.brl, cor: COR_BRL }, { nome: 'Dólar', v: x.usdR, cor: COR_USD }].filter(r => r.v > 0), x.total)}</div>
        <div><h3>Onde está</h3>${meterList(x.plats.map(p => ({ nome: p.nome, v: p.v, cor: p.cor, nota: p.repetido ? 'posição de ' + P.rotulo(p.refPos).toLowerCase() : '' })), x.total)}</div>
        <div><h3>Classes de ativo</h3>${meterList(x.classes.map(([k, v]) => ({ nome: k, v, cor: COR_CLASSE })), x.total)}</div>
      </div>` : ''}
      ${rep.length ? `<p class="muted small pf-nota">Sem posição deste mês em ${rep.map(p => p.nome).join(', ')}: repete a última conhecida.</p>` : ''}
    </section>`;
  };
  PV.ligarFicha = (el, cli, ir) => {
    const bm = el.querySelector('#pfMes'); if (bm) bm.onclick = () => ir({ patrimonio: true });
    const bt = el.querySelector('#pfMeta'); if (bt) bt.onclick = () => UI.modal({
      title: 'Meta de patrimônio · ' + App.Cli.apelido(cli), size: 'sm',
      body: `<form class="form" id="fPfM"><p class="muted small" style="margin:0">Quanto você quer que este cliente tenha com você. Aparece como barra de progresso na ficha.</p>
        <label class="f"><span>Meta</span><input name="meta" data-num inputmode="decimal" value="${cli.metaPatrimonio ? U.num(cli.metaPatrimonio) : ''}" placeholder="R$" autofocus></label></form>`,
      footer: `${cli.metaPatrimonio ? '<button class="btn ghost danger-text" data-pf-del>Remover</button><span class="grow"></span>' : ''}<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fPfM" type="submit">Salvar</button>`,
      onMount(m, api) {
        m.querySelector('#fPfM').onsubmit = e => { e.preventDefault(); const v = U.parseNum(e.target.meta.value); Store.update('clientes', cli.id, { metaPatrimonio: v > 0 ? v : null }); api.close(); UI.toast(v > 0 ? 'Meta salva' : 'Meta removida'); };
        const d = m.querySelector('[data-pf-del]'); if (d) d.onclick = () => { Store.update('clientes', cli.id, { metaPatrimonio: null }); api.close(); UI.toast('Meta removida'); };
      }
    });
  };

  App.PatView = PV;
})(window.App = window.App || {});

</script>
<script>
/* js/views/clientes.js */
/* Tela Clientes: cards por produto → lista do produto → ficha do cliente. O MB abre o dashboard do mês. */
(function (App) {
  const { U, M, UI, Store, Cli } = App;
  const V = { titulo: 'Clientes' };
  let P = {}, busca = '', filtro = 'ativo', mesMB = null;
  V.setParams = p => { P = p || {}; if (!P.produto) busca = ''; };
  const ir = p => { App.go('clientes', p); };
  const av = c => `<span class="cl-av">${U.esc((Cli.apelido(c) || '?').slice(0, 2).toUpperCase())}</span>`;
  const voltar = (rot, p) => `<button class="back" data-cl-volta='${U.esc(JSON.stringify(p || {}))}'>${UI.icon('voltar')}${U.esc(rot)}</button>`;

  V.render = el => {
    if (P.cliente) return ficha(el);
    if (P.indicacoes) return indicacoes(el);
    if (P.xp) return xpBase(el);
    if (P.patrimonio && App.PatView) return App.PatView.tela(el, P, { voltar, ligarComum, ir });
    if (P.produto === 'mb') return mb(el);
    if (P.produto) return produto(el);
    return inicio(el);
  };
  const ligarComum = el => {
    el.querySelectorAll('[data-cl-volta]').forEach(b => b.onclick = () => ir(JSON.parse(b.dataset.clVolta)));
    el.querySelectorAll('[data-cli]').forEach(b => b.addEventListener('click', e => { if (e.target.closest('[data-stop]')) return; ir({ cliente: b.dataset.cli, de: P.produto || null, deInd: P.indicacoes || null }); }));
    el.querySelectorAll('[data-prod]').forEach(b => b.onclick = () => ir({ produto: b.dataset.prod }));
    el.querySelectorAll('[data-novo-cli]').forEach(b => b.onclick = () => App.Forms.cliente(null, {}, c => ir({ cliente: c.id })));
    el.querySelectorAll('[data-novo-ct]').forEach(b => b.onclick = () => App.Forms.contrato(null, { produto: b.dataset.novoCt || P.produto || undefined, clienteId: b.dataset.cid || undefined }));
  };
  const vencItem = v => `<li class="cl-venc" ${v.cli ? `data-cli="${v.cli.id}"` : ''}><span class="cl-vd ${U.diff(v.data, U.today()) <= 7 ? 'perto' : ''}"><b>${new Date(v.data + 'T12:00').getDate()}</b>${['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][+v.data.slice(5, 7) - 1]}</span>
      <div><b>${U.esc(v.cli ? v.cli.nome : v.nomeMB || '')}</b><small>${U.esc(v.rotulo)}</small></div><span class="muted small">${U.relDue(v.data)}</span></li>`;
  V.vencItem = vencItem;

  /* ---------- Início: cards por produto ---------- */
  function inicio(el) {
    const q = Cli.norm(busca);
    const clis = Cli.clientes().filter(c => !q || Cli.norm(c.nome + ' ' + (c.apelido || '')).includes(q));
    /* Renovações em aberto (com status) + o que vem depois da antecedência, até 60 dias */
    const abertas = App.Ren ? App.Ren.abertas() : [], chaves = new Set(Store.all('renovacoes').map(r => r.id));
    const venc = Cli.vencimentos(60).filter(v => !v.aviso && v.data > U.today() && !(App.Ren && abertas.some(r => r.data === v.data && ((v.ct && r.ctId === v.ct.id) || (v.mapa && r.origem === 'mapa' && r.clienteId === (v.cli && v.cli.id)) || (v.mb && r.origem === 'mb' && r.nomeMB === v.nomeMB)))));
    el.innerHTML = `
      <div class="page-h"><div><h1>Clientes</h1><p class="muted">Seus clientes por produto. Clique num card para ver a lista, ou num cliente para ver tudo o que ele tem com você.</p></div>
        <div class="page-act"><button class="btn ghost" data-novo-cli>${UI.icon('mais')}Novo cliente</button><button class="btn primary" data-novo-ct>${UI.icon('mais')}Adicionar produto</button></div></div>
      <div class="pcards">${(() => { const ind = Store.all('clientes').filter(c => c.indicadoPor || c.geracao > 1), rk = Cli.rankingIndicacoes();
        return `<button class="pcard pc-ind" id="clInd" style="--pc:#C98CFF"><span class="pc-top"><b>Indicações</b></span><small class="pc-sub">Árvore de quem indicou quem</small>
          <span class="pc-n"><b>${ind.length}</b> ${ind.length === 1 ? 'pessoa indicada' : 'pessoas indicadas'}</span>
          <span class="pc-l">${ind.filter(Cli.converteu).length} rodaram${rk.length ? ' · maior rede: ' + U.esc(nomeCurto(rk[0].c)) + ' (' + rk[0].rede + ')' : ''}</span></button>`; })()}${(() => { const xs = Cli.clientes().filter(c => !c.saiu && Cli.plXp(c) != null), tot = xs.reduce((s, c) => s + Cli.plXp(c), 0), ult = xs.map(c => c.xp.em).sort().pop();
        return `<button class="pcard pc-xp" id="clXpBase" style="--pc:#2B5A8C"><span class="pc-top"><b>XP</b></span><small class="pc-sub">PL total digitado por você</small>
          <span class="pc-n"><b>${xs.length}</b> ${xs.length === 1 ? 'cliente' : 'clientes'}</span>${tot ? `<span class="pc-v">${U.brlShort(tot)}</span>` : ''}
          <span class="pc-l">${ult ? 'Atualizado até ' + U.fmtDate(ult) + ' · ' : ''}Atualizar PL ›</span></button>`; })()}${App.PatView ? App.PatView.card() : ''}${Cli.PRODUTOS.filter(p => Cli.visivel(p.id) || (p.oculto && Cli.contratos({ produto: p.id, todos: true }).length)).map(p => { const r = Cli.resumo(p.id);
        return `<button class="pcard" data-prod="${p.id}" style="--pc:${p.cor}">
          <span class="pc-top"><b>${U.esc(p.nome)}</b>${r.avisos ? `<span class="pc-av">${r.avisos} aviso${r.avisos > 1 ? 's' : ''}</span>` : ''}</span>
          ${p.sub ? `<small class="pc-sub">${U.esc(p.sub)}</small>` : ''}
          <span class="pc-n"><b>${r.n}</b> ${r.n === 1 ? 'cliente' : 'clientes'}</span>
          ${r.valor ? `<span class="pc-v">${U.brlShort(r.valor)}</span>` : ''}
          <span class="pc-l">${r.linhas.filter(Boolean).map(l => U.esc(l)).join(' · ')}</span>${(() => { const n = Cli.potenciais(p.id).length; return n ? `<span class="pc-pot">${n} potencia${n === 1 ? 'l' : 'is'}</span>` : ''; })()}</button>`; }).join('')}</div>
      ${mapaBase()}
      <div class="grid-2">
        <div class="ren-col">${App.Ren ? App.Ren.card({ titulo: 'Renovações em aberto', max: 8, extras: Cli.avisosConsorcio(), link: false }) : ''}
        <section class="card"><div class="card-h"><h2>${abertas.length ? 'Mais adiante' : 'Próximos vencimentos'}</h2><span class="muted small">até 60 dias</span></div>
          ${venc.length ? `<ul class="cl-vlist">${venc.slice(0, 12).map(vencItem).join('')}</ul>` : `<div class="empty sm"><b>Nada mais vencendo.</b><p>Seguros entram em Renovações ${App.Ren ? App.Ren.antec('seguros') : 30} dias antes e a renda fixa ${App.Ren ? App.Ren.antec('rf') : 15} dias antes. Os prazos ficam em Ajustes.</p></div>`}</section></div>
        <section class="card"><div class="card-h"><h2>Todos os clientes</h2><span class="count">${Store.all('clientes').length}</span></div>
          <label class="search">${UI.icon('busca')}<input id="clBusca" placeholder="Buscar cliente" value="${U.esc(busca)}"></label>
          ${clis.length ? `<ul class="cl-list">${clis.slice(0, 60).map(c => { const cts = Cli.contratos({ clienteId: c.id });
            return `<li data-cli="${c.id}">${av(c)}<div><b>${U.esc(c.nome)}</b><span class="cl-chips">${[...new Set(cts.map(x => x.produto))].map(pid => `<i style="--pc:${Cli.produto(pid).cor}">${U.esc(Cli.produto(pid).nome)}</i>`).join('') || '<small class="muted">sem produto cadastrado</small>'}</span></div></li>`; }).join('')}</ul>`
            : `<div class="empty sm"><b>${busca ? 'Nenhum cliente encontrado.' : 'Nenhum cliente ainda.'}</b><p>${busca ? '' : 'Cadastre um cliente ou importe o mês do MB.'}</p></div>`}</section>
      </div>`;
    el.querySelector('#clInd').onclick = () => ir({ indicacoes: true });
    el.querySelector('#clXpBase').onclick = () => ir({ xp: true });
    const bPat = el.querySelector('#clPat'); if (bPat) bPat.onclick = () => ir({ patrimonio: true });
    if (App.Ren) App.Ren.ligar(el);
    el.querySelectorAll('[data-area]').forEach(b => b.onclick = () => areaModal(b.dataset.area));
    const inp = el.querySelector('#clBusca');
    inp.oninput = () => { busca = inp.value; const pos = inp.selectionStart; inicio(el); const n = el.querySelector('#clBusca'); n.focus(); n.setSelectionRange(pos, pos); };
    ligarComum(el);
  }

  /* ---------- Mapa 360 ---------- */
  const sitPill = (sit, extra = '') => `<span class="sit" style="--sc:${Cli.SITS[sit].cor}">${Cli.SITS[sit].label}${extra}</span>`;
  const etapaRot = id => (Cli.ETAPAS.find(e => e.id === id) || {}).label || '';
  const ORD_SIT = ['comigo', 'mapeado', 'nao', 'na', 'sem'];
  /* Visão da base: por área, quantos têm com você, com outro, não têm, e de quantos falta saber */
  function mapaBase() {
    const base = Cli.base360(); if (!base.length) return '';
    return `<section class="card m360b"><div class="card-h"><h2>Mapa 360 da base</h2><span class="muted small">${U.plural(base.length, 'cliente', 'clientes')} · clique numa área para ver os nomes</span></div>
      <div class="m360b-grid">${Cli.areasVisiveis().map(a => { const r = Cli.resumoArea(a.id), t = base.length;
