      out.push({ mb: true, data: d, cli, nomeMB: cl.nome, rotulo: `${ps.ativo} vence no MB · ${U.brl(ps.saldo)}` });
    });
    /* Consórcio na última parcela */
    Store.all('contratos').filter(c => c.produto === 'consorcio' && (c.status || 'ativo') === 'ativo' && c.prazo && c.pagas != null && +c.prazo - +c.pagas <= 1 && +c.prazo - +c.pagas >= 0)
      .forEach(ct => out.push({ ct, data: hoje, cli: C.cliente(ct.clienteId), rotulo: 'Consórcio na última parcela' }));
    return out.sort((a, b) => a.data.localeCompare(b.data));
  };

  /* ---------- MB ---------- */
  C.dataMB = s => { const m = /^(\d{2})\/(\d{2})\/(\d{2,4})$/.exec(String(s || '').trim()); if (!m) return null; const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2]}-${m[1]}`; };
  C.mbMeses = () => Store.all('mb').slice().sort((a, b) => b.id.localeCompare(a.id));
  C.mbAtual = () => C.mbMeses()[0] || null;
  C.porMbId = mbId => { const ct = Store.all('contratos').find(c => c.produto === 'mb' && String(c.mbId) === String(mbId)); return ct ? C.cliente(ct.clienteId) : null; };
  C.mbDoCliente = cli => { const mb = C.mbAtual(); if (!mb) return null; const ct = Store.all('contratos').find(c => c.produto === 'mb' && c.clienteId === cli.id); if (!ct) return null; return (mb.clients || []).find(c => String(c.id) === String(ct.mbId)) || null; };
  const MES_ID = { janeiro: '01', fevereiro: '02', marco: '03', abril: '04', maio: '05', junho: '06', julho: '07', agosto: '08', setembro: '09', outubro: '10', novembro: '11', dezembro: '12' };
  C.idDoRef = ref => { const m = /([a-zç]+)\s*\/\s*(\d{4})/i.exec(norm(ref)); return m && MES_ID[m[1]] ? m[2] + '-' + MES_ID[m[1]] : null; };

  /* Lê o arquivo do mês: o dashboard HTML do MB (const D = {...}) ou um JSON no mesmo formato */
  C.lerArquivoMB = texto => {
    let d = null;
    try { d = JSON.parse(texto); } catch (e) {
      const m = /const\s+D\s*=\s*(\{[\s\S]*?\});\s*\n/.exec(texto);
      if (m) try { d = JSON.parse(m[1]); } catch (e2) { d = null; }
    }
    if (!d || !Array.isArray(d.clients) || !d.ref) throw new Error('Não encontrei os dados da carteira neste arquivo.');
    const id = C.idDoRef(d.ref); if (!id) throw new Error('Não consegui ler o mês de referência ("' + d.ref + '").');
    return { id, dados: d };
  };
  C.importarMB = ({ id, dados }) => {
    const ja = Store.get('mb', id);
    const rec = { ref: dados.ref, cdi: dados.cdi || null, ipca: dados.ipca ?? null, clients: dados.clients, positions: dados.positions || [], importadoEm: U.nowISO() };
    if (ja) Store.update('mb', id, rec, { silent: true }); else Store.insert('mb', { id, ...rec }, { silent: true });
    const novos = C.ligarClientesMB(dados, { silent: true });
    Store.commit();
    return { substituiu: !!ja, novos };
  };
  /* Cada cliente do MB vira (ou se liga a) um cliente da base, com o produto MB */
  C.ligarClientesMB = (dados, opts = {}) => {
    let novos = 0;
    (dados.clients || []).forEach(c => {
      if (Store.all('contratos').some(ct => ct.produto === 'mb' && String(ct.mbId) === String(c.id))) return;
      let cli = C.porNome(c.nome);
      if (!cli) { cli = C.criar({ nome: titulo(c.nome) }, { silent: true }); novos++; }
      Store.insert('contratos', { clienteId: cli.id, produto: 'mb', mbId: String(c.id), status: 'ativo' }, { silent: true });
    });
    if (!opts.silent) Store.commit();
    return novos;
  };
  const MIN = ['de', 'da', 'do', 'das', 'dos', 'e'];
  const titulo = s => String(s).toLowerCase().split(' ').map((w, i) => i && MIN.includes(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

  /* Resumo de cada produto para os cards */
  C.resumo = pid => {
    const p = C.produto(pid);
    if (pid === 'mb') {
      const mb = C.mbAtual(); if (!mb) return { n: 0, linhas: ['Importe o primeiro mês'] };
      const pl = mb.clients.reduce((s, c) => s + (+c.pl || 0), 0), cdi = mb.cdi ? mb.cdi[0] : null;
      return { n: mb.clients.length, valor: pl, linhas: ['Posição de ' + mb.ref, cdi != null ? `CDI do mês ${U.num(cdi)}%` : ''].filter(Boolean) };
    }
    const cts = C.contratos({ produto: pid }), clis = new Set(cts.map(c => c.clienteId));
    const soma = p.principal ? cts.reduce((s, c) => s + (+c[p.principal] || 0), 0) : 0;
    const linhas = [];
    if (pid === 'consorcio') linhas.push(U.plural(cts.length, 'cota', 'cotas'), `${cts.filter(c => c.contemplado).length} contemplada(s)`);
    if (pid === 'vida') linhas.push(U.plural(cts.length, 'apólice', 'apólices'), 'Prêmio ' + U.brl(cts.reduce((s, c) => s + (+c.premio || 0), 0)) + '/mês');
    if (pid === 'rc') linhas.push(U.plural(cts.length, 'apólice', 'apólices'));
    if (pid === 'saude') linhas.push(U.plural(cts.reduce((s, c) => s + (+c.vidas || 0), 0), 'vida', 'vidas'));
    if (pid === 'eqseed') linhas.push(U.plural(cts.length, 'investimento', 'investimentos'));
    if (pid === 'ita') linhas.push('US$ ' + cts.reduce((s, c) => s + (+c.valorUsd || 0), 0).toLocaleString('pt-BR', { maximumFractionDigits: 0 }));
    const avisos = C.vencimentos(30).filter(v => v.ct && v.ct.produto === pid).length;
    return { n: clis.size, valor: soma, linhas, avisos };
  };

  App.Cli = C;
})(window.App = window.App || {});

</script>
<script>
/* js/core/backup.js */
/* Backup e restauração em JSON. */
(function (App) {
  const { U, Store } = App;
  const B = {};
  const APP_ID = 'painel-gestao-pessoal';

  B.exportar = async () => {
    const pacote = { app: APP_ID, versao: 1, exportadoEm: U.nowISO(), dados: Store.snapshot() };
    const texto = JSON.stringify(pacote, null, 2);
    const nome = 'backup-painel-gestao-' + U.today() + '.json';
    const ok = await B.salvarArquivo(nome, texto, 'application/json');
    if (ok) Store.config('ultimoBackup', U.nowISO());
    return ok;
  };

  /* No navegador comum usa um link de download. Publicado no Claude, usa a permissão de download. */
  B.salvarArquivo = async (nome, texto, tipo) => {
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename: nome, data: new Blob([texto], { type: tipo }) }); return true; }
      } catch (e) { if (e && e.code === 'declined') return false; }
    }
    try {
      const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
      const a = document.createElement('a');
      a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      return true;
    } catch (e) { return false; }
  };

  /* Lê e valida o arquivo. Retorna { dados, resumo } ou lança um erro com mensagem clara. */
  B.ler = file => new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    fr.onload = () => {
      let obj;
      try { obj = JSON.parse(fr.result); } catch (e) { return reject(new Error('O arquivo não é um JSON válido.')); }
      const dados = obj && obj.app === APP_ID ? obj.dados : obj;
      if (!dados || !Array.isArray(dados.atividades) || !Array.isArray(dados.responsabilidades)) return reject(new Error('Este arquivo não é um backup do Painel de Gestão.'));
      resolve({
        dados, exportadoEm: obj.exportadoEm || null,
        resumo: { responsabilidades: dados.responsabilidades.length, atividades: dados.atividades.length, metas: (dados.metas || []).length }
      });
    };
    fr.readAsText(file);
  });

  B.restaurar = dados => { Store.replaceAll(dados); Store.config('inicializado', true); if (App.Fat) App.Fat.garantir(); };

  App.Backup = B;
})(window.App = window.App || {});

</script>
<script>
/* js/core/cloud.js */
/*
 * Nuvem: login (Supabase Auth) e adaptador que grava as tabelas no Supabase.
 * As telas não conhecem nada daqui; só o App.Store usa o adaptador.
 */
(function (App) {
  const { U, Store } = App;
  const C = {};
  let sb = null, usuario = null;

  /* Coleção do app -> tabela do banco, e os campos de cada uma */
  const TABELAS = { responsabilidades: 'responsabilidades', atividades: 'atividades', metas: 'metas', metaRegistros: 'meta_registros', historico: 'historico', faturamento: 'faturamento' };
  const CAMPOS = {
    responsabilidades: ['id', 'nome', 'descricao', 'cor', 'status', 'demo', 'criadoEm', 'atualizadoEm'],
    atividades: ['id', 'titulo', 'descricao', 'responsabilidadeId', 'categoria', 'inicio', 'prazo', 'prioridade', 'status', 'metaId', 'resultadoEsperado', 'resultado', 'resultadoTexto', 'observacoes', 'concluidaEm', 'adiamentos', 'tipoNegocio', 'cliente', 'valorNegocio', 'resultadoNegocio', 'demo', 'criadoEm', 'atualizadoEm'],
    metas: ['id', 'nome', 'responsabilidadeId', 'descricao', 'alvo', 'atual', 'unidade', 'inicio', 'fim', 'periodicidade', 'modo', 'demo', 'criadoEm', 'atualizadoEm'],
    metaRegistros: ['id', 'metaId', 'valor', 'nota', 'em', 'demo', 'criadoEm', 'atualizadoEm'],
    historico: ['id', 'atividadeId', 'tipo', 'descricao', 'em', 'demo', 'criadoEm', 'atualizadoEm'],
    faturamento: ['id', 'data', 'cliente', 'tipo', 'descricao', 'valor', 'receita', 'responsabilidadeId', 'atividadeId', 'observacoes', 'demo', 'criadoEm', 'atualizadoEm']
  };
  /* Tabelas do faturamento guardam o registro inteiro em JSON (fácil de evoluir sem mudar o banco) */
  const JSONT = { linhas: 'fat_linhas', produtos: 'fat_produtos', producoes: 'fat_producoes', recebiveis: 'fat_recebiveis', recorrencias: 'fat_recorrencias', emails: 'emails', clientes: 'clientes', contratos: 'contratos', mb: 'carteira_mb' };
  Object.assign(TABELAS, JSONT);
  const DATAS = ['inicio', 'prazo', 'fim', 'data', 'concluidaEm', 'em', 'criadoEm', 'atualizadoEm'];
  const NUMEROS = ['resultadoEsperado', 'resultado', 'alvo', 'atual', 'valor', 'adiamentos', 'valorNegocio', 'receita'];
  const OBRIG = { responsabilidades: ['nome', 'Sem nome'], atividades: ['titulo', 'Sem título'], metas: ['nome', 'Sem nome'] };
  /* Campos que não têm coluna própria (várias metas, % que fica com você...) vão para "extras" (jsonb) */
  const COM_EXTRAS = { atividades: true, metas: true };
  const semExtras = {};
  let avisouExtras = false;
  const snake = k => k.replace(/[A-Z]/g, m => '_' + m.toLowerCase());
  const camel = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());

  C.paraLinha = (col, rec, uid) => {
    if (JSONT[col]) { const { id, demo, ...dados } = rec; return { user_id: uid, id, dados, demo: !!demo, atualizado_em: rec.atualizadoEm || U.nowISO() }; }
    const r = { user_id: uid };
    CAMPOS[col].forEach(k => {
      let v = rec[k];
      if (v === undefined || v === '') v = null;
      if (v !== null && NUMEROS.includes(k)) { v = Number(v); if (!isFinite(v)) v = null; }
      if (v !== null && k === 'adiamentos') v = Math.round(v);
      if (k === 'demo') v = !!v;
      r[snake(k)] = v;
    });
    const ob = OBRIG[col]; if (ob && !r[ob[0]]) r[ob[0]] = ob[1];
    if (COM_EXTRAS[col]) {
      const ex = {};
      Object.keys(rec).forEach(k => { if (!CAMPOS[col].includes(k) && k !== 'user_id' && k !== 'extras' && !k.startsWith('_') && rec[k] !== undefined) ex[k] = rec[k]; });
      r.extras = ex;
    }
    return r;
  };
  C.deLinha = row => {
    if (row.dados && typeof row.dados === 'object' && !('titulo' in row) && !('nome' in row)) return { ...row.dados, id: row.id, demo: !!row.demo };
    const o = {};
    Object.entries(row).forEach(([k, v]) => { if (k === 'user_id' || k === 'extras' || v === null) return; o[camel(k)] = v; });
    if (row.extras && typeof row.extras === 'object') Object.entries(row.extras).forEach(([k, v]) => { if (!(k in o) && v !== null) o[k] = v; });
    return o;
  };

  async function lerTudo(tabela) {
    const out = []; let de = 0;
    for (;;) {
      const { data, error } = await sb.from(tabela).select('*').range(de, de + 999);
      if (error) throw error;
      out.push(...data);
      if (data.length < 1000) break;
      de += 1000;
    }
    return out;
  }
  const lotes = (arr, n = 400) => { const r = []; for (let i = 0; i < arr.length; i += n) r.push(arr.slice(i, i + n)); return r; };
  /* Se o banco ainda não tem a coluna "extras" (SQL novo não rodou), grava sem ela e avisa uma vez */
  async function gravar(tabela, linhas) {
    for (let l of lotes(linhas)) {
      if (semExtras[tabela]) l = l.map(({ extras, ...r }) => r);
      let { error } = await sb.from(tabela).upsert(l, { onConflict: 'user_id,id' });
      if (error && !semExtras[tabela] && /extras/i.test(error.message || '')) {
        semExtras[tabela] = true;
        if (!avisouExtras) { avisouExtras = true; setTimeout(() => App.UI && App.UI.toast('Rode o supabase-schema.sql novo no Supabase para salvar várias metas e o % na nuvem.', 'aviso'), 500); }
        ({ error } = await sb.from(tabela).upsert(l.map(({ extras, ...r }) => r), { onConflict: 'user_id,id' }));
      }
      if (error) throw error;
    }
  }
  async function apagar(tabela, ids, uid) { for (const l of lotes(ids)) { const { error } = await sb.from(tabela).delete().eq('user_id', uid).in('id', l); if (error) throw error; } }

  C.adapter = user => ({
    name: 'Nuvem (Supabase)', remote: true, cacheKey: user.id, email: user.email,
    async load() {
      const out = { config: {} };
      for (const [col, t] of Object.entries(TABELAS)) out[col] = (await lerTudo(t)).map(C.deLinha);
      const { data, error } = await sb.from('configuracoes').select('dados').maybeSingle();
      if (error) throw error;
      out.config = data && data.dados ? data.dados : {};
      return out;
    },
    async push(p) {
      const uid = user.id;
      if (p.full) {
        for (const [col, t] of Object.entries(TABELAS)) {
          const { error } = await sb.from(t).delete().eq('user_id', uid); if (error) throw error;
          await gravar(t, p.db[col].map(r => C.paraLinha(col, r, uid)));
        }
      } else {
        for (const [col, c] of Object.entries(p.cols)) {
          const t = TABELAS[col]; if (!t) continue;
          if (c.up.length) await gravar(t, c.up.map(r => C.paraLinha(col, r, uid)));
          if (c.del.length) await apagar(t, c.del, uid);
        }
      }
      if (p.config) {
        const { error } = await sb.from('configuracoes').upsert({ user_id: uid, dados: p.config, atualizado_em: U.nowISO() }, { onConflict: 'user_id' });
        if (error) throw error;
      }
    }
  });

  /* ---------- Conexão e sessão ---------- */
  C.configurado = () => { const c = window.HORUS_CONFIG || {}; return !!(c.supabaseUrl && c.supabaseAnonKey); };
  C.init = () => {
    const c = window.HORUS_CONFIG;
    sb = window.supabase.createClient(c.supabaseUrl.trim(), c.supabaseAnonKey.trim(), { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(C.novaSenha, 300); });
    return sb;
  };
  C.sessao = async () => { const { data } = await sb.auth.getSession(); usuario = data.session ? data.session.user : null; return data.session; };
  C.usuario = () => usuario;

  const traduz = e => {
    const m = (e && (e.message || e.error_description || String(e))) || '';
    if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/email not confirmed/i.test(m)) return 'Confirme o seu e-mail pelo link que enviamos e entre de novo.';
    if (/already registered|already exists/i.test(m)) return 'Esse e-mail já tem conta. Use "Entrar".';
    if (/password should be at least|weak/i.test(m)) return 'A senha precisa ter pelo menos 8 caracteres, com letras e números.';
    if (/signups not allowed|signup is disabled/i.test(m)) return 'Novos cadastros estão desativados neste painel.';
    if (/rate limit|too many/i.test(m)) return 'Muitas tentativas. Espere um minuto e tente de novo.';
    if (/fetch|network/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
    return 'Não foi possível concluir: ' + m;
  };

  /* ---------- Tela de login ---------- */
  C.telaLogin = aoEntrar => {
    let modo = 'entrar';
    const el = document.createElement('div');
    el.className = 'auth';
    document.body.appendChild(el);
    const desenhar = (msg = '', tipo = 'erro') => {
      el.innerHTML = `<div class="auth-card">
        <b class="logo dark">Horus <span>Gestão</span></b>
        <h1>${modo === 'entrar' ? 'Entrar no painel' : modo === 'criar' ? 'Criar sua conta' : 'Recuperar senha'}</h1>
        <p class="muted small">${modo === 'esqueci' ? 'Enviamos um link para você criar uma nova senha.' : 'Seus dados ficam salvos na nuvem e aparecem em qualquer aparelho.'}</p>
        <form class="form" id="fAuth">
          <label class="f full"><span>E-mail</span><input type="email" name="email" autocomplete="email" required autofocus></label>
          ${modo !== 'esqueci' ? `<label class="f full"><span>Senha</span><input type="password" name="senha" autocomplete="${modo === 'criar' ? 'new-password' : 'current-password'}" required minlength="8"></label>` : ''}
          ${msg ? `<p class="${tipo === 'ok' ? 'fok' : 'ferr'}">${U.esc(msg)}</p>` : ''}
          <button class="btn primary full" type="submit">${modo === 'entrar' ? 'Entrar' : modo === 'criar' ? 'Criar conta' : 'Enviar link'}</button>
        </form>
        <div class="auth-links">
          ${modo === 'entrar' ? '<button class="link" data-m="criar">Criar conta</button><button class="link" data-m="esqueci">Esqueci minha senha</button>' : '<button class="link" data-m="entrar">Voltar para entrar</button>'}
        </div></div>`;
      el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { modo = b.dataset.m; desenhar(); });
      const f = el.querySelector('#fAuth');
      setTimeout(() => f.email.focus(), 30);
      f.onsubmit = async e => {
        e.preventDefault();
        const email = f.email.value.trim(), senha = f.senha ? f.senha.value : '';
        const bt = f.querySelector('button[type=submit]'); bt.disabled = true; bt.textContent = 'Aguarde...';
        try {
          if (modo === 'entrar') {
            const { error } = await sb.auth.signInWithPassword({ email, password: senha });
            if (error) throw error;
            el.remove(); aoEntrar();
          } else if (modo === 'criar') {
            const { data, error } = await sb.auth.signUp({ email, password: senha, options: { emailRedirectTo: location.href.split('#')[0] } });
            if (error) throw error;
            if (data.session) { el.remove(); aoEntrar(); }
            else { modo = 'entrar'; desenhar('Conta criada. Abra o e-mail de confirmação que enviamos para ' + email + ' e depois entre aqui.', 'ok'); }
          } else {
            const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
            if (error) throw error;
            modo = 'entrar'; desenhar('Se esse e-mail tiver conta, você vai receber um link para criar uma nova senha.', 'ok');
          }
        } catch (err) { desenhar(traduz(err)); const fe = el.querySelector('[name=email]'); if (fe) fe.value = email; }
      };
    };
    desenhar();
  };

  C.novaSenha = () => {
    App.UI.modal({
      title: 'Criar nova senha', size: 'sm',
      body: `<form class="form" id="fNs"><label class="f full"><span>Nova senha</span><input type="password" name="senha" minlength="8" required autofocus autocomplete="new-password"></label><p class="ferr" id="errNs" hidden></p></form>`,
      footer: `<button class="btn primary" form="fNs" type="submit">Salvar senha</button>`,
      onMount(el, api) {
        el.querySelector('#fNs').onsubmit = async e => {
          e.preventDefault();
          const { error } = await sb.auth.updateUser({ password: e.target.senha.value });
          if (error) { const er = el.querySelector('#errNs'); er.textContent = traduz(error); er.hidden = false; return; }
          api.close(); App.UI.toast('Senha atualizada');
        };
      }
    });
  };

  C.sair = async () => {
    if (Store.pendente()) {
      const ok = await App.UI.confirm({ title: 'Sair com alterações pendentes?', text: 'Algumas alterações ainda não foram enviadas para a nuvem. Se sair agora, elas se perdem. Conecte-se à internet e espere aparecer "Salvo na nuvem".', ok: 'Sair mesmo assim' });
      if (!ok) return;
    }
    try { await sb.auth.signOut(); } catch (e) {}
    Store.limparCopiaLocal();
    location.reload();
  };

  /* ---------- Primeiro acesso: banco vazio ---------- */
  C.boasVindas = () => {
    const m = App.UI.modal({
      title: 'Bem-vindo ao Horus Gestão', size: 'md',
      body: `<p>Sua conta está pronta e ainda não tem dados. Como você quer começar?</p>
        <div class="welcome">
          <label class="wopt"><b>Trazer meus dados do painel antigo</b><span>Escolha o backup (.json) baixado em "Backup e dados" do arquivo que você já usava.</span><input type="file" accept=".json,application/json" id="wFile"></label>
          <button class="wopt" data-w="resp"><b>Começar com as minhas 4 responsabilidades</b><span>Assessoria, Capitão de Vida, Capitão de Xceed e Projetos pessoais, sem atividades.</span></button>
          <button class="wopt" data-w="demo"><b>Ver com exemplos</b><span>Inclui a Campanha de indicações 2027. Você apaga depois em "Backup e dados".</span></button>
        </div><p class="ferr" id="wErr" hidden></p>`,
      onMount(el, api) {
        el.querySelector('#wFile').onchange = async e => {
          const file = e.target.files[0]; if (!file) return;
          try { const r = await App.Backup.ler(file); App.Backup.restaurar(r.dados); api.close(); App.UI.toast(`Backup importado: ${r.resumo.atividades} atividades e ${r.resumo.metas} metas`); }
          catch (err) { const er = el.querySelector('#wErr'); er.textContent = err.message; er.hidden = false; }
        };
        el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {
          if (b.dataset.w === 'demo') App.Demo.seed();
          else { App.Demo.RESP.forEach(r => Store.insert('responsabilidades', { ...r, status: 'ativa' }, { silent: true })); Store.commit(); Store.config('inicializado', true); }
          api.close(); App.UI.toast('Tudo pronto');
        });
      }
    });
    return m;
  };

  /* Atualiza ao voltar para a aba e a cada minuto, para ver o que foi feito em outro aparelho */
  C.vigiar = () => {
    const tentar = () => { if (document.visibilityState === 'visible' && !document.querySelector('.modal-wrap')) Store.sincronizar().catch(() => {}); };
    document.addEventListener('visibilitychange', tentar);
    setInterval(tentar, 60000);
  };

  App.Cloud = C;
})(window.App = window.App || {});

</script>
<script>
/* js/ui/components.js */
/* Componentes de interface reutilizáveis: ícones, janelas, confirmação, avisos e etiquetas. */
(function (App) {
  const { U, M } = App;
  const UI = {};

  const P = {
    painel: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
    atividades: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>',
    metas: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
    resp: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
    dados: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
    mais: '<path d="M12 5v14M5 12h14"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    editar: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    lixo: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    adiar: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
    arquivo: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/>',
    lista: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    kanban: '<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    busca: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    seta: '<path d="M9 6l6 6-6 6"/>',
    voltar: '<path d="M15 18l-6-6 6-6"/>',
    dinheiro: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6.5 9.5v.01M17.5 14.5v.01"/>',
    negocio: '<path d="M3 12l4-4 4 3 3-3 7 6"/><path d="M14 14l3 3M11 17l2 2M7 13l-4 4"/>',
    historico: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
    calendario: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/>',
    externo: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
    copiar: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'
  };
  UI.icon = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;

  /* ---------- Aviso rápido ---------- */
  let tt;
  UI.toast = (msg, tipo = 'ok', acao) => {
    const el = document.getElementById('toast');
    el.className = 'toast ' + tipo;
    const acoes = acao ? (Array.isArray(acao) ? acao : [acao]) : [];
    el.innerHTML = `<span>${U.esc(msg)}</span>${acoes.map((x, i) => `<button class="toast-act" data-i="${i}">${U.esc(x.label)}</button>`).join('')}`;
    el.hidden = false;
    el.querySelectorAll('.toast-act').forEach(b => b.onclick = () => { el.hidden = true; acoes[+b.dataset.i].fn(); });
    clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, acao ? 6000 : 3000);
  };

  /* ---------- Janela (modal) ---------- */
  let pilha = [];
  UI.modal = ({ title, body, footer = '', size = '', onMount, onClose }) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `<div class="modal-bd"></div><div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${U.esc(title)}">
      <div class="modal-h"><h2>${U.esc(title)}</h2><button class="icon-btn" data-close aria-label="Fechar">${UI.icon('x')}</button></div>
      <div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
    document.body.appendChild(wrap);
    const last = document.activeElement;
    const api = {
      el: wrap.querySelector('.modal'),
      close() { wrap.remove(); pilha = pilha.filter(x => x !== api); if (onClose) onClose(); if (last && last.focus) last.focus(); }
    };
    pilha.push(api);
    wrap.querySelector('.modal-bd').onclick = () => api.close();
    wrap.querySelectorAll('[data-close]').forEach(b => b.onclick = () => api.close());
    if (onMount) onMount(api.el, api);
    const f = api.el.querySelector('[autofocus]') || api.el.querySelector('input,select,textarea,button:not([data-close])');
    if (f) setTimeout(() => f.focus(), 30);
    return api;
  };
  UI.closeTop = () => { const t = pilha[pilha.length - 1]; if (t) { t.close(); return true; } return false; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.closeTop()) e.preventDefault(); });

  /* ---------- Confirmação antes de excluir ---------- */
  UI.confirm = ({ title, text, ok = 'Confirmar', danger = true }) => new Promise(resolve => {
    let done = false;
    const m = UI.modal({
      title, size: 'sm',
      body: `<p class="confirm-text">${text}</p>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${U.esc(ok)}</button>`,
      onMount: el => { el.querySelector('[data-ok]').onclick = () => { done = true; m.close(); resolve(true); }; setTimeout(() => el.querySelector('[data-ok]').focus(), 40); },
      onClose: () => { if (!done) resolve(false); }
    });
  });

  /* ---------- Etiquetas ---------- */
  UI.respChip = id => `<span class="rchip"><i style="background:${M.respCor(id)}"></i>${U.esc(M.respNome(id))}</span>`;
  UI.prioPill = id => `<span class="prio p-${id}">${M.prio(id).label}</span>`;
  UI.statusPill = id => `<span class="st s-${id}">${M.status(id).label}</span>`;
  UI.due = a => {
    if (a.status === 'concluida') return `<span class="due done">${a.prazo ? U.fmtDate(a.prazo) : 'Concluída'}</span>`;
    const cls = M.atrasada(a) ? 'late' : M.hoje(a) ? 'today' : a.prazo && U.diff(a.prazo, U.today()) <= 2 ? 'soon' : '';
    return `<span class="due ${cls}">${UI.icon('adiar')}${U.relDue(a.prazo)}</span>`;
  };
  /* Etiqueta de negócio: tipo, cliente e valor */
  UI.negChip = a => { const ns = M.negociosDa(a); if (!ns.length) return '';
    return ns.map(n => `<span class="neg${n.resultado === 'perdido' ? ' perdido' : ''}">${UI.icon('negocio')}${U.esc(M.tipoNeg(n.tipo).label)}${n.valor ? ' · ' + U.brlShort(n.valor) : ''}</span>`).join('') + (a.cliente ? `<span class="cli">${U.esc(a.cliente)}</span>` : ''); };
  UI.bar = (pct, cor) => `<div class="pbar"><i style="width:${Math.min(100, Math.round(pct * 100))}%;${cor ? 'background:' + cor : ''}"></i></div>`;

  /* ---------- Formulários ---------- */
  UI.options = (list, sel, { vazio } = {}) => (vazio ? `<option value="">${U.esc(vazio)}</option>` : '') +
    list.map(o => `<option value="${U.esc(o.id)}"${o.id === sel ? ' selected' : ''}>${U.esc(o.label || o.nome)}</option>`).join('');
  UI.respOptions = (sel, vazio) => UI.options(App.Store.all('responsabilidades').filter(r => r.status !== 'arquivada' || r.id === sel), sel, { vazio });
  UI.formData = form => {
    const o = {};
    form.querySelectorAll('[name]').forEach(el => {
      if (el.type === 'radio' && !el.checked) return;
      let v = el.value;
      if (el.dataset.num !== undefined) v = U.parseNum(v);
      else v = v.trim();
      o[el.name] = v === '' ? null : v;
    });
    return o;
  };
  UI.segmented = (name, list, sel) => `<div class="segpick" role="radiogroup">${list.map(o => `<label class="sp sp-${o.id}"><input type="radio" name="${name}" value="${o.id}"${o.id === sel ? ' checked' : ''}><span>${U.esc(o.label)}</span></label>`).join('')}</div>`;

  App.UI = UI;
})(window.App = window.App || {});

</script>
<script>
/* js/ui/charts.js */
/* Gráficos simples em SVG, sem bibliotecas. */
(function (App) {
  const C = {};
  /* Anel de percentual */
  C.ring = (pct, size = 96, cor = 'var(--accent)') => {
    const r = size / 2 - 7, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${Math.round(p * 100)}%">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="8"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${cor}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="${size / 4.6}" font-weight="700" fill="var(--ink)">${Math.round(p * 100)}%</text></svg>`;
  };
  /* Linha de evolução com linha da meta */
  C.spark = (vals, alvo, w = 300, h = 70) => {
    if (!vals.length) return '';
    const mx = Math.max(alvo || 0, ...vals, 1), n = vals.length;
    const x = i => 6 + (n === 1 ? (w - 12) / 2 : i * (w - 12) / (n - 1)), y = v => h - 8 - (v / mx) * (h - 20);
    const pts = vals.map((v, i) => [x(i), y(v)]);
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Evolução do resultado">
      ${alvo ? `<line x1="0" x2="${w}" y1="${y(alvo)}" y2="${y(alvo)}" stroke="var(--muted)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>` : ''}
      <path d="M${pts.map(p => p.join(' ')).join(' L')} L${pts[n - 1][0]} ${h} L${pts[0][0]} ${h}Z" fill="var(--accent)" opacity=".12"/>
      <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
  };
  App.Charts = C;
})(window.App = window.App || {});

</script>
<script>
/* js/ui/forms.js */
/* Formulários e janelas de ação: atividade, concluir, adiar, detalhes, meta e responsabilidade. */
(function (App) {
  const { U, M, UI, Store } = App;
  const F = {};

  const categorias = () => [...new Set(Store.all('atividades').map(a => a.categoria).filter(Boolean))].sort();
  const datasRapidas = () => [
    ['Hoje', U.today()], ['Amanhã', U.addDays(U.today(), 1)], ['Sexta', U.nextWeekday(5)], ['Próx. segunda', U.nextWeekday(1)], ['Sem prazo', '']
  ];

  /* ---------- Metas da atividade (pode ser mais de uma) ---------- */
  const metaAtiva = m => !(m.fim && m.fim < U.today());
  /* Metas para escolher: as da responsabilidade primeiro, depois as outras */
  const metasEscolha = (respId, sel) => {
    const ms = Store.all('metas').filter(m => metaAtiva(m) || sel.has(m.id));
    const da = ms.filter(m => m.responsabilidadeId === respId), outras = ms.filter(m => m.responsabilidadeId !== respId);
    const ord = arr => arr.sort((a, b) => a.nome.localeCompare(b.nome));
    return { da: ord(da), outras: ord(outras) };
  };
  const chipMeta = (m, on) => `<button type="button" class="mpick${on ? ' on' : ''}" data-mid="${m.id}" aria-pressed="${on}"><i style="background:${M.respCor(m.responsabilidadeId)}"></i>${U.esc(m.nome)}${m.unidade ? `<small>${U.esc(m.unidade)}</small>` : ''}<svg class="ic ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>`;
  const numTxt = v => v == null ? '' : U.num(v);

  /* Campos de resultado por meta, usados ao concluir (atividade comum e negócio) */
  const camposResultado = a => {
    const metas = M.metasComResultado(a);
    if (!metas.length) return a.resultadoEsperado != null
      ? `<label class="f full"><span>Quanto você obteve? Esperado: ${U.num(a.resultadoEsperado)}</span><input name="resultado" data-num inputmode="decimal" value="${a.resultado ?? ''}" placeholder="0"></label>` : '';
    const somadas = a.somadas || [];
    return `<div class="rmetas">${metas.map((m, i) => { const esp = M.espMeta(a, m.id), res = M.resMeta(a, m.id);
      return `<div class="rmeta"><div class="rmeta-h"><i style="background:${M.respCor(m.responsabilidadeId)}"></i><b>${U.esc(m.nome)}</b>${esp != null ? `<small>esperado: ${U.esc(M.fmtMeta(esp, m))}</small>` : ''}</div>
        <div class="rmeta-b"><label class="f"><span>${M.ehDinheiro(m) ? 'Quanto você gerou (R$)?' : 'Quantas ' + U.esc(m.unidade || 'unidades') + ' você obteve?'}</span><input data-res="${m.id}" data-num inputmode="decimal" value="${res ?? ''}" placeholder="0"${i === 0 ? ' autofocus' : ''}></label>
        ${m.modo === 'manual' ? `<label class="chk"><input type="checkbox" data-soma="${m.id}"${somadas.includes(m.id) ? '' : ' checked'}><span>Somar à meta (hoje: ${U.esc(M.fmtMeta(m.atual || 0, m, true))})</span></label>` : '<small class="muted">Entra na meta automaticamente.</small>'}</div></div>`; }).join('')}</div>
      <p class="note">Realizar a atividade é o que você fez. ${metas.length > 1 ? 'Cada meta recebe o próprio resultado.' : 'O número acima é o resultado.'} Deixe em branco a meta que não teve resultado.</p>`;
  };
  const lerResultados = (el, form) => {
    const resultados = {}, somarManual = [];
    el.querySelectorAll('[data-res]').forEach(i => { const v = U.parseNum(i.value); if (v != null) resultados[i.dataset.res] = v; });
    el.querySelectorAll('[data-soma]').forEach(c => { if (c.checked && resultados[c.dataset.soma] != null) somarManual.push(c.dataset.soma); });
    const r = form.resultado ? U.parseNum(form.resultado.value) : null;
    return { resultados, somarManual, resultado: r };
  };
  F._camposResultado = camposResultado; F._lerResultados = lerResultados;

  /* ---------- Próximos passos (o que a atividade gerou) ---------- */
  const PRAZOS = [['1', 'Amanhã'], ['3', 'Em 3 dias'], ['7', 'Em 1 semana'], ['15', 'Em 15 dias'], ['30', 'Em 30 dias'], ['', 'Sem prazo']];
  const blocoProximos = (a, aberto) => {
    const metas = M.metasComResultado(a), com = a.cliente ? ' · ' + a.cliente : '';
    const sug = [
      ...metas.map(m => ({ t: 'Retomar: ' + m.nome + com, m: [m.id], l: 'Retomar ' + m.nome })),
      { t: 'Reunião com especialista' + com, m: [], l: 'Reunião com especialista' },
      { t: 'Enviar proposta' + com, m: [], l: 'Enviar proposta' },
      { t: 'Retorno' + com, m: [], l: 'Retorno / follow-up' }
    ];
    return `<div class="prox${aberto ? ' on' : ''}" id="prox">
      <div class="prox-h"><b>${UI.icon('mais')}Essa atividade gerou algo?</b><small>Cada próximo passo vira uma nova atividade ligada a esta, com o mesmo cliente e responsabilidade.</small></div>
      <div class="prox-sug">${sug.map((x, i) => `<button type="button" class="qd" data-sug="${i}">+ ${U.esc(x.l)}</button>`).join('')}<button type="button" class="qd" data-sug="novo">+ Outro</button></div>
      <div class="prox-list" id="proxList"></div>
    </div>`;
  };
  const montarProximos = (el, a) => {
    const metas = M.metasComResultado(a), com = a.cliente ? ' · ' + a.cliente : '';
    const sug = [
      ...metas.map(m => ({ t: 'Retomar: ' + m.nome + com, m: [m.id] })),
      { t: 'Reunião com especialista' + com, m: [] }, { t: 'Enviar proposta' + com, m: [] }, { t: 'Retorno' + com, m: [] }
    ];
    const lista = el.querySelector('#proxList');
    const add = (titulo, mids) => {
      el.querySelector('#prox').classList.add('on');
      /* Se já existe uma linha vazia, a sugestão preenche ela */
      const vazia = [...lista.querySelectorAll('.prox-r')].find(x => !x.querySelector('.pt').value.trim());
      if (vazia && titulo) { vazia.querySelector('.pt').value = titulo; vazia.querySelectorAll('.pm [data-mid]').forEach(b => b.classList.toggle('on', mids.includes(b.dataset.mid))); vazia.querySelector('.pt').focus(); return; }
      if (vazia && !titulo) { vazia.querySelector('.pt').focus(); return; }
      const r = document.createElement('div'); r.className = 'prox-r';
      r.innerHTML = `<input class="pt" maxlength="140" value="${U.esc(titulo)}" placeholder="Ex.: Reunião com o especialista de seguros" aria-label="Próximo passo">
        <select class="pd" aria-label="Prazo">${PRAZOS.map(([d, l]) => `<option value="${d}"${d === '7' ? ' selected' : ''}>${l}</option>`).join('')}</select>
        <button type="button" class="icon-btn pr-x" title="Remover" aria-label="Remover">${UI.icon('x')}</button>
        ${metas.length ? `<div class="pm" title="Metas deste próximo passo">${metas.map(m => `<button type="button" class="mpick sm${mids.includes(m.id) ? ' on' : ''}" data-mid="${m.id}"><i style="background:${M.respCor(m.responsabilidadeId)}"></i>${U.esc(m.nome)}<svg class="ic ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>`).join('')}</div>` : ''}`;
      r.querySelector('.pr-x').onclick = () => { r.remove(); if (!lista.children.length) el.querySelector('#prox').classList.remove('on'); };
      r.querySelectorAll('.pm [data-mid]').forEach(b => b.onclick = () => b.classList.toggle('on'));
      lista.appendChild(r);
      const i = r.querySelector('.pt'); i.focus(); if (!titulo) return; i.setSelectionRange(i.value.length, i.value.length);
    };
    el.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => { const k = b.dataset.sug; if (k === 'novo') add('', []); else add(sug[+k].t, sug[+k].m); });
    return { add };
  };
  const lerProximos = el => [...el.querySelectorAll('.prox-r')].map(r => {
    const d = r.querySelector('.pd').value;
    return { titulo: r.querySelector('.pt').value.trim(), prazo: d === '' ? null : U.addDays(U.today(), +d), metaIds: [...r.querySelectorAll('.pm .on')].map(b => b.dataset.mid) };
  }).filter(x => x.titulo);
  const avisarProximos = (criados, extra) => {
    if (!criados.length) return false;
    UI.toast((extra ? extra + ' · ' : '') + U.plural(criados.length, 'próximo passo criado', 'próximos passos criados'), 'ok', { label: 'Ver', fn: () => F.detalhes(criados[0].origemId) });
    return true;
  };

  /* Só os próximos passos (pelo detalhe ou depois de concluir) */
  F.proximos = id => {
    const a = Store.get('atividades', id); if (!a) return;
    UI.modal({
      title: 'Próximos passos', size: 'sm',
      body: `<form class="form" id="fPx"><p class="muted" style="margin:0">A partir de: <b>${U.esc(a.titulo)}</b></p>${blocoProximos(a, true)}
        <p class="note">Precisa de mais campos (valor, negócio, descrição)? <a href="#" id="pxFull">Abrir o formulário completo</a>.</p></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fPx" type="submit">Criar</button>`,
      onMount(el, api) {
        const px = montarProximos(el, a); px.add('', []);
        el.querySelector('#pxFull').onclick = e => { e.preventDefault(); api.close(); F.atividade(null, { ...M.herdar(a), prazo: U.addDays(U.today(), 7) }); };
        el.querySelector('#fPx').onsubmit = e => {
          e.preventDefault(); const itens = lerProximos(el);
          if (!itens.length) { UI.toast('Escreva pelo menos um próximo passo.', 'aviso'); return; }
          api.close(); avisarProximos(M.criarProximos(id, itens));
        };
      }
    });
  };

  /* ---------- Nova atividade / editar atividade ---------- */
  F.atividade = (id, preset = {}) => {
    const a = id ? Store.get('atividades', id) : null;
    const v = a || { prioridade: 'media', status: 'pendente', prazo: U.today(), responsabilidadeId: (M.respAtivas()[0] || {}).id, ...preset };
    if (!M.respAtivas().length && !a) {
      UI.toast('Cadastre uma responsabilidade antes de criar atividades.', 'aviso');
      return F.resp(null);
    }
    const sel = new Set(M.metasDa(v));
    const esp = {}, res = {};
    sel.forEach(mid => { esp[mid] = M.espMeta(v, mid); res[mid] = M.resMeta(v, mid); });
    const tiposTop = M.tiposUsados().slice(0, 6).map(t => t.label);
    const tiposChips = (tiposTop.length >= 3 ? tiposTop : [...new Set([...tiposTop, 'Investimentos', 'Consórcio', 'Seguro de vida', 'Previdência', 'Câmbio'])].slice(0, 6));
    const negs0 = M.negociosDa(v);
    const ehNeg = !!(negs0.length || v._neg);
    const m = UI.modal({
      title: a ? 'Editar atividade' : 'Nova atividade', size: 'md',
      body: `<form class="form" id="fAt" novalidate>
        ${M.origem(v) ? `<div class="orig-banner">${UI.icon('seta')}<span>Próximo passo de <b>${U.esc(M.origem(v).titulo)}</b></span></div>` : ''}
        <label class="f full"><span>Título</span><input name="titulo" required maxlength="140" value="${U.esc(v.titulo || '')}" placeholder="O que precisa ser feito?" autofocus></label>
        <div class="row2">
          <label class="f"><span>Responsabilidade</span><select name="responsabilidadeId">${UI.respOptions(v.responsabilidadeId)}</select></label>
          <label class="f"><span>Prazo de conclusão</span><input type="date" name="prazo" value="${v.prazo || ''}"></label>
        </div>
        <div class="quick-dates">${datasRapidas().map(([l, d]) => `<button type="button" class="qd" data-d="${d}">${l}</button>`).join('')}</div>
        <div class="f full"><span>Prioridade</span>${UI.segmented('prioridade', M.PRIORIDADES, v.prioridade)}</div>
        ${a ? `<div class="f full"><span>Status</span>${UI.segmented('status', M.STATUS, v.status)}</div>` : ''}
        <div class="f full metas-f"><span>Metas que esta atividade ajuda <em>marque uma ou mais</em></span>
          <div class="mpicks" id="mpicks"></div>
          <div class="mres" id="mres"></div>
        </div>
        <div class="negbox${ehNeg ? ' on' : ''}">
          <label class="neg-toggle"><input type="checkbox" id="chkNeg" ${ehNeg ? 'checked' : ''}><span class="tg"><i></i></span><span><b>É um negócio</b><small>Aparece em Negócios em andamento. Escreva o tipo do jeito que você usa.</small></span></label>
          <div class="neg-fields" ${ehNeg ? '' : 'hidden'}>
            <label class="f full"><span>Cliente</span><input name="cliente" list="dlCli" value="${U.esc(v.cliente || '')}" placeholder="Nome do cliente"><datalist id="dlCli">${[...new Set(Store.all('atividades').map(x => x.cliente).filter(Boolean))].sort().map(c => `<option value="${U.esc(c)}">`).join('')}</datalist></label>
            <datalist id="dlTipo">${M.tiposSugestoes().map(t => `<option value="${U.esc(t)}">`).join('')}</datalist>
            <div class="negs-h"><span>Negócios deste card</span><small>Uma reunião pode tratar de vários: cada um tem valor e % próprios.</small></div>
            <div class="negs" id="negs"></div>
            <div class="tipo-chips"><span class="tc-l">Adicionar:</span>${tiposChips.map(t => `<button type="button" class="qd" data-tipo="${U.esc(t)}">+ ${U.esc(t)}</button>`).join('')}<button type="button" class="qd" data-tipo="">+ Outro</button></div>
            <div class="negs-tot" id="negsTot"></div>
          </div>
        </div>
        <details class="more" ${a ? 'open' : ''}><summary>Mais detalhes</summary>
          <div class="more-b">
            <label class="f full"><span>Descrição</span><textarea name="descricao" rows="2">${U.esc(v.descricao || '')}</textarea></label>
            <div class="row2">
              <label class="f"><span>Categoria ou projeto</span><input name="categoria" list="dlCat" value="${U.esc(v.categoria || '')}" placeholder="Ex.: Campanha de indicações 2027"><datalist id="dlCat">${categorias().map(c => `<option value="${U.esc(c)}">`).join('')}</datalist></label>
              <label class="f"><span>Data de início</span><input type="date" name="inicio" value="${v.inicio || ''}"></label>
            </div>
            <div class="row2" id="resGen">
              <label class="f"><span>Resultado esperado</span><input name="resultadoEsperado" data-num inputmode="decimal" value="${sel.size ? '' : numTxt(v.resultadoEsperado)}" placeholder="Ex.: 3"></label>
              <label class="f"><span>Resultado alcançado</span><input name="resultado" data-num inputmode="decimal" value="${sel.size ? '' : numTxt(v.resultado)}" placeholder="Número"></label>
            </div>
            <label class="f full"><span>Resultado em texto</span><input name="resultadoTexto" value="${U.esc(v.resultadoTexto || '')}" placeholder="Ex.: 3 indicações, 1 reunião marcada"></label>
            <label class="f full"><span>Observações</span><textarea name="observacoes" rows="3">${U.esc(v.observacoes || '')}</textarea></label>
          </div>
        </details>
        <p class="ferr" id="errAt" hidden></p>
      </form>`,
      footer: `<span class="kbd-hint">Enter salva</span><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fAt" type="submit">${a ? 'Salvar alterações' : 'Criar atividade'}</button>`,
      onMount(el, api) {
        const form = el.querySelector('#fAt');
        const marcar = () => el.querySelectorAll('.qd[data-d]').forEach(b => b.classList.toggle('on', b.dataset.d === form.prazo.value));
        el.querySelectorAll('.qd[data-d]').forEach(b => b.onclick = () => { form.prazo.value = b.dataset.d; marcar(); });
        form.prazo.oninput = marcar; marcar();

        /* Metas */
        const guardar = () => { el.querySelectorAll('[data-esp]').forEach(i => { esp[i.dataset.esp] = U.parseNum(i.value); }); el.querySelectorAll('[data-res]').forEach(i => { res[i.dataset.res] = U.parseNum(i.value); }); };
        const desenharMetas = () => {
          guardar();
          const { da, outras } = metasEscolha(form.responsabilidadeId.value, sel);
          const box = el.querySelector('#mpicks');
          box.innerHTML = (da.length || outras.length)
            ? da.map(x => chipMeta(x, sel.has(x.id))).join('') + (outras.length ? `<span class="mp-sep">Outras responsabilidades</span>` + outras.map(x => chipMeta(x, sel.has(x.id))).join('') : '')
            : `<span class="muted small">Nenhuma meta cadastrada ainda. Crie em Metas.</span>`;
          box.querySelectorAll('[data-mid]').forEach(b => b.onclick = () => { const k = b.dataset.mid; sel.has(k) ? sel.delete(k) : sel.add(k); desenharMetas(); });
          const ms = [...sel].map(i => Store.get('metas', i)).filter(Boolean);
          el.querySelector('#mres').innerHTML = ms.length ? `<div class="mres-h"><span></span><span>Esperado</span><span>Alcançado</span></div>` + ms.map(x => `<div class="mres-r"><span class="mres-n"><i style="background:${M.respCor(x.responsabilidadeId)}"></i>${U.esc(x.nome)}<small>${U.esc(x.unidade || '')}</small></span>
            <input data-esp="${x.id}" data-num inputmode="decimal" value="${numTxt(esp[x.id])}" placeholder="Esperado" aria-label="Esperado em ${U.esc(x.nome)}">
            <input data-res="${x.id}" data-num inputmode="decimal" value="${numTxt(res[x.id])}" placeholder="Alcançado" aria-label="Alcançado em ${U.esc(x.nome)}"></div>`).join('') : '';
          el.querySelector('#resGen').hidden = ms.length > 0;
        };
        form.responsabilidadeId.onchange = desenharMetas;
        desenharMetas();

        /* Negócios (vários por card) */
        const chk = el.querySelector('#chkNeg'), box = el.querySelector('#negs');
        const linhaNeg = n => {
          const r = document.createElement('div'); r.className = 'neg-r'; r.dataset.nid = n.id || M.novoNegId(); r.dataset.res = n.resultado || '';
          r.innerHTML = `<label class="f"><span>Tipo de negócio</span><input class="nt" list="dlTipo" maxlength="60" value="${U.esc(n.tipo ? M.tipoNeg(n.tipo).label : '')}" placeholder="Digite ou escolha" autocomplete="off"></label>
            <label class="f"><span>Valor estimado</span><input class="nv" data-num inputmode="decimal" value="${numTxt(n.valor)}" placeholder="R$"></label>
            <label class="f"><span>% que fica</span><input class="np" data-num inputmode="decimal" value="${numTxt(n.pct)}" placeholder="Ex.: 30"></label>
            <div class="f"><span>Fica com você</span><div class="liq-est">—</div></div>
            <button type="button" class="icon-btn nx" title="Tirar este negócio" aria-label="Tirar este negócio">${UI.icon('x')}</button>`;
          r.querySelector('.nx').onclick = () => { r.remove(); if (!box.children.length) linhaNeg({}); calcNeg(); };
          r.addEventListener('input', calcNeg);
          box.appendChild(r); return r;
        };
        const calcNeg = () => {
          let tot = 0, totV = 0, n = 0;
          box.querySelectorAll('.neg-r').forEach(r => {
            const pad = M.pctPadrao(M.tipoSalvar(r.querySelector('.nt').value));
            r.querySelector('.np').placeholder = pad != null ? 'Padrão ' + U.num(pad) : 'Ex.: 30';
            const val = U.parseNum(r.querySelector('.nv').value), pct = U.parseNum(r.querySelector('.np').value) ?? pad;
            r.querySelector('.liq-est').innerHTML = val != null && pct != null ? `<b>${U.brlC(val * pct / 100)}</b><small>${U.num(pct)}% de ${U.brl(val)}</small>` : '<span class="muted">valor e %</span>';
            if (val != null) { totV += val; n++; } if (val != null && pct != null) tot += val * pct / 100;
          });
          const linhas = box.querySelectorAll('.neg-r').length;
          el.querySelector('#negsTot').innerHTML = linhas > 1 && n ? `<span>${linhas} negócios</span><b>${U.brl(totV)}</b>${tot ? `<span>· fica com você ≈ ${U.brlC(tot)}</span>` : ''}` : '';
          el.querySelectorAll('[data-tipo]').forEach(b => b.classList.toggle('on', !!b.dataset.tipo && [...box.querySelectorAll('.nt')].some(i => M.norm(i.value) === M.norm(b.dataset.tipo))));
        };
        (negs0.length ? negs0 : [{}]).forEach(linhaNeg); calcNeg();
        el.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => {
          const t = b.dataset.tipo, vazia = [...box.querySelectorAll('.nt')].find(i => !i.value.trim());
          const inp = vazia || linhaNeg({}).querySelector('.nt');
          if (t) { inp.value = t; inp.closest('.neg-r').querySelector('.nv').focus(); } else inp.focus();
          calcNeg();
        });
        chk.onchange = () => { el.querySelector('.neg-fields').hidden = !chk.checked; el.querySelector('.negbox').classList.toggle('on', chk.checked); if (chk.checked) (box.querySelector('.nt').value ? form.cliente : box.querySelector('.nt')).focus(); };

        form.onsubmit = e => {
          e.preventDefault();
          const d = UI.formData(form), er = el.querySelector('#errAt');
          const erro = (msg, campo) => { er.textContent = msg; er.hidden = false; if (campo) campo.focus(); };
          if (!d.titulo) return erro('Escreva um título para a atividade.', form.titulo);
          if (chk.checked) {
            const negs = [];
            for (const r of box.querySelectorAll('.neg-r')) {
              const tipo = M.tipoSalvar(r.querySelector('.nt').value), valor = U.parseNum(r.querySelector('.nv').value), pct = U.parseNum(r.querySelector('.np').value);
              if (!tipo) { if (valor != null || pct != null) return erro('Escreva o tipo de cada negócio (ex.: Zentis, Seguro de vida).', r.querySelector('.nt')); continue; }
              if (pct != null && (pct < 0 || pct > 100)) return erro('O % que fica com você precisa estar entre 0 e 100.', r.querySelector('.np'));
              negs.push({ id: r.dataset.nid, tipo, valor, pct, resultado: r.dataset.res || null });
            }
            if (!negs.length) return erro('Escreva o tipo de negócio (ex.: Zentis, Seguro de vida, Consórcio).', box.querySelector('.nt'));
            Object.assign(d, M.espelhoNeg(negs));
          } else { Object.assign(d, M.espelhoNeg([])); d.negocios = []; d.cliente = null; }
          guardar();
          const ids = [...sel].filter(i => Store.get('metas', i));
          d.metaIds = ids;
          d.esperados = {}; d.resultados = {};
          ids.forEach(i => { if (esp[i] != null) d.esperados[i] = esp[i]; if (res[i] != null) d.resultados[i] = res[i]; });
          if (ids.length) Object.assign(d, M.espelho(ids, d.resultados, d.esperados));
          else d.metaId = null;
          if (!a && v.origemId) d.origemId = v.origemId;
          if (a) { M.editarAtividade(a.id, d); UI.toast('Atividade atualizada'); }
          else { const nova = M.criarAtividade(d); if (v._emailId && Store.get('emails', v._emailId)) Store.update('emails', v._emailId, { atividadeId: nova.id }); UI.toast('Atividade criada'); }
          api.close();
        };
        form.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !['TEXTAREA', 'SUMMARY', 'SELECT'].includes(e.target.tagName) && !(e.target.list && e.target.value === '')) { e.preventDefault(); form.requestSubmit(); } });
      }
    });
    return m;
  };

  /* ---------- Concluir ---------- */
  F.concluir = id => {
    const a = Store.get('atividades', id); if (!a) return;
    if (M.ehNegocio(a)) return F.concluirNegocio(id);
    const metas = M.metasComResultado(a);
    if (!metas.length && a.resultadoEsperado == null) {
      M.concluir(id);
      UI.toast('Atividade concluída', 'ok', [{ label: 'Gerou algo?', fn: () => F.proximos(id) }, { label: 'Desfazer', fn: () => M.reabrir(id) }]);
      return;
    }
    UI.modal({
      title: 'Concluir atividade', size: 'sm',
      body: `<form class="form" id="fCon"><p class="muted" style="margin:0">${U.esc(a.titulo)}</p>
        ${camposResultado(a)}
        ${blocoProximos(a)}
        <label class="f full"><span>Anotação (opcional)</span><input name="nota" value="${U.esc(a.resultadoTexto || '')}" placeholder="Ex.: dois sócios e o irmão"></label></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fCon" type="submit">${UI.icon('check')}Concluir</button>`,
      onMount(el, api) {
        const f = el.querySelector('#fCon');
        montarProximos(el, a);
        f.onsubmit = e => {
          e.preventDefault(); const r = lerResultados(el, f), prox = lerProximos(el);
          M.concluir(id, { ...r, nota: f.nota.value.trim() || null }); api.close();
          if (!avisarProximos(M.criarProximos(id, prox), 'Atividade concluída')) UI.toast('Atividade concluída', 'ok', { label: 'Desfazer', fn: () => M.reabrir(id) });
        };
      }
    });
  };

  /* ---------- Adiar ---------- */
  F.adiar = id => {
    const a = Store.get('atividades', id); if (!a) return;
    const base = a.prazo && a.prazo > U.today() ? a.prazo : U.today();
    const op = [['+1 dia', U.addDays(base, 1)], ['+3 dias', U.addDays(base, 3)], ['+1 semana', U.addDays(base, 7)], ['Próx. segunda', U.nextWeekday(1)]];
    UI.modal({
      title: 'Adiar atividade', size: 'sm',
      body: `<form class="form" id="fAd"><p class="muted" style="margin:0">${U.esc(a.titulo)} · prazo atual: <b>${a.prazo ? U.fmtDate(a.prazo) : 'sem prazo'}</b></p>
        <div class="quick-dates">${op.map(([l, d]) => `<button type="button" class="qd" data-d="${d}">${l}<small>${U.fmtDate(d)}</small></button>`).join('')}</div>
        <label class="f full"><span>Novo prazo</span><input type="date" name="prazo" value="${op[0][1]}" required></label>
        <label class="f full"><span>Motivo (opcional)</span><input name="motivo" placeholder="Fica no histórico da atividade"></label></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fAd" type="submit">Adiar</button>`,
      onMount(el, api) {
        const f = el.querySelector('#fAd');
        const marcar = () => el.querySelectorAll('.qd').forEach(b => b.classList.toggle('on', b.dataset.d === f.prazo.value));
        el.querySelectorAll('.qd').forEach(b => b.onclick = () => { f.prazo.value = b.dataset.d; marcar(); }); f.prazo.oninput = marcar; marcar();
        f.onsubmit = e => { e.preventDefault(); const d = UI.formData(f); if (!d.prazo) return; M.adiar(id, d.prazo, d.motivo); api.close(); UI.toast('Adiada para ' + U.fmtDate(d.prazo)); };
      }
    });
  };

  F.excluirAtividade = async id => {
    const a = Store.get('atividades', id); if (!a) return false;
    const ok = await UI.confirm({ title: 'Excluir atividade?', text: `"${U.esc(a.titulo)}" e o histórico dela serão apagados. Isso não pode ser desfeito.`, ok: 'Excluir' });
    if (ok) { M.excluirAtividade(id); UI.toast('Atividade excluída'); }
    return ok;
  };

  /* ---------- Detalhes + histórico ---------- */
  F.detalhes = id => {
    const a = Store.get('atividades', id); if (!a) return;
    const metas = M.metasComResultado(a);
    const lin = (k, v) => v ? `<div class="kv"><span>${k}</span><div>${v}</div></div>` : '';
    const hist = M.historico(id);
    const m = UI.modal({
      title: a.titulo, size: 'md',
      body: `<div class="det-chips">${UI.respChip(a.responsabilidadeId)}${UI.statusPill(a.status)}${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
        <div class="kvs">
          ${lin('Descrição', U.esc(a.descricao))}
          ${lin('Categoria', U.esc(a.categoria))}
          ${lin('Prazo', a.prazo ? U.fmtDateLong(a.prazo) : 'Sem prazo')}
          ${lin('Início', a.inicio ? U.fmtDateLong(a.inicio) : '')}
          ${lin('Cliente', M.ehNegocio(a) && a.cliente ? U.esc(a.cliente) : '')}
          ${lin(M.negociosDa(a).length > 1 ? 'Negócios' : 'Negócio', M.negociosDa(a).map(n => { const lq = M.liqNeg(n);
            return `<div class="dneg"><b>${U.esc(M.tipoNeg(n.tipo).label)}</b>${n.valor != null ? ' · ' + U.brl(n.valor) : ''}${lq != null ? ` <span class="muted">· fica ${U.brlC(lq)} (${U.num(M.pctNeg(n))}%)</span>` : ''}${n.resultado ? ` <span class="tag ${n.resultado === 'ganho' ? 't-ok' : 't-erro'}">${n.resultado === 'ganho' ? 'Fechado' : 'Não fechou'}</span>` : ''}</div>`; }).join(''))}
          ${lin(metas.length > 1 ? 'Metas' : 'Meta', metas.map(m => { const r = M.resMeta(a, m.id), e = M.espMeta(a, m.id); return `<div class="dmeta"><i style="background:${M.respCor(m.responsabilidadeId)}"></i>${U.esc(m.nome)} <b>${r != null ? U.esc(M.fmtMeta(r, m, true)) : '—'}</b>${e != null ? ' de ' + U.esc(M.fmtMeta(e, m)) : (M.ehDinheiro(m) ? '' : ' ' + U.esc(m.unidade || ''))}</div>`; }).join(''))}
          ${lin('Fica com você', M.negociosDa(a).length > 1 && M.liquidoEstimado(a) != null ? `<b>${U.brlC(M.liquidoEstimado(a))}</b> <span class="muted">somando os negócios</span>` : '')}
          ${lin('Resultado', !metas.length && (a.resultado != null || a.resultadoEsperado != null) ? `<b>${a.resultado != null ? U.num(a.resultado) : '—'}</b>${a.resultadoEsperado != null ? ' de ' + U.num(a.resultadoEsperado) + ' esperado(s)' : ''}${a.resultadoTexto ? '<br><span class="muted">' + U.esc(a.resultadoTexto) + '</span>' : ''}` : (a.resultadoTexto ? U.esc(a.resultadoTexto) : ''))}
          ${lin('Veio de', M.origem(a) ? `<a href="#" class="dlink" data-open="${M.origem(a).id}">${UI.icon('seta')}${U.esc(M.origem(a).titulo)}</a>` : '')}
          ${lin('Gerou', M.filhos(a.id).map(x => `<a href="#" class="dlink" data-open="${x.id}">${U.esc(x.titulo)} ${UI.statusPill(x.status)}${x.prazo && x.status !== 'concluida' ? ' <small class="muted">' + U.fmtDate(x.prazo) + '</small>' : ''}</a>`).join(''))}
          ${lin('Observações', U.esc(a.observacoes))}
          ${lin('Criada em', U.fmtDateTime(a.criadoEm))}
          ${lin('Concluída em', a.concluidaEm ? U.fmtDateTime(a.concluidaEm) : '')}
          ${lin('Adiamentos', a.adiamentos ? String(a.adiamentos) : '')}
        </div>
        <h3 class="sub-h">${UI.icon('historico')}Histórico</h3>
        <ol class="timeline">${hist.length ? hist.map(h => `<li class="t-${h.tipo}"><b>${U.esc(h.descricao)}</b><small>${U.fmtDateTime(h.em)}</small></li>`).join('') : '<li><small>Sem registros.</small></li>'}</ol>`,
      footer: `<button class="btn ghost danger-text" data-a="del">${UI.icon('lixo')}Excluir</button><span class="grow"></span>
        ${a.status !== 'concluida' ? `<button class="btn ghost" data-a="adiar">${UI.icon('adiar')}Adiar</button>` : ''}
        <button class="btn ghost" data-a="prox" title="Criar atividades geradas por esta">${UI.icon('mais')}Próximo passo</button>
        <button class="btn ghost" data-a="edit">${UI.icon('editar')}Editar</button>
        ${a.status !== 'concluida' ? `<button class="btn primary" data-a="ok">${UI.icon('check')}Concluir</button>` : `<button class="btn ghost" data-a="reabrir">Reabrir</button>`}`,
      onMount(el, api) {
        el.querySelectorAll('[data-open]').forEach(l => l.onclick = e => { e.preventDefault(); api.close(); F.detalhes(l.dataset.open); });
        el.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
          const act = b.dataset.a;
          if (act === 'del') { if (await F.excluirAtividade(id)) api.close(); return; }
          api.close();
          if (act === 'edit') F.atividade(id);
          if (act === 'prox') F.proximos(id);
          if (act === 'adiar') F.adiar(id);
          if (act === 'ok') F.concluir(id);
          if (act === 'reabrir') { M.reabrir(id); UI.toast('Atividade reaberta'); }
        });
      }
    });
    return m;
  };

  /* ---------- Responsabilidade ---------- */
  F.resp = id => {
    const r = id ? Store.get('responsabilidades', id) : null;
    const v = r || { cor: M.CORES[Store.all('responsabilidades').length % M.CORES.length] };
    UI.modal({
      title: r ? 'Editar responsabilidade' : 'Nova responsabilidade', size: 'sm',
      body: `<form class="form" id="fRe">
        <label class="f full"><span>Nome</span><input name="nome" required maxlength="60" value="${U.esc(v.nome || '')}" autofocus placeholder="Ex.: Assessoria de Investimentos"></label>
        <label class="f full"><span>Descrição</span><textarea name="descricao" rows="2">${U.esc(v.descricao || '')}</textarea></label>
        <div class="f full"><span>Cor de identificação</span><div class="colors">${M.CORES.map(c => `<label class="cpick"><input type="radio" name="cor" value="${c}"${c === v.cor ? ' checked' : ''}><i style="background:${c}"></i></label>`).join('')}</div></div>
        <p class="ferr" id="errRe" hidden></p></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fRe" type="submit">${r ? 'Salvar' : 'Criar responsabilidade'}</button>`,
      onMount(el, api) {
        el.querySelector('#fRe').onsubmit = e => {
          e.preventDefault(); const d = UI.formData(e.target);
          if (!d.nome) { const er = el.querySelector('#errRe'); er.textContent = 'Dê um nome à responsabilidade.'; er.hidden = false; return; }
          if (r) Store.update('responsabilidades', r.id, d); else Store.insert('responsabilidades', { ...d, status: 'ativa' });
          api.close(); UI.toast(r ? 'Responsabilidade atualizada' : 'Responsabilidade criada');
        };
      }
    });
  };

  /* ---------- Meta ---------- */
  F.meta = id => {
    const mt = id ? Store.get('metas', id) : null;
    const t = U.today(), d0 = new Date();
    const v = mt || { periodicidade: 'mensal', modo: 'manual', inicio: U.iso(new Date(d0.getFullYear(), d0.getMonth(), 1)), fim: U.iso(new Date(d0.getFullYear(), d0.getMonth() + 1, 0)), responsabilidadeId: (M.respAtivas()[0] || {}).id, atual: 0 };
    UI.modal({
      title: mt ? 'Editar meta' : 'Nova meta', size: 'md',
      body: `<form class="form" id="fMe">
        <label class="f full"><span>Nome da meta</span><input name="nome" required maxlength="100" value="${U.esc(v.nome || '')}" autofocus placeholder="Ex.: Conseguir 30 indicações"></label>
        <div class="row2">
          <label class="f"><span>Responsabilidade</span><select name="responsabilidadeId">${UI.respOptions(v.responsabilidadeId)}</select></label>
          <label class="f"><span>Periodicidade</span><select name="periodicidade" id="selPer">${UI.options(M.PERIODICIDADES, v.periodicidade)}</select></label>
        </div>
        <div class="row3">
          <label class="f"><span>Quantidade desejada</span><input name="alvo" data-num inputmode="decimal" required value="${v.alvo ?? ''}" placeholder="30"></label>
          <label class="f"><span>Unidade de medida</span><input name="unidade" value="${U.esc(v.unidade || '')}" placeholder="indicações"></label>
          <label class="f" id="boxAtual"><span>Resultado atual</span><input name="atual" data-num inputmode="decimal" value="${v.atual ?? 0}"></label>
        </div>
        <div class="row2">
          <label class="f"><span>Data inicial</span><input type="date" name="inicio" value="${v.inicio || ''}"></label>
          <label class="f"><span>Data final</span><input type="date" name="fim" value="${v.fim || ''}"></label>
        </div>
        <div class="f full"><span>Como o resultado é atualizado</span>${UI.segmented('modo', [{ id: 'manual', label: 'Eu atualizo manualmente' }, { id: 'atividades', label: 'Soma dos resultados das atividades' }], v.modo)}</div>
        <p class="note" id="modoNote"></p>
        <label class="f full"><span>Descrição</span><textarea name="descricao" rows="2">${U.esc(v.descricao || '')}</textarea></label>
        <p class="ferr" id="errMe" hidden></p></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fMe" type="submit">${mt ? 'Salvar' : 'Criar meta'}</button>`,
      onMount(el, api) {
        const f = el.querySelector('#fMe');
        const modo = () => { const at = f.querySelector('[name=modo]:checked').value === 'atividades'; el.querySelector('#boxAtual').hidden = at;
          el.querySelector('#modoNote').textContent = at ? 'Cada atividade ligada a esta meta pede o resultado ao ser concluída, e a meta soma tudo automaticamente.' : 'Você registra o resultado atual sempre que quiser, e cada registro fica na evolução da meta.'; };
        f.querySelectorAll('[name=modo]').forEach(r => r.onchange = modo); modo();
        el.querySelector('#selPer').onchange = e => {
          const n = new Date(), p = e.target.value; let a, b;
          if (p === 'semanal') { const s = new Date(n); s.setDate(n.getDate() - ((n.getDay() + 6) % 7)); a = U.iso(s); b = U.addDays(a, 6); }
          if (p === 'mensal') { a = U.iso(new Date(n.getFullYear(), n.getMonth(), 1)); b = U.iso(new Date(n.getFullYear(), n.getMonth() + 1, 0)); }
          if (p === 'trimestral') { const q = Math.floor(n.getMonth() / 3) * 3; a = U.iso(new Date(n.getFullYear(), q, 1)); b = U.iso(new Date(n.getFullYear(), q + 3, 0)); }
          if (p === 'anual') { a = n.getFullYear() + '-01-01'; b = n.getFullYear() + '-12-31'; }
          f.inicio.value = a; f.fim.value = b;
        };
        f.onsubmit = e => {
          e.preventDefault(); const d = UI.formData(f); const er = el.querySelector('#errMe');
          if (!d.nome) { er.textContent = 'Dê um nome à meta.'; er.hidden = false; return; }
          if (!(d.alvo > 0)) { er.textContent = 'Informe a quantidade desejada (maior que zero).'; er.hidden = false; return; }
          if (d.inicio && d.fim && d.fim < d.inicio) { er.textContent = 'A data final precisa ser depois da inicial.'; er.hidden = false; return; }
          d.atual = d.atual || 0;
          if (mt) { const mudou = d.modo === 'manual' && d.atual !== mt.atual; Store.update('metas', mt.id, d); if (mudou) M.registrarMeta(mt.id, d.atual, 'Ajuste na edição'); }
          else { const n = Store.insert('metas', d); if (d.modo === 'manual') M.registrarMeta(n.id, d.atual, 'Início'); }
          api.close(); UI.toast(mt ? 'Meta atualizada' : 'Meta criada');
        };
      }
    });
  };

  /* Atualizar resultado de meta manual, com evolução */
  F.atualizarMeta = id => {
    const mt = Store.get('metas', id); if (!mt) return;
    const regs = M.metaRegistros(id);
    UI.modal({
      title: 'Atualizar resultado', size: 'sm',
      body: `<form class="form" id="fUp"><p class="muted" style="margin:0">${U.esc(mt.nome)} · meta: <b>${U.num(mt.alvo)} ${U.esc(mt.unidade || '')}</b></p>
        <div class="stepper"><button type="button" class="btn ghost" data-s="-1">−1</button><input name="valor" data-num inputmode="decimal" value="${mt.atual || 0}" autofocus><button type="button" class="btn ghost" data-s="1">+1</button><button type="button" class="btn ghost" data-s="5">+5</button></div>
        <label class="f full"><span>Anotação (opcional)</span><input name="nota" placeholder="Ex.: 2 indicações na reunião com a Lidy"></label>
        ${regs.length ? `<h3 class="sub-h">Evolução</h3>${App.Charts.spark(regs.map(r => r.valor), mt.alvo)}<ol class="timeline compact">${regs.slice().reverse().slice(0, 6).map(r => `<li><b>${U.num(r.valor)} ${U.esc(mt.unidade || '')}</b>${r.nota ? ' · ' + U.esc(r.nota) : ''}<small>${U.fmtDateTime(r.em)}</small></li>`).join('')}</ol>` : ''}</form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fUp" type="submit">Registrar</button>`,
      onMount(el, api) {
        const f = el.querySelector('#fUp');
        el.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { f.valor.value = Math.max(0, (U.parseNum(f.valor.value) || 0) + +b.dataset.s); });
        f.onsubmit = e => { e.preventDefault(); const d = UI.formData(f); if (d.valor == null) return; M.registrarMeta(id, d.valor, d.nota); api.close(); UI.toast('Resultado registrado'); };
      }
    });
  };

  /* ---------- Concluir negócio(s): cada negócio fecha ou não, com valor, % e lançamento no faturamento ---------- */
  F.concluirNegocio = id => {
    const a = Store.get('atividades', id); if (!a) return;
    const negs = M.negociosDa(a).map(n => ({ ...n }));
    const info = negs.map(n => { const prod = M.produtoDoTipo(n.tipo); return { n, prod, pad: prod && prod.pctComigo != null ? +prod.pctComigo : null }; });
    const varios = negs.length > 1;
    const bloco = ({ n, prod, pad }, i) => {
      const pct0 = n.pct != null ? +n.pct : pad;
      return `<div class="cneg" data-i="${i}">
        <div class="cneg-h"><b>${UI.icon('negocio')}${U.esc(M.tipoNeg(n.tipo).label)}</b>${UI.segmented('res' + i, [{ id: 'ganho', label: 'Fechou' }, { id: 'perdido', label: 'Não fechou' }], n.resultado || 'ganho')}</div>
        <div class="cneg-b">
          <div class="row2">
            <label class="f"><span>Valor do negócio</span><input data-v="${i}" data-num inputmode="decimal" value="${n.valor != null ? U.num(n.valor) : ''}" placeholder="R$"${i === 0 ? ' autofocus' : ''}></label>
            <label class="f"><span>% que fica com você</span><input data-p="${i}" data-num inputmode="decimal" value="${pct0 != null ? U.num(pct0) : ''}" placeholder="Ex.: 30"></label>
          </div>
          <div class="liq-box" data-l="${i}"></div>
          ${prod && prod.id !== 'p_outros' ? `<label class="chk" data-padbox="${i}" hidden><input type="checkbox" data-pad="${i}"><span></span></label>` : ''}
          <label class="chk"><input type="checkbox" data-lanc="${i}" checked><span>Lançar no faturamento${prod ? ' como <b>' + U.esc(prod.nome) + '</b>' : ''}</span></label>
        </div></div>`;
    };
    UI.modal({
      title: varios ? 'Concluir negócios' : 'Concluir negócio', size: 'sm',
      body: `<form class="form" id="fCn"><p class="muted" style="margin:0">${U.esc(a.titulo)}${a.cliente ? ' · ' + U.esc(a.cliente) : ''}</p>
        ${varios ? '<p class="note" style="margin:0">Marque o que fechou e o que não fechou. Cada negócio fechado vai para o faturamento com o produto dele.</p>' : ''}
        <div class="cnegs">${info.map(bloco).join('')}</div>
        ${camposResultado(a)}
        ${blocoProximos(a)}
        <label class="f full"><span>Anotação (opcional)</span><input name="nota" placeholder="Ex.: Zentis fechou, seguro ficou para janeiro"></label></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fCn" type="submit">${UI.icon('check')}Concluir</button>`,
      onMount(el, api) {
        const f = el.querySelector('#fCn');
        const calc = i => {
          const { prod, pad } = info[i];
          const val = U.parseNum(el.querySelector(`[data-v="${i}"]`).value), pct = U.parseNum(el.querySelector(`[data-p="${i}"]`).value);
          const ganho = el.querySelector(`[name="res${i}"]:checked`).value === 'ganho';
          const com = prod && prod.comissaoPct != null ? +prod.comissaoPct : null;
          const base = val != null ? (com != null ? val * com / 100 : val) : null;
          el.querySelector(`.cneg[data-i="${i}"] .cneg-b`).hidden = !ganho;
          el.querySelector(`.cneg[data-i="${i}"]`).classList.toggle('perdido', !ganho);
          el.querySelector(`[data-l="${i}"]`).innerHTML = base != null && pct != null
            ? `<span>Fica com você</span><b>${U.brlC(base * pct / 100)}</b><small>${com != null ? `${U.brl(val)} × ${U.num(com)}% de comissão = ${U.brlC(base)} bruto, × ${U.num(pct)}%` : `${U.brlC(base)} × ${U.num(pct)}%`}</small>`
            : `<span>Fica com você</span><small>Informe o valor e o % para ver quanto fica com você.</small>`;
          const pb = el.querySelector(`[data-padbox="${i}"]`);
          if (pb) { pb.hidden = !(pct != null && pct !== pad); pb.querySelector('span').textContent = `Usar ${U.num(pct ?? 0)}% como padrão para "${prod.nome}"`; }
          return { val, pct, base, ganho };
        };
        const tudo = () => info.forEach((_, i) => calc(i));
        f.addEventListener('input', tudo); f.addEventListener('change', tudo); tudo();
        montarProximos(el, a);
        f.onsubmit = e => {
          e.preventDefault();
          const vals = info.map((_, i) => calc(i));
          const ruim = vals.findIndex(v => v.ganho && v.pct != null && (v.pct < 0 || v.pct > 100));
          if (ruim >= 0) { UI.toast('O % precisa estar entre 0 e 100.', 'aviso'); el.querySelector(`[data-p="${ruim}"]`).focus(); return; }
          const r = lerResultados(el, f), prox = lerProximos(el), nota = f.nota.value.trim();
          const fila = [], partes = [];
          const novos = negs.map((n, i) => {
            const v = vals[i], { prod } = info[i];
            const nn = { ...n, resultado: v.ganho ? 'ganho' : 'perdido', valor: v.ganho && v.val != null ? v.val : n.valor ?? null, pct: v.ganho && v.pct != null ? v.pct : n.pct ?? null };
            const lab = M.tipoNeg(n.tipo).label;
            if (v.ganho) {
              partes.push(lab + ': fechado' + (v.base != null && v.pct != null ? ' (fica ' + U.brlC(v.base * v.pct / 100) + ')' : ''));
              const pd = el.querySelector(`[data-pad="${i}"]`);
              if (prod && pd && pd.checked && v.pct != null) Store.update('produtos', prod.id, { pctComigo: v.pct }, { silent: true });
              if (el.querySelector(`[data-lanc="${i}"]`).checked) fila.push({ cliente: a.cliente || null, valor: v.val, bruto: prod && prod.comissaoPct != null ? undefined : v.val, pctComigo: v.pct, produtoId: prod ? prod.id : 'p_outros', linhaId: prod ? prod.linhaId : undefined, atividadeId: a.id, observacoes: a.titulo + (varios ? ' · ' + lab : '') });
            } else partes.push(lab + ': não fechou');
            return nn;
          });
          Store.update('atividades', id, M.espelhoNeg(novos), { silent: true });
          M.concluir(id, { ...r, nota: (varios ? partes.join(' · ') : (novos[0].resultado === 'ganho' ? 'Negócio fechado' + (vals[0].base != null && vals[0].pct != null ? ' · fica com você ' + U.brlC(vals[0].base * vals[0].pct / 100) : '') : 'Negócio não fechou')) + (nota ? ' · ' + nota : '') });
          const criados = M.criarProximos(id, prox);
          api.close();
          const fechou = novos.some(n => n.resultado === 'ganho');
          const msg = varios ? `${novos.filter(n => n.resultado === 'ganho').length} de ${novos.length} negócios fechados` : (fechou ? 'Negócio fechado' : 'Negócio encerrado');
          if (fila.length) {
            const abrir = k => { if (k >= fila.length) { avisarProximos(criados, msg); return; } F.producao(null, fila[k], { etapa: fila.length > 1 ? (k + 1) + ' de ' + fila.length : '', aoFechar: () => setTimeout(() => abrir(k + 1), 80) }); };
            setTimeout(() => abrir(0), 60);
            return;
          }
          if (avisarProximos(criados, msg)) return;
          UI.toast(msg, 'ok', { label: 'Desfazer', fn: () => { M.reabrir(id); Store.update('atividades', id, M.espelhoNeg(negs)); } });
        };
      }
    });
  };

  App.Forms = F;
})(window.App = window.App || {});

</script>
<script>
/* js/ui/forms-fat.js */
/* Formulários do faturamento: produção, linha, produto, recorrência, histórico e avulso. */
(function (App) {
  const { U, M, UI, Store, Fat } = App;
  const F = App.Forms;

  const linhaOpts = sel => UI.options(Fat.linhas(true).map(l => ({ id: l.id, label: l.nome })), sel);
  const produtoOpts = (linhaId, sel) => UI.options(Fat.produtos(linhaId).map(p => ({ id: p.id, label: p.nome })), sel);
  const clientes = () => [...new Set([...Store.all('producoes').map(x => x.cliente), ...Store.all('atividades').map(x => x.cliente)].filter(Boolean))].sort();
  const num = v => v == null || v === '' ? '' : U.num(v);

  /* ---------- Lançar produção (cliente a cliente) ---------- */
  F.producao = (id, preset = {}, opts = {}) => {
    const p = id ? Store.get('producoes', id) : null;
    const prod0 = Fat.produto(preset.produtoId || (p && p.produtoId)) || Fat.produtos()[0] || {};
    const v = p || { data: U.today(), linhaId: prod0.linhaId, produtoId: prod0.id, regra: prod0.regra || 'mes_seguinte', parcelas: prod0.parcelas || 12, grupo: prod0.grupo || 'novo', comissaoPct: prod0.comissaoPct ?? null, pctComigo: prod0.pctComigo ?? null, ...preset };
    if (!Fat.linhas().length) { UI.toast('Cadastre uma linha de negócio primeiro.', 'aviso'); return; }
    const jaRec = p ? Fat.recebidosDaProducao(p.id) : 0;
    UI.modal({
      title: p ? 'Editar produção' : 'Lançar produção' + (opts.etapa ? ' · ' + opts.etapa : ''), size: 'md', onClose: opts.aoFechar,
      body: `<form class="form" id="fPr">
        <div class="row3">
