            <div class="sched-l">${ds.slice(0, 13).map((dt, i) => `<span><small>${U.fmtDate(dt)}</small>${U.brlC(vv.liq[i])}</span>`).join('')}${ds.length > 13 ? `<span><small>+${ds.length - 13}</small>…</span>` : ''}</div>
            <div class="small muted">Total líquido: <b class="ink">${U.brlC(tot)}</b>${ds.length > 1 ? ` em ${ds.length} parcelas, de ${Fat.nomeMes(Fat.ym(ds[0]))} a ${Fat.nomeMes(Fat.ym(ds[ds.length - 1]))}` : ''}</div>`;
        };
        el.querySelector('#prLinha').onchange = e => { el.querySelector('#prProd').innerHTML = produtoOpts(e.target.value); aplicarProduto(); };
        const aplicarProduto = () => {
          const pr = Fat.produto(el.querySelector('#prProd').value); if (!pr) return atualizar();
          const rr = f.querySelector(`[name=regra][value="${pr.regra || 'mes_seguinte'}"]`); if (rr) rr.checked = true;
          if (pr.comissaoPct != null) f.comissaoPct.value = num(pr.comissaoPct);
          if (pr.pctComigo != null) f.pctComigo.value = num(pr.pctComigo);
          if (pr.regra === 'parcelado') { f.parcelas.value = pr.parcelas || 12; f.grupo.value = pr.grupo || 'novo'; }
          atualizar();
        };
        el.querySelector('#prProd').onchange = aplicarProduto;
        f.bruto.addEventListener('input', () => { brutoManual = f.bruto.value.trim() !== ''; });
        f.addEventListener('input', atualizar); f.addEventListener('change', atualizar); atualizar();
        f.onsubmit = e => {
          e.preventDefault(); const d = ler(), er = el.querySelector('#errPr'); d.regra = regra();
          if (!d.data) { er.textContent = 'Informe a data da produção.'; er.hidden = false; return; }
          if (!d.produtoId) { er.textContent = 'Escolha o produto.'; er.hidden = false; return; }
          if (d.bruto == null && d.liquido == null && d.liquidoParcela == null) { er.textContent = 'Informe o resultado bruto ou o líquido.'; er.hidden = false; return; }
          if (d.regra !== 'parcelado') { d.liquidoParcela = null; d.liquidoUltima = null; d.parcelas = null; d.grupo = null; } else d.liquido = null;
          if (preset.atividadeId && !p) d.atividadeId = preset.atividadeId;
          Fat.salvarProducao(d, p ? p.id : null); api.close();
          UI.toast(p ? 'Produção atualizada' : 'Produção lançada');
        };
        const del = el.querySelector('[data-del]');
        if (del) del.onclick = async () => {
          if (await UI.confirm({ title: 'Excluir produção?', text: `A produção de <b>${U.esc(p.cliente || 'cliente')}</b> e todas as parcelas dela, inclusive as já marcadas como recebidas, serão apagadas.`, ok: 'Excluir' })) { Fat.excluirProducao(p.id); api.close(); UI.toast('Produção excluída'); }
        };
      }
    });
  };
  /* Atalho antigo: "Lançar negócio" agora lança produção */
  F.faturamento = (id, preset) => F.producao(id, preset);

  /* ---------- Linha de negócio ---------- */
  F.linha = id => {
    const l = id ? Fat.linha(id) : null;
    const v = l || { cor: Fat.CORES[Store.all('linhas').length % Fat.CORES.length] };
    UI.modal({
      title: l ? 'Editar linha de negócio' : 'Nova linha de negócio', size: 'sm',
      body: `<form class="form" id="fLi"><label class="f full"><span>Nome</span><input name="nome" required value="${U.esc(v.nome || '')}" placeholder="Ex.: InvestSmart (XP)" autofocus></label>
        <div class="f full"><span>Cor</span><div class="colors">${Fat.CORES.map(c => `<label class="cpick"><input type="radio" name="cor" value="${c}"${c === v.cor ? ' checked' : ''}><i style="background:${c}"></i></label>`).join('')}</div></div><p class="ferr" id="errLi" hidden></p></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fLi" type="submit">Salvar</button>`,
      onMount(el, api) {
        el.querySelector('#fLi').onsubmit = e => { e.preventDefault(); const d = UI.formData(e.target);
          if (!d.nome) { const er = el.querySelector('#errLi'); er.textContent = 'Dê um nome à linha.'; er.hidden = false; return; }
          if (l) Store.update('linhas', l.id, d); else Store.insert('linhas', { ...d, ativa: true, ordem: 50 }); api.close(); UI.toast('Linha salva'); };
      }
    });
  };

  /* ---------- Produto ---------- */
  F.produto = (id, linhaId) => {
    const p = id ? Fat.produto(id) : null;
    const v = p || { linhaId, regra: 'mes_seguinte', parcelas: 12, grupo: 'novo' };
    UI.modal({
      title: p ? 'Editar produto' : 'Novo produto', size: 'sm',
      body: `<form class="form" id="fPd"><label class="f full"><span>Nome</span><input name="nome" required value="${U.esc(v.nome || '')}" placeholder="Ex.: Renda fixa" autofocus></label>
        <div class="row2"><label class="f"><span>Linha</span><select name="linhaId">${linhaOpts(v.linhaId)}</select></label>
        <label class="f"><span>% comissão padrão</span><input name="comissaoPct" data-num inputmode="decimal" value="${num(v.comissaoPct)}" placeholder="Opcional"></label></div>
        <label class="f full"><span>% que fica com você (padrão)</span><input name="pctComigo" data-num inputmode="decimal" value="${num(v.pctComigo)}" placeholder="Ex.: 30 · usado ao concluir negócios deste produto"></label>
        <div class="f full"><span>Quando recebe (padrão)</span>${UI.segmented('regra', Fat.REGRAS.map(r => ({ id: r.id, label: r.id === 'mes_seguinte' ? 'Mês seguinte' : r.id === 'mesmo_mes' ? 'Mesmo mês' : 'Parcelado' })), v.regra)}</div>
        <div class="row2" id="pdParc"><label class="f"><span>Parcelas</span><input name="parcelas" data-num inputmode="numeric" value="${v.parcelas || 12}"></label><label class="f"><span>Grupo</span><select name="grupo">${UI.options(Fat.GRUPOS, v.grupo || 'novo')}</select></label></div>
        <p class="ferr" id="errPd" hidden></p></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fPd" type="submit">Salvar</button>`,
      onMount(el, api) {
        const f = el.querySelector('#fPd'); const sync = () => { el.querySelector('#pdParc').hidden = f.querySelector('[name=regra]:checked').value !== 'parcelado'; };
        f.querySelectorAll('[name=regra]').forEach(r => r.onchange = sync); sync();
        f.onsubmit = e => { e.preventDefault(); const d = UI.formData(f);
          if (!d.nome) { const er = el.querySelector('#errPd'); er.textContent = 'Dê um nome ao produto.'; er.hidden = false; return; }
          if (p) Store.update('produtos', p.id, d); else Store.insert('produtos', { ...d, ativo: true }); api.close(); UI.toast('Produto salvo'); };
      }
    });
  };

  /* ---------- Recorrência (valor fixo mensal) ---------- */
  F.recorrencia = id => {
    const r = id ? Store.get('recorrencias', id) : null;
    const v = r || { inicio: Fat.ymHoje(), dia: 15, linhaId: (Fat.linhas()[0] || {}).id };
    UI.modal({
      title: r ? 'Editar recorrência' : 'Nova recorrência', size: 'sm',
      body: `<form class="form" id="fRc"><label class="f full"><span>Descrição</span><input name="descricao" required value="${U.esc(v.descricao || '')}" placeholder="Ex.: Mensal Eqseed" autofocus></label>
        <div class="row2"><label class="f"><span>Linha</span><select name="linhaId">${linhaOpts(v.linhaId)}</select></label>
        <label class="f"><span>Valor líquido por mês</span><input name="valor" data-num inputmode="decimal" required value="${num(v.valor)}" placeholder="R$"></label></div>
        <div class="row3"><label class="f"><span>Primeiro mês</span><input type="month" name="inicio" required value="${Fat.ym(v.inicio)}"></label>
        <label class="f"><span>Último mês (opcional)</span><input type="month" name="fim" value="${v.fim ? Fat.ym(v.fim) : ''}"></label>
        <label class="f"><span>Dia que cai</span><input name="dia" data-num inputmode="numeric" value="${v.dia || 15}"></label></div>
        <p class="note">Cada mês aparece como previsto. Ao conferir o recebimento, ele vira um registro com o valor real.</p><p class="ferr" id="errRc" hidden></p></form>`,
      footer: `${r ? `<button class="btn ghost danger-text" data-del>${UI.icon('lixo')}Excluir</button><span class="grow"></span>` : ''}<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fRc" type="submit">Salvar</button>`,
      onMount(el, api) {
        el.querySelector('#fRc').onsubmit = e => { e.preventDefault(); const d = UI.formData(e.target), er = el.querySelector('#errRc');
          if (!d.descricao || d.valor == null || !d.inicio) { er.textContent = 'Preencha descrição, valor e primeiro mês.'; er.hidden = false; return; }
          if (d.fim && d.fim < d.inicio) { er.textContent = 'O último mês precisa ser depois do primeiro.'; er.hidden = false; return; }
          d.dia = Math.min(28, Math.max(1, Math.round(d.dia || 15)));
          if (r) Store.update('recorrencias', r.id, d); else Store.insert('recorrencias', { ...d, ativa: true }); api.close(); UI.toast('Recorrência salva'); };
        const del = el.querySelector('[data-del]');
        if (del) del.onclick = async () => { if (await UI.confirm({ title: 'Excluir recorrência?', text: 'Os meses futuros deixam de aparecer. Os meses já conferidos como recebidos continuam no histórico.', ok: 'Excluir' })) { Store.remove('recorrencias', r.id); api.close(); UI.toast('Recorrência excluída'); } };
      }
    });
  };

  /* ---------- Histórico: quanto recebeu em meses anteriores, por linha ---------- */
  F.historico = (ym) => {
    const mes = ym || Fat.addMes(Fat.ymHoje(), -1);
    const existentes = m => Store.where('recebiveis', r => r.tipo === 'historico' && Fat.ym(r.previstoEm) === m);
    const linhas = Fat.linhas();
    const corpo = m => `<div class="hgrid">${linhas.map(l => { const ex = existentes(m).find(r => r.linhaId === l.id); return `<label class="f"><span><i class="ldot" style="background:${l.cor}"></i>${U.esc(l.nome)}</span><input data-num inputmode="decimal" data-linha="${l.id}" value="${ex ? num(ex.recebido) : ''}" placeholder="R$ 0"></label>`; }).join('')}</div>`;
    UI.modal({
      title: 'Lançar histórico de recebimentos', size: 'md',
      body: `<form class="form" id="fHi"><p class="muted small" style="margin:0">Quanto você recebeu em cada linha num mês que já passou. Serve para completar o ano sem detalhar cliente.</p>
        <label class="f"><span>Mês</span><input type="month" name="mes" value="${mes}" max="${Fat.ymHoje()}"></label>
        <div id="hiCorpo">${corpo(mes)}</div><p class="note">Deixe em branco as linhas sem recebimento. Para corrigir, abra o mesmo mês e altere.</p></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fHi" type="submit">Salvar mês</button>`,
      onMount(el, api) {
        const f = el.querySelector('#fHi');
        f.mes.onchange = () => { el.querySelector('#hiCorpo').innerHTML = corpo(f.mes.value); };
        f.onsubmit = e => {
          e.preventDefault(); const m = f.mes.value; if (!m) return;
          let n = 0;
          f.querySelectorAll('[data-linha]').forEach(inp => {
            const v = U.parseNum(inp.value), lid = inp.dataset.linha, ex = existentes(m).find(r => r.linhaId === lid);
            if (v == null || v === 0) { if (ex) Store.remove('recebiveis', ex.id, { silent: true }); return; }
            n++;
            if (ex) Store.update('recebiveis', ex.id, { previsto: v, recebido: v }, { silent: true });
            else Store.insert('recebiveis', { tipo: 'historico', linhaId: lid, descricao: 'Histórico', previstoEm: Fat.dia15(m), previsto: v, recebido: v, status: 'recebido', recebidoEm: U.nowISO() }, { silent: true });
          });
          Store.commit(); api.close(); UI.toast(`Histórico de ${Fat.nomeMes(m, true)} salvo`);
        };
      }
    });
  };

  /* ---------- Recebimento avulso (campanha, bônus, pendência) ---------- */
  F.avulso = (id, preset = {}) => {
    const r = id ? Store.get('recebiveis', id) : null;
    const v = r || { previstoEm: Fat.dia15(Fat.proximoPagamento()), linhaId: (Fat.linhas()[0] || {}).id, ...preset };
    UI.modal({
      title: r ? 'Editar recebimento avulso' : 'Recebimento avulso', size: 'sm',
      body: `<form class="form" id="fAv"><label class="f full"><span>Descrição</span><input name="descricao" required value="${U.esc(v.descricao || '')}" placeholder="Ex.: Campanha Vida, Adicional Eqseed, Pendência Avenue" autofocus></label>
        <div class="row2"><label class="f"><span>Linha</span><select name="linhaId">${linhaOpts(v.linhaId)}</select></label>
        <label class="f"><span>Valor líquido</span><input name="previsto" data-num inputmode="decimal" required value="${num(v.previsto)}" placeholder="R$"></label></div>
        <div class="row2"><label class="f"><span>Data prevista</span><input type="date" name="previstoEm" required value="${v.previstoEm}"></label>
        <label class="f"><span>Cliente (opcional)</span><input name="cliente" value="${U.esc(v.cliente || '')}"></label></div>
        <label class="neg-toggle sm"><input type="checkbox" id="avRec" ${v.status === 'recebido' ? 'checked' : ''}><span class="tg"><i></i></span><span><b>Já recebi</b></span></label>
        <p class="ferr" id="errAv" hidden></p></form>`,
      footer: `${r ? `<button class="btn ghost danger-text" data-del>${UI.icon('lixo')}Excluir</button><span class="grow"></span>` : ''}<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fAv" type="submit">Salvar</button>`,
      onMount(el, api) {
        el.querySelector('#fAv').onsubmit = e => { e.preventDefault(); const d = UI.formData(e.target), er = el.querySelector('#errAv');
          if (!d.descricao || d.previsto == null || !d.previstoEm) { er.textContent = 'Preencha descrição, valor e data.'; er.hidden = false; return; }
          const rec = el.querySelector('#avRec').checked;
          const dados = { ...d, tipo: 'avulso', status: rec ? 'recebido' : 'previsto', recebido: rec ? d.previsto : null, recebidoEm: rec ? U.nowISO() : null };
          if (r) Store.update('recebiveis', r.id, dados); else Store.insert('recebiveis', dados); api.close(); UI.toast('Recebimento salvo'); };
        const del = el.querySelector('[data-del]');
        if (del) del.onclick = async () => { if (await UI.confirm({ title: 'Excluir recebimento?', text: `"${U.esc(r.descricao)}" será apagado.`, ok: 'Excluir' })) { Store.remove('recebiveis', r.id); api.close(); UI.toast('Recebimento excluído'); } };
      }
    });
  };
})(window.App = window.App || {});

</script>
<script>
/* js/views/painel.js */
/* Tela: Painel (dashboard principal). Responde: hoje, atrasadas, próximas, metas e execução. */
(function (App) {
  const { U, M, UI, Store, Charts } = App;
  const V = { titulo: 'Painel' };
  let filtroResp = '';

  const itemAt = a => `<li class="pitem${M.atrasada(a) ? ' is-late' : ''}" data-id="${a.id}">
      <button class="check" data-act="concluir" aria-label="Concluir ${U.esc(a.titulo)}">${UI.icon('check')}</button>
      <div class="pmain" data-act="abrir"><b>${U.esc(a.titulo)}</b><div class="pmeta">${UI.respChip(a.responsabilidadeId)}${M.ehNegocio(a) ? UI.negChip(a) : (a.categoria ? `<span class="cat">${U.esc(a.categoria)}</span>` : '')}</div></div>
      <div class="pside">${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
      <button class="icon-btn" data-act="adiar" title="Adiar" aria-label="Adiar">${UI.icon('adiar')}</button></li>`;

  V.render = el => {
    const r = M.resumo(filtroResp);
    const prior = M.prioridadesHoje().filter(a => !filtroResp || a.responsabilidadeId === filtroResp);
    const prox = Store.all('atividades').filter(a => M.proximos(a, 7) && !prior.includes(a) && (!filtroResp || a.responsabilidadeId === filtroResp)).sort(M.ordemAtencao);
    const metas = Store.all('metas').filter(m => (!filtroResp || m.responsabilidadeId === filtroResp) && !(m.fim && m.fim < U.addDays(U.today(), -30)));
    const resps = M.respAtivas().filter(x => !filtroResp || x.id === filtroResp);
    const exec = r.planejadas7 ? r.feitas7 / r.planejadas7 : null;
    const demo = App.Demo.count();
    const negs = M.negItensAbertos().filter(x => !filtroResp || x.a.responsabilidadeId === filtroResp);

    el.innerHTML = `
      ${demo.atividades + demo.metas ? `<div class="banner">Você está vendo <b>dados de demonstração</b>. Quando quiser começar com os seus, apague-os em <a href="#dados" data-go="dados">Backup e dados</a>.</div>` : ''}
      <div class="page-h"><div><h1>Bom dia</h1><p class="muted cap">${U.todayLong()}</p></div>
        <label class="filter"><span class="sr">Filtrar por responsabilidade</span><select id="fResp">${UI.options(M.respAtivas().map(x => ({ id: x.id, label: x.nome })), filtroResp, { vazio: 'Todas as responsabilidades' })}</select></label></div>

      <section class="kpis" aria-label="Indicadores">
        <a class="kpi" href="#atividades" data-go="atividades" data-q="prazo=hoje"><span>Para hoje</span><b>${r.hoje}</b></a>
        <a class="kpi ${r.atrasadas ? 'k-late' : ''}" href="#atividades" data-go="atividades" data-q="prazo=atrasadas"><span>Atrasadas</span><b>${r.atrasadas}</b></a>
        <a class="kpi" href="#atividades" data-go="atividades" data-q="prazo=7dias"><span>Próximos 7 dias</span><b>${r.proximos7}</b></a>
        <a class="kpi" href="#atividades" data-go="atividades" data-q="status=abertas"><span>Pendentes</span><b>${r.pendentes}</b></a>
        <a class="kpi" href="#atividades" data-go="atividades" data-q="status=concluida"><span>Concluídas</span><b>${r.concluidas}</b></a>
        <a class="kpi k-neg" href="#negocios" data-go="negocios"><span>Negócios em andamento</span><b>${negs.length}</b><em>${negs.length ? U.brlShort(negs.reduce((s, x) => s + (+x.n.valor || 0), 0)) + ' em negociação' : 'Nenhum no momento'}</em></a>
      </section>

      <div class="grid-main">
        <section class="card prio-card" aria-label="Minhas prioridades de hoje">
          <div class="card-h"><h2>Minhas prioridades de hoje</h2><span class="count">${prior.length}</span></div>
          ${prior.length ? `<ul class="plist" id="plist">${prior.map(itemAt).join('')}</ul>`
            : `<div class="empty"><b>Nada urgente por aqui.</b><p>Nenhuma atividade atrasada ou para hoje. Aproveite para adiantar as próximas.</p></div>`}
          ${prox.length ? `<details class="next"><summary>Próximos 7 dias · ${prox.length}</summary><ul class="plist">${prox.slice(0, 12).map(itemAt).join('')}</ul></details>` : ''}
        </section>

        <aside class="side-col">
          ${App.Emails ? App.Emails.quadro() : ''}
          <section class="card exec">
            <div class="card-h"><h2>Estou executando o que planejei?</h2></div>
            <div class="exec-b">${Charts.ring(r.pctConclusao, 92)}
              <div><p class="big-l">${U.pct(r.pctConclusao)} <span class="muted">concluído no total</span></p>
              <p class="muted small">${exec == null ? 'Nenhuma atividade venceu nos últimos 7 dias.' : `Últimos 7 dias: <b class="ink">${r.feitas7} de ${r.planejadas7}</b> atividades com prazo foram concluídas (${U.pct(exec)}).`}</p></div></div>
          </section>
          <section class="card">
            <div class="card-h"><h2>Metas</h2><a class="link" href="#metas" data-go="metas">Ver todas</a></div>
            ${metas.length ? `<ul class="mlist">${metas.slice(0, 5).map(m => { const p = M.metaPct(m), s = M.metaSituacao(m); return `<li><div class="mrow"><span class="mname">${U.esc(m.nome)}</span><span class="tag t-${s.id}">${s.label}</span></div>${UI.bar(p, M.respCor(m.responsabilidadeId))}<div class="mrow small muted"><span>${U.num(M.metaAtual(m))} de ${U.num(m.alvo)} ${U.esc(m.unidade || '')}</span><span>${U.pct(p)}</span></div></li>`; }).join('')}</ul>`
              : `<div class="empty sm"><p>Nenhuma meta ativa.</p><a class="btn ghost" href="#metas" data-go="metas">Criar meta</a></div>`}
          </section>
        </aside>
      </div>

      <section class="card" aria-label="Desempenho por responsabilidade">
        <div class="card-h"><h2>Desempenho por responsabilidade</h2><a class="link" href="#responsabilidades" data-go="responsabilidades">Gerenciar</a></div>
        <div class="rgrid">${resps.map(x => {
          const at = Store.where('atividades', a => a.responsabilidadeId === x.id), c = at.filter(a => a.status === 'concluida').length, l = at.filter(M.atrasada).length, h = at.filter(M.hoje).length;
          return `<a class="rcard" href="#atividades" data-go="atividades" data-q="resp=${x.id}" style="--c:${x.cor}"><div class="rh"><i></i><b>${U.esc(x.nome)}</b></div>
            ${UI.bar(at.length ? c / at.length : 0, x.cor)}
            <div class="rnums"><span><b>${c}</b>/${at.length} concluídas</span><span class="${l ? 'late' : ''}"><b>${l}</b> atrasada${l === 1 ? '' : 's'}</span><span><b>${h}</b> hoje</span></div></a>`;
        }).join('') || '<p class="muted">Cadastre suas responsabilidades para ver o desempenho de cada uma.</p>'}</div>
      </section>`;

    const h = new Date().getHours();
    el.querySelector('.page-h h1').textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    el.querySelector('#fResp').onchange = e => { filtroResp = e.target.value; V.render(el); };
    if (App.Emails) App.Emails.ligar(el.querySelector('.mail-card') || el);
    el.querySelectorAll('.pitem').forEach(li => li.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const id = li.dataset.id;
      if (b.dataset.act === 'concluir') App.Forms.concluir(id);
      if (b.dataset.act === 'abrir') App.Forms.detalhes(id);
      if (b.dataset.act === 'adiar') App.Forms.adiar(id);
    }));
  };

  App.Views = App.Views || {};
  App.Views.painel = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/atividades.js */
/* Tela: Atividades, em lista agrupada por prazo ou em quadro Kanban, com filtros. */
(function (App) {
  const { U, M, UI, Store } = App;
  const V = { titulo: 'Atividades' };
  const PADRAO = { resp: '', status: 'abertas', prioridade: '', prazo: '', busca: '', categoria: '', metaId: '' };
  let f = { ...PADRAO };
  let modo = (() => { try { return localStorage.getItem('gestao-pessoal:modoAtividades') || 'lista'; } catch (e) { return 'lista'; } })();

  V.setParams = q => { f = { ...PADRAO }; if (q) Object.assign(f, q); if (q && (q.prazo === 'atrasadas' || q.prazo === 'hoje' || q.prazo === '7dias')) f.status = 'abertas'; if (q && q.status === 'concluida') f.status = 'concluida'; };

  const passa = (a, semStatus) => {
    if (f.resp && a.responsabilidadeId !== f.resp) return false;
    if (f.categoria && a.categoria !== f.categoria) return false;
    if (f.metaId && !M.metasDa(a).includes(f.metaId)) return false;
    if (!semStatus && f.status === 'abertas' && !M.aberta(a)) return false;
    if (!semStatus && f.status && f.status !== 'abertas' && a.status !== f.status) return false;
    if (f.prioridade && a.prioridade !== f.prioridade) return false;
    if (f.prazo === 'atrasadas' && !M.atrasada(a)) return false;
    if (f.prazo === 'hoje' && !M.hoje(a)) return false;
    if (f.prazo === '7dias' && !(M.hoje(a) || M.proximos(a, 7))) return false;
    if (f.prazo === 'semprazo' && a.prazo) return false;
    if (f.busca) { const q = f.busca.toLowerCase(); if (![a.titulo, a.descricao, a.categoria, a.observacoes].some(s => s && s.toLowerCase().includes(q))) return false; }
    return true;
  };

  const grupo = a => {
    if (a.status === 'concluida') return 'concluidas';
    if (!a.prazo) return 'semprazo';
    if (M.atrasada(a)) return 'atrasadas';
    if (M.hoje(a)) return 'hoje';
    if (U.diff(a.prazo, U.today()) <= 7) return 'semana';
    return 'depois';
  };
  const GRUPOS = [['atrasadas', 'Atrasadas'], ['hoje', 'Hoje'], ['semana', 'Próximos 7 dias'], ['depois', 'Mais adiante'], ['semprazo', 'Sem prazo'], ['concluidas', 'Concluídas']];

  /* Ligação com outras atividades: "↳ veio de..." e "gerou 2" */
  const ligacao = a => {
    const o = M.origem(a), n = M.filhos(a.id).length;
    return (o ? `<span class="lig" title="Próximo passo de: ${U.esc(o.titulo)}">↳ ${U.esc(o.titulo.length > 28 ? o.titulo.slice(0, 27) + '…' : o.titulo)}</span>` : '')
      + (n ? `<span class="lig" title="Esta atividade gerou ${n}">gerou ${n}</span>` : '');
  };
  /* Resultado por meta: "2/3 indicações · R$ 40 mil produção" */
  const resultadoTxt = a => {
    const ms = M.metasComResultado(a);
    if (!ms.length) {
      if (a.resultado == null && a.resultadoEsperado == null) return '';
      if (a.resultado == null) return `<span class="res pend">Esperado: ${U.num(a.resultadoEsperado)}</span>`;
      return `<span class="res">${U.num(a.resultado)}${a.resultadoEsperado != null ? '/' + U.num(a.resultadoEsperado) : ''} resultado</span>`;
    }
    return ms.map(m => { const r = M.resMeta(a, m.id), e = M.espMeta(a, m.id), t = U.esc(m.nome);
      if (r == null && e == null) return `<span class="res meta" title="Meta: ${t}">${t}</span>`;
      if (r == null) return `<span class="res pend" title="Meta: ${t}">Esperado: ${U.esc(M.fmtMeta(e, m))}</span>`;
      return `<span class="res" title="Meta: ${t}">${U.esc(M.ehDinheiro(m) ? M.fmtMeta(r, m) + (e != null ? ' de ' + M.fmtMeta(e, m) : '') : U.num(r) + (e != null ? '/' + U.num(e) : '') + ' ' + (m.unidade || ''))}</span>`; }).join('');
  };

  const linha = a => `<li class="arow${a.status === 'concluida' ? ' is-done' : ''}${M.atrasada(a) ? ' is-late' : ''}" data-id="${a.id}">
    <button class="check${a.status === 'concluida' ? ' on' : ''}" data-act="${a.status === 'concluida' ? 'reabrir' : 'concluir'}" aria-label="${a.status === 'concluida' ? 'Reabrir' : 'Concluir'}">${UI.icon('check')}</button>
    <div class="amain" data-act="abrir"><b>${U.esc(a.titulo)}</b><div class="pmeta">${UI.respChip(a.responsabilidadeId)}${UI.negChip(a)}${a.categoria && !a.tipoNegocio ? `<span class="cat">${U.esc(a.categoria)}</span>` : ''}${a.status === 'andamento' || a.status === 'adiada' ? UI.statusPill(a.status) : ''}${resultadoTxt(a)}${ligacao(a)}</div></div>
    <div class="aside">${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
    <div class="aact">${a.status !== 'concluida' ? `<button class="icon-btn" data-act="adiar" title="Adiar" aria-label="Adiar">${UI.icon('adiar')}</button>` : ''}<button class="icon-btn" data-act="editar" title="Editar" aria-label="Editar">${UI.icon('editar')}</button><button class="icon-btn" data-act="excluir" title="Excluir" aria-label="Excluir">${UI.icon('lixo')}</button></div></li>`;

  const cartao = a => `<article class="kcard${M.atrasada(a) ? ' is-late' : ''}" draggable="true" data-id="${a.id}" tabindex="0">
    <div class="kc-top">${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
    <b>${U.esc(a.titulo)}</b>
    <div class="pmeta">${UI.respChip(a.responsabilidadeId)}${UI.negChip(a)}${resultadoTxt(a)}${ligacao(a)}</div></article>`;

  V.render = el => {
    const todas = Store.all('atividades');
    const lista = todas.filter(passa);
    const cats = [...new Set(todas.map(a => a.categoria).filter(Boolean))].sort();
    const filtrado = JSON.stringify(f) !== JSON.stringify(PADRAO);

    el.innerHTML = `
      <div class="page-h"><div><h1>Atividades</h1><p class="muted">${U.plural(lista.length, 'atividade', 'atividades')}${filtrado ? ' com os filtros atuais' : ' em aberto'}</p></div>
        <div class="seg" role="group" aria-label="Visualização"><button data-modo="lista" aria-pressed="${modo === 'lista'}">${UI.icon('lista')}Lista</button><button data-modo="kanban" aria-pressed="${modo === 'kanban'}">${UI.icon('kanban')}Kanban</button></div></div>
      <div class="filters">
        <label class="search">${UI.icon('busca')}<input id="fBusca" placeholder="Buscar" value="${U.esc(f.busca)}" aria-label="Buscar atividades"></label>
        <select data-f="resp" aria-label="Responsabilidade">${UI.options(Store.all('responsabilidades').map(x => ({ id: x.id, label: x.nome })), f.resp, { vazio: 'Todas as responsabilidades' })}</select>
        <select data-f="prazo" aria-label="Prazo">${UI.options([{ id: 'atrasadas', label: 'Atrasadas' }, { id: 'hoje', label: 'Para hoje' }, { id: '7dias', label: 'Até 7 dias' }, { id: 'semprazo', label: 'Sem prazo' }], f.prazo, { vazio: 'Qualquer prazo' })}</select>
        <select data-f="prioridade" aria-label="Prioridade">${UI.options(M.PRIORIDADES, f.prioridade, { vazio: 'Qualquer prioridade' })}</select>
        ${modo === 'lista' ? `<select data-f="status" aria-label="Status">${UI.options([{ id: 'abertas', label: 'Em aberto' }, ...M.STATUS], f.status, { vazio: 'Todos os status' })}</select>` : ''}
        ${cats.length ? `<select data-f="categoria" aria-label="Categoria">${UI.options(cats.map(c => ({ id: c, label: c })), f.categoria, { vazio: 'Todas as categorias' })}</select>` : ''}
        ${f.metaId && Store.get('metas', f.metaId) ? `<span class="fchip">Meta: ${U.esc(Store.get('metas', f.metaId).nome)}</span>` : ''}
        ${filtrado ? `<button class="link" id="limpar">Limpar filtros</button>` : ''}
      </div>
      <div id="corpo"></div>`;

    const corpo = el.querySelector('#corpo');
    if (modo === 'lista') {
      const gs = GRUPOS.map(([k, t]) => [k, t, lista.filter(a => grupo(a) === k)]).filter(g => g[2].length);
      gs.forEach(g => g[2].sort(g[0] === 'concluidas' ? (a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || '') : M.ordemAtencao));
      corpo.innerHTML = gs.length ? gs.map(([k, t, arr]) => `<section class="agroup g-${k}"><h2>${t} <span class="count">${arr.length}</span></h2><ul class="alist">${arr.map(linha).join('')}</ul></section>`).join('')
        : `<div class="empty card"><b>Nenhuma atividade encontrada.</b><p>${filtrado ? 'Tente outros filtros.' : 'Crie a primeira atividade.'}</p><button class="btn primary" data-nova>${UI.icon('mais')}Nova atividade</button></div>`;
    } else {
      const base = todas.filter(a => passa(a, true));
      corpo.innerHTML = `<div class="kanban">${M.STATUS.map(s => { const arr = base.filter(a => a.status === s.id).sort(s.id === 'concluida' ? (a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || '') : M.ordemAtencao);
        return `<section class="kcol" data-status="${s.id}"><h2>${UI.statusPill(s.id)}<span class="count">${arr.length}</span></h2><div class="kdrop">${(s.id === 'concluida' ? arr.slice(0, 15) : arr).map(cartao).join('') || '<p class="kempty">Arraste atividades para cá</p>'}${s.id === 'concluida' && arr.length > 15 ? `<p class="kempty">+${arr.length - 15} concluídas</p>` : ''}</div></section>`; }).join('')}</div>
        <p class="note">Arraste os cartões entre as colunas para mudar o status. No celular, toque no cartão e use Editar.</p>`;
      bindKanban(corpo);
    }

    el.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => { modo = b.dataset.modo; try { localStorage.setItem('gestao-pessoal:modoAtividades', modo); } catch (e) {} V.render(el); });
    el.querySelectorAll('[data-f]').forEach(s => s.onchange = () => { f[s.dataset.f] = s.value; V.render(el); });
    const busca = el.querySelector('#fBusca');
    busca.oninput = () => { f.busca = busca.value; const pos = busca.selectionStart; V.render(el); const nb = el.querySelector('#fBusca'); nb.focus(); nb.setSelectionRange(pos, pos); };
    const lim = el.querySelector('#limpar'); if (lim) lim.onclick = () => { f = { ...PADRAO }; V.render(el); };
    const nova = el.querySelector('[data-nova]'); if (nova) nova.onclick = () => App.Forms.atividade(null, f.resp ? { responsabilidadeId: f.resp } : {});
    corpo.querySelectorAll('.arow').forEach(li => li.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const id = li.dataset.id, act = b.dataset.act;
      if (act === 'concluir') App.Forms.concluir(id);
      if (act === 'reabrir') { M.reabrir(id); UI.toast('Atividade reaberta'); }
      if (act === 'abrir') App.Forms.detalhes(id);
      if (act === 'adiar') App.Forms.adiar(id);
      if (act === 'editar') App.Forms.atividade(id);
      if (act === 'excluir') App.Forms.excluirAtividade(id);
    }));
  };

  function bindKanban(root) {
    let drag = null;
    root.querySelectorAll('.kcard').forEach(c => {
      c.addEventListener('dragstart', e => { drag = c.dataset.id; c.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', drag); } catch (x) {} });
      c.addEventListener('dragend', () => c.classList.remove('dragging'));
      c.addEventListener('click', () => App.Forms.detalhes(c.dataset.id));
      c.addEventListener('keydown', e => { if (e.key === 'Enter') App.Forms.detalhes(c.dataset.id); });
    });
    root.querySelectorAll('.kcol').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => {
        e.preventDefault(); col.classList.remove('over');
        const id = drag; drag = null; if (!id) return;
        const a = Store.get('atividades', id); const st = col.dataset.status;
        if (!a || a.status === st) return;
        if (st === 'concluida') return App.Forms.concluir(id);
        if (st === 'adiada') return App.Forms.adiar(id);
        if (a.status === 'concluida') M.reabrir(id);
        M.mudarStatus(id, st); UI.toast('Movida para ' + M.status(st).label);
      });
    });
  }

  App.Views = App.Views || {};
  App.Views.atividades = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/negocios.js */
/* Tela: Negócios em andamento (aberta pelo card do painel). */
(function (App) {
  const { U, M, UI, Store } = App;
  const V = { titulo: 'Negócios em andamento' };
  let fTipo = '';

  /* Uma linha por negócio (um card com Zentis e Vida aparece duas vezes) */
  const linha = ({ a, n }) => { const outros = M.negociosDa(a).filter(x => x.id !== n.id && !x.resultado), lq = M.liqNeg(n);
    return `<li class="nrow${M.atrasada(a) ? ' is-late' : ''}" data-id="${a.id}">
      <button class="check" data-act="concluir" aria-label="Concluir negócio">${UI.icon('check')}</button>
      <div class="amain" data-act="abrir"><b>${U.esc(a.cliente || a.titulo)}</b><div class="pmeta"><span class="neg">${U.esc(M.tipoNeg(n.tipo).label)}</span>${a.cliente ? `<span>${U.esc(a.titulo)}</span>` : ''}${outros.length ? `<span class="lig" title="No mesmo card">+ ${U.esc(outros.map(x => M.tipoNeg(x.tipo).label).join(', '))}</span>` : ''}${UI.respChip(a.responsabilidadeId)}${a.status === 'andamento' || a.status === 'adiada' ? UI.statusPill(a.status) : ''}</div></div>
      <div class="nval">${n.valor ? U.brl(n.valor) : '<span class="muted">sem valor</span>'}${lq != null ? `<small>fica ${U.brlShort(lq)}</small>` : ''}</div>
      <div class="aside">${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
      <div class="aact"><button class="icon-btn" data-act="editar" title="Editar" aria-label="Editar">${UI.icon('editar')}</button></div></li>`; };

  V.render = el => {
    const abertos = M.negItensAbertos();
    const lista = abertos.filter(x => !fTipo || M.tipoChave(x.n.tipo) === fTipo).sort((x, y) => M.ordemAtencao(x.a, y.a));
    const total = lista.reduce((s, x) => s + (+x.n.valor || 0), 0);
    const ini = U.addDays(U.today(), -30);
    const fechados = Store.all('atividades').filter(a => M.ehNegocio(a) && a.status === 'concluida' && (a.concluidaEm || '').slice(0, 10) >= ini).sort((a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || ''))
      .flatMap(a => M.negociosDa(a).map(n => ({ a, n, perdido: (n.resultado || a.resultadoNegocio) === 'perdido' })));
    const ganhos = fechados.filter(x => !x.perdido);
    const mesIni = U.today().slice(0, 8) + '01';
    const prodMes = App.Fat.producoesDoMes(App.Fat.ymHoje());
    const semana = abertos.filter(x => x.a.prazo && U.diff(x.a.prazo, U.today()) <= 7).length;
    /* Agrupa pelo tipo digitado (sem diferenciar maiúsculas e acentos) */
    const grupos = {};
    abertos.forEach(({ n }) => { const k = M.tipoChave(n.tipo); const g = grupos[k] || (grupos[k] = { id: k, label: M.tipoNeg(n.tipo).label, n: 0, v: 0 }); g.n++; g.v += +n.valor || 0; });
    const porTipo = Object.values(grupos).sort((a, b) => b.n - a.n || b.v - a.v);
    if (fTipo && !grupos[fTipo]) fTipo = '';
    const liqTotal = abertos.reduce((s, x) => s + (M.liqNeg(x.n) || 0), 0);
    const tituloTipo = fTipo ? grupos[fTipo].label : 'Todos os negócios';

    el.innerHTML = `
      <div class="page-h"><div><h1>Negócios em andamento</h1><p class="muted">Cada negócio aparece separado, mesmo quando vários estão no mesmo card.</p></div>
        <button class="btn primary" id="novoNeg">${UI.icon('mais')}Novo negócio</button></div>
      <section class="kpis k4">
        <div class="kpi"><span>Em andamento</span><b>${abertos.length}</b></div>
        <div class="kpi"><span>Valor em negociação</span><b>${U.brlShort(abertos.reduce((s, x) => s + (+x.n.valor || 0), 0))}</b>${liqTotal ? `<em>≈ ${U.brlShort(liqTotal)} ficam com você</em>` : ''}</div>
        <div class="kpi ${semana ? 'k-warn' : ''}"><span>Fecham em até 7 dias</span><b>${semana}</b></div>
        <a class="kpi" href="#faturamento" data-go="faturamento"><span>Produção do mês (líquido)</span><b>${U.brlShort(prodMes.reduce((s, p) => s + App.Fat.liquidoTotal(p), 0))}</b><em>${U.plural(prodMes.length, 'lançamento', 'lançamentos')}</em></a>
      </section>
      ${porTipo.length ? `<div class="tchips"><button class="tchip${!fTipo ? ' on' : ''}" data-t="">Todos <b>${abertos.length}</b></button>${porTipo.map(t => `<button class="tchip${fTipo === t.id ? ' on' : ''}" data-t="${U.esc(t.id)}">${U.esc(t.label)} <b>${t.n}</b><small>${U.brlShort(t.v)}</small></button>`).join('')}</div>` : ''}
      <section class="card">
        <div class="card-h"><h2>${U.esc(tituloTipo)}</h2><span class="muted small">${U.brl(total)}</span></div>
        ${lista.length ? `<ul class="alist">${lista.map(linha).join('')}</ul>` : `<div class="empty"><b>Nenhum negócio em andamento.</b><p>Ao criar uma atividade, marque "É um negócio" e escreva o tipo, o cliente e o valor.</p><button class="btn primary" id="novoNeg2">${UI.icon('mais')}Novo negócio</button></div>`}
      </section>
      ${fechados.length ? `<section class="card"><div class="card-h"><h2>Concluídos nos últimos 30 dias</h2><span class="muted small">${ganhos.length} fechados · ${fechados.length - ganhos.length} não fecharam</span></div>
        <ul class="alist">${fechados.slice(0, 12).map(({ a, n, perdido }) => `<li class="nrow is-done" data-id="${a.id}"><span class="tag ${perdido ? 't-erro' : 't-ok'}">${perdido ? 'Não fechou' : 'Fechado'}</span>
          <div class="amain" data-act="abrir"><b>${U.esc(a.cliente || a.titulo)}</b><div class="pmeta"><span>${U.esc(M.tipoNeg(n.tipo).label)}</span><span>${U.fmtDate((a.concluidaEm || '').slice(0, 10))}</span></div></div>
          <div class="nval">${n.valor ? U.brl(n.valor) : ''}</div></li>`).join('')}</ul></section>` : ''}`;

    const novo = () => App.Forms.atividade(null, { tipoNegocio: fTipo ? grupos[fTipo].label : null, categoria: 'Negócios', prioridade: 'alta', _neg: true });
    el.querySelector('#novoNeg').onclick = novo;
    const n2 = el.querySelector('#novoNeg2'); if (n2) n2.onclick = novo;
    el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { fTipo = b.dataset.t; V.render(el); });
    el.querySelectorAll('.nrow').forEach(li => li.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const id = li.dataset.id;
      if (b.dataset.act === 'concluir') App.Forms.concluir(id);
      if (b.dataset.act === 'abrir') App.Forms.detalhes(id);
      if (b.dataset.act === 'editar') App.Forms.atividade(id);
    }));
  };

  App.Views = App.Views || {};
  App.Views.negocios = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/faturamento.js */
/*
 * Tela: Faturamento. Fica só no menu lateral.
 * Abas: Resumo · Produção · Recebimentos (conferência do dia 15) · Recorrências e histórico · Linhas e produtos
 */
(function (App) {
  const { U, UI, Store, Fat } = App;
  const V = { titulo: 'Faturamento' };
  const ABAS = [['resumo', 'Resumo'], ['producao', 'Produção'], ['recebimentos', 'Recebimentos'], ['recorrencias', 'Recorrências e histórico'], ['linhas', 'Linhas e produtos']];
  let aba = 'resumo', ano = new Date().getFullYear(), mesProd = null, mesRec = null, fLinha = '', rank = 'recebido';

  V.setParams = q => { if (q && q.aba) aba = q.aba; };

  const ldot = id => `<i class="ldot" style="background:${Fat.linhaCor(id)}"></i>`;
  const navMes = (id, ym) => `<div class="mnav"><button class="icon-btn" data-nav="${id}" data-d="-1" aria-label="Mês anterior">${UI.icon('voltar')}</button><b>${Fat.nomeMes(ym, true)}</b><button class="icon-btn flip" data-nav="${id}" data-d="1" aria-label="Próximo mês">${UI.icon('voltar')}</button></div>`;
  const linhaFiltro = () => `<select id="fLinha" aria-label="Linha de negócio">${UI.options(Fat.linhas(true).map(l => ({ id: l.id, label: l.nome })), fLinha, { vazio: 'Todas as linhas' })}</select>`;

  /* ---------- Resumo ---------- */
  function resumo() {
    const prox = Fat.proximoPagamento(), rp = Fat.resumoMes(prox), hoje = Fat.ymHoje();
    const prodMes = Fat.producoesDoMes(hoje), liqMes = prodMes.reduce((s, p) => s + Fat.liquidoTotal(p), 0), brMes = prodMes.reduce((s, p) => s + (+p.bruto || 0), 0);
    const meses = Array.from({ length: 12 }, (_, i) => { const ym = ano + '-' + String(i + 1).padStart(2, '0'); return { ym, ...Fat.totalMes(ym) }; });
    const anoAtual = String(new Date().getFullYear());
    let recAno = 0; for (let i = 1; i <= 12; i++) { const ym = anoAtual + '-' + String(i).padStart(2, '0'); if (ym <= hoje) recAno += Fat.totalMes(ym).recebido; }
    let futuro = 0; for (let i = 1; i <= 12; i++) futuro += Fat.totalMes(Fat.addMes(hoje, i)).aberto;
    const pend = Store.all('recebiveis').filter(Fat.pendente), pendV = pend.reduce((s, r) => s + (+r.previsto || 0), 0);
    const maxM = Math.max(...meses.map(m => m.recebido + m.aberto), 1);
    /* ranking das linhas no ano */
    const rk = {};
    if (rank === 'recebido') meses.forEach(m => Object.entries(Fat.resumoMes(m.ym).porLinha).forEach(([l, v]) => { rk[l] = (rk[l] || 0) + v.recebido; }));
    else Fat.producaoEntre(ano + '-01', ano + '-12').forEach(p => { rk[p.linhaId] = (rk[p.linhaId] || 0) + Fat.liquidoTotal(p); });
    const rkArr = Object.entries(rk).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]), rkTot = rkArr.reduce((s, [, v]) => s + v, 0) || 1;
    const linhasProx = Object.entries(rp.porLinha).sort((a, b) => (b[1].recebido + b[1].aberto) - (a[1].recebido + a[1].aberto));

    return `
      <div class="fat-top">
        <section class="card hero-pay">
          <span class="eyebrow">Você recebe em 15 de ${Fat.nomeMes(prox, true).replace(/ de \d+$/, '')}</span>
          <b class="big">${U.brlC(rp.recebido + rp.aberto)}</b>
          <span class="muted small">${rp.recebido ? `${U.brlC(rp.recebido)} já conferido · ` : ''}${U.plural(rp.itens.length, 'lançamento previsto', 'lançamentos previstos')}</span>
          ${linhasProx.length ? `<ul class="plin">${linhasProx.map(([l, v]) => `<li><span>${ldot(l)}${U.esc(Fat.linhaNome(l))}</span><b>${U.brlC(v.recebido + v.aberto)}</b></li>`).join('')}</ul>` : '<p class="muted small">Nenhum valor previsto. Lance a produção do mês para ver a previsão.</p>'}
          <button class="btn ghost sm" data-aba="recebimentos" data-mes="${prox}">Conferir recebimentos</button>
        </section>
        <div class="kpis k2">
          <div class="kpi"><span>Produção de ${Fat.nomeMes(hoje, true).replace(/ de \d+$/, '')} (líquido)</span><b>${U.brlShort(liqMes)}</b><em>${U.brlShort(brMes)} bruto · ${U.plural(prodMes.length, 'lançamento', 'lançamentos')}</em></div>
          <div class="kpi k-brand"><span>Recebido em ${new Date().getFullYear()}</span><b>${U.brlShort(recAno)}</b><em>até ${Fat.nomeMes(hoje)}</em></div>
          <div class="kpi"><span>A receber nos próximos 12 meses</span><b>${U.brlShort(futuro)}</b><em>parcelas e recorrências já previstas</em></div>
          <div class="kpi ${pend.length ? 'k-warn' : ''}"><span>Pendências</span><b>${pend.length}</b><em>${pend.length ? U.brlC(pendV) + ' previstos que não foram conferidos' : 'Nada atrasado'}</em></div>
        </div>
      </div>
      <div class="grid-main">
        <section class="card">
          <div class="card-h"><h2>Recebimentos de ${ano}</h2><div class="mnav"><button class="icon-btn" data-ano="-1" aria-label="Ano anterior">${UI.icon('voltar')}</button><b>${ano}</b><button class="icon-btn flip" data-ano="1" aria-label="Próximo ano">${UI.icon('voltar')}</button></div></div>
          <div class="mbars">${meses.map(m => { const t = m.recebido + m.aberto; return `<button class="mb${m.ym === hoje ? ' now' : ''}" data-aba="recebimentos" data-mes="${m.ym}" title="${Fat.nomeMes(m.ym, true)}: ${U.brlC(m.recebido)} recebido${m.aberto ? ' · ' + U.brlC(m.aberto) + ' em aberto' : ''}"><span class="mv">${t ? U.brlShort(t).replace('R$ ', '') : ''}</span><span class="stack" style="height:${t / maxM * 100}%"><i class="ab" style="flex:${m.aberto}"></i><i class="rc" style="flex:${m.recebido}"></i></span><small>${Fat.nomeMes(m.ym).slice(0, 3)}</small></button>`; }).join('')}</div>
          <div class="legend-l"><span><i class="rc"></i>Recebido</span><span><i class="ab"></i>Previsto em aberto</span></div>
        </section>
        <section class="card">
          <div class="card-h"><h2>Linhas de negócio</h2><div class="seg" role="group"><button data-rank="recebido" aria-pressed="${rank === 'recebido'}">Recebido</button><button data-rank="producao" aria-pressed="${rank === 'producao'}">Produção</button></div></div>
          ${rkArr.length ? `<ul class="tbars">${rkArr.map(([l, v], i) => `<li><div class="mrow"><span><b class="rkpos">${i + 1}º</b>${ldot(l)}${U.esc(Fat.linhaNome(l))}</span><b>${U.brlShort(v)} <span class="muted small">${Math.round(v / rkTot * 100)}%</span></b></div>${UI.bar(v / rkArr[0][1], Fat.linhaCor(l))}</li>`).join('')}</ul>` : `<p class="muted small">Sem ${rank === 'recebido' ? 'recebimentos' : 'produção'} em ${ano}.</p>`}
        </section>
      </div>`;
  }

  /* ---------- Produção ---------- */
  function producao() {
    const ym = mesProd || Fat.ymHoje();
    const lista = Fat.producoesDoMes(ym).filter(p => !fLinha || p.linhaId === fLinha).sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    const liq = lista.reduce((s, p) => s + Fat.liquidoTotal(p), 0), br = lista.reduce((s, p) => s + (+p.bruto || 0), 0);
    const grupos = {};
    lista.forEach(p => { const k = p.linhaId + '|' + p.produtoId; (grupos[k] = grupos[k] || []).push(p); });
    const ordem = Object.keys(grupos).sort((a, b) => { const la = Fat.linha(a.split('|')[0]) || {}, lb = Fat.linha(b.split('|')[0]) || {}; return (la.ordem || 50) - (lb.ordem || 50) || a.localeCompare(b); });
    return `
      <div class="toolbar">${navMes('prod', ym)}${linhaFiltro()}<span class="grow"></span><button class="btn primary" id="novaProd">${UI.icon('mais')}Lançar produção</button></div>
      <section class="kpis k3"><div class="kpi k-brand"><span>Líquido gerado</span><b>${U.brlShort(liq)}</b></div><div class="kpi"><span>Resultado bruto</span><b>${U.brlShort(br)}</b></div><div class="kpi"><span>Lançamentos</span><b>${lista.length}</b></div></section>
      ${ordem.length ? ordem.map(k => { const [l, pId] = k.split('|'), arr = grupos[k], tl = arr.reduce((s, p) => s + Fat.liquidoTotal(p), 0), tb = arr.reduce((s, p) => s + (+p.bruto || 0), 0);
        return `<section class="card pblock" style="--c:${Fat.linhaCor(l)}"><div class="card-h"><h2>${ldot(l)}${U.esc(Fat.linhaNome(l))} · ${U.esc(Fat.produtoNome(pId))}</h2><span class="muted small">${U.brlC(tb)} bruto · <b class="ink">${U.brlC(tl)} líquido</b></span></div>
          <div class="tw"><table class="ftable"><thead><tr><th>Data</th><th>Cliente</th><th class="r">Valor / aporte</th><th class="r">Comissão</th><th class="r">Bruto</th><th class="r">Líquido</th><th>Recebe</th></tr></thead><tbody>
          ${arr.map(p => { const ds = Fat.datas(p.data, p.regra, p.parcelas, p.grupo), v = Fat.valores(p), rec = Fat.recebidosDaProducao(p.id);
            return `<tr data-prod="${p.id}"><td>${U.fmtDate(p.data)}</td><td><b>${U.esc(p.cliente || '—')}</b>${p.observacoes ? `<br><span class="muted small">${U.esc(p.observacoes)}</span>` : ''}</td><td class="r">${p.valor != null ? U.brlC(p.valor) : '—'}</td><td class="r">${p.comissaoPct != null ? U.num(p.comissaoPct) + '%' : '—'}</td><td class="r">${p.bruto != null ? U.brlC(p.bruto) : '—'}</td>
              <td class="r"><b>${U.brlC(v.liq.reduce((s, x) => s + x, 0))}</b>${v.estimado ? '<br><span class="tag t-aviso">sem líquido</span>' : ''}${v.n > 1 ? `<br><span class="muted small">${v.n}x ${U.brlC(v.liq[0])}</span>` : ''}</td>
              <td><span class="small">${Fat.regraTxt(p.regra, p.parcelas, p.grupo)}</span><br><span class="muted small">${v.n > 1 ? `de ${U.fmtDate(ds[0])} a ${U.fmtDate(ds[ds.length - 1])}` : U.fmtDate(ds[0])}${rec ? ` · ${rec}/${v.n} recebida${rec > 1 ? 's' : ''}` : ''}</span></td></tr>`; }).join('')}
          </tbody></table></div></section>`; }).join('')
      : `<div class="empty card"><b>Nenhuma produção em ${Fat.nomeMes(ym, true)}.</b><p>Lance cada negócio com o cliente, o valor, o resultado bruto e o líquido. O faturamento calcula quando cada valor entra.</p><button class="btn primary" id="novaProd2">${UI.icon('mais')}Lançar produção</button></div>`}`;
  }

  /* ---------- Recebimentos (conferência do dia 15) ---------- */
  const TIPO_TAG = { recorrente: 'Recorrente', avulso: 'Avulso', historico: 'Histórico' };
  function recebimentos() {
    const ym = mesRec || Fat.proximoPagamento(), r = Fat.resumoMes(ym);
    const itens = r.itens.filter(x => !fLinha || x.linhaId === fLinha);
    const porL = {}; itens.forEach(x => (porL[x.linhaId] = porL[x.linhaId] || []).push(x));
    const linhasOrd = Object.keys(porL).sort((a, b) => ((Fat.linha(a) || {}).ordem || 50) - ((Fat.linha(b) || {}).ordem || 50));
    const abertos = itens.filter(x => x.status !== 'recebido');
    return `
      <div class="toolbar">${navMes('rec', ym)}${linhaFiltro()}<span class="grow"></span><button class="btn ghost" id="novoAv">${UI.icon('mais')}Avulso</button>${abertos.length ? `<button class="btn primary" id="todos">${UI.icon('check')}Marcar todos como recebidos</button>` : ''}</div>
      <section class="kpis k4"><div class="kpi"><span>Previsto</span><b>${U.brlShort(r.previsto)}</b><em>${U.brlC(r.previsto)}</em></div><div class="kpi k-brand"><span>Recebido</span><b>${U.brlShort(r.recebido)}</b></div><div class="kpi"><span>Em aberto</span><b>${U.brlShort(r.aberto)}</b></div><div class="kpi ${r.pendentes ? 'k-warn' : ''}"><span>Pendentes</span><b>${r.pendentes}</b><em>${r.pendentes ? 'passou da data e não foi conferido' : 'nada atrasado'}</em></div></section>
      ${linhasOrd.length ? linhasOrd.map(l => { const arr = porL[l].sort((a, b) => (a.cliente || a.descricao || '').localeCompare(b.cliente || b.descricao || '')), tp = arr.reduce((s, x) => s + (+x.previsto || 0), 0), tr = arr.reduce((s, x) => s + Fat.valorRecebido(x), 0);
        return `<section class="card"><div class="card-h"><h2>${ldot(l)}${U.esc(Fat.linhaNome(l))}</h2><span class="muted small">previsto ${U.brlC(tp)} · <b class="ink">recebido ${U.brlC(tr)}</b></span></div>
          <ul class="rlist">${arr.map(x => { const ok = x.status === 'recebido', dif = ok && x.recebido != null && Math.abs(x.recebido - x.previsto) >= 0.01;
            return `<li class="${ok ? 'ok' : Fat.pendente(x) ? 'late' : ''}" data-rid="${x.id}"><button class="check${ok ? ' on' : ''}" data-act="toggle" aria-label="${ok ? 'Desmarcar' : 'Marcar como recebido'}">${UI.icon('check')}</button>
              <div class="amain" data-act="${x.producaoId ? 'prod' : x.tipo === 'recorrente' ? 'rec' : x.tipo === 'avulso' ? 'av' : 'hist'}"><b>${U.esc(x.cliente || x.descricao)}</b><div class="pmeta"><span>${U.esc(x.cliente ? x.descricao : '')}</span>${x.total > 1 ? `<span class="tag t-neutro">${x.numero}/${x.total}</span>` : ''}${TIPO_TAG[x.tipo] ? `<span class="tag t-neutro">${TIPO_TAG[x.tipo]}</span>` : ''}${x.estimado ? '<span class="tag t-aviso">sem líquido</span>' : ''}${Fat.pendente(x) ? '<span class="tag t-erro">Pendente</span>' : ''}<span>${U.fmtDate(x.previstoEm)}</span></div></div>
              <div class="rvals"><span class="muted small">previsto</span><b>${U.brlC(x.previsto)}</b></div>
              <div class="rvals">${ok ? `<span class="muted small">recebido</span><input class="rin${dif ? ' dif' : ''}" data-num inputmode="decimal" value="${String(x.recebido ?? x.previsto).replace('.', ',')}" aria-label="Valor recebido" ${x.virtual ? 'disabled' : ''}>` : ''}</div></li>`; }).join('')}</ul></section>`; }).join('')
      : `<div class="empty card"><b>Nada previsto para ${Fat.nomeMes(ym, true)}.</b><p>Os valores aparecem aqui conforme você lança produção, recorrências e avulsos.</p></div>`}`;
  }

  /* ---------- Recorrências e histórico ---------- */
  function recorrencias() {
    const rcs = Store.all('recorrencias').slice().sort((a, b) => a.descricao.localeCompare(b.descricao));
    const hist = Store.all('recebiveis').filter(r => r.tipo === 'historico'), meses = [...new Set(hist.map(h => Fat.ym(h.previstoEm)))].sort().reverse();
    const ativa = rc => Fat.recorrenciaAtiva(rc, Fat.ymHoje()) || Fat.ym(rc.inicio) > Fat.ymHoje();
    return `
      <section class="card"><div class="card-h"><h2>Recorrências</h2><button class="btn primary sm" id="novaRc">${UI.icon('mais')}Nova recorrência</button></div>
        <p class="muted small" style="margin-top:-6px">Valores fixos todo mês, como Mensal Eqseed ou Recorrência Vida.</p>
        ${rcs.length ? `<ul class="rlist">${rcs.map(rc => `<li data-rc="${rc.id}" class="${ativa(rc) ? '' : 'ok'}"><span class="ldot big" style="background:${Fat.linhaCor(rc.linhaId)}"></span><div class="amain"><b>${U.esc(rc.descricao)}</b><div class="pmeta"><span>${U.esc(Fat.linhaNome(rc.linhaId))}</span><span>de ${Fat.nomeMes(Fat.ym(rc.inicio))}${rc.fim ? ' a ' + Fat.nomeMes(Fat.ym(rc.fim)) : ' sem fim definido'} · dia ${rc.dia || 15}</span>${ativa(rc) ? '' : '<span class="tag t-neutro">Encerrada</span>'}</div></div><div class="rvals"><span class="muted small">por mês</span><b>${U.brlC(rc.valor)}</b></div><button class="icon-btn" aria-label="Editar">${UI.icon('editar')}</button></li>`).join('')}</ul>` : '<p class="muted small">Nenhuma recorrência cadastrada.</p>'}
      </section>
      <section class="card"><div class="card-h"><h2>Histórico de recebimentos</h2><button class="btn primary sm" id="novoHi">${UI.icon('mais')}Lançar mês</button></div>
        <p class="muted small" style="margin-top:-6px">Quanto você recebeu em meses anteriores, por linha, para completar o ano.</p>
        ${meses.length ? `<div class="tw"><table class="ftable"><thead><tr><th>Mês</th>${Fat.linhas(true).map(l => `<th class="r">${U.esc(l.nome)}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
          ${meses.map(m => { const hs = hist.filter(h => Fat.ym(h.previstoEm) === m); return `<tr data-hi="${m}"><td><b>${Fat.nomeMes(m, true)}</b></td>${Fat.linhas(true).map(l => { const h = hs.find(x => x.linhaId === l.id); return `<td class="r">${h ? U.brlC(h.recebido) : '<span class="muted">—</span>'}</td>`; }).join('')}<td class="r"><b>${U.brlC(hs.reduce((s, h) => s + (+h.recebido || 0), 0))}</b></td></tr>`; }).join('')}
        </tbody></table></div>` : '<p class="muted small">Nenhum mês lançado.</p>'}
      </section>`;
  }

  /* ---------- Linhas e produtos ---------- */
  function linhas() {
    return `<div class="toolbar"><p class="muted small" style="margin:0">Cada produto define o % de comissão e quando você recebe. No lançamento você pode mudar.</p><span class="grow"></span><button class="btn primary" id="novaLinha">${UI.icon('mais')}Nova linha</button></div>
      <div class="lgrid">${Fat.linhas(true).map(l => `<section class="card lcard${l.ativa === false ? ' off' : ''}" style="--c:${l.cor}"><div class="card-h"><h2>${ldot(l.id)}${U.esc(l.nome)}</h2><div><button class="icon-btn" data-ed-linha="${l.id}" aria-label="Editar linha">${UI.icon('editar')}</button><button class="icon-btn" data-arq-linha="${l.id}" title="${l.ativa === false ? 'Reativar' : 'Arquivar'}" aria-label="${l.ativa === false ? 'Reativar' : 'Arquivar'}">${UI.icon('arquivo')}</button></div></div>
        <ul class="prods">${Store.all('produtos').filter(p => p.linhaId === l.id).sort((a, b) => a.nome.localeCompare(b.nome)).map(p => `<li data-ed-prod="${p.id}" class="${p.ativo === false ? 'off' : ''}"><b>${U.esc(p.nome)}</b><span class="muted small">${Fat.regraTxt(p.regra, p.parcelas, p.grupo)}${p.comissaoPct != null ? ' · ' + U.num(p.comissaoPct) + '% comissão' : ''}${p.pctComigo != null ? ' · fica ' + U.num(p.pctComigo) + '%' : ''}</span></li>`).join('')}</ul>
        <button class="link" data-novo-prod="${l.id}">+ Produto</button></section>`).join('')}</div>`;
  }

  V.render = el => {
    const corpo = { resumo, producao, recebimentos, recorrencias, linhas }[aba]();
    el.innerHTML = `<div class="page-h"><div><h1>Faturamento</h1><p class="muted">O que você produziu, quando recebe e quanto já entrou.</p></div>${aba === 'resumo' ? `<button class="btn primary" id="novaProdTop">${UI.icon('mais')}Lançar produção</button>` : ''}</div>
      <nav class="tabs" role="tablist">${ABAS.map(([k, t]) => `<button role="tab" data-aba="${k}" aria-selected="${aba === k}">${t}</button>`).join('')}</nav>${corpo}`;

    const q = s => el.querySelector(s), on = (s, fn) => { const x = q(s); if (x) x.onclick = fn; };
    el.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { aba = b.dataset.aba; if (b.dataset.mes) mesRec = b.dataset.mes; V.render(el); });
    el.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { const d = +b.dataset.d; if (b.dataset.nav === 'prod') mesProd = Fat.addMes(mesProd || Fat.ymHoje(), d); else mesRec = Fat.addMes(mesRec || Fat.proximoPagamento(), d); V.render(el); });
    el.querySelectorAll('[data-ano]').forEach(b => b.onclick = () => { ano += +b.dataset.ano; V.render(el); });
    el.querySelectorAll('[data-rank]').forEach(b => b.onclick = () => { rank = b.dataset.rank; V.render(el); });
    const fl = q('#fLinha'); if (fl) fl.onchange = () => { fLinha = fl.value; V.render(el); };
    ['#novaProd', '#novaProd2', '#novaProdTop'].forEach(s => on(s, () => App.Forms.producao(null, mesProd && mesProd !== Fat.ymHoje() ? { data: mesProd + '-01' } : {})));
    el.querySelectorAll('[data-prod]').forEach(tr => tr.onclick = () => App.Forms.producao(tr.dataset.prod));
    on('#novoAv', () => App.Forms.avulso(null, { previstoEm: Fat.dia15(mesRec || Fat.proximoPagamento()) }));
    on('#todos', async () => {
      const ym = mesRec || Fat.proximoPagamento(), ab = Fat.doMes(ym).filter(x => x.status !== 'recebido' && (!fLinha || x.linhaId === fLinha));
      if (!(await UI.confirm({ title: 'Marcar todos como recebidos?', text: `${U.plural(ab.length, 'lançamento', 'lançamentos')} de ${Fat.nomeMes(ym, true)} somando <b>${U.brlC(ab.reduce((s, x) => s + (+x.previsto || 0), 0))}</b> serão marcados com o valor previsto. Você pode corrigir cada valor depois.`, ok: 'Marcar todos', danger: false }))) return;
      ab.forEach(x => Fat.marcarRecebido(x, null, true)); Store.commit(); UI.toast('Recebimentos conferidos');
    });
    el.querySelectorAll('.rlist [data-rid]').forEach(li => {
      const achar = () => Fat.doMes(mesRec || Fat.proximoPagamento()).find(x => x.id === li.dataset.rid);
      li.addEventListener('click', e => {
        const b = e.target.closest('[data-act]'); if (!b) return; const x = achar(); if (!x) return;
        if (b.dataset.act === 'toggle') { if (x.status === 'recebido') Fat.desmarcar(x); else { Fat.marcarRecebido(x); Store.commit(); } return; }
        if (b.dataset.act === 'prod') App.Forms.producao(x.producaoId);
        if (b.dataset.act === 'rec') App.Forms.recorrencia(x.recorrenciaId);
        if (b.dataset.act === 'av') App.Forms.avulso(x.id);
        if (b.dataset.act === 'hist') App.Forms.historico(Fat.ym(x.previstoEm));
      });
      const inp = li.querySelector('.rin');
      if (inp) inp.addEventListener('change', () => { const v = U.parseNum(inp.value); const x = achar(); if (v != null && x && !x.virtual) { Store.update('recebiveis', x.id, { recebido: v }); UI.toast('Valor recebido ajustado'); } });
    });
    on('#novaRc', () => App.Forms.recorrencia(null));
    el.querySelectorAll('[data-rc]').forEach(li => li.onclick = () => App.Forms.recorrencia(li.dataset.rc));
    on('#novoHi', () => App.Forms.historico());
    el.querySelectorAll('[data-hi]').forEach(tr => tr.onclick = () => App.Forms.historico(tr.dataset.hi));
    on('#novaLinha', () => App.Forms.linha(null));
    el.querySelectorAll('[data-ed-linha]').forEach(b => b.onclick = () => App.Forms.linha(b.dataset.edLinha));
    el.querySelectorAll('[data-arq-linha]').forEach(b => b.onclick = () => { const l = Fat.linha(b.dataset.arqLinha); Store.update('linhas', l.id, { ativa: l.ativa === false }); UI.toast(l.ativa === false ? 'Linha arquivada' : 'Linha reativada'); });
    el.querySelectorAll('[data-ed-prod]').forEach(li => li.onclick = () => App.Forms.produto(li.dataset.edProd));
    el.querySelectorAll('[data-novo-prod]').forEach(b => b.onclick = () => App.Forms.produto(null, b.dataset.novoProd));
  };

  App.Views = App.Views || {};
  App.Views.faturamento = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/metas.js */
/* Tela: Metas e indicadores. Atividade realizada ≠ resultado alcançado. */
(function (App) {
  const { U, M, UI, Store, Charts } = App;
  const V = { titulo: 'Metas' };
  let fResp = '', fPer = '', verEncerradas = false;

  V.setParams = q => { if (q && q.resp) fResp = q.resp; };

  const cartao = m => {
    const atual = M.metaAtual(m), p = M.metaPct(m), s = M.metaSituacao(m), t = M.metaTempo(m), cor = M.respCor(m.responsabilidadeId);
    const ats = M.metaAtividades(m.id), feitas = ats.filter(a => a.status === 'concluida');
    const regs = m.modo === 'manual' ? M.metaRegistros(m.id) : feitas.sort((a, b) => (a.concluidaEm || '').localeCompare(b.concluidaEm || '')).reduce((acc, a) => { acc.push((acc[acc.length - 1] || 0) + (M.resMeta(a, m.id) || 0)); return acc; }, []);
    const vals = m.modo === 'manual' ? regs.map(r => r.valor) : regs;
    const falta = Math.max(0, m.alvo - atual);
    return `<article class="card meta" data-id="${m.id}" style="--c:${cor}">
      <div class="meta-h"><div>${UI.respChip(m.responsabilidadeId)}<h3>${U.esc(m.nome)}</h3></div><span class="tag t-${s.id}">${s.label}</span></div>
      <div class="meta-num"><b>${U.num(atual)}</b><span>de ${U.num(m.alvo)} ${U.esc(m.unidade || '')}</span><em>${U.pct(p)}</em></div>
      <div class="meta-bar">${UI.bar(p, cor)}${t != null ? `<i class="tmark" style="left:${t * 100}%" title="Tempo decorrido do período"></i>` : ''}</div>
      <div class="meta-info small muted"><span>${M.period(m.periodicidade).label}${m.inicio && m.fim ? ' · ' + U.fmtDate(m.inicio) + ' a ' + U.fmtDate(m.fim) : ''}</span>${p < 1 ? `<span>Faltam ${U.num(falta)}</span>` : ''}</div>
      ${vals.length > 1 ? Charts.spark(vals, m.alvo) : ''}
      ${m.modo === 'atividades' ? `<div class="meta-acts-info"><span><b>${ats.length}</b> atividades vinculadas</span><span><b>${feitas.length}</b> realizadas</span><span><b>${U.num(atual)}</b> ${U.esc(m.unidade || 'resultados')} obtidos</span></div>` : ''}
      ${m.descricao ? `<p class="small muted">${U.esc(m.descricao)}</p>` : ''}
      <div class="meta-f">
        ${m.modo === 'manual' ? `<button class="btn primary sm" data-act="atualizar">Atualizar resultado</button>` : `<button class="btn ghost sm" data-act="nova-at">${UI.icon('mais')}Atividade para esta meta</button>`}
        <span class="grow"></span>
        <button class="icon-btn" data-act="ver" title="Ver atividades" aria-label="Ver atividades">${UI.icon('atividades')}</button>
        <button class="icon-btn" data-act="editar" title="Editar" aria-label="Editar">${UI.icon('editar')}</button>
        <button class="icon-btn" data-act="excluir" title="Excluir" aria-label="Excluir">${UI.icon('lixo')}</button>
      </div></article>`;
  };

  V.render = el => {
    const hoje = U.today();
    const todas = Store.all('metas').filter(m => (!fResp || m.responsabilidadeId === fResp) && (!fPer || m.periodicidade === fPer));
    const ativas = todas.filter(m => !(m.fim && m.fim < hoje)), enc = todas.filter(m => m.fim && m.fim < hoje);
    const lista = verEncerradas ? enc : ativas;
    el.innerHTML = `
      <div class="page-h"><div><h1>Metas</h1><p class="muted">Atividades são o que você faz. Metas medem o resultado que você alcança.</p></div>
        <button class="btn primary" id="novaMeta">${UI.icon('mais')}Nova meta</button></div>
      <div class="filters">
        <select id="mResp" aria-label="Responsabilidade">${UI.options(Store.all('responsabilidades').map(x => ({ id: x.id, label: x.nome })), fResp, { vazio: 'Todas as responsabilidades' })}</select>
        <select id="mPer" aria-label="Periodicidade">${UI.options(M.PERIODICIDADES, fPer, { vazio: 'Qualquer periodicidade' })}</select>
        <div class="seg" role="group"><button data-enc="0" aria-pressed="${!verEncerradas}">Ativas · ${ativas.length}</button><button data-enc="1" aria-pressed="${verEncerradas}">Encerradas · ${enc.length}</button></div>
      </div>
      ${lista.length ? `<div class="mgrid">${lista.map(cartao).join('')}</div>` : `<div class="empty card"><b>${verEncerradas ? 'Nenhuma meta encerrada.' : 'Nenhuma meta ativa.'}</b><p>Exemplos: conseguir 30 indicações, realizar 15 reuniões, prospectar 50 pessoas.</p>${verEncerradas ? '' : `<button class="btn primary" id="novaMeta2">${UI.icon('mais')}Criar meta</button>`}</div>`}`;
    el.querySelector('#novaMeta').onclick = () => App.Forms.meta(null);
    const n2 = el.querySelector('#novaMeta2'); if (n2) n2.onclick = () => App.Forms.meta(null);
    el.querySelector('#mResp').onchange = e => { fResp = e.target.value; V.render(el); };
    el.querySelector('#mPer').onchange = e => { fPer = e.target.value; V.render(el); };
    el.querySelectorAll('[data-enc]').forEach(b => b.onclick = () => { verEncerradas = b.dataset.enc === '1'; V.render(el); });
    el.querySelectorAll('.meta').forEach(c => c.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const id = c.dataset.id, mt = Store.get('metas', id);
      if (b.dataset.act === 'atualizar') App.Forms.atualizarMeta(id);
      if (b.dataset.act === 'editar') App.Forms.meta(id);
      if (b.dataset.act === 'nova-at') App.Forms.atividade(null, { responsabilidadeId: mt.responsabilidadeId, metaIds: [id] });
      if (b.dataset.act === 'ver') App.go('atividades', { status: '', resp: mt.responsabilidadeId, categoria: '', metaId: id }, { origem: true });
      if (b.dataset.act === 'excluir') {
        const n = M.metaAtividades(id).length;
        if (await UI.confirm({ title: 'Excluir meta?', text: `"${U.esc(mt.nome)}" e a evolução registrada serão apagadas.${n ? ` As ${n} atividades vinculadas continuam, só perdem o vínculo.` : ''}`, ok: 'Excluir meta' })) { M.excluirMeta(id); UI.toast('Meta excluída'); }
      }
    }));
  };

  App.Views = App.Views || {};
  App.Views.metas = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/responsabilidades.js */
/* Tela: Responsabilidades (cadastrar, editar, arquivar e excluir). */
(function (App) {
  const { U, M, UI, Store } = App;
  const V = { titulo: 'Responsabilidades' };
  let verArq = false;

  V.render = el => {
    const todas = Store.all('responsabilidades'), arq = todas.filter(r => r.status === 'arquivada'), ativas = todas.filter(r => r.status !== 'arquivada');
    const lista = verArq ? arq : ativas;
    el.innerHTML = `
      <div class="page-h"><div><h1>Responsabilidades</h1><p class="muted">As frentes da sua vida profissional e pessoal. Cada uma tem suas atividades e metas.</p></div>
        <button class="btn primary" id="novaResp">${UI.icon('mais')}Nova responsabilidade</button></div>
      <div class="filters"><div class="seg" role="group"><button data-arq="0" aria-pressed="${!verArq}">Ativas · ${ativas.length}</button><button data-arq="1" aria-pressed="${verArq}">Arquivadas · ${arq.length}</button></div></div>
      ${lista.length ? `<div class="respgrid">${lista.map(r => {
        const at = Store.where('atividades', a => a.responsabilidadeId === r.id), ab = at.filter(M.aberta), l = at.filter(M.atrasada).length, c = at.length - ab.length;
        const mts = Store.where('metas', m => m.responsabilidadeId === r.id);
        return `<article class="card resp" data-id="${r.id}" style="--c:${r.cor}">
          <div class="resp-h"><i class="dot"></i><h3>${U.esc(r.nome)}</h3>${r.status === 'arquivada' ? '<span class="tag t-neutro">Arquivada</span>' : ''}</div>
          ${r.descricao ? `<p class="muted small">${U.esc(r.descricao)}</p>` : ''}
          <div class="resp-nums"><div><b>${ab.length}</b><span>em aberto</span></div><div class="${l ? 'late' : ''}"><b>${l}</b><span>atrasadas</span></div><div><b>${c}</b><span>concluídas</span></div><div><b>${mts.length}</b><span>metas</span></div></div>
          ${UI.bar(at.length ? c / at.length : 0, r.cor)}
          <div class="meta-f">
            <button class="btn ghost sm" data-act="ativ">Atividades</button><button class="btn ghost sm" data-act="metas">Metas</button><span class="grow"></span>
            <button class="icon-btn" data-act="editar" title="Editar" aria-label="Editar">${UI.icon('editar')}</button>
            <button class="icon-btn" data-act="arquivar" title="${r.status === 'arquivada' ? 'Reativar' : 'Arquivar'}" aria-label="${r.status === 'arquivada' ? 'Reativar' : 'Arquivar'}">${UI.icon('arquivo')}</button>
            <button class="icon-btn" data-act="excluir" title="Excluir" aria-label="Excluir">${UI.icon('lixo')}</button>
          </div></article>`;
      }).join('')}</div>` : `<div class="empty card"><b>${verArq ? 'Nenhuma responsabilidade arquivada.' : 'Nenhuma responsabilidade cadastrada.'}</b><p>${verArq ? 'Arquive uma responsabilidade quando ela deixar de ser sua, sem perder o histórico.' : 'Comece pelas suas frentes, como Assessoria de Investimentos.'}</p></div>`}`;

    el.querySelector('#novaResp').onclick = () => App.Forms.resp(null);
    el.querySelectorAll('[data-arq]').forEach(b => b.onclick = () => { verArq = b.dataset.arq === '1'; V.render(el); });
    el.querySelectorAll('.resp').forEach(c => c.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const r = Store.get('responsabilidades', c.dataset.id);
      if (b.dataset.act === 'editar') App.Forms.resp(r.id);
      if (b.dataset.act === 'ativ') App.go('atividades', { resp: r.id, status: '' }, { origem: true });
      if (b.dataset.act === 'metas') App.go('metas', { resp: r.id }, { origem: true });
      if (b.dataset.act === 'arquivar') {
        const arquivar = r.status !== 'arquivada';
        if (arquivar && !(await UI.confirm({ title: 'Arquivar responsabilidade?', text: `"${U.esc(r.nome)}" sai do painel e dos cadastros novos. As atividades e metas continuam guardadas, e você pode reativar quando quiser.`, ok: 'Arquivar', danger: false }))) return;
        Store.update('responsabilidades', r.id, { status: arquivar ? 'arquivada' : 'ativa' }); UI.toast(arquivar ? 'Responsabilidade arquivada' : 'Responsabilidade reativada');
      }
      if (b.dataset.act === 'excluir') {
        const na = Store.where('atividades', a => a.responsabilidadeId === r.id).length, nm = Store.where('metas', m => m.responsabilidadeId === r.id).length;
        const ok = await UI.confirm({ title: 'Excluir responsabilidade?', text: `"${U.esc(r.nome)}" será apagada${na || nm ? ` junto com <b>${U.plural(na, 'atividade', 'atividades')}</b> e <b>${U.plural(nm, 'meta', 'metas')}</b>` : ''}. Isso não pode ser desfeito. Se quiser só tirar do caminho, use Arquivar.`, ok: 'Excluir tudo' });
        if (ok) { M.excluirResp(r.id); UI.toast('Responsabilidade excluída'); }
      }
    }));
  };

  App.Views = App.Views || {};
  App.Views.responsabilidades = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/dados.js */
/* Tela: Backup e dados (exportar, importar, demonstração, apagar tudo). */
(function (App) {
  const { U, UI, Store, Backup, Demo } = App;
  const V = { titulo: 'Backup e dados' };

  V.render = el => {
    const ult = Store.config('ultimoBackup'), demo = Demo.count();
    const n = c => Store.all(c).length;
    el.innerHTML = `
      <div class="page-h"><div><h1>Backup e dados</h1><p class="muted">${Store.adapter().remote ? 'Seus dados ficam na nuvem. O backup em JSON é uma cópia extra, sua, para guardar.' : 'Seus dados ficam salvos neste navegador. Faça backups para não perdê-los e para levar a outro computador.'}</p></div></div>
      <div class="dgrid">
        <section class="card">
          <div class="card-h"><h2>Backup</h2></div>
          <p class="small">Último backup: <b>${ult ? U.fmtDateTime(ult) : 'nunca feito'}</b></p>
          <div class="dnums"><span><b>${n('responsabilidades')}</b> responsabilidades</span><span><b>${n('atividades')}</b> atividades</span><span><b>${n('metas')}</b> metas</span><span><b>${n('faturamento')}</b> lançamentos de faturamento</span><span><b>${Store.sizeKB()} KB</b> usados</span></div>
          <div class="btns"><button class="btn primary" id="exp">Baixar backup (.json)</button></div>
          <p class="note">Guarde o arquivo numa pasta segura ou na nuvem (Google Drive, OneDrive). Recomendo um backup por semana.</p>
        </section>
        <section class="card">
          <div class="card-h"><h2>Restaurar backup</h2></div>
          <p class="small">Substitui <b>todos</b> os dados atuais pelos do arquivo. Você confirma antes.</p>
          <label class="btn ghost file-btn">Escolher arquivo .json<input type="file" id="imp" accept=".json,application/json"></label>
        </section>
        <section class="card">
          <div class="card-h"><h2>Dados de demonstração</h2></div>
          ${demo.atividades + demo.metas + demo.faturamento ? `<p class="small">Existem <b>${U.plural(demo.atividades, 'atividade', 'atividades')}</b>, <b>${U.plural(demo.metas, 'meta', 'metas')}</b> e <b>${U.plural(demo.faturamento, 'lançamento', 'lançamentos')}</b> de faturamento de exemplo, incluindo a Campanha de indicações 2027. Suas responsabilidades e o que você cadastrou não são apagados.</p>
            <div class="btns"><button class="btn danger" id="delDemo">Apagar dados de demonstração</button></div>`
            : `<p class="small">Nenhum dado de demonstração no momento.</p><div class="btns"><button class="btn ghost" id="addDemo">Carregar exemplos</button></div>`}
        </section>
        <section class="card">
          <div class="card-h"><h2>Apagar tudo</h2></div>
          <p class="small">Remove responsabilidades, atividades, metas e históricos${Store.adapter().remote ? ' da nuvem e de todos os aparelhos' : ' deste navegador'}. Faça um backup antes.</p>
          <div class="btns"><button class="btn danger" id="clear">Apagar todos os dados</button></div>
        </section>
        <section class="card wide">
          <div class="card-h"><h2>Onde os dados ficam</h2></div>
          ${Store.adapter().remote
            ? `<p class="small">Na <b>nuvem (Supabase)</b>, na conta <b>${U.esc(Store.adapter().email || '')}</b>. Entre com essa conta em qualquer computador ou celular para ver os mesmos dados. Cada alteração é salva automaticamente, e sem internet ela fica guardada no aparelho até a conexão voltar.</p>
               <div class="btns"><button class="btn ghost" id="sync">Atualizar agora</button><button class="btn ghost" id="logout">Sair da conta</button></div>`
            : `<p class="small">Armazenamento atual: <b>${Store.adapter().name}</b>. ${Store.available() ? 'Os dados continuam aqui ao fechar e reabrir o navegador.' : '<b class="late">O navegador está bloqueando o armazenamento (janela anônima ou bloqueio de dados). Nada será guardado ao fechar.</b>'}</p>
               <p class="note">Limpar os dados de navegação ou usar outro navegador começa com o painel vazio. Por isso o backup é importante.</p>`}
        </section>
      </div>`;

    el.querySelector('#exp').onclick = async () => { const ok = await Backup.exportar(); UI.toast(ok ? 'Backup baixado' : 'O download não foi concluído', ok ? 'ok' : 'aviso'); if (ok) V.render(el); };
    el.querySelector('#imp').onchange = async e => {
      const file = e.target.files[0]; e.target.value = ''; if (!file) return;
      try {
        const r = await Backup.ler(file);
        const ok = await UI.confirm({ title: 'Restaurar este backup?', text: `O arquivo tem <b>${r.resumo.responsabilidades}</b> responsabilidades, <b>${r.resumo.atividades}</b> atividades e <b>${r.resumo.metas}</b> metas${r.exportadoEm ? ', exportado em ' + U.fmtDateTime(r.exportadoEm) : ''}. Os dados atuais serão substituídos.`, ok: 'Restaurar' });
        if (ok) { Backup.restaurar(r.dados); UI.toast('Backup restaurado'); App.go('painel'); }
      } catch (err) { UI.toast(err.message, 'erro'); }
    };
    const dd = el.querySelector('#delDemo');
    if (dd) dd.onclick = async () => { if (await UI.confirm({ title: 'Apagar dados de demonstração?', text: 'As atividades e metas de exemplo serão apagadas, inclusive se você tiver editado alguma delas. Metas de exemplo usadas por atividades suas são mantidas.', ok: 'Apagar exemplos' })) { const r = Demo.remove(); UI.toast(`Exemplos apagados: ${U.plural(r.atividades, 'atividade', 'atividades')}, ${U.plural(r.metas, 'meta', 'metas')} e ${U.plural(r.faturamento, 'lançamento', 'lançamentos')}`); } };
    const ad = el.querySelector('#addDemo');
    if (ad) ad.onclick = () => { Demo.seed(); UI.toast('Exemplos carregados'); };
    const sy = el.querySelector('#sync'); if (sy) sy.onclick = async () => { try { await Store.sincronizar(); UI.toast('Dados atualizados'); } catch (e) { UI.toast('Não foi possível atualizar agora.', 'erro'); } };
    const lo = el.querySelector('#logout'); if (lo) lo.onclick = () => App.Cloud.sair();
    el.querySelector('#clear').onclick = async () => {
      if (!(await UI.confirm({ title: 'Apagar todos os dados?', text: 'Tudo o que está neste navegador será apagado: responsabilidades, atividades, metas e históricos. Isso não pode ser desfeito.', ok: 'Continuar' }))) return;
      if (!(await UI.confirm({ title: 'Tem certeza?', text: 'Última confirmação. Se ainda não fez backup, cancele e baixe o backup primeiro.', ok: 'Apagar tudo' }))) return;
      Store.clear(); App.Fat.garantir(); UI.toast('Todos os dados foram apagados');
    };
  };

  App.Views = App.Views || {};
  App.Views.dados = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/emails.js */
/* E-mails para responder: triados pelo Claude a partir do Outlook e gravados na tabela "emails".
   Registro: { msgId, remetente, remetenteEmail, assunto, resumo, motivo, prioridade, recebidoEm, link,
               sugestao, status: 'novo' | 'respondido' | 'arquivado', atividadeId, cliente, triadoEm,
               tipo: 'email' | 'convite', eventoId, evento: { inicio, fim, local, organizador }, conflito,
               rascunhoId, rascunhoLink,
               acao: { tipo: 'aceitar' | 'talvez' | 'recusar' | 'enviar', texto, comentario, status: 'pendente' | 'feito' | 'erro', pedidoEm, feitoEm, erro } }
   O painel só registra o pedido em "acao"; o Claude executa no Outlook na próxima leitura. */
(function (App) {
  const { U, M, UI, Store } = App;
  const E = {};
  const PESO = { alta: 3, media: 2, baixa: 1 };
  const PRIO = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };

  E.todos = () => Store.all('emails');
