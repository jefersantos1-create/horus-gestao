    if (cp.t === 'url') return `<label class="f full"><span>${cp.l}</span><input type="url" name="${cp.k}" value="${U.esc(val)}" placeholder="Cole aqui o link do arquivo no OneDrive / SharePoint"></label>`;
    if (cp.t === 'data') return `<label class="f"><span>${cp.l}</span><input type="date" name="${cp.k}" value="${val || ''}"></label>`;
    if (['brl', 'num', 'usd'].includes(cp.t)) return `<label class="f"><span>${cp.l}</span><input name="${cp.k}" data-num inputmode="decimal" value="${num(v[cp.k])}" placeholder="${cp.t === 'brl' ? 'R$' : cp.t === 'usd' ? 'US$' : ''}"></label>`;
    return `<label class="f"><span>${cp.l}</span><input name="${cp.k}" maxlength="80" value="${U.esc(val)}"></label>`;
  };

  F.contrato = (id, preset = {}) => {
    const ct = id ? Store.get('contratos', id) : null;
    const v = ct || { status: 'ativo', ...preset };
    const fixoCli = ct ? Cli.cliente(ct.clienteId) : preset.clienteId ? Cli.cliente(preset.clienteId) : null;
    const prods = Cli.PRODUTOS.filter(p => !p.especial && (Cli.visivel(p.id) || p.id === v.produto || p.id === preset.produto));
    let pid = v.produto && v.produto !== 'mb' ? v.produto : (preset.produto || 'consorcio');
    UI.modal({
      title: ct ? 'Editar produto do cliente' : 'Adicionar produto', size: 'md',
      body: `<form class="form" id="fCt" novalidate>
        ${fixoCli ? `<div class="cli-fixo"><span class="cl-av">${U.esc(Cli.apelido(fixoCli).slice(0, 2).toUpperCase())}</span><b>${U.esc(fixoCli.nome)}</b></div>`
          : `<label class="f full"><span>Cliente</span><input name="_cliente" list="dlClis" required placeholder="Digite o nome; se não existir, será cadastrado" autocomplete="off" autofocus><datalist id="dlClis">${Cli.clientes().map(c => `<option value="${U.esc(c.nome)}">`).join('')}</datalist></label>`}
        ${ct ? `<div class="f full"><span>Produto</span><b>${U.esc(Cli.produto(pid).nome)}</b></div>` : `<div class="f full"><span>Produto</span><div class="prod-pick">${prods.map(p => `<button type="button" class="qd${p.id === pid ? ' on' : ''}" data-p="${p.id}"><i style="background:${p.cor}"></i>${U.esc(p.nome)}</button>`).join('')}</div></div>`}
        <div class="ct-campos" id="ctCampos"></div>
        ${ct ? `<div class="f full"><span>Situação</span>${UI.segmented('status', [{ id: 'ativo', label: 'Ativo' }, { id: 'encerrado', label: 'Encerrado' }], v.status || 'ativo')}</div>` : ''}
        <label class="f full"><span>Observações</span><textarea name="observacoes" rows="2">${U.esc(v.observacoes || '')}</textarea></label>
        <p class="ferr" id="errCt" hidden></p></form>`,
      footer: `${ct ? `<button class="btn ghost danger" data-del>${UI.icon('lixo')}Excluir</button><span class="grow"></span>` : ''}<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fCt" type="submit">${ct ? 'Salvar' : 'Adicionar'}</button>`,
      onMount(el, api) {
        const f = el.querySelector('#fCt');
        const desenhar = () => { const p = Cli.produto(pid); el.querySelector('#ctCampos').innerHTML = `<div class="ct-grid">${p.campos.map(cp => campoHTML(cp, v)).join('')}</div><datalist id="dlSeg">${Cli.seguradoras().map(x => `<option value="${U.esc(x)}">`).join('')}</datalist>`; };
        el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { pid = b.dataset.p; el.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', x === b)); desenhar(); });
        desenhar();
        f.onsubmit = e => {
          e.preventDefault();
          const d = UI.formData(f), er = el.querySelector('#errCt');
          let cli = fixoCli;
          if (!cli) {
            const nome = (d._cliente || '').trim();
            if (!nome) { er.textContent = 'Escolha ou escreva o nome do cliente.'; er.hidden = false; return; }
            cli = Cli.porNome(nome) || Cli.criar({ nome }, { silent: true });
          }
          delete d._cliente;
          Cli.produto(pid).campos.forEach(cp => { if (cp.t === 'sim') d[cp.k] = !!d[cp.k]; if (cp.t === 'mes' && d[cp.k]) d[cp.k] = +d[cp.k]; if (cp.t === 'url' && d[cp.k] && !/^https?:\/\//i.test(d[cp.k])) d[cp.k] = 'https://' + d[cp.k]; });
          /* Seguradora nova digitada entra na lista de Ajustes */
          const segs = Cli.produto(pid).campos.filter(cp => cp.t === 'seg').map(cp => (d[cp.k] || '').trim()).filter(x => x && !Cli.seguradoras().some(y => Cli.norm(y) === Cli.norm(x)));
          if (segs.length) Cli.salvarSeguradoras(Cli.seguradoras().concat(segs));
          if (App.Pat) Object.assign(d, App.Pat.posHistDe(pid, ct, d));
          if (ct) { Store.update('contratos', ct.id, d); UI.toast('Produto atualizado'); }
          else { Store.insert('contratos', { ...d, clienteId: cli.id, produto: pid, status: 'ativo' }); UI.toast(Cli.produto(pid).nome + ' adicionado para ' + Cli.apelido(cli)); }
          api.close();
        };
        const del = el.querySelector('[data-del]');
        if (del) del.onclick = async () => {
          if (!await UI.confirm({ title: 'Excluir este produto?', text: 'O registro de ' + U.esc(Cli.produto(pid).nome) + ' deste cliente será apagado. Se ele só deixou de ter o produto, prefira marcar como Encerrado.', ok: 'Excluir' })) return;
          Store.remove('contratos', ct.id); api.close(); UI.toast('Produto excluído');
        };
      }
    });
  };
})(window.App = window.App || {});

</script>
<script>
/* js/ui/renovacoes.js */
/* Renovações (Parte 2 do roteiro Assessoria 360).
   Cada vencimento (contrato comigo, área mapeada com outro corretor, renda fixa do MB) vira um item com status
   quando entra na antecedência do seu grupo, e só sai do Painel quando o usuário dá baixa.
   Tabela: renovacoes (jsonb). id determinístico 'ren_<chave>' para não duplicar entre aparelhos.
   dados: { chave, origem: 'contrato'|'mapa'|'mb', data, clienteId, nomeMB, ctId, produto, campo, area, mbCid, ativo,
            grupo, rotulo, status, obs, baixaEm, historico: [{ em, status, obs }], atividadeId, baixaAtv } 
   Parte 2.1: a renovação não lança receita sozinha. Pelo botão "Criar atividade" (ou "Ligar a atividade existente") vira uma
   atividade-negócio (extras.renovacaoId); a receita sai do fluxo normal de concluir negócio. Os status andam juntos. */
(function (App) {
  const { U, Store } = App;
  const R = {};
  const cli = () => App.Cli;

  /* ---------- Antecedência por grupo (Ajustes) ---------- */
  R.GRUPOS = [
    { id: 'seguros', nome: 'Seguros (vida, auto, RC, residencial)', padrao: 30 },
    { id: 'rf', nome: 'Renda fixa (MB)', padrao: 15 },
    { id: 'saude', nome: 'Plano de saúde (renovação e reajuste)', padrao: 30 },
    { id: 'consorcio', nome: 'Consórcio', padrao: 30 },
    { id: 'internacional', nome: 'ITA e internacionais', padrao: 30 },
    { id: 'outros', nome: 'Outros', padrao: 30 }
  ];
  R.antec = gid => { const c = Store.config('antecedencia') || {}, g = R.GRUPOS.find(x => x.id === gid) || R.GRUPOS[R.GRUPOS.length - 1]; const v = +c[gid]; return v >= 0 && v <= 365 && c[gid] != null && c[gid] !== '' ? v : g.padrao; };
  R.salvarAntec = (gid, dias) => { const c = { ...(Store.config('antecedencia') || {}) }; c[gid] = Math.max(0, Math.min(365, Math.round(+dias || 0))); Store.config('antecedencia', c); };

  /* ---------- Status ---------- */
  const FINAIS = ['renovado', 'migrado', 'perdido'];
  R.final = s => FINAIS.includes(s);
  R.opcoes = r => {
    const base = [{ id: 'a_tratar', label: 'A tratar' }, { id: 'cotacao', label: r.origem === 'mb' ? 'Em conversa' : 'Em cotação' }];
    if (r.origem === 'mapa') return base.concat([{ id: 'migrado', label: 'Migrado para mim' }, { id: 'perdido', label: 'Ficou com o outro' }]);
    if (r.origem === 'mb') return base.concat([{ id: 'renovado', label: 'Reaplicado' }, { id: 'perdido', label: 'Resgatado' }]);
    if (r.campo === 'reajuste') return base.concat([{ id: 'renovado', label: 'Reajuste tratado' }, { id: 'perdido', label: 'Cancelou' }]);
    if (r.produto === 'ita') return base.concat([{ id: 'renovado', label: 'Aporte pago' }, { id: 'perdido', label: 'Não vai aportar' }]);
    return base.concat([{ id: 'renovado', label: 'Renovado' }, { id: 'perdido', label: 'Perdido' }]);
  };
  R.rotStatus = r => (R.opcoes(r).find(o => o.id === r.status) || { label: 'A tratar' }).label;

  /* ---------- De onde vêm os vencimentos ---------- */
  const slug = s => cli().norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  const grupoCt = ct => ct.produto === 'ita' ? 'internacional' : ct.produto === 'saude' || (ct.produto === 're' && ct.tipo === 'Plano de saúde') ? 'saude' : ['vida', 're', 'rc', 'auto'].includes(ct.produto) ? 'seguros' : ct.produto === 'consorcio' ? 'consorcio' : 'outros';
  const grupoArea = a => a.id === 'saude' ? 'saude' : a.seguro ? 'seguros' : a.id === 'consorcio' ? 'consorcio' : a.id === 'internacional' ? 'internacional' : 'outros';
  R.candidatos = () => {
    const C = cli(), out = [], hoje = U.today();
    Store.all('contratos').forEach(ct => {
      const d = C.proxData(ct); if (!d) return;
      const campo = C.campoVenc(ct), base = { origem: 'contrato', ctId: ct.id, clienteId: ct.clienteId, produto: ct.produto, campo, grupo: grupoCt(ct), rotulo: C.rotuloVenc(ct) };
      out.push({ ...base, data: d, chave: `ct_${ct.id}_${d}` });
      /* Reajuste: a data "pula" para o ano seguinte quando o mês passa; o reajuste que passou sem baixa continua valendo */
      if (campo === 'reajuste') { const p = U.parse(d); p.setFullYear(p.getFullYear() - 1); const ant = U.iso(p); if (ant >= U.addDays(hoje, -90)) out.push({ ...base, data: ant, chave: `ct_${ct.id}_${ant}` }); }
    });
    const mb = C.mbAtual();
    if (mb) (mb.positions || []).forEach(ps => {
      const d = C.dataMB(ps.venc); if (!d) return;
      const cl = (mb.clients || []).find(c => String(c.id) === String(ps.cid)); if (!cl) return;
      const c = C.porMbId(ps.cid);
      out.push({ origem: 'mb', data: d, chave: `mb_${ps.cid}_${slug(ps.ativo)}_${d}`, clienteId: c ? c.id : null, nomeMB: cl.nome, mbCid: String(ps.cid), ativo: ps.ativo, produto: 'mb', grupo: 'rf', rotulo: `${ps.ativo} vence no MB · ${U.brl(ps.saldo)}` });
    });
    Store.all('clientes').forEach(c => Object.entries(c.mapa || {}).forEach(([aid, m]) => {
      if (m.sit !== 'mapeado' || !m.venc) return; const a = C.area(aid); if (!a) return;
      out.push({ origem: 'mapa', data: m.venc, chave: `mp_${c.id}_${aid}_${m.venc}`, clienteId: c.id, area: aid, produto: (a.prods[0] || '').split(':')[0], grupo: grupoArea(a), rotulo: `${a.nome} com ${m.onde || 'outro corretor'} · mapeado` });
    }));
    return out;
  };
  const idDe = chave => 'ren_' + chave;

  /* ---------- Sincroniza (cria os itens que entraram na antecedência) e devolve os abertos ---------- */
  let agendado = false;
  const gravarDepois = () => { if (agendado) return; agendado = true; setTimeout(() => { agendado = false; Store.commit(); }, 0); };
  R.sincronizar = () => {
    const C = cli(); if (!C) return;
    const hoje = U.today(), agora = U.nowISO(); let mudou = false;
    const cands = R.candidatos();
    cands.forEach(k => {
      if (k.data > U.addDays(hoje, R.antec(k.grupo)) || k.data < U.addDays(hoje, -90)) return;
      const id = idDe(k.chave), ja = Store.get('renovacoes', id);
      if (ja) { if (!R.final(ja.status) && ja.rotulo !== k.rotulo) { Store.update('renovacoes', id, { rotulo: k.rotulo, clienteId: k.clienteId || ja.clienteId }, { silent: true }); mudou = true; } return; }
      Store.insert('renovacoes', { id, ...k, status: 'a_tratar', historico: [{ em: agora, status: 'a_tratar', obs: 'Entrou na antecedência de ' + R.antec(k.grupo) + ' dias' }] }, { silent: true });
      mudou = true;
    });
    /* Atividade ligada: status andam juntos (a conclusão feita pelo painel passa por R.aoConcluir, que pergunta o resto) */
    Store.all('renovacoes').forEach(r => {
      if (!r.atividadeId) return;
      const a = Store.get('atividades', r.atividadeId);
      const hist = (st, obs) => (r.historico || []).concat({ em: agora, status: st, obs, auto: true });
      if (!a) { Store.update('renovacoes', r.id, { atividadeId: null, historico: hist(r.status, 'A atividade ligada foi excluída') }, { silent: true }); mudou = true; return; }
      if (segurando.has(a.id)) return;
      const aberta = a.status !== 'concluida';
      if (!R.final(r.status) && aberta && r.status === 'a_tratar') { Store.update('renovacoes', r.id, { status: 'cotacao', historico: hist('cotacao', 'Atividade ligada em andamento') }, { silent: true }); mudou = true; return; }
      if (!R.final(r.status) && !aberta) { const res = R.resultadoAtv(a, r); if (res) { const st = R.stDoResultado(r, res); Store.update('renovacoes', r.id, { status: st, baixaEm: agora, baixaAtv: a.id, historico: hist(st, 'Atividade concluída: ' + (res === 'ganho' ? 'negócio fechado' : 'negócio não fechou')) }, { silent: true }); if (st === 'migrado') R.marcarComigo(r); mudou = true; } return; }
      /* Atividade reaberta (ex.: "Desfazer") volta a renovação para "Em cotação" */
      if (R.final(r.status) && aberta && r.baixaAtv === a.id) { if (r.status === 'migrado') R.voltarMapa(r); Store.update('renovacoes', r.id, { status: 'cotacao', baixaEm: null, baixaAtv: null, mapaAntes: null, historico: hist('cotacao', 'Atividade reaberta') }, { silent: true }); mudou = true; }
    });
    /* Baixas automáticas, só quando a própria fonte mostra o desfecho */
    Store.all('renovacoes').forEach(r => {
      if (R.final(r.status)) return;
      let st = null, obs = '';
      if (r.origem === 'contrato' && r.campo !== 'reajuste') {
        const ct = Store.get('contratos', r.ctId), nova = ct && ct[r.campo];
        if (ct && (ct.status || 'ativo') === 'ativo' && nova && nova > r.data) { st = 'renovado'; obs = (r.produto === 'ita' ? 'Pago até' : 'Vencimento') + ' atualizado no contrato para ' + U.fmtDate(nova); }
      }
      if (r.origem === 'mapa') {
        const c = C.cliente(r.clienteId), a = C.area(r.area);
        if (c && a && C.mapa(c, r.area).sit === 'comigo') { st = 'migrado'; obs = 'A área passou para "Comigo" no Mapa 360'; }
      }
      if (st) { Store.update('renovacoes', r.id, { status: st, baixaEm: agora, historico: (r.historico || []).concat({ em: agora, status: st, obs, auto: true }) }, { silent: true }); mudou = true; }
    });
    if (mudou) gravarDepois();
  };
  const segurando = new Set();
  R.segurar = atvId => segurando.add(atvId);
  R.abertas = () => { R.sincronizar(); return Store.all('renovacoes').filter(r => !R.final(r.status)).sort((a, b) => a.data.localeCompare(b.data) || String(a.rotulo).localeCompare(String(b.rotulo))); };
  R.doCliente = id => Store.all('renovacoes').filter(r => r.clienteId === id).sort((a, b) => b.data.localeCompare(a.data));
  R.nome = r => { const c = r.clienteId && cli().cliente(r.clienteId); return c ? c.nome : r.nomeMB || 'Cliente'; };
  /* "em 16 dias", "hoje", "venceu há 4 dias" (a data já aparece ao lado) */
  R.rel = d => { const n = U.diff(d, U.today()); return n === 0 ? 'vence hoje' : n === 1 ? 'amanhã' : n > 1 ? 'em ' + n + ' dias' : n === -1 ? 'venceu ontem' : 'venceu há ' + (-n) + ' dias'; };
  R.vencida = r => !R.final(r.status) && r.data < U.today();

  /* ---------- Lista (Painel, Clientes, ficha) ---------- */
  const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  R.item = (r, { semNome } = {}) => {
    const dd = U.diff(r.data, U.today()), venc = R.vencida(r), fin = R.final(r.status);
    const atv = R.atividade(r), lq = atv && atv.status !== 'concluida' ? R.liqAtv(atv) : null;
    const atvTxt = atv ? `<span class="ren-atv">${App.UI.icon('negocio')}${atv.status === 'concluida' ? 'atividade concluída' : 'atividade ligada'}${lq ? ' · fica ≈ ' + U.brlC(lq) : ''}</span>` : '';
    return `<li class="ren-it${venc ? ' is-venc' : ''}${fin ? ' is-fin' : ''}" data-ren="${U.esc(r.id)}" tabindex="0" role="button">
      <span class="cl-vd ${venc ? 'venc' : dd <= 7 ? 'perto' : ''}"><b>${+r.data.slice(8, 10)}</b>${MES[+r.data.slice(5, 7) - 1]}${r.data.slice(0, 4) !== U.today().slice(0, 4) ? `<i>${r.data.slice(2, 4)}</i>` : ''}</span>
      <div><b>${U.esc(semNome ? r.rotulo : R.nome(r))}</b><small>${U.esc(semNome ? (fin && r.baixaEm ? 'baixa em ' + U.fmtDate(r.baixaEm.slice(0, 10)) : '') : r.rotulo)}</small>${atvTxt}</div>
      <span class="ren-side"><span class="ren-st rs-${r.status}">${U.esc(R.rotStatus(r))}</span>${fin ? '' : `<em class="${venc ? 'late' : ''}">${R.rel(r.data)}</em>`}</span></li>`;
  };

  R.ligarBlocoAtividade = (el, r, api) => el.querySelectorAll('[data-ratv]').forEach(b => b.onclick = async () => {
    const k = b.dataset.ratv, a = R.atividade(r);
    if (k === 'abrir' && a) { api.close(); App.Forms.detalhes(a.id); }
    if (k === 'criar') { api.close(); R.criarAtividade(r.id); }
    if (k === 'ligar') { api.close(); R.escolherAtividade(r.id, () => R.abrir(r.id, { direto: true })); }
    if (k === 'desligar') { const ok = await App.UI.confirm({ title: 'Desligar a atividade?', text: 'A atividade continua existindo; só deixa de andar junto com esta renovação.', ok: 'Desligar', danger: false }); if (ok) { R.desligar(r.id); api.close(); R.abrir(r.id, { direto: true }); } }
  });

  /* Baixa dada pela renovação com atividade aberta: conclui a atividade junto? */
  R.perguntarConcluir = async (atvId, st) => {
    const a = Store.get('atividades', atvId), M = App.M, UI = App.UI; if (!a || a.status === 'concluida') return;
    const ganho = st !== 'perdido';
    const ok = await UI.confirm({ title: 'Concluir a atividade também?', text: `<b>${U.esc(a.titulo)}</b> ainda está aberta. ${ganho ? 'Ao concluir, você lança a receita como de costume.' : 'Ela será concluída como negócio que não fechou.'}`, ok: 'Concluir atividade', danger: false });
    if (!ok) return;
    if (ganho && M.ehNegocio(a)) return App.Forms.concluirNegocio(atvId);
    if (M.ehNegocio(a)) Store.update('atividades', atvId, M.espelhoNeg(M.negociosDa(a).map(n => n.resultado ? n : { ...n, resultado: 'perdido' })), { silent: true });
    M.concluir(atvId, { nota: ganho ? 'Concluída junto com a baixa da renovação' : 'Negócio não fechou (baixa da renovação)' });
    UI.toast('Atividade concluída');
  };

  /* Depois de concluir a atividade ligada (e lançar a receita): dá a baixa e, se renovou, atualiza o contrato */
  R.aoConcluir = (atvId, depois) => {
    const seguir = () => { segurando.delete(atvId); Store.commit(); if (depois) depois(); };
    const a = Store.get('atividades', atvId), r = a && a.renovacaoId && Store.get('renovacoes', a.renovacaoId);
    if (!r || R.final(r.status)) return seguir();
    const res = R.resultadoAtv(a, r); if (!res) return seguir();
    const st = R.stDoResultado(r, res), agora = U.nowISO(), C = cli(), UI = App.UI;
    const lab = (R.opcoes(r).find(o => o.id === st) || {}).label;
    const baixa = obs => { const at = Store.get('renovacoes', r.id) || r; Store.update('renovacoes', r.id, { status: st, baixaEm: agora, baixaAtv: atvId, historico: (at.historico || []).concat({ em: agora, status: st, obs }) }, { silent: true }); };
    baixa('Atividade concluída: ' + (res === 'ganho' ? 'negócio fechado' : 'negócio não fechou'));
    const ct = r.ctId && Store.get('contratos', r.ctId);
    if (st === 'migrado') R.marcarComigo(r);
    segurando.delete(atvId); Store.commit();
    if (st === 'renovado' && ct && r.origem === 'contrato' && r.campo !== 'reajuste') {
      const kP = ct.premio != null || ct.mensalidade == null ? 'premio' : 'mensalidade', temP = C.produto(ct.produto).campos.some(x => x.k === kP);
      const neg = App.M.negociosDa(a).find(n => n.renId === r.id && n.resultado === 'ganho');
      let feito = false;
      UI.modal({
        title: 'Renovação · ' + lab, size: 'sm',
        body: `<form class="form" id="fRenP"><p class="muted" style="margin:0">${U.esc(R.nome(r))} · ${U.esc(r.rotulo)}</p>
          <div class="row2"><label class="f"><span>${r.produto === 'ita' ? 'Novo "pago até"' : 'Novo vencimento'}</span><input type="date" name="novaData" value="${mais1ano(r.data)}" required></label>
          ${temP ? `<label class="f"><span>Novo prêmio${R.mensalCt(ct) ? ' (mensal)' : ''}</span><input name="premio" data-num inputmode="decimal" value="${(pv => pv != null && pv !== '' ? U.num(pv) : '')(neg && neg.valor != null ? neg.valor : ct[kP])}" placeholder="R$"></label>` : ''}</div>
          <p class="ren-nota">Atualiza o contrato e o aviso do próximo ano já fica programado.</p></form>`,
        footer: `<button class="btn ghost" data-close>Agora não</button><button class="btn primary" form="fRenP" type="submit">Atualizar contrato</button>`,
        onClose: () => { if (!feito) { const at = Store.get('renovacoes', r.id); if (at) Store.update('renovacoes', r.id, { historico: (at.historico || []).concat({ em: U.nowISO(), status: st, obs: 'Contrato não atualizado (vencimento continua o antigo)' }) }); } setTimeout(() => depois && depois(), 60); },
        onMount(el, api) {
          el.querySelector('#fRenP').onsubmit = e => {
            e.preventDefault(); const d = UI.formData(e.target); if (!d.novaData) return;
            const patch = { [r.campo]: d.novaData }; if (C.produto(ct.produto).campos.some(x => x.k === 'inicio') && ct.produto !== 'ita') patch.inicio = r.data;
            if (temP && d.premio != null) patch[kP] = d.premio;
            Store.update('contratos', ct.id, patch, { silent: true });
            const at = Store.get('renovacoes', r.id); Store.update('renovacoes', r.id, { historico: (at.historico || []).concat({ em: U.nowISO(), status: st, obs: 'Novo vencimento ' + U.fmtDate(d.novaData) + (temP && d.premio != null ? ' · prêmio ' + U.brl(d.premio) : '') }) }, { silent: true });
            feito = true; Store.commit(); api.close(); UI.toast('Contrato atualizado · próximo aviso programado');
          };
        }
      });
      return;
    }
    if (st === 'migrado' && r.clienteId) {
      UI.confirm({ title: 'Migrado para você', text: `No Mapa 360, ${U.esc(R.nome(r))} passou a ter ${U.esc(((C.area(r.area) || {}).nome || '').toLowerCase())} com você. Cadastrar o contrato agora?`, ok: 'Cadastrar contrato', danger: false }).then(ok => {
        if (ok) { const pid = r.produto && r.produto !== 'mb' ? r.produto : undefined; App.Forms.contrato(null, { produto: pid, clienteId: r.clienteId, ...(r.area === 'saude' ? { tipo: 'Plano de saúde' } : r.area === 'residencial' ? { tipo: 'Residencial' } : r.area === 'vidagrupo' ? { tipo: 'Seguro de vida em grupo' } : r.area === 'rc' ? { tipo: 'RC pessoal' } : {}) }); }
        else if (depois) depois();
      });
      return;
    }
    if (st === 'perdido' && ct && r.origem === 'contrato' && r.campo !== 'reajuste' && (ct.status || 'ativo') === 'ativo') {
      UI.confirm({ title: 'Renovação: ' + lab, text: `Marcar o contrato de ${U.esc(R.nome(r))} como encerrado?`, ok: 'Encerrar contrato', danger: false }).then(ok => {
        if (ok) { Store.update('contratos', ct.id, { status: 'encerrado' }); const at = Store.get('renovacoes', r.id); Store.update('renovacoes', r.id, { historico: (at.historico || []).concat({ em: U.nowISO(), status: st, obs: 'Contrato encerrado' }) }); }
        if (depois) depois();
      });
      return;
    }
    UI.toast('Renovação: ' + lab); if (depois) setTimeout(depois, 1200);
  };

  App.Ren = R;
})(window.App = window.App || {});

</script>
<script>
/* js/ui/regua.js */
/* Parte 4 · Régua de contato (24/11/2026).
   Último contato do cliente = o mais recente entre o "Falei hoje" (clientes.dados.ultimoContato / contatos[]) e as atividades
   concluídas com ele. Frequência: 30 dias para todos por enquanto (Store.config('reguaDias'), sem tela).
   Card "Quem ligar esta semana" no Painel e faixa de contato na ficha do cliente. */
(function (App) {
  const { U, Store } = App;
  const Rg = {};
  const C = () => App.Cli;

  Rg.dias = () => { const v = +Store.config('reguaDias'); return v > 0 ? v : 30; };
  /* { data, fonte: 'contato'|'atividade', nota } ou null */
  Rg.ultimo = c => {
    let best = c.ultimoContato ? { data: c.ultimoContato, fonte: 'contato', nota: ((c.contatos || [])[0] || {}).nota || null } : null;
    C().atividadesDo(c).forEach(a => { const d = a.status === 'concluida' && (a.concluidaEm || '').slice(0, 10);
      if (d && (!best || d > best.data)) best = { data: d, fonte: 'atividade', nota: a.titulo }; });
    return best;
  };
  /* Situação de um cliente na régua */
  Rg.situacao = c => {
    const u = Rg.ultimo(c), hoje = U.today();
    if (!u) return { c, u, nunca: true, prox: null, faltam: null };
    const prox = U.addDays(u.data, Rg.dias());
    return { c, u, nunca: false, prox, faltam: U.diff(prox, hoje), desde: U.diff(hoje, u.data) };
  };
  /* Aniversário nos próximos n dias: devolve quantos dias faltam (0 = hoje) ou null */
  Rg.aniversario = (c, n = 7) => {
    if (!c.nascimento) return null; const h = U.parse(U.today());
    for (let i = 0; i <= n; i++) { const d = new Date(h); d.setDate(h.getDate() + i); if (U.iso(d).slice(5) === c.nascimento.slice(5)) return i; }
    return null;
  };
  Rg.lista = () => {
    const base = C().base360();
    const sits = base.map(Rg.situacao);
    const ligar = sits.filter(s => !s.nunca && s.faltam <= 7).sort((a, b) => a.faltam - b.faltam || a.c.nome.localeCompare(b.c.nome, 'pt-BR'));
    const nunca = sits.filter(s => s.nunca).sort((a, b) => a.c.nome.localeCompare(b.c.nome, 'pt-BR'));
    const aniv = base.map(c => ({ c, d: Rg.aniversario(c) })).filter(x => x.d != null).sort((a, b) => a.d - b.d);
    return { ligar, nunca, aniv, emDia: sits.length - ligar.length - nunca.length };
  };

  /* ---------- Registrar ---------- */
  Rg.registrar = (cid, { nota, data } = {}) => {
    const c = C().cliente(cid); if (!c) return;
    const d = data || U.today(), contatos = [{ em: d, nota: nota || null }].concat(c.contatos || []).slice(0, 30);
    const ult = contatos.map(x => x.em).sort().pop();
    Store.update('clientes', cid, { ultimoContato: ult, contatos });
  };
  Rg.desfazer = (cid, antes) => Store.update('clientes', cid, { ultimoContato: antes.ultimoContato || null, contatos: antes.contatos || [] });
  Rg.anotar = cid => {
    const c = C().cliente(cid); if (!c) return; const UI = App.UI, ult = (c.contatos || [])[0];
    UI.modal({
      title: 'Contato com ' + C().apelido(c), size: 'sm',
      body: `<form class="form" id="fCto"><div class="row2"><label class="f"><span>Data</span><input type="date" name="data" value="${ult ? ult.em : U.today()}"></label></div>
        <label class="f full"><span>O que conversaram <em>opcional</em></span><input name="nota" maxlength="140" value="${U.esc(ult && ult.em === U.today() ? ult.nota || '' : '')}" placeholder="Ex.: enviei a movimentação da carteira"></label></form>`,
      footer: `<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" form="fCto" type="submit">Salvar</button>`,
      onMount(el, api) {
        el.querySelector('#fCto').onsubmit = e => {
          e.preventDefault(); const d = UI.formData(e.target), atual = C().cliente(cid);
          /* Se o "Falei hoje" acabou de ser registrado, completa ele em vez de criar outro */
          const cs = (atual.contatos || []).slice();
          if (cs[0] && cs[0].em === U.today() && !cs[0].nota) cs.shift();
          const contatos = [{ em: d.data || U.today(), nota: d.nota || null }].concat(cs).slice(0, 30);
          Store.update('clientes', cid, { ultimoContato: contatos.map(x => x.em).sort().pop(), contatos });
          api.close(); UI.toast('Contato registrado');
        };
      }
    });
  };
  Rg.falei = cid => {
    const c = C().cliente(cid); if (!c) return;
    const antes = { ultimoContato: c.ultimoContato, contatos: (c.contatos || []).slice() };
    Rg.registrar(cid);
    App.UI.toast('Contato com ' + C().apelido(c) + ' registrado', 'ok', [{ label: 'Anotar', fn: () => Rg.anotar(cid) }, { label: 'Desfazer', fn: () => Rg.desfazer(cid, antes) }]);
  };

  /* ---------- Textos ---------- */
  const rel = s => s.nunca ? 'sem contato registrado' : s.faltam < 0 ? 'há ' + s.desde + ' dias sem contato' : s.faltam === 0 ? 'completa ' + Rg.dias() + ' dias hoje' : 'completa ' + Rg.dias() + ' dias em ' + s.faltam + (s.faltam === 1 ? ' dia' : ' dias');
  const anivTxt = d => d === 0 ? 'Aniversário hoje' : d === 1 ? 'Aniversário amanhã' : 'Aniversário em ' + d + ' dias';
  const linha = s => `<li class="rg-it${!s.nunca && s.faltam < 0 ? ' atras' : ''}"><button class="rg-n" data-rg-cli="${s.c.id}"><b>${U.esc(s.c.nome)}</b><small>${U.esc(rel(s))}${s.u && !s.nunca ? ' · ' + U.esc(s.u.nota || 'último em ' + U.fmtDate(s.u.data)) : ''}</small></button><button class="rg-f" data-rg-falei="${s.c.id}">Falei hoje</button></li>`;

  /* ---------- Card do Painel ---------- */
  Rg.card = (filtroResp = []) => {
    if (filtroResp.length && App.Ren && !filtroResp.includes(App.Ren.respRenovacao().id)) return '';
    const { ligar, nunca, aniv, emDia } = Rg.lista(), MAX = 6;
    const total = ligar.length + nunca.length;
    return `<section class="card rg-card"><div class="card-h"><h2>Quem ligar esta semana</h2><span class="grow"></span>${ligar.length ? `<span class="count">${ligar.length}</span>` : ''}</div>
      <p class="rg-res">Contato a cada ${Rg.dias()} dias · ${emDia} em dia${ligar.length ? ` · <b>${ligar.length} para ligar</b>` : ''}${nunca.length ? ` · ${nunca.length} sem registro` : ''}</p>
      ${aniv.length ? `<ul class="rg-list">${aniv.map(x => `<li class="rg-it aniv"><button class="rg-n" data-rg-cli="${x.c.id}"><b>${U.esc(x.c.nome)}</b><small>${anivTxt(x.d)}</small></button><button class="rg-f" data-rg-falei="${x.c.id}">Falei hoje</button></li>`).join('')}</ul>` : ''}
      ${ligar.length ? `<ul class="rg-list">${ligar.slice(0, MAX).map(linha).join('')}</ul>${ligar.length > MAX ? `<details class="rg-mais"><summary>Ver todos · ${ligar.length}</summary><ul class="rg-list">${ligar.slice(MAX).map(linha).join('')}</ul></details>` : ''}`
        : total ? '' : '<p class="muted small" style="margin:4px 0 0">Todos os clientes estão em dia.</p>'}
      ${nunca.length ? `<details class="rg-mais"${ligar.length ? '' : ' open'}><summary>Sem contato registrado · ${nunca.length}</summary><p class="muted small" style="margin:4px 0 6px">Use "Falei hoje" quando falar com cada um; a partir daí a régua de ${Rg.dias()} dias começa a contar.</p><ul class="rg-list rg-scroll">${nunca.map(linha).join('')}</ul></details>` : ''}</section>`;
  };
  Rg.ligar = root => {
    root.querySelectorAll('[data-rg-falei]').forEach(b => b.onclick = e => { e.stopPropagation(); Rg.falei(b.dataset.rgFalei); });
    root.querySelectorAll('[data-rg-cli]').forEach(b => b.onclick = () => App.go('clientes', { cliente: b.dataset.rgCli }, { origem: true }));
    root.querySelectorAll('[data-rg-anotar]').forEach(b => b.onclick = () => Rg.anotar(b.dataset.rgAnotar));
  };

  /* ---------- Faixa na ficha do cliente ---------- */
  Rg.faixa = c => {
    if (!C().ehCliente(c) || c.saiu) return '';
    const s = Rg.situacao(c), hist = (c.contatos || []).slice(0, 8);
    const txt = s.nunca ? 'Nenhum contato registrado ainda' : `Último contato: <b>${U.fmtDate(s.u.data)}</b> (${s.desde === 0 ? 'hoje' : s.desde === 1 ? 'ontem' : 'há ' + s.desde + ' dias'})${s.u.nota ? ' · ' + U.esc(s.u.nota) : ''}`;
    const st = s.nunca ? '' : s.faltam < 0 ? `<span class="rg-tag atras">Passou ${-s.faltam} ${-s.faltam === 1 ? 'dia' : 'dias'} da régua</span>` : `<span class="rg-tag">Próximo até ${U.fmtDate(s.prox)}</span>`;
    return `<section class="rg-faixa${!s.nunca && s.faltam < 0 ? ' atras' : ''}"><div class="rg-fx-t"><span>${txt}</span>${st}</div>
      <div class="rg-fx-b"><button class="btn primary sm" data-rg-falei="${c.id}">Falei hoje</button><button class="btn ghost sm" data-rg-anotar="${c.id}">Anotar contato</button></div>
      ${hist.length ? `<details class="rg-hist"><summary>Contatos · ${(c.contatos || []).length}</summary><ul>${hist.map(h => `<li><time>${U.fmtDate(h.em)}</time>${h.nota ? U.esc(h.nota) : '<span class="muted">sem anotação</span>'}</li>`).join('')}</ul></details>` : ''}</section>`;
  };

  App.Regua = Rg;
})(window.App = window.App || {});

</script>
<script>
/* js/ui/agenda.js */
/* Braço direito (24/11): Agenda do Outlook com preparação de reunião + Resumo da manhã / Revisão da semana.
   Quem grava é o Claude (tarefas agendadas "Donna AI · agenda e resumo da manhã" e "Donna AI · revisão da semana");
   o painel só mostra. Nada de e-mail ou telefone de participantes: só nomes.
   agenda.dados  = { evId, titulo, inicio:'AAAA-MM-DDTHH:MM', fim, diaTodo, local, online, link, participantes:[nomes],
                     clienteId, clienteNome, cancelado, prep:{ resumo, pontos:[...], perguntas:[...], em }, atualizadoEm }
   resumos.dados = { tipo:'manha'|'semana', data:'AAAA-MM-DD', titulo, recado:[linhas], blocos:[{ titulo, itens:[texto] }], geradoEm } */
(function (App) {
  const { U, UI, Store } = App;
  const A = {}, R = {};
  const DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  const hora = s => (s || '').slice(11, 16);
  const dia = s => (s || '').slice(0, 10);
  const agora = () => { const d = new Date(); return U.today() + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const nomeDia = iso => { const d = new Date(iso + 'T12:00:00'); return DIAS[d.getDay()] + ', ' + d.getDate() + '/' + String(d.getMonth() + 1).padStart(2, '0'); };

  /* ---------- Agenda ---------- */
  A.eventos = () => Store.all('agenda').filter(e => !e.cancelado && e.inicio).sort((a, b) => a.inicio.localeCompare(b.inicio));
  A.doDia = d => A.eventos().filter(e => dia(e.inicio) === d);
  A.proximoDia = () => { const hoje = U.today(), e = A.eventos().find(x => dia(x.inicio) > hoje); return e ? dia(e.inicio) : null; };
  A.doCliente = cid => A.eventos().filter(e => e.clienteId === cid && dia(e.inicio) >= U.today());

  const item = e => {
    const passou = !e.diaTodo && (e.fim || e.inicio) < agora(), agoraJa = !e.diaTodo && e.inicio <= agora() && (e.fim || e.inicio) >= agora();
    return `<li class="ag-it${passou ? ' passou' : ''}${agoraJa ? ' agora' : ''}">
      <span class="ag-h">${e.diaTodo ? 'dia todo' : hora(e.inicio)}${e.fim && !e.diaTodo ? `<small>${hora(e.fim)}</small>` : ''}</span>
      <div class="ag-b"><b>${U.esc(e.titulo || 'Sem título')}</b>
        <span class="ag-m">${e.clienteNome ? `<button class="ag-cli" data-agcli="${U.esc(e.clienteId || '')}" data-agnome="${U.esc(e.clienteNome)}">${U.esc(e.clienteNome)}</button>` : ''}${e.online ? '<span>online</span>' : e.local ? `<span>${U.esc(e.local)}</span>` : ''}${agoraJa ? '<span class="ag-agora">agora</span>' : ''}</span></div>
      ${e.prep ? `<button class="btn sm ${passou ? 'ghost' : 'primary'}" data-agprep="${e.id}">Preparação</button>` : ''}</li>`;
  };

  A.card = () => {
    const hoje = U.today(), evs = A.doDia(hoje), prox = A.proximoDia(), nProx = prox ? A.doDia(prox).length : 0;
    const tem = Store.all('agenda').length > 0;
    const lido = Store.all('agenda').reduce((m, e) => (e.atualizadoEm || '') > m ? e.atualizadoEm : m, '');
    return `<section class="card ag-card" aria-label="Agenda de hoje"><div class="card-h"><h2>Agenda de hoje</h2><span class="grow"></span>${evs.length ? `<span class="count">${evs.length}</span>` : ''}</div>
      ${evs.length ? `<ul class="ag-list">${evs.map(item).join('')}</ul>`
        : `<div class="empty sm"><p>${tem ? 'Nenhum compromisso hoje.' : 'A agenda do Outlook chega na leitura das 7h23 (dias úteis).'}</p></div>`}
      ${prox ? `<button class="link ag-prox" data-agdia="${prox}">${prox === U.addDays(hoje, 1) ? 'Amanhã' : nomeDia(prox)} · ${U.plural(nProx, 'compromisso', 'compromissos')} ›</button>` : ''}
      ${lido ? `<p class="muted small ag-lido">Lida do Outlook ${U.fmtDateTime(lido)}</p>` : ''}</section>`;
  };

  A.prep = id => {
    const e = Store.get('agenda', id); if (!e || !e.prep) return;
    const p = e.prep, lista = (t, xs) => xs && xs.length ? `<h3 class="ag-h3">${t}</h3><ul class="ag-ul">${xs.map(x => `<li>${U.esc(x)}</li>`).join('')}</ul>` : '';
    UI.modal({
      title: 'Preparação · ' + (e.titulo || ''), size: 'md',
      body: `<p class="muted small" style="margin:0 0 10px">${U.esc(nomeDia(dia(e.inicio)))}${e.diaTodo ? '' : ' · ' + hora(e.inicio) + (e.fim ? '–' + hora(e.fim) : '')}${e.online ? ' · online' : e.local ? ' · ' + U.esc(e.local) : ''}${(e.participantes || []).length ? ' · com ' + e.participantes.map(U.esc).join(', ') : ''}</p>
        ${p.resumo ? `<p class="ag-res">${U.esc(p.resumo)}</p>` : ''}
        ${lista('Pontos para a conversa', p.pontos)}${lista('Perguntas a fazer', p.perguntas)}
        ${p.em ? `<p class="muted small" style="margin-top:12px">Preparada pelo Claude em ${U.fmtDateTime(p.em)} com os dados do painel.</p>` : ''}`,
      footer: `${e.link ? `<a class="btn ghost" href="${U.esc(e.link)}" target="_blank" rel="noopener">Abrir no Outlook</a>` : ''}<span class="grow"></span>${e.clienteId && App.Cli && App.Cli.cliente(e.clienteId) ? `<button class="btn ghost" data-agficha>Ficha do cliente</button>` : ''}<button class="btn primary" data-close>Fechar</button>`,
      onMount(el, api) { const b = el.querySelector('[data-agficha]'); if (b) b.onclick = () => { api.close(); App.go('clientes', { cliente: e.clienteId }, { origem: true }); }; }
    });
  };

  A.dia = d => {
    const evs = A.doDia(d);
    UI.modal({
      title: 'Agenda · ' + nomeDia(d), size: 'md',
      body: evs.length ? `<ul class="ag-list">${evs.map(item).join('')}</ul>` : '<p class="muted">Nenhum compromisso.</p>',
      footer: `<button class="btn primary" data-close>Fechar</button>`,
      onMount(el, api) { ligar(el, api); }
    });
  };

  const ligar = (el, api) => {
    el.querySelectorAll('[data-agprep]').forEach(b => b.onclick = () => A.prep(b.dataset.agprep));
    el.querySelectorAll('[data-agcli]').forEach(b => b.onclick = () => { if (api) api.close(); if (b.dataset.agcli && App.Cli && App.Cli.cliente(b.dataset.agcli)) App.go('clientes', { cliente: b.dataset.agcli }, { origem: true }); else UI.toast(b.dataset.agnome + ' não está na base.', 'aviso'); });
    el.querySelectorAll('[data-agdia]').forEach(b => b.onclick = () => A.dia(b.dataset.agdia));
  };
  A.ligar = el => ligar(el);

  /* Ficha do cliente: próximas reuniões com ele */
  A.ficha = cli => {
    const evs = A.doCliente(cli.id).slice(0, 3); if (!evs.length) return '';
    return `<div class="ag-ficha">${evs.map(e => `<span>${U.esc(nomeDia(dia(e.inicio)))}${e.diaTodo ? '' : ' ' + hora(e.inicio)} · <b>${U.esc(e.titulo || 'Reunião')}</b>${e.prep ? ` <button class="link" data-agprep="${e.id}">Preparação</button>` : ''}</span>`).join('')}</div>`;
  };

  /* ---------- Resumo da manhã / Revisão da semana ---------- */
  const LIDO = 'donna-resumo-lido';
  R.atual = () => {
    const hoje = U.today(), dow = new Date(hoje + 'T12:00:00').getDay();
    /* sexta (depois de gerada), sábado e domingo: revisão da semana; dias úteis: resumo do dia */
    const sem = Store.all('resumos').filter(r => r.tipo === 'semana' && r.data && r.data <= hoje && U.diff(hoje, r.data) <= 2).sort((a, b) => b.data.localeCompare(a.data))[0];
    if (sem && (dow === 5 || dow === 6 || dow === 0)) return sem;
    return Store.all('resumos').find(r => r.tipo === 'manha' && r.data === hoje) || null;
  };
  R.card = () => {
    const r = R.atual(); if (!r) return '';
    let lido = ''; try { lido = localStorage.getItem(LIDO) || ''; } catch (e) {}
    const chave = r.id + '|' + (r.geradoEm || ''), fechado = lido === chave;
    const semana = r.tipo === 'semana';
    return `<section class="card rs-card${semana ? ' rs-sem' : ''}${fechado ? ' rs-fechado' : ''}" aria-label="${semana ? 'Revisão da semana' : 'Resumo da manhã'}">
      <div class="card-h"><h2>${U.esc(r.titulo || (semana ? 'Revisão da semana' : 'Resumo do dia'))}</h2><span class="grow"></span>
        ${(r.blocos || []).length ? '<button class="link" data-rsver>Ver completo</button>' : ''}
        <button class="link" data-rsok>${fechado ? 'Mostrar' : 'Ok, li'}</button></div>
      ${fechado ? '' : `<ul class="rs-rec">${(r.recado || []).map(x => `<li>${U.esc(x)}</li>`).join('')}</ul>`}</section>`;
  };
  R.ligar = el => {
    const r = R.atual(); if (!r) return;
    const ok = el.querySelector('[data-rsok]'); if (ok) ok.onclick = () => { const chave = r.id + '|' + (r.geradoEm || ''); let lido = ''; try { lido = localStorage.getItem(LIDO) || ''; localStorage.setItem(LIDO, lido === chave ? '' : chave); } catch (e) {} App.render && App.render(); };
    const v = el.querySelector('[data-rsver]'); if (v) v.onclick = () => UI.modal({
      title: r.titulo || 'Resumo', size: 'md',
      body: `${(r.recado || []).length ? `<ul class="rs-rec">${r.recado.map(x => `<li>${U.esc(x)}</li>`).join('')}</ul>` : ''}${(r.blocos || []).map(b => `<h3 class="ag-h3">${U.esc(b.titulo || '')}</h3><ul class="ag-ul">${(b.itens || []).map(x => `<li>${U.esc(x)}</li>`).join('')}</ul>`).join('')}
        ${r.geradoEm ? `<p class="muted small" style="margin-top:12px">Gerado pelo Claude em ${U.fmtDateTime(r.geradoEm)}.</p>` : ''}`,
      footer: '<button class="btn primary" data-close>Fechar</button>'
    });
  };

  App.Agenda = A; App.Resumo = R;
})(window.App = window.App || {});

</script>
<script>
/* js/views/painel.js */
/* Tela: Painel (dashboard principal). Responde: hoje, atrasadas, próximas, metas e execução. */
(function (App) {
  const { U, M, UI, Store, Charts } = App;
  const V = { titulo: 'Painel' };
  /* Filtro do Painel: várias responsabilidades ao mesmo tempo, lembrado neste aparelho */
  const CH = 'horus-painel-resps';
  let filtroResp = (() => { try { return JSON.parse(localStorage.getItem(CH)) || []; } catch (e) { return []; } })();
  const salvarFiltro = () => { try { localStorage.setItem(CH, JSON.stringify(filtroResp)); } catch (e) {} };
  const rotuloFiltro = () => { const ns = filtroResp.map(id => M.resp(id)).filter(Boolean);
    return !ns.length ? 'Todas as responsabilidades' : ns.length === 1 ? ns[0].nome : ns.length === 2 ? ns[0].nome + ' + ' + ns[1].nome : ns.length + ' responsabilidades'; };

  const itemAt = a => `<li class="pitem${M.atrasada(a) ? ' is-late' : ''}" data-id="${a.id}">
      <button class="check" data-act="concluir" aria-label="Concluir ${U.esc(a.titulo)}">${UI.icon('check')}</button>
      <div class="pmain" data-act="abrir"><b>${U.esc(a.titulo)}</b><div class="pmeta">${UI.respChips(a)}${UI.cliChip(a)}${M.ehNegocio(a) ? UI.negChip(a) : (a.categoria ? `<span class="cat">${U.esc(a.categoria)}</span>` : '')}</div></div>
      <div class="pside">${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
      <button class="icon-btn" data-act="adiar" title="Adiar" aria-label="Adiar">${UI.icon('adiar')}</button></li>`;

  V.render = el => {
    filtroResp = filtroResp.filter(id => M.resp(id) && M.resp(id).status !== 'arquivada');
    const ok = a => M.noFiltro(a, filtroResp), qr = filtroResp.length ? '&resp=' + filtroResp.join(',') : '';
    const r = M.resumo(filtroResp);
    const prior = M.prioridadesHoje().filter(ok);
    const prox = Store.all('atividades').filter(a => M.proximos(a, 7) && !prior.includes(a) && ok(a)).sort(M.ordemAtencao);
    const metas = Store.all('metas').filter(m => (!filtroResp.length || filtroResp.includes(m.responsabilidadeId)) && !(m.fim && m.fim < U.addDays(U.today(), -30)));
    const resps = M.respAtivas().filter(x => !filtroResp.length || filtroResp.includes(x.id));
    const exec = r.planejadas7 ? r.feitas7 / r.planejadas7 : null;
    const demo = App.Demo.count();
    const negs = M.negItensAbertos().filter(x => ok(x.a));

    const negLink = negs.length ? ` · <a class="link" href="#negocios" data-go="negocios">${negs.length} negócio${negs.length === 1 ? '' : 's'} em andamento</a>` : '';
    const cardMetas = `<section class="card metas-card">
            <div class="card-h"><h2>Metas</h2><a class="link" href="#metas" data-go="metas">Ver todas</a></div>
            ${metas.length ? `<ul class="mlist">${metas.slice(0, 5).map(m => { const p = M.metaPct(m), s = M.metaSituacao(m); return `<li><div class="mrow"><span class="mname">${U.esc(m.nome)}</span><span class="tag t-${s.id}">${s.label}</span></div>${UI.bar(p, M.respCor(m.responsabilidadeId))}<div class="mrow small muted"><span>${U.num(M.metaAtual(m))} de ${U.num(m.alvo)} ${U.esc(m.unidade || '')}</span><span>${U.pct(p)}</span></div></li>`; }).join('')}</ul>`
              : `<div class="empty sm"><p>Nenhuma meta ativa.</p><a class="btn ghost" href="#metas" data-go="metas">Criar meta</a></div>`}
          </section>`;
    el.innerHTML = `
      ${demo.atividades + demo.metas ? `<div class="banner">Você está vendo <b>dados de demonstração</b>. Quando quiser começar com os seus, apague-os em <a href="#dados" data-go="dados">Backup e dados</a>.</div>` : ''}
      <div class="page-h"><div><h1>Bom dia</h1><p class="muted cap">${U.todayLong()}</p></div>
        <div class="mfilter"><button class="mf-btn${filtroResp.length ? ' on' : ''}" id="fResp" aria-haspopup="true" aria-expanded="false"><span class="mf-dots">${(filtroResp.length ? filtroResp.map(M.resp) : M.respAtivas()).slice(0, 4).map(x => `<i style="background:${x.cor || '#8A93A3'}"></i>`).join('')}</span><span class="mf-l">${U.esc(rotuloFiltro())}</span>${UI.icon('seta')}</button>
          <div class="mf-pop" id="fRespPop" hidden><p class="mf-h">Ver no Painel</p>
            ${M.respAtivas().map(x => `<label class="mf-op"><input type="checkbox" value="${x.id}" ${filtroResp.includes(x.id) ? 'checked' : ''}><i style="background:${x.cor || '#8A93A3'}"></i><span>${U.esc(x.nome)}</span></label>`).join('')}
            <div class="mf-act"><button class="link" id="fRespTodas">Ver todas</button><button class="btn primary sm" id="fRespOk">Aplicar</button></div></div></div></div>

      ${(() => { const ls = App.Seg ? App.Seg.lembretes() : []; return ls.length ? `<section class="rotina" aria-label="Lembretes de rotina">${ls.map(x => `<div class="rt-it rt-${x.tom}"><div><b>${U.esc(x.titulo)}</b><span>${U.esc(x.texto)}</span></div><button class="btn sm ${x.tom === 'info' ? 'primary' : 'ghost'}" data-rt="${x.id}">${U.esc(x.acao)}</button></div>`).join('')}</section>` : ''; })()}
      ${App.Resumo ? App.Resumo.card() : ''}
      <div class="ptop">
        <section class="kpis kp3" aria-label="Indicadores">
          <a class="kpi" href="#atividades" data-go="atividades" data-q="prazo=hoje${qr}"><span>Para hoje</span><b>${r.hoje}</b></a>
          <a class="kpi ${r.atrasadas ? 'k-late' : ''}" href="#atividades" data-go="atividades" data-q="prazo=atrasadas${qr}"><span>Atrasadas</span><b>${r.atrasadas}</b></a>
          <a class="kpi" href="#atividades" data-go="atividades" data-q="status=abertas${qr}"><span>Pendentes</span><b>${r.pendentes}</b></a>
        </section>
        ${App.Funil ? App.Funil.card(filtroResp, { topo: true, rodape: negLink }) : ''}
      </div>

      <div class="grid-main">
        <div class="main-col">
          <section class="card prio-card" aria-label="Minhas prioridades">
            <div class="card-h"><h2>Minhas prioridades</h2><span class="grow"></span>
              <div class="pv-nav" role="tablist" aria-label="Período">
                <button class="pv-arr" data-pv="0" aria-label="Hoje" title="Hoje">${UI.icon('voltar')}</button>
                <button class="pv-tab" role="tab" data-pv="0" aria-selected="true">Hoje <b>${prior.length}</b></button>
                <button class="pv-tab" role="tab" data-pv="1" aria-selected="false">Próximos 7 dias <b>${prox.length}</b></button>
                <button class="pv-arr" data-pv="1" aria-label="Próximos 7 dias" title="Próximos 7 dias">${UI.icon('seta')}</button>
              </div>
              <a class="link" href="#atividades" data-go="atividades">Ver atividades</a></div>
            <div class="pv" id="pv"><div class="pv-track">
              <div class="pv-pane" data-pane="0">
                ${prior.length ? `<ul class="plist">${prior.map(itemAt).join('')}</ul>`
                  : `<div class="empty"><b>Nada urgente por aqui.</b><p>Nenhuma atividade atrasada ou para hoje. Aproveite para adiantar as próximas.</p></div>`}
                ${prox.length ? `<button class="pv-mais" data-pv="1">Próximos 7 dias · ${prox.length} ${UI.icon('seta')}</button>` : ''}
              </div>
              <div class="pv-pane" data-pane="1" inert>
                ${prox.length ? `<ul class="plist">${prox.slice(0, 12).map(itemAt).join('')}</ul>` : `<div class="empty sm"><p>Nada com prazo nos próximos 7 dias.</p></div>`}
                <div class="pv-rod"><button class="pv-mais back" data-pv="0">${UI.icon('voltar')} Voltar para hoje</button>${prox.length > 12 ? `<a class="link" href="#atividades" data-go="atividades" data-q="prazo=7dias${qr}">Ver todas (${prox.length})</a>` : ''}</div>
              </div>
            </div></div>
          </section>
          ${App.Emails ? App.Emails.quadro() : ''}
        </div>

        <aside class="side-col">
          ${App.Agenda ? App.Agenda.card() : ''}
          ${App.Regua ? App.Regua.card(filtroResp) : ''}
          ${App.Ren && App.Views.clientes ? App.Ren.card({ max: 5, extras: App.Cli.avisosConsorcio() }) : ''}
          <section class="card exec">
            <div class="card-h"><h2>Estou executando o que planejei?</h2></div>
            <div class="exec-b">${Charts.ring(r.pctConclusao, 92)}
              <div><p class="big-l">${U.pct(r.pctConclusao)} <span class="muted">concluído no total</span></p>
              <p class="muted small">${exec == null ? 'Nenhuma atividade venceu nos últimos 7 dias.' : `Últimos 7 dias: <b class="ink">${r.feitas7} de ${r.planejadas7}</b> atividades com prazo foram concluídas (${U.pct(exec)}).`}</p>
              <p class="small"><a class="link" href="#atividades" data-go="atividades" data-q="status=concluida${qr}">${r.concluidas} concluída${r.concluidas === 1 ? '' : 's'}</a></p></div></div>
          </section>
          ${cardMetas}
        </aside>
      </div>

      <section class="card desemp-card" aria-label="Desempenho por responsabilidade">
        <div class="card-h"><h2>Desempenho por responsabilidade</h2><a class="link" href="#responsabilidades" data-go="responsabilidades">Gerenciar</a></div>
        <div class="rgrid">${resps.map(x => {
          const at = Store.where('atividades', a => M.temResp(a, x.id)), c = at.filter(a => a.status === 'concluida').length, l = at.filter(M.atrasada).length, h = at.filter(M.hoje).length;
          return `<a class="rcard" href="#atividades" data-go="atividades" data-q="resp=${x.id}" style="--c:${x.cor}"><div class="rh"><i></i><b>${U.esc(x.nome)}</b></div>
            ${UI.bar(at.length ? c / at.length : 0, x.cor)}
            <div class="rnums"><span><b>${c}</b>/${at.length} concluídas</span><span class="${l ? 'late' : ''}"><b>${l}</b> atrasada${l === 1 ? '' : 's'}</span><span><b>${h}</b> hoje</span></div></a>`;
        }).join('') || '<p class="muted">Cadastre suas responsabilidades para ver o desempenho de cada uma.</p>'}</div>
      </section>`;

    const h = new Date().getHours();
    el.querySelector('.page-h h1').textContent = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    const fb = el.querySelector('#fResp'), pop = el.querySelector('#fRespPop');
    const fecharPop = () => { pop.hidden = true; fb.setAttribute('aria-expanded', 'false'); document.removeEventListener('click', foraPop, true); };
    const foraPop = e => { if (!e.target.closest('.mfilter')) fecharPop(); };
    fb.onclick = () => { if (!pop.hidden) return fecharPop(); pop.hidden = false; fb.setAttribute('aria-expanded', 'true'); setTimeout(() => document.addEventListener('click', foraPop, true)); };
    const aplicar = ids => { filtroResp = ids; salvarFiltro(); fecharPop(); V.render(el); };
    el.querySelector('#fRespOk').onclick = () => aplicar([...pop.querySelectorAll('input:checked')].map(i => i.value));
    el.querySelector('#fRespTodas').onclick = () => aplicar([]);
    pop.addEventListener('keydown', e => { if (e.key === 'Escape') { fecharPop(); fb.focus(); } });
    /* Prioridades: Hoje ⇄ Próximos 7 dias, de lado (não empurra os e-mails para baixo) */
    const pv = el.querySelector('#pv');
    if (pv) {
      const track = pv.firstElementChild, panes = [...track.children];
      let atual = 0;
      const ir = (i, anim = true) => {
        atual = Math.max(0, Math.min(panes.length - 1, i));
        pv.style.transition = track.style.transition = anim ? '' : 'none';
        track.style.transform = `translateX(-${atual * 100}%)`;
        pv.style.height = panes[atual].offsetHeight + 'px';
        panes.forEach((p, k) => { if (k === atual) p.removeAttribute('inert'); else p.setAttribute('inert', ''); });
        el.querySelectorAll('.pv-tab').forEach(t => t.setAttribute('aria-selected', String(+t.dataset.pv === atual)));
        el.querySelectorAll('.pv-arr').forEach(a => a.disabled = +a.dataset.pv === atual);
      };
      el.querySelectorAll('[data-pv]').forEach(b => b.onclick = () => ir(+b.dataset.pv));
      let x0 = null;
      pv.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      pv.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) ir(atual + (dx < 0 ? 1 : -1)); });
      ir(0, false);
      if (window.ResizeObserver) new ResizeObserver(() => { pv.style.height = panes[atual].offsetHeight + 'px'; }).observe(panes[0]);
    }
    if (App.Agenda) App.Agenda.ligar(el);
    if (App.Resumo) App.Resumo.ligar(el);
    el.querySelectorAll('[data-rt]').forEach(b => b.onclick = async () => { b.disabled = true; await App.Seg.executar(b.dataset.rt); b.disabled = false; });
    if (App.Emails) App.Emails.ligar(el.querySelector('.mail-card') || el);
    if (App.Ren) App.Ren.ligar(el);
    if (App.Regua) App.Regua.ligar(el);
    el.querySelectorAll('.cl-venc[data-cli]').forEach(li => li.onclick = () => App.go('clientes', { cliente: li.dataset.cli }, { origem: true }));
    el.querySelectorAll('.pitem').forEach(li => li.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const id = li.dataset.id;
      if (b.dataset.act === 'concluir') App.Forms.concluir(id);
      if (b.dataset.act === 'abrir') App.Forms.detalhes(id);
      if (b.dataset.act === 'adiar') App.Forms.adiar(id);
    }));
  };

  App.Views = App.Views || {};
  App.Views.painel = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/atividades.js */
/* Tela: Atividades, em lista agrupada por prazo ou em quadro Kanban, com filtros. */
(function (App) {
  const { U, M, UI, Store } = App;
  const V = { titulo: 'Atividades' };
  const PADRAO = { resp: '', status: 'abertas', prioridade: '', prazo: '', busca: '', categoria: '', metaId: '' };
  let f = { ...PADRAO };
  let modo = (() => { try { return localStorage.getItem('gestao-pessoal:modoAtividades') || 'lista'; } catch (e) { return 'lista'; } })();

  V.setParams = q => { f = { ...PADRAO }; if (q) Object.assign(f, q); if (q && (q.prazo === 'atrasadas' || q.prazo === 'hoje' || q.prazo === '7dias')) f.status = 'abertas'; if (q && q.status === 'concluida') f.status = 'concluida'; };

  const passa = (a, semStatus) => {
    if (f.resp && !M.noFiltro(a, String(f.resp).split(','))) return false;
    if (f.categoria && a.categoria !== f.categoria) return false;
    if (f.metaId && !M.metasDa(a).includes(f.metaId)) return false;
    if (!semStatus && f.status === 'abertas' && !M.aberta(a)) return false;
    if (!semStatus && f.status && f.status !== 'abertas' && a.status !== f.status) return false;
    if (f.prioridade && a.prioridade !== f.prioridade) return false;
    if (f.prazo === 'atrasadas' && !M.atrasada(a)) return false;
    if (f.prazo === 'hoje' && !M.hoje(a)) return false;
    if (f.prazo === '7dias' && !(M.hoje(a) || M.proximos(a, 7))) return false;
    if (f.prazo === 'semprazo' && a.prazo) return false;
    if (f.busca) { const q = f.busca.toLowerCase(); if (![a.titulo, a.descricao, a.categoria, a.observacoes].some(s => s && s.toLowerCase().includes(q))) return false; }
    return true;
  };

  const grupo = a => {
    if (a.status === 'concluida') return 'concluidas';
    if (!a.prazo) return 'semprazo';
    if (M.atrasada(a)) return 'atrasadas';
    if (M.hoje(a)) return 'hoje';
    if (U.diff(a.prazo, U.today()) <= 7) return 'semana';
    return 'depois';
  };
  const GRUPOS = [['atrasadas', 'Atrasadas'], ['hoje', 'Hoje'], ['semana', 'Próximos 7 dias'], ['depois', 'Mais adiante'], ['semprazo', 'Sem prazo'], ['concluidas', 'Concluídas']];

  /* Ligação com outras atividades: "↳ veio de..." e "gerou 2" */
  const ligacao = a => {
    const o = M.origem(a), n = M.filhos(a.id).length;
    return (o ? `<span class="lig" title="Próximo passo de: ${U.esc(o.titulo)}">↳ ${U.esc(o.titulo.length > 28 ? o.titulo.slice(0, 27) + '…' : o.titulo)}</span>` : '')
      + (n ? `<span class="lig" title="Esta atividade gerou ${n}">gerou ${n}</span>` : '');
  };
  /* Resultado por meta: "2/3 indicações · R$ 40 mil produção" */
  const resultadoTxt = a => {
    const ms = M.metasComResultado(a);
    if (!ms.length) {
      if (a.resultado == null && a.resultadoEsperado == null) return '';
      if (a.resultado == null) return `<span class="res pend">Esperado: ${U.num(a.resultadoEsperado)}</span>`;
      return `<span class="res">${U.num(a.resultado)}${a.resultadoEsperado != null ? '/' + U.num(a.resultadoEsperado) : ''} resultado</span>`;
    }
    return ms.map(m => { const r = M.resMeta(a, m.id), e = M.espMeta(a, m.id), t = U.esc(m.nome);
      if (r == null && e == null) return `<span class="res meta" title="Meta: ${t}">${t}</span>`;
      if (r == null) return `<span class="res pend" title="Meta: ${t}">Esperado: ${U.esc(M.fmtMeta(e, m))}</span>`;
      return `<span class="res" title="Meta: ${t}">${U.esc(M.ehDinheiro(m) ? M.fmtMeta(r, m) + (e != null ? ' de ' + M.fmtMeta(e, m) : '') : U.num(r) + (e != null ? '/' + U.num(e) : '') + ' ' + (m.unidade || ''))}</span>`; }).join('');
  };

  const linha = a => `<li class="arow${a.status === 'concluida' ? ' is-done' : ''}${M.atrasada(a) ? ' is-late' : ''}" data-id="${a.id}">
    <button class="check${a.status === 'concluida' ? ' on' : ''}" data-act="${a.status === 'concluida' ? 'reabrir' : 'concluir'}" aria-label="${a.status === 'concluida' ? 'Reabrir' : 'Concluir'}">${UI.icon('check')}</button>
    <div class="amain" data-act="abrir"><b>${U.esc(a.titulo)}</b><div class="pmeta">${UI.respChips(a)}${UI.cliChip(a)}${UI.negChip(a)}${a.categoria && !a.tipoNegocio ? `<span class="cat">${U.esc(a.categoria)}</span>` : ''}${a.status === 'andamento' || a.status === 'adiada' ? UI.statusPill(a.status) : ''}${resultadoTxt(a)}${ligacao(a)}</div></div>
    <div class="aside">${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
    <div class="aact">${a.status !== 'concluida' ? `<button class="icon-btn" data-act="adiar" title="Adiar" aria-label="Adiar">${UI.icon('adiar')}</button>` : ''}<button class="icon-btn" data-act="editar" title="Editar" aria-label="Editar">${UI.icon('editar')}</button><button class="icon-btn" data-act="excluir" title="Excluir" aria-label="Excluir">${UI.icon('lixo')}</button></div></li>`;

  const cartao = a => `<article class="kcard${M.atrasada(a) ? ' is-late' : ''}" draggable="true" data-id="${a.id}" tabindex="0">
    <div class="kc-top">${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
    <b>${U.esc(a.titulo)}</b>
    <div class="pmeta">${UI.respChips(a)}${UI.cliChip(a)}${UI.negChip(a)}${resultadoTxt(a)}${ligacao(a)}</div></article>`;

  V.render = el => {
    const todas = Store.all('atividades');
    const lista = todas.filter(passa);
    const cats = [...new Set(todas.map(a => a.categoria).filter(Boolean))].sort();
    const filtrado = JSON.stringify(f) !== JSON.stringify(PADRAO);

    el.innerHTML = `
      <div class="page-h"><div><h1>Atividades</h1><p class="muted">${U.plural(lista.length, 'atividade', 'atividades')}${filtrado ? ' com os filtros atuais' : ' em aberto'}</p></div>
        <div class="seg" role="group" aria-label="Visualização"><button data-modo="lista" aria-pressed="${modo === 'lista'}">${UI.icon('lista')}Lista</button><button data-modo="kanban" aria-pressed="${modo === 'kanban'}">${UI.icon('kanban')}Kanban</button></div></div>
      <div class="filters">
        <label class="search">${UI.icon('busca')}<input id="fBusca" placeholder="Buscar" value="${U.esc(f.busca)}" aria-label="Buscar atividades"></label>
        <select data-f="resp" aria-label="Responsabilidade">${f.resp && String(f.resp).includes(',') ? `<option value="${U.esc(f.resp)}" selected>${String(f.resp).split(',').map(i => M.respNome(i)).join(' + ')}</option>` : ''}${UI.options(Store.all('responsabilidades').map(x => ({ id: x.id, label: x.nome })), f.resp, { vazio: 'Todas as responsabilidades' })}</select>
        <select data-f="prazo" aria-label="Prazo">${UI.options([{ id: 'atrasadas', label: 'Atrasadas' }, { id: 'hoje', label: 'Para hoje' }, { id: '7dias', label: 'Até 7 dias' }, { id: 'semprazo', label: 'Sem prazo' }], f.prazo, { vazio: 'Qualquer prazo' })}</select>
        <select data-f="prioridade" aria-label="Prioridade">${UI.options(M.PRIORIDADES, f.prioridade, { vazio: 'Qualquer prioridade' })}</select>
        ${modo === 'lista' ? `<select data-f="status" aria-label="Status">${UI.options([{ id: 'abertas', label: 'Em aberto' }, ...M.STATUS], f.status, { vazio: 'Todos os status' })}</select>` : ''}
        ${cats.length ? `<select data-f="categoria" aria-label="Categoria">${UI.options(cats.map(c => ({ id: c, label: c })), f.categoria, { vazio: 'Todas as categorias' })}</select>` : ''}
        ${f.metaId && Store.get('metas', f.metaId) ? `<span class="fchip">Meta: ${U.esc(Store.get('metas', f.metaId).nome)}</span>` : ''}
        ${filtrado ? `<button class="link" id="limpar">Limpar filtros</button>` : ''}
      </div>
      <div id="corpo"></div>`;

    const corpo = el.querySelector('#corpo');
    if (modo === 'lista') {
      const gs = GRUPOS.map(([k, t]) => [k, t, lista.filter(a => grupo(a) === k)]).filter(g => g[2].length);
      gs.forEach(g => g[2].sort(g[0] === 'concluidas' ? (a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || '') : M.ordemAtencao));
      corpo.innerHTML = gs.length ? gs.map(([k, t, arr]) => `<section class="agroup g-${k}"><h2>${t} <span class="count">${arr.length}</span></h2><ul class="alist">${arr.map(linha).join('')}</ul></section>`).join('')
        : `<div class="empty card"><b>Nenhuma atividade encontrada.</b><p>${filtrado ? 'Tente outros filtros.' : 'Crie a primeira atividade.'}</p><button class="btn primary" data-nova>${UI.icon('mais')}Nova atividade</button></div>`;
    } else {
      const base = todas.filter(a => passa(a, true));
      corpo.innerHTML = `<div class="kanban">${M.STATUS.map(s => { const arr = base.filter(a => a.status === s.id).sort(s.id === 'concluida' ? (a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || '') : M.ordemAtencao);
        return `<section class="kcol" data-status="${s.id}"><h2>${UI.statusPill(s.id)}<span class="count">${arr.length}</span></h2><div class="kdrop">${(s.id === 'concluida' ? arr.slice(0, 15) : arr).map(cartao).join('') || '<p class="kempty">Arraste atividades para cá</p>'}${s.id === 'concluida' && arr.length > 15 ? `<p class="kempty">+${arr.length - 15} concluídas</p>` : ''}</div></section>`; }).join('')}</div>
        <p class="note">Arraste os cartões entre as colunas para mudar o status. No celular, toque no cartão e use Editar.</p>`;
      bindKanban(corpo);
    }

    el.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => { modo = b.dataset.modo; try { localStorage.setItem('gestao-pessoal:modoAtividades', modo); } catch (e) {} V.render(el); });
    el.querySelectorAll('[data-f]').forEach(s => s.onchange = () => { f[s.dataset.f] = s.value; V.render(el); });
    const busca = el.querySelector('#fBusca');
    busca.oninput = () => { f.busca = busca.value; const pos = busca.selectionStart; V.render(el); const nb = el.querySelector('#fBusca'); nb.focus(); nb.setSelectionRange(pos, pos); };
    const lim = el.querySelector('#limpar'); if (lim) lim.onclick = () => { f = { ...PADRAO }; V.render(el); };
    const nova = el.querySelector('[data-nova]'); if (nova) nova.onclick = () => App.Forms.atividade(null, f.resp ? { responsabilidadeId: String(f.resp).split(',')[0], respIds: String(f.resp).split(',').slice(1) } : {});
    corpo.querySelectorAll('.arow').forEach(li => li.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const id = li.dataset.id, act = b.dataset.act;
      if (act === 'concluir') App.Forms.concluir(id);
      if (act === 'reabrir') { M.reabrir(id); UI.toast('Atividade reaberta'); }
      if (act === 'abrir') App.Forms.detalhes(id);
      if (act === 'adiar') App.Forms.adiar(id);
      if (act === 'editar') App.Forms.atividade(id);
      if (act === 'excluir') App.Forms.excluirAtividade(id);
    }));
  };

  function bindKanban(root) {
    let drag = null;
    root.querySelectorAll('.kcard').forEach(c => {
      c.addEventListener('dragstart', e => { drag = c.dataset.id; c.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', drag); } catch (x) {} });
      c.addEventListener('dragend', () => c.classList.remove('dragging'));
      c.addEventListener('click', () => App.Forms.detalhes(c.dataset.id));
      c.addEventListener('keydown', e => { if (e.key === 'Enter') App.Forms.detalhes(c.dataset.id); });
    });
    root.querySelectorAll('.kcol').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => {
        e.preventDefault(); col.classList.remove('over');
        const id = drag; drag = null; if (!id) return;
        const a = Store.get('atividades', id); const st = col.dataset.status;
        if (!a || a.status === st) return;
        if (st === 'concluida') return App.Forms.concluir(id);
        if (st === 'adiada') return App.Forms.adiar(id);
        if (a.status === 'concluida') M.reabrir(id);
        M.mudarStatus(id, st); UI.toast('Movida para ' + M.status(st).label);
      });
    });
  }

  App.Views = App.Views || {};
  App.Views.atividades = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/negocios.js */
/* Tela: Negócios em andamento (aberta pelo card do painel). */
(function (App) {
  const { U, M, UI, Store } = App;
  const V = { titulo: 'Negócios em andamento' };
  let fTipo = '';

  /* Uma linha por negócio (um card com Zentis e Vida aparece duas vezes) */
  const linha = ({ a, n }) => { const outros = M.negociosDa(a).filter(x => x.id !== n.id && !x.resultado), lq = M.liqNeg(n);
    return `<li class="nrow${M.atrasada(a) ? ' is-late' : ''}" data-id="${a.id}">
      <button class="check" data-act="concluir" aria-label="Concluir negócio">${UI.icon('check')}</button>
      <div class="amain" data-act="abrir"><b>${U.esc(a.cliente || a.titulo)}</b><div class="pmeta"><span class="neg">${U.esc(M.tipoNeg(n.tipo).label)}</span>${a.cliente ? `<span>${U.esc(a.titulo)}</span>` : ''}${outros.length ? `<span class="lig" title="No mesmo card">+ ${U.esc(outros.map(x => M.tipoNeg(x.tipo).label).join(', '))}</span>` : ''}${UI.respChip(a.responsabilidadeId)}${a.status === 'andamento' || a.status === 'adiada' ? UI.statusPill(a.status) : ''}</div></div>
      <div class="nval">${n.valor ? U.brl(n.valor) : '<span class="muted">sem valor</span>'}${lq != null ? `<small>fica ${U.brlShort(lq)}</small>` : ''}</div>
      <div class="aside">${UI.prioPill(a.prioridade)}${UI.due(a)}</div>
      <div class="aact"><button class="icon-btn" data-act="editar" title="Editar" aria-label="Editar">${UI.icon('editar')}</button></div></li>`; };

  V.render = el => {
    const abertos = M.negItensAbertos();
    const lista = abertos.filter(x => !fTipo || M.tipoChave(x.n.tipo) === fTipo).sort((x, y) => M.ordemAtencao(x.a, y.a));
    const total = lista.reduce((s, x) => s + (+x.n.valor || 0), 0);
    const ini = U.addDays(U.today(), -30);
    const fechados = Store.all('atividades').filter(a => M.ehNegocio(a) && a.status === 'concluida' && (a.concluidaEm || '').slice(0, 10) >= ini).sort((a, b) => (b.concluidaEm || '').localeCompare(a.concluidaEm || ''))
      .flatMap(a => M.negociosDa(a).map(n => ({ a, n, perdido: (n.resultado || a.resultadoNegocio) === 'perdido' })));
    const ganhos = fechados.filter(x => !x.perdido);
    const mesIni = U.today().slice(0, 8) + '01';
    const prodMes = App.Fat.producoesDoMes(App.Fat.ymHoje());
    const semana = abertos.filter(x => x.a.prazo && U.diff(x.a.prazo, U.today()) <= 7).length;
    /* Agrupa pelo tipo digitado (sem diferenciar maiúsculas e acentos) */
    const grupos = {};
    abertos.forEach(({ n }) => { const k = M.tipoChave(n.tipo); const g = grupos[k] || (grupos[k] = { id: k, label: M.tipoNeg(n.tipo).label, n: 0, v: 0 }); g.n++; g.v += +n.valor || 0; });
    const porTipo = Object.values(grupos).sort((a, b) => b.n - a.n || b.v - a.v);
    if (fTipo && !grupos[fTipo]) fTipo = '';
    const liqTotal = abertos.reduce((s, x) => s + (M.liqNeg(x.n) || 0), 0);
    const tituloTipo = fTipo ? grupos[fTipo].label : 'Todos os negócios';

    el.innerHTML = `
      <div class="page-h"><div><h1>Negócios em andamento</h1><p class="muted">Cada negócio aparece separado, mesmo quando vários estão no mesmo card.</p></div>
        <button class="btn primary" id="novoNeg">${UI.icon('mais')}Novo negócio</button></div>
      <section class="kpis k4">
        <div class="kpi"><span>Em andamento</span><b>${abertos.length}</b></div>
        <div class="kpi"><span>Valor em negociação</span><b>${U.brlShort(abertos.reduce((s, x) => s + (+x.n.valor || 0), 0))}</b>${liqTotal ? `<em>≈ ${U.brlShort(liqTotal)} ficam com você</em>` : ''}</div>
        <div class="kpi ${semana ? 'k-warn' : ''}"><span>Fecham em até 7 dias</span><b>${semana}</b></div>
        <a class="kpi" href="#faturamento" data-go="faturamento"><span>Produção do mês (líquido)</span><b>${U.brlShort(prodMes.reduce((s, p) => s + App.Fat.liquidoTotal(p), 0))}</b><em>${U.plural(prodMes.length, 'lançamento', 'lançamentos')}</em></a>
      </section>
      ${porTipo.length ? `<div class="tchips"><button class="tchip${!fTipo ? ' on' : ''}" data-t="">Todos <b>${abertos.length}</b></button>${porTipo.map(t => `<button class="tchip${fTipo === t.id ? ' on' : ''}" data-t="${U.esc(t.id)}">${U.esc(t.label)} <b>${t.n}</b><small>${U.brlShort(t.v)}</small></button>`).join('')}</div>` : ''}
      <section class="card">
        <div class="card-h"><h2>${U.esc(tituloTipo)}</h2><span class="muted small">${U.brl(total)}</span></div>
        ${lista.length ? `<ul class="alist">${lista.map(linha).join('')}</ul>` : `<div class="empty"><b>Nenhum negócio em andamento.</b><p>Ao criar uma atividade, marque "É um negócio" e escreva o tipo, o cliente e o valor.</p><button class="btn primary" id="novoNeg2">${UI.icon('mais')}Novo negócio</button></div>`}
      </section>
      ${fechados.length ? `<section class="card"><div class="card-h"><h2>Concluídos nos últimos 30 dias</h2><span class="muted small">${ganhos.length} fechados · ${fechados.length - ganhos.length} não fecharam</span></div>
        <ul class="alist">${fechados.slice(0, 12).map(({ a, n, perdido }) => `<li class="nrow is-done" data-id="${a.id}"><span class="tag ${perdido ? 't-erro' : 't-ok'}">${perdido ? 'Não fechou' : 'Fechado'}</span>
          <div class="amain" data-act="abrir"><b>${U.esc(a.cliente || a.titulo)}</b><div class="pmeta"><span>${U.esc(M.tipoNeg(n.tipo).label)}</span><span>${U.fmtDate((a.concluidaEm || '').slice(0, 10))}</span></div></div>
          <div class="nval">${n.valor ? U.brl(n.valor) : ''}</div></li>`).join('')}</ul></section>` : ''}`;

    const novo = () => App.Forms.atividade(null, { tipoNegocio: fTipo ? grupos[fTipo].label : null, categoria: 'Negócios', prioridade: 'alta', _neg: true });
    el.querySelector('#novoNeg').onclick = novo;
    const n2 = el.querySelector('#novoNeg2'); if (n2) n2.onclick = novo;
    el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { fTipo = b.dataset.t; V.render(el); });
    el.querySelectorAll('.nrow').forEach(li => li.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return; const id = li.dataset.id;
      if (b.dataset.act === 'concluir') App.Forms.concluir(id);
      if (b.dataset.act === 'abrir') App.Forms.detalhes(id);
      if (b.dataset.act === 'editar') App.Forms.atividade(id);
    }));
  };

  App.Views = App.Views || {};
  App.Views.negocios = V;
})(window.App = window.App || {});

</script>
<script>
/* js/views/funil.js */
/* Parte 3 · Funil de oportunidades (24/11/2026).
   Não tem cadastro próprio: junta o que já existe e, ao mudar de etapa, grava na origem.
   - Negócios em aberto das atividades  → etapa em extras.negocios[i].etapa (padrão: reunião; renovação: proposta)
   - Mapa 360 "Não tem" / "Mapeado"     → mapa[area].etapa (a_abordar=lead, abordado=contato, reuniao, proposta; perdido sai do funil)
   - Indicações "Em conversa"           → clientes.dados.funilEtapa (padrão: contato)
   Fechou/Perdeu: negócio → fluxo normal de concluir (receita); mapa → "Comigo" (+ cadastrar contrato) ou "Não quis agora";
   indicação → "Rodou" ou "Não rodou". */
(function (App) {
  const { U, M, UI, Store } = App;
  const Fu = {};
  const C = () => App.Cli;

  Fu.ETAPAS = [{ id: 'lead', label: 'Lead' }, { id: 'contato', label: 'Contato' }, { id: 'reuniao', label: 'Reunião' }, { id: 'proposta', label: 'Proposta' }];
  const DO_MAPA = { a_abordar: 'lead', abordado: 'contato', reuniao: 'reuniao', proposta: 'proposta' };
  const PARA_MAPA = { lead: 'a_abordar', contato: 'abordado', reuniao: 'reuniao', proposta: 'proposta' };
  Fu.ORIGENS = [{ id: 'negocio', label: 'Negócios' }, { id: 'renovacao', label: 'Renovações' }, { id: 'indicacao', label: 'Indicações' }, { id: 'mapa', label: 'Mapa 360' }];

  const assessoria = () => App.Ren ? App.Ren.respRenovacao() : (M.respAtivas()[0] || {});
  const nomeCurto = c => c ? (c.apelido || String(c.nome || '').split(' ')[0]) : '';

  /* ---------- Itens do funil ---------- */
  Fu.itens = () => {
    const Cl = C(), out = [], comNegocio = new Set(), areaComNeg = new Set();
    M.negItensAbertos().forEach(({ a, n }) => {
      const cli = a.clienteId ? Cl.cliente(a.clienteId) : null;
      const ren = n.renId && App.Ren ? Store.get('renovacoes', n.renId) : null;
      if (cli) comNegocio.add(cli.id);
      if (ren && ren.origem === 'mapa') areaComNeg.add(ren.clienteId + '|' + ren.area);
      if (cli) Cl.AREAS.forEach(ar => { const k = Cl.norm(M.tipoNeg(n.tipo).label), an = Cl.norm(ar.nome); if (k.startsWith(an) || an.startsWith(k)) areaComNeg.add(cli.id + '|' + ar.id); });
      const ind = cli && cli.indicadoPor ? Cl.indicador(cli) : null;
      const lq = M.liqNeg(n), x12 = n.mensal ? 12 : 1;
      out.push({
        key: 'n:' + a.id + ':' + n.id, fonte: 'negocio', origem: ren ? 'renovacao' : 'negocio',
        etapa: n.etapa || (ren ? 'proposta' : 'reuniao'), nome: a.cliente || a.titulo, clienteId: cli ? cli.id : null,
        produto: M.tipoNeg(n.tipo).label, valor: n.valor != null ? +n.valor * x12 : null, mensal: !!n.mensal, valorMes: n.mensal ? n.valor : null,
        liq: lq != null ? lq * x12 : null, prox: a.titulo, prazo: a.prazo, atrasada: M.atrasada(a),
        origemTxt: ren ? 'Renovação' : ind ? 'Indicação de ' + nomeCurto(ind) : 'Negócio', a, n, resp: a
      });
    });
    Store.all('clientes').filter(c => c.situacao === 'conversa' && !comNegocio.has(c.id)).forEach(c => {
      const i = Cl.indicador(c);
      out.push({ key: 'i:' + c.id, fonte: 'indicacao', origem: 'indicacao', etapa: c.funilEtapa || 'contato', nome: c.nome, clienteId: c.id,
        produto: 'Abertura de relacionamento', valor: null, liq: null, prox: c.observacoes || '', prazo: null,
        origemTxt: i ? 'Indicação de ' + nomeCurto(i) : 'Indicação', c });
    });
    Store.all('clientes').filter(c => !c.saiu).forEach(c => Object.entries(c.mapa || {}).forEach(([aid, reg]) => {
      if (!reg || (reg.sit !== 'nao' && reg.sit !== 'mapeado') || reg.etapa === 'perdido') return;
      const ar = Cl.area(aid); if (!ar || !Cl.areaVisivel(ar) || areaComNeg.has(c.id + '|' + aid)) return;
      if (Cl.mapa(c, aid).sit !== reg.sit) return; /* já tem contrato ativo na área */
      out.push({ key: 'm:' + c.id + ':' + aid, fonte: 'mapa', origem: 'mapa', etapa: DO_MAPA[reg.etapa] || 'lead', nome: c.nome, clienteId: c.id,
        produto: ar.nome, valor: reg.valor != null && reg.valor !== '' ? +reg.valor : null, liq: null,
        prox: [reg.sit === 'mapeado' ? 'Tem com ' + (reg.onde || 'outro') : 'Não tem', reg.venc && 'vence ' + U.fmtDate(reg.venc), reg.obs].filter(Boolean).join(' · '),
        prazo: reg.venc || null, origemTxt: reg.sit === 'mapeado' ? 'Mapa 360 · mapeado' : 'Mapa 360 · cross-sell', c, area: aid, reg });
    }));
    return out;
  };
  Fu.ordem = (a, b) => (a.prazo || '9999').localeCompare(b.prazo || '9999') || (b.valor || 0) - (a.valor || 0) || String(a.nome).localeCompare(String(b.nome), 'pt-BR');
  Fu.etapaRot = id => (Fu.ETAPAS.find(e => e.id === id) || {}).label || id;

  /* ---------- Ações (gravam na origem) ---------- */
  Fu.mover = (it, etapa) => {
    if (it.etapa === etapa) return;
    if (it.fonte === 'negocio') {
      const a = Store.get('atividades', it.a.id); if (!a) return;
      Store.update('atividades', a.id, M.espelhoNeg(M.negociosDa(a).map(n => n.id === it.n.id ? { ...n, etapa } : n)), { silent: true });
      M.log(a.id, 'editada', 'Funil: ' + M.tipoNeg(it.n.tipo).label + ' de ' + Fu.etapaRot(it.etapa) + ' para ' + Fu.etapaRot(etapa));
      Store.commit();
    }
    if (it.fonte === 'mapa') C().salvarMapa(it.c.id, it.area, { ...it.reg, etapa: PARA_MAPA[etapa] });
    if (it.fonte === 'indicacao') Store.update('clientes', it.c.id, { funilEtapa: etapa, funilEm: U.today() });
    UI.toast(it.nome.split(' ')[0] + ' · ' + Fu.etapaRot(etapa));
  };
  Fu.fechar = async (it, ganhou) => {
    const Cl = C();
    if (it.fonte === 'negocio') {
      if (ganhou) return App.Forms.concluirNegocio(it.a.id);
      const ok = await UI.confirm({ title: 'Não fechou?', text: `<b>${U.esc(it.produto)}</b> · ${U.esc(it.nome)} sai do funil como negócio que não fechou.`, ok: 'Não fechou', danger: false });
      if (!ok) return;
      const a = Store.get('atividades', it.a.id), negs = M.negociosDa(a).map(n => n.id === it.n.id ? { ...n, resultado: 'perdido' } : n);
      Store.update('atividades', a.id, M.espelhoNeg(negs), { silent: true });
      if (negs.every(n => n.resultado)) { if (App.Ren && a.renovacaoId) App.Ren.segurar(a.id); M.concluir(a.id, { nota: M.tipoNeg(it.n.tipo).label + ': não fechou (funil)' }); if (App.Ren && a.renovacaoId) App.Ren.aoConcluir(a.id); }
      else { M.log(a.id, 'editada', M.tipoNeg(it.n.tipo).label + ': não fechou (funil)'); Store.commit(); }
      UI.toast('Negócio encerrado');
      return;
    }
    if (it.fonte === 'indicacao') {
      Cl.registrarIndicacao({ indicadorId: it.c.indicadoPor, situacao: ganhou ? 'sim' : 'nao', data: it.c.dataIndicacao, observacoes: it.c.observacoes, existenteId: it.c.id });
      UI.toast(ganhou ? nomeCurto(it.c) + ' rodou! Agora conta como cliente.' : nomeCurto(it.c) + ' foi para "Não rodaram".');
      return;
    }
    if (it.fonte === 'mapa') {
      if (!ganhou) { Cl.salvarMapa(it.c.id, it.area, { ...it.reg, etapa: 'perdido' }); UI.toast('Mapa 360: "Não quis agora"'); return; }
      const mp = { ...it.reg, sit: 'comigo' }; delete mp.etapa; Cl.salvarMapa(it.c.id, it.area, mp);
