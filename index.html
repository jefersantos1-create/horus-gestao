<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Horus Gestão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: identidade Horus em tema claro. Menu lateral preto com logo HORUS em degradê violeta; área de trabalho clara lavanda; roxo só em ação principal, item ativo e destaques */
:root {
  --bg: #F6F4FB; --surface: #FFFFFF; --surface-2: #F4F1FA; --line: #E5E0F0; --track: #ECE7F6;
  --ink: #1D1630; --muted: #615A77; --faint: #8F88A6;
  --accent: #6E3FF0; --accent-ink: #FFFFFF; --accent-soft: #EFE9FE;
  --grad: linear-gradient(90deg, #8F6BFF 0%, #C98CFF 100%);
  --grad-btn: linear-gradient(90deg, #6E3FF0 0%, #A24DE8 100%);
  --glow: 0 8px 22px rgba(110, 63, 240, .28);
  --late: #C8402E; --late-soft: #FCEBE7; --warn: #B0650F; --warn-soft: #FDF2E2; --ok: #23864F; --ok-soft: #E4F5EA;
  --p-urgente: #C8402E; --p-alta: #C2611A; --p-media: #6E3FF0; --p-baixa: #7A7390;
  --side: #0B0A10; --side-line: #221E2E; --side-ink: #FFFFFF; --side-muted: #9890B2; --side-hover: #1A1626; --side-active: #241C40;
  --shadow: 0 1px 2px rgba(40, 20, 90, .04), 0 8px 24px rgba(40, 20, 90, .06);
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.muted { color: var(--muted); } .small { font-size: 13px; } .ink { color: var(--ink); } .late { color: var(--late); }
.cap::first-letter { text-transform: uppercase; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.grow { flex: 1; }
kbd { font-family: inherit; font-size: 11.5px; color: inherit; border: 1px solid var(--faint); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
b, td, .kpi b, .count { font-variant-numeric: tabular-nums; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--side-line); color: var(--side-ink); display: flex; flex-direction: column; gap: 18px; padding: calc(20px + env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; color: var(--side-ink); white-space: nowrap; display: block; }
.logo span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { display: block; color: var(--side-muted); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }
.mark-unused { display: inline-flex; align-items: flex-end; gap: 2px; width: 26px; height: 26px; padding: 5px; border-radius: 7px; background: var(--accent); flex: none; }
.mark i { flex: 1; background: var(--accent-ink); border-radius: 1px; opacity: .95; }
.mark i:nth-child(1) { height: 40%; } .mark i:nth-child(2) { height: 70%; } .mark i:nth-child(3) { height: 100%; }
.sidebar .new { width: 100%; justify-content: center; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 7px 10px 7px 7px; border-radius: 11px; color: var(--side-muted); text-decoration: none; font-weight: 600; font-size: 14px; transition: background .15s, color .15s; }
.nav a .ic { width: 34px; height: 34px; padding: 8px; border-radius: 10px; transition: background .2s, box-shadow .2s; }
.nav a:hover { background: var(--side-hover); color: var(--side-ink); }
.nav a.active { background: var(--side-active); color: var(--side-ink); }
.nav a.active .ic { background: var(--grad-btn); color: #fff; box-shadow: var(--glow); }
.side-foot kbd { background: transparent; }
.side-foot { margin-top: auto; color: var(--side-muted); font-size: 12px; padding: 0 8px; display: grid; gap: 10px; }
.side-foot p { margin: 0; }
.topbar { display: none; }
.view { padding-block: 28px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1240px; width: 100%; outline: none; display: grid; gap: 20px; align-content: start; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 20; align-items: center; justify-content: space-between; gap: 10px; background: var(--side); border-bottom: 1px solid var(--side-line); padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sidebar { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20; flex-direction: row; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); border-right: 0; border-top: 1px solid var(--side-line); }
  .sidebar .brand, .sidebar .new, .side-foot { display: none; }
  .nav { grid-template-columns: repeat(6, 1fr); width: 100%; }
  .nav .l-long { display: none; } .nav .l-short { display: inline; }
  .nav a { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 4px 2px; text-align: center; }
  .nav a .ic { width: 30px; height: 30px; padding: 6px; }
  .nav a.active { background: none; }
  .nav a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .view { padding-block: 18px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 16px; }
}

/* ---------- Botões ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: 14px; background: var(--surface); transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--grad-btn); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); box-shadow: var(--glow); transform: translateY(-1px); }
.btn.ghost { border-color: var(--line); background: var(--surface); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.danger { background: var(--late); color: #fff; }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.danger-text { color: var(--late) !important; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--faint); transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; text-decoration: none; }
.link:hover { text-decoration: underline; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--grad-btn); color: #fff; box-shadow: var(--glow); }
.seg .ic { width: 16px; height: 16px; }

/* ---------- Cabeçalho de página e filtros ---------- */
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-h h1 { font-size: 26px; font-weight: 700; }
.page-h p { margin: 4px 0 0; max-width: 70ch; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, .search { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 13.5px; max-width: 100%; }
select:hover, .search:hover { border-color: var(--faint); }
.search { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; min-width: 200px; flex: 1 1 200px; max-width: 320px; }
.search input { border: 0; outline: 0; background: none; padding: 8px 0; width: 100%; }
.search .ic { color: var(--faint); width: 16px; height: 16px; }
.filter select { min-width: 220px; }
.fchip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; }
.banner { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }

/* ---------- Cartões e indicadores ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-h h2 { font-size: 15px; font-weight: 700; }
.count { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); padding: 1px 9px; font-family: var(--body); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.45fr); gap: 12px; }
.kpi.k-neg span, .kpi.k-neg em { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); transition: border-color .15s, transform .15s; min-width: 0; }
.kpi:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--glow); }
.kpi span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.kpi b { display: block; font-family: var(--display); font-size: 28px; font-weight: 700; margin-top: 2px; }
.kpi.k-late { border-color: color-mix(in srgb, var(--late) 45%, var(--line)); background: var(--late-soft); }
.kpi.k-late b, .kpi.k-late span { color: var(--late); }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1080px) { .grid-main { grid-template-columns: 1fr; } }
.side-col { display: grid; gap: 20px; min-width: 0; }
.empty { text-align: center; padding: 28px 16px; display: grid; justify-items: center; gap: 6px; }
.empty b { font-family: var(--display); font-size: 16px; }
.empty p { margin: 0 0 6px; color: var(--muted); max-width: 46ch; }
.empty.sm { padding: 12px; }

/* Prioridades de hoje */
.prio-card .card-h h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; background: var(--grad-btn); -webkit-background-clip: text; background-clip: text; color: transparent; }
.prio-card { position: relative; overflow: hidden; }
.prio-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--grad); }
.plist, .alist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pitem, .arow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); transition: border-color .15s, background .15s; }
.pitem:hover, .arow:hover { border-color: var(--faint); }
.pitem.is-late, .arow.is-late { border-left: 3px solid var(--late); }
.pmain, .amain { min-width: 0; cursor: pointer; }
.pmain b, .amain b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.pside, .aside { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.aact { display: flex; gap: 2px; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--faint); background: var(--surface); display: grid; place-items: center; color: transparent; padding: 0; transition: border-color .15s, background .15s, color .15s; }
.check .ic { width: 14px; height: 14px; stroke-width: 3; }
.check:hover { border-color: var(--ok); color: var(--ok); }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.check:focus-visible { outline-color: var(--accent); }
.arow.is-done .amain b { text-decoration: line-through; color: var(--muted); }
.next { margin-top: 14px; }
.next summary { cursor: pointer; font-weight: 600; color: var(--muted); font-size: 13.5px; margin-bottom: 8px; }
@media (max-width: 640px) {
  .pitem, .arow { grid-template-columns: auto minmax(0, 1fr) auto; }
  .pitem .pside, .arow .aside { grid-column: 2 / 4; grid-row: 2; justify-content: flex-start; }
  .pmain b, .amain b { white-space: normal; }
  .arow .aact { grid-column: 3; grid-row: 1; }
  .pitem > .icon-btn { grid-column: 3; grid-row: 1; }
}

/* Etiquetas */
.rchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.rchip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.cat { font-size: 12px; color: var(--muted); }
.cat::before { content: "·"; margin-right: 6px; }
.res { font-size: 12px; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 1px 7px; border-radius: 999px; }

.res.pend { color: var(--muted); background: var(--surface-2); font-weight: 600; }
.prio { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.p-urgente { color: var(--p-urgente); } .p-alta { color: var(--p-alta); } .p-media { color: var(--p-media); } .p-baixa { color: var(--p-baixa); }
.prio.p-urgente { background: var(--late-soft); }
.st { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.s-andamento { background: var(--accent-soft); color: var(--accent); } .s-adiada { background: var(--warn-soft); color: var(--warn); } .s-concluida { background: var(--ok-soft); color: var(--ok); }
.due { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); white-space: nowrap; font-weight: 500; }
.due .ic { width: 14px; height: 14px; }
.due.late { color: var(--late); font-weight: 700; } .due.today { color: var(--warn); font-weight: 700; } .due.soon { color: var(--ink); } .due.done { color: var(--faint); }
.tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.t-ok { background: var(--ok-soft); color: var(--ok); } .t-aviso { background: var(--warn-soft); color: var(--warn); } .t-erro { background: var(--late-soft); color: var(--late); } .t-neutro { background: var(--surface-2); color: var(--muted); }
.pbar { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--grad-btn); border-radius: 999px; transition: width .3s; }

/* Execução e metas no painel */
.exec-b { display: flex; align-items: center; gap: 16px; }
.big-l { font-family: var(--display); font-size: 18px; font-weight: 700; margin: 0 0 4px; }
.big-l .muted { font-size: 13px; font-family: var(--body); font-weight: 500; }
.exec-b p.small { margin: 0; }
.mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.mrow { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 5px; }
.mrow:last-child { margin: 5px 0 0; }
.mname { font-weight: 600; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.rcard { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; text-decoration: none; color: var(--ink); transition: border-color .15s; }
.rcard:hover { border-color: var(--c); }
.rh { display: flex; align-items: center; gap: 8px; }
.rh i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.rnums { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.rnums b { color: var(--ink); }
.rnums .late b, .rnums .late { color: var(--late); }

/* ---------- Atividades ---------- */
.agroup { display: grid; gap: 8px; }
.agroup h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.g-atrasadas h2 { color: var(--late); } .g-hoje h2 { color: var(--warn); }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
.kcol { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 10px; transition: border-color .15s, background .15s; min-width: 0; }
.kcol.over { border-color: var(--accent); background: var(--accent-soft); }
.kcol h2 { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.kdrop { display: grid; gap: 8px; min-height: 60px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: grid; gap: 7px; cursor: grab; box-shadow: var(--shadow); }
.kcard:hover { border-color: var(--faint); }
.kcard.dragging { opacity: .45; }
.kcard.is-late { border-left: 3px solid var(--late); }
.kcard b { font-weight: 600; font-size: 13.5px; }
.kc-top { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.kempty { color: var(--faint); font-size: 12.5px; text-align: center; margin: 8px 0; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }

/* ---------- Metas ---------- */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.meta { display: grid; gap: 12px; align-content: start; }
.meta-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.meta-h h3 { font-size: 16px; margin-top: 4px; }
.meta-num { display: flex; align-items: baseline; gap: 8px; }
.meta-num b { font-family: var(--display); font-size: 30px; font-weight: 700; }
.meta-num span { color: var(--muted); }
.meta-num em { margin-left: auto; font-style: normal; font-weight: 700; color: var(--c); font-size: 15px; }
.meta-bar { position: relative; }
.meta-bar .pbar { height: 10px; }
.tmark { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--ink); opacity: .5; border-radius: 1px; }
.meta-info { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.meta-acts-info { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.meta-acts-info b { color: var(--ink); }
.meta-f { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; flex-wrap: wrap; }
.spark { width: 100%; height: 56px; display: block; }

/* ---------- Responsabilidades ---------- */
.respgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.resp { display: grid; gap: 12px; align-content: start; border-top: 3px solid var(--c); }
.resp-h { display: flex; align-items: center; gap: 9px; }
.resp-h h3 { font-size: 16px; flex: 1; }
.resp-h .dot { width: 11px; height: 11px; border-radius: 3px; background: var(--c); }
.resp p { margin: 0; }
.resp-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.resp-nums div { background: var(--surface-2); border-radius: 8px; padding: 8px; text-align: center; }
.resp-nums b { display: block; font-family: var(--display); font-size: 18px; }
.resp-nums span { font-size: 11.5px; color: var(--muted); }
.resp-nums .late b, .resp-nums .late span { color: var(--late); }

/* ---------- Backup ---------- */
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

/* ---------- Janelas e formulários ---------- */

.modal-bd { position: absolute; inset: 0; background: rgba(15, 8, 35, .5); backdrop-filter: blur(2px); }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px rgba(10, 20, 40, .28); animation: pop .16s ease-out; }

.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px 6px; }

.modal-h, .modal-f { flex: none; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.kbd-hint { margin-right: auto; color: var(--faint); font-size: 12px; }
@media (max-width: 520px) { .kbd-hint { display: none; } .modal-wrap { place-items: end center; padding-bottom: 0; } .modal { border-radius: 14px 14px 0 0; max-height: 92vh; max-height: 92dvh; } }
.confirm-text { margin: 0; line-height: 1.55; }
.form { display: grid; gap: 12px; }

.f textarea { resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

.segpick { display: flex; gap: 6px; flex-wrap: wrap; }
.sp input { position: absolute; opacity: 0; pointer-events: none; }
.sp span { display: inline-block; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .12s; }
.sp input:checked + span { background: var(--grad-btn); border-color: transparent; color: var(--accent-ink); }

.sp-urgente input:checked + span { background: var(--p-urgente); border-color: var(--p-urgente); color: #fff; }

.more { border: 1px solid var(--line); border-radius: 10px; }

.ferr { color: var(--late); font-size: 13px; margin: 0; font-weight: 600; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }

/* Aviso */

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Nuvem: status, conta, login ---------- */
.sync { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12.5px; color: var(--side-muted); }

/* ---------- Negócios e faturamento ---------- */

.back { display: inline-flex; align-items: center; gap: 4px; justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 600; font-size: 13.5px; color: var(--accent); transition: border-color .15s, box-shadow .15s, transform .15s; }

.tchips { display: flex; gap: 8px; flex-wrap: wrap; }

.plin { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 6px; position: relative; z-index: 1; }

@media (max-width: 640px) { .rlist li { grid-template-columns: auto minmax(0, 1fr) auto; } .rlist li .rvals:last-child { grid-column: 2 / 4; justify-items: start; grid-auto-flow: column; align-items: center; gap: 8px; } .rlist li .rvals:last-child:empty { display: none; } }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

  /* dias de b até a (a - b) */
  U.diff = (a, b) => Math.round((U.parse(a) - U.parse(b)) / 864e5);
  U.nextWeekday = (wd) => { const d = new Date(); const k = (wd - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + k); return U.iso(d); };

  const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const DIA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  U.fmtDate = s => { const d = U.parse(s); return d ? d.getDate() + ' ' + MES[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '') : ''; };
  U.fmtDateLong = s => { const d = U.parse(s); return d ? DIA[d.getDay()] + ', ' + d.getDate() + ' ' + MES[d.getMonth()] + ' ' + d.getFullYear() : ''; };
  U.fmtDateTime = iso => { try { return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  U.todayLong = () => new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

  /* Texto relativo do prazo: "Hoje", "Amanhã", "Atrasada há 3 dias", "Em 5 dias" */
  U.relDue = s => {
    if (!s) return 'Sem prazo';
    const d = U.diff(s, U.today());
    if (d === 0) return 'Hoje';
    if (d === 1) return 'Amanhã';
    if (d === -1) return 'Venceu ontem';
    if (d < 0) return 'Venceu há ' + (-d) + ' dias';
    if (d <= 6) return 'Em ' + d + ' dias';
    return U.fmtDate(s);
  };

  const nf = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
  U.num = v => nf.format(+v || 0);
  U.brl = v => 'R$ ' + new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(Math.round(+v || 0));
  U.brlC = v => 'R$ ' + (+v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  U.brlShort = v => { v = +v || 0; const a = Math.abs(v); if (a >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: a >= 1e7 ? 1 : 2 }) + ' mi'; if (a >= 1e4) return 'R$ ' + Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil'; return U.brl(v); };
  U.mesNome = (y, m) => ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][m] + (y !== new Date().getFullYear() ? '/' + String(y).slice(2) : '');
  U.pct = v => Math.round((v || 0) * 100) + '%';
  U.esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.parseNum = s => { s = String(s ?? '').trim().replace(/\s/g, ''); if (!s) return null; s = s.replace(/^R\$/i, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); const n = parseFloat(s); return isNaN(n) ? null : n; };
  U.byKey = (arr, k) => Object.fromEntries(arr.map(x => [x[k], x]));
  U.plural = (n, um, varios) => n + ' ' + (n === 1 ? um : varios);

  App.U = U;
})(window.App = window.App || {});

</script>
<script>
/* js/core/store.js */
/*
 * Camada de dados.
 * Toda leitura e escrita passa por App.Store. As telas nunca falam com o banco.
 *
 * Como funciona:
 * - Os dados ficam em memória e numa cópia no navegador (resposta instantânea e uso sem internet).
 * - Com um adaptador remoto (Supabase), cada alteração entra numa fila e é enviada para a nuvem
 *   em segundo plano. Se a internet cair, a fila fica guardada e é reenviada depois.
 * - Sem adaptador remoto, funciona só no navegador (LocalStorage), como na versão 1.
 */
(function (App) {
  const BASE = 'gestao-pessoal:dados:v1', QBASE = 'gestao-pessoal:fila:v1';
  const COLS = ['responsabilidades', 'atividades', 'metas', 'metaRegistros', 'historico', 'faturamento', 'linhas', 'produtos', 'producoes', 'recebiveis', 'recorrencias', 'emails'];
  const SCHEMA = 1;

  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { localStorage.setItem(k, v); },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  const LocalStorageAdapter = { name: 'Este navegador', remote: false, cacheKey: '' };

  const empty = () => ({ schemaVersion: SCHEMA, ...Object.fromEntries(COLS.map(c => [c, []])), config: {} });
  const emptyQ = () => ({ full: false, config: false, cols: {} });
  let adapter = LocalStorageAdapter, db = empty(), q = emptyQ(), listeners = [], statusFns = [], available = true;
  let status = { id: 'local', msg: '' }, flushing = false, timer = null, retryTimer = null, voo = null;
  const KEY = () => BASE + (adapter.cacheKey ? ':' + adapter.cacheKey : '');
  const QKEY = () => QBASE + (adapter.cacheKey ? ':' + adapter.cacheKey : '');

  /* ---------- Fila de alterações para a nuvem ---------- */
  function mark(col, id, tipo) {
    if (!adapter.remote) return;
    const c = q.cols[col] || (q.cols[col] = { up: [], del: [] });
    if (tipo === 'up') { if (!c.up.includes(id)) c.up.push(id); c.del = c.del.filter(x => x !== id); }
    else { c.up = c.up.filter(x => x !== id); if (!c.del.includes(id)) c.del.push(id); }
  }
  const qVazia = x => !x.full && !x.config && !Object.values(x.cols).some(c => c.up.length || c.del.length);
  /* Junta uma fila antiga (que falhou) com a atual, sem perder a ordem das operações */
  function juntar(velha, nova) {
    const r = { full: velha.full || nova.full, config: velha.config || nova.config, cols: JSON.parse(JSON.stringify(velha.cols)) };
    const prev = q; q = r;
    Object.entries(nova.cols).forEach(([col, c]) => { c.up.forEach(id => mark(col, id, 'up')); c.del.forEach(id => mark(col, id, 'del')); });
    q = prev; return r;
  }

  function salvarLocal() {
    /* A fila salva inclui o que está sendo enviado agora: se a página fechar no meio, nada se perde */
    try { ls.set(KEY(), JSON.stringify(db)); if (adapter.remote) ls.set(QKEY(), JSON.stringify(voo ? juntar(voo, q) : q)); }
    catch (e) { App.UI && App.UI.toast('O navegador não deixou guardar a cópia local. Faça um backup.', 'erro'); }
  }
  function setStatus(id, msg = '') { status = { id, msg }; statusFns.forEach(fn => { try { fn(status); } catch (e) {} }); }

  async function flush() {
    if (!adapter.remote || flushing) return;
    if (qVazia(q)) { setStatus('ok'); return; }
    if (typeof navigator !== 'undefined' && navigator.onLine === false) { setStatus('offline', 'Sem internet. As alterações estão guardadas neste aparelho.'); return; }
    flushing = true; setStatus('salvando');
    const envio = q; voo = envio; q = emptyQ();
    try {
      const pacote = { full: envio.full, config: envio.config ? db.config : null, cols: {} };
      if (envio.full) pacote.db = db;
      else Object.entries(envio.cols).forEach(([col, c]) => {
        pacote.cols[col] = { up: c.up.map(id => db[col].find(x => x.id === id)).filter(Boolean), del: c.del };
      });
      await adapter.push(pacote);
      voo = null; salvarLocal();
      setStatus('ok');
    } catch (e) {
      console.error(e);
      voo = null; q = juntar(envio, q); salvarLocal();
      const off = navigator.onLine === false;
      setStatus(off ? 'offline' : 'erro', off ? 'Sem internet. As alterações estão guardadas neste aparelho.' : 'Não foi possível salvar na nuvem. Tentando de novo.');
      clearTimeout(retryTimer); retryTimer = setTimeout(flush, 15000);
    } finally {
      flushing = false;
      if (!qVazia(q)) setTimeout(flush, 50);
    }
  }
  const agendar = () => { clearTimeout(timer); timer = setTimeout(flush, 400); };

  const Store = {
    COLS,
    adapter: () => adapter,
    available: () => available,
    status: () => status,
    onStatus(fn) { statusFns.push(fn); fn(status); },
    pendente: () => !qVazia(q) || !!voo,

    /* Troca o lugar onde os dados ficam (ex.: Supabase depois do login) */
    useAdapter(a) { adapter = a; db = empty(); q = emptyQ(); voo = null; setStatus(a.remote ? 'carregando' : 'local'); },

    /* Carrega a cópia local. Retorna true quando não há nada salvo (primeiro uso). */
    init() {
      try { localStorage.setItem(BASE + ':teste', '1'); localStorage.removeItem(BASE + ':teste'); } catch (e) { available = false; }
      const raw = ls.get(KEY());
      if (adapter.remote) { try { q = JSON.parse(ls.get(QKEY())) || emptyQ(); } catch (e) { q = emptyQ(); } }
      if (!raw) { db = empty(); return true; }
      try { db = Store.normalize(JSON.parse(raw)); } catch (e) { db = empty(); return true; }
      return false;
    },
    /* Envia o que estiver pendente e baixa a versão da nuvem. Retorna { vazio } */
    async sincronizar() {
      if (!adapter.remote) return { vazio: false };
      await flush();
      if (!qVazia(q)) return { vazio: false, pendente: true };
      setStatus('salvando', 'Atualizando');
      const remoto = await adapter.load();
      const vazio = COLS.every(c => !remoto[c].length) && !Object.keys(remoto.config || {}).length;
      if (!qVazia(q) || flushing) { setStatus('ok'); return { vazio: false }; }
      const novo = Store.normalize(remoto);
      const mudou = JSON.stringify(novo) !== JSON.stringify(db);
      db = novo; salvarLocal(); setStatus('ok');
      if (mudou) listeners.forEach(fn => { try { fn(); } catch (e) {} });
      return { vazio };
    },
    tentarDeNovo() { flush(); },

    normalize(data) {
      const out = empty();
      COLS.forEach(c => { out[c] = Array.isArray(data[c]) ? data[c] : []; });
      out.config = data.config && typeof data.config === 'object' ? data.config : {};
      return out;
    },
    commit() {
      salvarLocal();
      if (adapter.remote) agendar();
      listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
    },
    onChange(fn) { listeners.push(fn); },

    all(col) { return db[col]; },
    get(col, id) { return db[col].find(x => x.id === id) || null; },
    where(col, fn) { return db[col].filter(fn); },
    insert(col, obj, { silent } = {}) {
      const now = App.U.nowISO();
      const rec = { id: obj.id || App.U.uid(col.slice(0, 3)), criadoEm: now, atualizadoEm: now, ...obj };
      db[col].push(rec); mark(col, rec.id, 'up');
      if (!silent) Store.commit();
      return rec;
    },
    update(col, id, patch, { silent } = {}) {
      const rec = Store.get(col, id);
      if (!rec) return null;
      Object.assign(rec, patch, { atualizadoEm: App.U.nowISO() }); mark(col, id, 'up');
      if (!silent) Store.commit();
      return rec;
    },
    remove(col, id, { silent } = {}) {
      db[col] = db[col].filter(x => x.id !== id); mark(col, id, 'del');
      if (!silent) Store.commit();
    },
    removeWhere(col, fn, { silent } = {}) {
      const sai = db[col].filter(fn);
      db[col] = db[col].filter(x => !fn(x));
      sai.forEach(x => mark(col, x.id, 'del'));
      if (!silent) Store.commit();
      return sai.length;
    },
    config(k, v) { if (v === undefined) return db.config[k]; db.config[k] = v; if (adapter.remote) q.config = true; Store.commit(); },
    snapshot() { return JSON.parse(JSON.stringify(db)); },
    replaceAll(data) { db = Store.normalize(data); if (adapter.remote) q = { ...emptyQ(), full: true, config: true }; Store.commit(); },
    clear() { db = empty(); db.config.inicializado = true; if (adapter.remote) q = { ...emptyQ(), full: true, config: true }; Store.commit(); },
    /* Ao sair da conta: apaga a cópia local deste aparelho */
    limparCopiaLocal() { ls.del(KEY()); ls.del(QKEY()); db = empty(); q = emptyQ(); voo = null; },
    sizeKB() { return Math.round((ls.get(KEY()) || '').length / 1024); }
  };

  if (typeof window !== 'undefined') {
    window.addEventListener('online', () => flush());
  }

  App.Store = Store;
})(window.App = window.App || {});

</script>
<script>
/* js/core/model.js */
/*
 * Regras do negócio: listas fixas, cálculos (atraso, progresso de metas)
 * e ações que alteram dados e registram histórico.
 */
(function (App) {
  const { U, Store } = App;
  const M = {};

  M.PRIORIDADES = [
    { id: 'urgente', label: 'Urgente', peso: 4 },
    { id: 'alta', label: 'Alta', peso: 3 },
    { id: 'media', label: 'Média', peso: 2 },
    { id: 'baixa', label: 'Baixa', peso: 1 }
  ];
  M.STATUS = [
    { id: 'pendente', label: 'Pendente' },
    { id: 'andamento', label: 'Em andamento' },
    { id: 'adiada', label: 'Adiada' },
    { id: 'concluida', label: 'Concluída' }
  ];
  M.PERIODICIDADES = [
    { id: 'semanal', label: 'Semanal' }, { id: 'mensal', label: 'Mensal' },
    { id: 'trimestral', label: 'Trimestral' }, { id: 'anual', label: 'Anual' }
  ];
  M.CORES = ['#6E3FF0', '#2F855A', '#1E7A86', '#B7791F', '#C2412D', '#A0466B', '#2B5A8C', '#5A6474'];
  M.TIPOS_NEGOCIO = [
    { id: 'investimentos', label: 'Investimentos' }, { id: 'consorcio', label: 'Consórcio' }, { id: 'seguro', label: 'Seguro' },
    { id: 'previdencia', label: 'Previdência' }, { id: 'cambio', label: 'Câmbio' }, { id: 'credito', label: 'Crédito' }, { id: 'outro', label: 'Outro' }
  ];
  /* Tipo de negócio é livre: aceita os ids antigos (consorcio...) ou qualquer texto digitado */
  M.norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  M.tipoNeg = id => M.TIPOS_NEGOCIO.find(t => t.id === id) || { id, label: id || 'Negócio' };
  M.tipoChave = v => M.norm(M.tipoNeg(v).label);
  /* Texto digitado -> o que é salvo (se for um dos tipos padrão, guarda o id antigo) */
  M.tipoSalvar = txt => { txt = String(txt || '').trim().replace(/\s+/g, ' '); if (!txt) return null; const t = M.TIPOS_NEGOCIO.find(x => M.norm(x.label) === M.norm(txt) || x.id === M.norm(txt)); return t ? t.id : txt; };
  /* Tipos já usados, do mais usado para o menos usado */
  M.tiposUsados = () => {
    const c = {};
    Store.all('atividades').forEach(a => M.negociosDa(a).forEach(n => { const l = M.tipoNeg(n.tipo).label, k = M.norm(l); c[k] = c[k] || { label: l, n: 0 }; c[k].n++; }));
    return Object.values(c).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label));
  };
  /* Sugestões para o campo: usados + produtos e linhas do faturamento + padrões */
  M.tiposSugestoes = () => {
    const out = [], vis = new Set(), add = l => { const k = M.norm(l); if (l && !vis.has(k)) { vis.add(k); out.push(l); } };
    M.tiposUsados().forEach(t => add(t.label));
    M.TIPOS_NEGOCIO.filter(t => t.id !== 'outro').forEach(t => add(t.label));
    if (App.Fat) { App.Fat.produtos().forEach(p => add(p.nome)); App.Fat.linhas().forEach(l => add(l.nome)); }
    return out;
  };
  /* Produto do faturamento que corresponde ao tipo do negócio */
  M.produtoDoTipo = tipo => {
    const Fat = App.Fat; if (!Fat || !tipo) return null;
    const ps = Store.all('produtos').filter(p => p.ativo !== false), k = M.tipoChave(tipo);
    const porNome = ps.find(p => M.norm(p.nome) === k); if (porNome) return porNome;
    const fixo = Fat.PRODUTO_DO_NEGOCIO[tipo]; if (fixo && Fat.produto(fixo)) return Fat.produto(fixo);
    const lin = Store.all('linhas').find(l => M.norm(l.nome) === k || M.norm(l.nome).split(' ')[0] === k);
    if (lin) { const p = ps.find(x => x.linhaId === lin.id); if (p) return p; }
    const parcial = ps.find(p => k.length > 3 && (M.norm(p.nome).includes(k) || k.includes(M.norm(p.nome))));
    return parcial || Fat.produto('p_outros') || null;
  };
  /* % que fica com você: o da atividade, senão o padrão do produto */
  M.pctPadrao = tipo => { const p = M.produtoDoTipo(tipo); return p && p.pctComigo != null ? +p.pctComigo : null; };
  /* ---------- Vários negócios por card ----------
     a.negocios = [{ id, tipo, valor, pct, resultado: null | 'ganho' | 'perdido' }]
     Cards antigos têm só tipoNegocio/valorNegocio/pctComigo/resultadoNegocio: viram uma lista de 1. */
  M.negociosDa = a => {
    if (!a) return [];
    if (Array.isArray(a.negocios)) return a.negocios.filter(n => n && n.tipo);
    return a.tipoNegocio ? [{ id: 'n1', tipo: a.tipoNegocio, valor: a.valorNegocio ?? null, pct: a.pctComigo ?? null, resultado: a.resultadoNegocio || null }] : [];
  };
  M.novoNegId = () => 'n' + Math.random().toString(36).slice(2, 8);
  /* Campos antigos espelham a lista: tipo e % do 1º negócio, valor = soma, resultado = geral */
  M.espelhoNeg = negs => {
    const n = negs[0];
    return {
      negocios: negs,
      tipoNegocio: n ? n.tipo : null,
      valorNegocio: negs.some(x => x.valor != null) ? negs.reduce((s, x) => s + (+x.valor || 0), 0) : null,
      pctComigo: negs.length === 1 ? (n.pct ?? null) : null,
      resultadoNegocio: negs.length && negs.every(x => x.resultado) ? (negs.some(x => x.resultado === 'ganho') ? 'ganho' : 'perdido') : null
    };
  };
  M.pctNeg = n => n.pct != null ? +n.pct : M.pctPadrao(n.tipo);
  M.liqNeg = n => { const p = M.pctNeg(n); return n.valor != null && p != null ? (+n.valor) * p / 100 : null; };
  M.pctDe = a => { const ns = M.negociosDa(a); return ns.length === 1 ? M.pctNeg(ns[0]) : null; };
  M.liquidoEstimado = a => { const v = M.negociosDa(a).map(M.liqNeg).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) : null; };
  M.ehNegocio = a => M.negociosDa(a).length > 0;
  M.negociosAbertos = () => Store.all('atividades').filter(a => M.ehNegocio(a) && M.aberta(a));
  /* Cada negócio em aberto como item próprio: { a: atividade, n: negócio } */
  M.negItensAbertos = () => M.negociosAbertos().flatMap(a => M.negociosDa(a).filter(n => !n.resultado).map(n => ({ a, n })));
  M.prio = id => M.PRIORIDADES.find(p => p.id === id) || M.PRIORIDADES[2];
  M.status = id => M.STATUS.find(s => s.id === id) || M.STATUS[0];
  M.period = id => M.PERIODICIDADES.find(p => p.id === id) || M.PERIODICIDADES[1];

  /* ---------- Responsabilidades ---------- */
  M.resp = id => Store.get('responsabilidades', id);
  M.respAtivas = () => Store.all('responsabilidades').filter(r => r.status !== 'arquivada');
  M.respNome = id => (M.resp(id) || {}).nome || 'Sem responsabilidade';
  M.respCor = id => (M.resp(id) || {}).cor || '#8A93A3';

  /* ---------- Atividades ---------- */
  M.aberta = a => a.status !== 'concluida';
  M.atrasada = a => M.aberta(a) && a.prazo && a.prazo < U.today();
  M.hoje = a => M.aberta(a) && a.prazo === U.today();
  M.proximos = (a, dias = 7) => M.aberta(a) && a.prazo && a.prazo > U.today() && U.diff(a.prazo, U.today()) <= dias;
  /* Ordem de atenção: atrasadas e de hoje primeiro, depois prioridade, depois prazo */
  M.ordemAtencao = (a, b) => {
    const ka = M.atrasada(a) ? 0 : M.hoje(a) ? 1 : 2, kb = M.atrasada(b) ? 0 : M.hoje(b) ? 1 : 2;
    if (ka !== kb) return ka - kb;
    const p = M.prio(b.prioridade).peso - M.prio(a.prioridade).peso;
    if (p) return p;
    return (a.prazo || '9999').localeCompare(b.prazo || '9999');
  };
  /* "Minhas prioridades de hoje": atrasadas, de hoje e urgentes/altas que vencem em até 2 dias */
  M.prioridadesHoje = () => Store.all('atividades')
    .filter(a => M.atrasada(a) || M.hoje(a) || (M.aberta(a) && ['urgente', 'alta'].includes(a.prioridade) && a.prazo && U.diff(a.prazo, U.today()) <= 2) || (M.aberta(a) && a.prioridade === 'urgente' && !a.prazo))
    .sort(M.ordemAtencao);

  M.log = (atividadeId, tipo, descricao, silent = true) =>
    Store.insert('historico', { atividadeId, tipo, descricao, em: U.nowISO() }, { silent });
  M.historico = id => Store.where('historico', h => h.atividadeId === id).sort((a, b) => b.em.localeCompare(a.em));

  M.criarAtividade = (dados, { semCommit } = {}) => {
    const a = Store.insert('atividades', { status: 'pendente', prioridade: 'media', ...dados }, { silent: true });
    const pai = a.origemId ? Store.get('atividades', a.origemId) : null;
    M.log(a.id, 'criada', 'Atividade criada' + (a.prazo ? ' com prazo para ' + U.fmtDate(a.prazo) : '') + (pai ? ' · próximo passo de "' + pai.titulo + '"' : ''));
    if (pai) M.log(pai.id, 'gerou', 'Gerou o próximo passo "' + a.titulo + '"' + (a.prazo ? ' para ' + U.fmtDate(a.prazo) : ''));
    if (!semCommit) Store.commit();
    return a;
  };

  /* ---------- Próximos passos: atividades geradas a partir de outra ---------- */
  M.origem = a => a && a.origemId ? Store.get('atividades', a.origemId) : null;
  M.filhos = id => Store.where('atividades', x => x.origemId === id).sort((a, b) => (a.criadoEm || '').localeCompare(b.criadoEm || ''));
  /* O que o próximo passo herda da atividade de origem */
  M.herdar = pai => ({ origemId: pai.id, responsabilidadeId: pai.responsabilidadeId, cliente: pai.cliente || null, categoria: pai.categoria || null, prioridade: pai.prioridade || 'media' });
  /* itens: [{ titulo, prazo, metaIds }] */
  M.criarProximos = (paiId, itens) => {
    const pai = Store.get('atividades', paiId); if (!pai || !itens.length) return [];
    const criados = itens.map(it => M.criarAtividade({ ...M.herdar(pai), titulo: it.titulo, prazo: it.prazo || null, metaIds: it.metaIds || [], metaId: (it.metaIds || [])[0] || null, esperados: {}, resultados: {} }, { semCommit: true }));
    Store.commit();
    return criados;
  };
  M.editarAtividade = (id, dados) => {
    const a = Store.get('atividades', id); if (!a) return;
    const mud = [];
    if (dados.prazo !== undefined && dados.prazo !== a.prazo) mud.push('prazo de ' + (a.prazo ? U.fmtDate(a.prazo) : 'sem prazo') + ' para ' + (dados.prazo ? U.fmtDate(dados.prazo) : 'sem prazo'));
    if (dados.status && dados.status !== a.status) mud.push('status de ' + M.status(a.status).label + ' para ' + M.status(dados.status).label);
    if (dados.prioridade && dados.prioridade !== a.prioridade) mud.push('prioridade de ' + M.prio(a.prioridade).label + ' para ' + M.prio(dados.prioridade).label);
    if (dados.metaIds) { const antes = M.metasDa(a).join(','), dep = dados.metaIds.join(','); if (antes !== dep) mud.push('metas: ' + (dados.metaIds.map(i => (Store.get('metas', i) || {}).nome).filter(Boolean).join(', ') || 'nenhuma')); }
    if (dados.status === 'concluida' && a.status !== 'concluida') dados.concluidaEm = U.nowISO();
    if (dados.status && dados.status !== 'concluida') dados.concluidaEm = null;
    Store.update('atividades', id, dados, { silent: true });
    M.log(id, 'editada', mud.length ? 'Alterado: ' + mud.join('; ') : 'Informações editadas');
    Store.commit();
  };
  /* resultados: { metaId: valor }  ·  somarManual: metas manuais que recebem o valor */
  M.concluir = (id, { resultado, nota, resultados, somarManual } = {}) => {
    const a = Store.get('atividades', id); if (!a) return;
    const patch = { status: 'concluida', concluidaEm: U.nowISO() };
    if (resultado !== undefined && resultado !== null) patch.resultado = resultado;
    const partes = [];
    if (resultados && Object.keys(resultados).length) {
      patch.resultados = { ...(a.resultados || {}), ...resultados };
      Object.assign(patch, M.espelho(M.metasDa(a), patch.resultados, a.esperados || {}));
      if (!M.metasDa(a).length && resultado != null) patch.resultado = resultado;
      Object.entries(resultados).forEach(([mid, v]) => {
        const mt = Store.get('metas', mid); if (!mt || v == null) return;
        partes.push(M.fmtMeta(v, mt) + ' em "' + mt.nome + '"');
        if (mt.modo === 'manual' && (somarManual || []).includes(mid)) {
          const novo = (+mt.atual || 0) + (+v || 0);
          Store.update('metas', mid, { atual: novo }, { silent: true });
          Store.insert('metaRegistros', { metaId: mid, valor: novo, nota: 'Atividade: ' + a.titulo, em: U.nowISO() }, { silent: true });
        }
      });
    } else if (resultado != null) partes.push('resultado: ' + U.num(resultado));
    if (somarManual && somarManual.length) patch.somadas = [...new Set([...(a.somadas || []), ...somarManual])];
    if (nota) patch.resultadoTexto = nota;
    Store.update('atividades', id, patch, { silent: true });
    M.log(id, 'concluida', 'Concluída' + (partes.length ? ' · ' + partes.join(', ') : '') + (nota ? ' · ' + nota : ''));
    Store.commit();
  };
  M.reabrir = id => {
    Store.update('atividades', id, { status: 'pendente', concluidaEm: null }, { silent: true });
    M.log(id, 'reaberta', 'Atividade reaberta');
    Store.commit();
  };
  M.adiar = (id, novoPrazo, motivo) => {
    const a = Store.get('atividades', id); if (!a) return;
    const antes = a.prazo;
    Store.update('atividades', id, { prazo: novoPrazo, status: 'adiada', adiamentos: (a.adiamentos || 0) + 1 }, { silent: true });
    M.log(id, 'adiada', 'Adiada de ' + (antes ? U.fmtDate(antes) : 'sem prazo') + ' para ' + U.fmtDate(novoPrazo) + (motivo ? ' · ' + motivo : ''));
    Store.commit();
  };
  M.mudarStatus = (id, status) => {
    if (status === 'concluida') return M.concluir(id);
    M.editarAtividade(id, { status });
  };
  M.excluirAtividade = id => {
    Store.remove('atividades', id, { silent: true });
    Store.removeWhere('historico', h => h.atividadeId === id, { silent: true });
    Store.commit();
  };

  /* ---------- Metas ---------- */
  /* Uma atividade pode servir a várias metas. Registros antigos têm só metaId. */
  M.metasDa = a => Array.isArray(a.metaIds) ? a.metaIds.filter(Boolean) : (a.metaId ? [a.metaId] : []);
  const doMapa = (a, mapa, campo, mid) => {
    const o = a[mapa]; if (o && o[mid] != null) return +o[mid];
    return M.metasDa(a).length <= 1 && a[campo] != null ? +a[campo] : null;
  };
  M.resMeta = (a, mid) => doMapa(a, 'resultados', 'resultado', mid);
  M.espMeta = (a, mid) => doMapa(a, 'esperados', 'resultadoEsperado', mid);
  /* Campos antigos (metaId, resultado, resultadoEsperado) espelham a primeira/única meta */
  M.espelho = (ids, resultados, esperados) => {
    const um = ids.length === 1 ? ids[0] : null;
    return { metaId: ids[0] || null, resultado: um ? (resultados[um] ?? null) : null, resultadoEsperado: um ? (esperados[um] ?? null) : null };
  };
  /* Meta em dinheiro (unidade R$) mostra "R$ 5.000"; as outras, "3 indicações" */
  M.ehDinheiro = m => /^(r\$|reais|brl|real)$/i.test(String((m && m.unidade) || '').trim());
  M.fmtMeta = (v, m, semUn) => M.ehDinheiro(m) ? U.brl(v) : U.num(v) + (semUn || !m.unidade ? '' : ' ' + m.unidade);
  M.metaAtividades = metaId => Store.where('atividades', a => M.metasDa(a).includes(metaId));
  M.metaAtual = m => m.modo === 'atividades'
    ? M.metaAtividades(m.id).reduce((s, a) => s + (M.resMeta(a, m.id) || 0), 0)
    : (+m.atual || 0);
  /* Metas que pedem resultado ao concluir a atividade */
  M.metasComResultado = a => M.metasDa(a).map(i => Store.get('metas', i)).filter(Boolean);
  /* Tira metas apagadas das atividades */
  M.desvincular = ids => Store.all('atividades').filter(a => M.metasDa(a).some(i => ids.includes(i))).forEach(a => {
    const rest = M.metasDa(a).filter(i => !ids.includes(i));
    const r = { ...(a.resultados || {}) }, e = { ...(a.esperados || {}) }; ids.forEach(i => { delete r[i]; delete e[i]; });
    Store.update('atividades', a.id, { metaIds: rest, resultados: r, esperados: e, metaId: rest[0] || null }, { silent: true });
  });
  M.metaPct = m => m.alvo > 0 ? M.metaAtual(m) / m.alvo : 0;
  /* Quanto do período já passou (0 a 1) */
  M.metaTempo = m => {
    if (!m.inicio || !m.fim) return null;
    const tot = U.diff(m.fim, m.inicio) || 1, pas = U.diff(U.today(), m.inicio);
    return Math.min(1, Math.max(0, pas / tot));
  };
  M.metaSituacao = m => {
    const p = M.metaPct(m), t = M.metaTempo(m);
    if (p >= 1) return { id: 'ok', label: 'Atingida' };
    if (m.fim && m.fim < U.today()) return { id: 'erro', label: 'Encerrada sem atingir' };
    if (t == null || t < 0.05) return { id: 'neutro', label: 'Em andamento' };
    if (p >= t - 0.1) return { id: 'ok', label: 'No ritmo' };
    return { id: 'aviso', label: 'Abaixo do ritmo' };
  };
  M.registrarMeta = (metaId, valor, nota) => {
    const m = Store.get('metas', metaId); if (!m) return;
    Store.update('metas', metaId, { atual: valor }, { silent: true });
    Store.insert('metaRegistros', { metaId, valor, nota: nota || '', em: U.nowISO() }, { silent: true });
    Store.commit();
  };
  M.metaRegistros = id => Store.where('metaRegistros', r => r.metaId === id).sort((a, b) => a.em.localeCompare(b.em));
  M.excluirMeta = id => {
    Store.remove('metas', id, { silent: true });
    Store.removeWhere('metaRegistros', r => r.metaId === id, { silent: true });
    M.desvincular([id]);
    Store.commit();
  };

  /* Exclui a responsabilidade e o que está ligado a ela */
  M.excluirResp = id => {
    const ats = Store.where('atividades', a => a.responsabilidadeId === id).map(a => a.id);
    const mts = Store.where('metas', m => m.responsabilidadeId === id).map(m => m.id);
    Store.removeWhere('atividades', a => ats.includes(a.id), { silent: true });
    Store.removeWhere('historico', h => ats.includes(h.atividadeId), { silent: true });
    Store.removeWhere('metas', m => mts.includes(m.id), { silent: true });
    Store.removeWhere('metaRegistros', r => mts.includes(r.metaId), { silent: true });
    M.desvincular(mts);
    Store.remove('responsabilidades', id, { silent: true });
    Store.commit();
  };

  /* ---------- Números do painel ---------- */
  M.resumo = (filtroResp) => {
    const at = Store.all('atividades').filter(a => !filtroResp || a.responsabilidadeId === filtroResp);
    const concl = at.filter(a => a.status === 'concluida');
    /* Execução: das atividades com prazo nos últimos 7 dias (até hoje), quantas foram concluídas */
    const ini = U.addDays(U.today(), -6);
    const planejadas = at.filter(a => a.prazo && a.prazo >= ini && a.prazo <= U.today());
    const feitas = planejadas.filter(a => a.status === 'concluida');
    return {
      total: at.length, pendentes: at.length - concl.length, concluidas: concl.length,
      atrasadas: at.filter(M.atrasada).length, hoje: at.filter(M.hoje).length,
      proximos7: at.filter(a => M.proximos(a, 7)).length,
      pctConclusao: at.length ? concl.length / at.length : 0,
      planejadas7: planejadas.length, feitas7: feitas.length
    };
  };


  App.M = M;
})(window.App = window.App || {});

</script>

    ];

      }

    const C = 'Campanha de indicações 2027';
    const ats = [
      { titulo: 'Reunião de indicações com Vitor', responsabilidadeId: R('r_assessoria'), categoria: C, prazo: d(-6), prioridade: 'alta', status: 'concluida', metaId: 'm_indic', resultadoEsperado: 3, resultado: 3, resultadoTexto: '3 indicações: dois sócios e o irmão.' },

      { titulo: 'Reunião de indicações com Maísa', responsabilidadeId: R('r_assessoria'), categoria: C, prazo: d(3), prioridade: 'alta', status: 'pendente', metaId: 'm_indic', resultadoEsperado: 3 },
      { titulo: 'Ligar para as indicações do Vitor', responsabilidadeId: R('r_assessoria'), categoria: C, prazo: d(1), prioridade: 'media', status: 'andamento', metaId: 'm_contatos' },

      { titulo: 'Feedback individual com a equipe', responsabilidadeId: R('r_xceed'), categoria: 'Gestão do time', prazo: d(-4), prioridade: 'media', status: 'concluida' },
      { titulo: 'Organizar finanças da casa', responsabilidadeId: R('r_pessoal'), categoria: 'Casa', prazo: d(-1), prioridade: 'media', status: 'pendente' },

      Store.insert('historico', { atividadeId: rec.id, tipo: 'criada', descricao: 'Atividade criada com prazo para ' + U.fmtDate(a.prazo), em: criado, demo: true }, { silent: true });

    /* Produção de exemplo (o faturamento calcula sozinho quando cada valor entra) */

    const mes = (n, dia) => { const x = new Date(); x.setMonth(x.getMonth() - n, Math.min(dia, 28)); return U.iso(x); };
    [
      { data: mes(0, 4), cliente: 'Carla Menezes', produtoId: 'p_vida', valor: 14400, comissaoPct: 50, bruto: 7200, liquido: 432, regra: 'mes_seguinte' },

    ].forEach(p => { const pr = App.Fat.produto(p.produtoId) || {}; App.Fat.salvarProducao({ ...p, linhaId: pr.linhaId, demo: true }, null, { silent: true }); });

  };

  Demo.count = () => ({
    atividades: Store.where('atividades', a => a.demo).length,
    metas: Store.where('metas', m => m.demo).length,
    faturamento: Store.where('producoes', f => f.demo).length
  });

  /* Apaga só o que é demonstração. Metas de exemplo usadas por atividades suas são mantidas. */
  Demo.remove = () => {
    const ats = Store.where('atividades', a => a.demo).map(a => a.id);
    const usadas = new Set(Store.where('atividades', a => !a.demo).flatMap(a => M.metasDa(a)));
    Store.all('metas').filter(m => m.demo && usadas.has(m.id)).forEach(m => Store.update('metas', m.id, { demo: false }, { silent: true }));
    const mts = Store.where('metas', m => m.demo).map(m => m.id);
    Store.removeWhere('atividades', a => ats.includes(a.id), { silent: true });
    Store.removeWhere('historico', h => ats.includes(h.atividadeId), { silent: true });
    Store.removeWhere('metas', m => mts.includes(m.id), { silent: true });
    Store.removeWhere('metaRegistros', r => mts.includes(r.metaId), { silent: true });
    const prs = Store.where('producoes', f => f.demo).map(f => f.id);
    Store.removeWhere('recebiveis', r => r.demo || prs.includes(r.producaoId), { silent: true });
    const nf = Store.removeWhere('producoes', f => f.demo, { silent: true });
    Store.commit();
    return { atividades: ats.length, metas: mts.length, faturamento: nf };
  };

  App.Demo = Demo;
})(window.App = window.App || {});

<script>
/* js/core/fat.js */
/*
 * Faturamento: produção (o que você gerou) e recebíveis (quando e quanto entra na conta).
 *
 * Coleções:
 *  linhas        Linhas de negócio (InvestSmart, BeSmart, Eqseed, Dolarize.me, MB...)
 *  produtos      Produtos de cada linha, com % de comissão e regra de pagamento padrão
 *  producoes     Lançamentos cliente a cliente (data de produção, valor, bruto, líquido)
 *  recebiveis    Parcelas previstas/recebidas. Geradas a partir das produções, ou lançadas
 *                como avulso (campanha, bônus) ou histórico (mês + linha + valor recebido)
 *  recorrencias  Valores fixos mensais (ex.: Mensal Eqseed). Os meses aparecem como previstos
 *                e viram registro quando você confirma o recebimento.
 */
(function (App) {
  const { U, Store } = App;
  const Fat = {};

  Fat.REGRAS = [
    { id: 'mes_seguinte', label: 'Dia 15 do mês seguinte' },
    { id: 'mesmo_mes', label: 'No mesmo mês' },
    { id: 'parcelado', label: 'Parcelado' }
  ];
  Fat.GRUPOS = [{ id: 'novo', label: 'Grupo novo (pula o 2º mês)' }, { id: 'andamento', label: 'Grupo em andamento' }];
  Fat.CORES = ['#6E3FF0', '#2F855A', '#1E7A86', '#B7791F', '#C2412D', '#A0466B', '#2B5A8C', '#5A6474'];

  const DEF_LINHAS = [
    { id: 'l_investsmart', nome: 'InvestSmart (XP)', cor: '#2B5A8C', ordem: 1 },
    { id: 'l_besmart', nome: 'BeSmart', cor: '#6E3FF0', ordem: 2 },
    { id: 'l_eqseed', nome: 'Eqseed', cor: '#2F855A', ordem: 3 },
    { id: 'l_dolarize', nome: 'Dolarize.me', cor: '#B7791F', ordem: 4 },
    { id: 'l_mb', nome: 'MB (Mercado Bitcoin)', cor: '#1E7A86', ordem: 5 },
    { id: 'l_outras', nome: 'Outras', cor: '#5A6474', ordem: 9 }
  ];
  const P = (id, linhaId, nome, regra = 'mes_seguinte', extra = {}) => ({ id, linhaId, nome, regra, ...extra });
  const DEF_PRODUTOS = [
    P('p_rf', 'l_investsmart', 'Renda fixa'), P('p_coe', 'l_investsmart', 'COE'), P('p_rv', 'l_investsmart', 'Renda variável'),
    P('p_global', 'l_investsmart', 'XP Global (internacional)', 'mesmo_mes'),
    P('p_vida', 'l_besmart', 'Seguro de vida (novo)'), P('p_vidafixo', 'l_besmart', 'Vida fixo'), P('p_adm', 'l_besmart', 'ADM'),
    P('p_prev', 'l_besmart', 'Previdência'), P('p_saude', 'l_besmart', 'Saúde'), P('p_re', 'l_besmart', 'RE'),
    P('p_consorcio', 'l_besmart', 'Consórcio', 'parcelado', { parcelas: 12, grupo: 'novo' }),
    P('p_eqseed', 'l_eqseed', 'Eqseed', 'mes_seguinte', { comissaoPct: 6 }),
    P('p_cambio', 'l_dolarize', 'Câmbio'), P('p_dol_inter', 'l_dolarize', 'Internacional', 'mesmo_mes'),
    P('p_mb', 'l_mb', 'Mercado Bitcoin'),
    P('p_outros', 'l_outras', 'Outros')
  ];
  /* Negócio do painel -> produto sugerido ao lançar no faturamento */
  Fat.PRODUTO_DO_NEGOCIO = { investimentos: 'p_rf', consorcio: 'p_consorcio', seguro: 'p_vida', previdencia: 'p_prev', cambio: 'p_cambio', credito: 'p_outros', outro: 'p_outros' };

  /* ---------- Datas por mês ---------- */
  Fat.ym = d => String(d || '').slice(0, 7);
  Fat.ymHoje = () => U.today().slice(0, 7);
  Fat.addMes = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  Fat.nomeMes = (ym, longo) => { const [y, m] = ym.split('-').map(Number); const nomes = longo ? ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'] : ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']; return nomes[m - 1] + (longo ? ' de ' + y : '/' + String(y).slice(2)); };
  Fat.dia15 = ym => ym + '-15';
  /* Próximo dia de pagamento (dia 15): este mês se ainda não passou, senão o próximo */
  Fat.proximoPagamento = () => { const h = U.today(); return h.slice(8) <= '15' ? Fat.ymHoje() : Fat.addMes(Fat.ymHoje(), 1); };

  /* ---------- Cadastros ---------- */
  Fat.linhas = (todas) => Store.all('linhas').filter(l => todas || l.ativa !== false).sort((a, b) => (a.ordem || 50) - (b.ordem || 50) || a.nome.localeCompare(b.nome));
  Fat.linha = id => Store.get('linhas', id);
  Fat.linhaNome = id => (Fat.linha(id) || {}).nome || 'Sem linha';
  Fat.linhaCor = id => (Fat.linha(id) || {}).cor || '#8F88A6';
  Fat.produtos = linhaId => Store.all('produtos').filter(p => (!linhaId || p.linhaId === linhaId) && p.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome));
  Fat.produto = id => Store.get('produtos', id);
  Fat.produtoNome = id => (Fat.produto(id) || {}).nome || '—';
  Fat.regraTxt = (regra, n, grupo) => regra === 'parcelado' ? `${n || 1}x${grupo === 'novo' ? ' · grupo novo' : grupo === 'andamento' ? ' · em andamento' : ''}` : regra === 'mesmo_mes' ? 'Mesmo mês' : 'Dia 15 do mês seguinte';

  /* Primeiro uso do novo faturamento: cria linhas/produtos padrão e converte lançamentos antigos */
  Fat.garantir = () => {
    if (Store.config('fatV2')) return;
    let mudou = false;
    if (!Store.all('linhas').length) { DEF_LINHAS.forEach(l => Store.insert('linhas', { ...l, ativa: true }, { silent: true })); mudou = true; }
    if (!Store.all('produtos').length) { DEF_PRODUTOS.forEach(p => Store.insert('produtos', { ...p, ativo: true }, { silent: true })); mudou = true; }
    const antigos = Store.all('faturamento').slice();
    antigos.forEach(f => {
      const txt = ((f.cliente || '') + ' ' + (f.descricao || '')).toLowerCase();
      const produtoId = /eqseed/.test(txt) ? 'p_eqseed' : /dolarize/.test(txt) ? 'p_cambio' : Fat.PRODUTO_DO_NEGOCIO[f.tipo] || 'p_outros';
      const pr = Fat.produto(produtoId) || {};
      Fat.salvarProducao({ data: f.data || U.today(), cliente: f.cliente, linhaId: pr.linhaId || 'l_outras', produtoId, valor: f.valor, bruto: f.receita ?? f.valor, liquido: f.receita ?? null, regra: 'mes_seguinte', observacoes: [f.descricao, f.observacoes].filter(Boolean).join(' · '), atividadeId: f.atividadeId || null, demo: !!f.demo }, null, { silent: true });
      Store.remove('faturamento', f.id, { silent: true }); mudou = true;
    });
    if (mudou) Store.commit();
    Store.config('fatV2', true);
  };

  /* ---------- Produção -> recebíveis ---------- */
  Fat.datas = (data, regra, n, grupo) => {
    const ym = Fat.ym(data);
    if (regra === 'mesmo_mes') return [data];
    if (regra !== 'parcelado') return [Fat.dia15(Fat.addMes(ym, 1))];
    n = Math.max(1, Math.round(n || 1));
    return Array.from({ length: n }, (_, i) => { const k = i + 1; const off = grupo === 'novo' ? (k === 1 ? 1 : k + 1) : k; return Fat.dia15(Fat.addMes(ym, off)); });
  };
  /* Valores líquidos de cada parcela. Sem líquido informado, usa o bruto (marcado como estimado) */
  Fat.valores = p => {
    const n = p.regra === 'parcelado' ? Math.max(1, Math.round(p.parcelas || 1)) : 1;
    const estimado = p.liquido == null && p.liquidoParcela == null;
    let liq;
    if (p.regra === 'parcelado') {
      const por = p.liquidoParcela != null ? +p.liquidoParcela : (p.liquido != null ? +p.liquido / n : (+p.bruto || 0) / n);
      liq = Array.from({ length: n }, (_, i) => Math.round(por * 100) / 100);
      if (p.liquidoUltima != null && n > 1) liq[n - 1] = +p.liquidoUltima;
    } else liq = [p.liquido != null ? +p.liquido : (+p.bruto || 0)];
    const brPor = (+p.bruto || 0) / n;
    return { n, estimado, liq, bruto: liq.map(() => Math.round(brPor * 100) / 100) };
  };
  Fat.liquidoTotal = p => Fat.valores(p).liq.reduce((s, v) => s + v, 0);
  Fat.gerarRecebiveis = (prod, silent) => {
    const atuais = Store.where('recebiveis', r => r.producaoId === prod.id);
    const recebidos = new Set(atuais.filter(r => r.status === 'recebido').map(r => r.numero));
    Store.removeWhere('recebiveis', r => r.producaoId === prod.id && r.status !== 'recebido', { silent: true });
    const ds = Fat.datas(prod.data, prod.regra, prod.parcelas, prod.grupo), v = Fat.valores(prod);
    ds.forEach((dt, i) => {
      if (recebidos.has(i + 1)) return;
      Store.insert('recebiveis', { tipo: 'producao', producaoId: prod.id, linhaId: prod.linhaId, produtoId: prod.produtoId, cliente: prod.cliente || null, descricao: Fat.produtoNome(prod.produtoId), previstoEm: dt, numero: i + 1, total: ds.length, previsto: v.liq[i], bruto: v.bruto[i], estimado: v.estimado, status: 'previsto', demo: !!prod.demo }, { silent: true });
    });
    if (!silent) Store.commit();
  };
  Fat.salvarProducao = (dados, id, { silent } = {}) => {
    let p;
    if (id) p = Store.update('producoes', id, dados, { silent: true });
    else p = Store.insert('producoes', dados, { silent: true });
    Fat.gerarRecebiveis(p, true);
    if (!silent) Store.commit();
    return p;
  };
  Fat.excluirProducao = id => { Store.removeWhere('recebiveis', r => r.producaoId === id, { silent: true }); Store.remove('producoes', id, { silent: true }); Store.commit(); };
  Fat.recebidosDaProducao = id => Store.where('recebiveis', r => r.producaoId === id && r.status === 'recebido').length;

  /* ---------- Recebíveis do mês (inclui recorrências ainda não confirmadas) ---------- */
  Fat.recorrenciaAtiva = (rc, ym) => rc.ativa !== false && rc.inicio && Fat.ym(rc.inicio) <= ym && (!rc.fim || Fat.ym(rc.fim) >= ym);
  Fat.virtuais = ym => Store.all('recorrencias').filter(rc => Fat.recorrenciaAtiva(rc, ym) && !Store.all('recebiveis').some(r => r.recorrenciaId === rc.id && Fat.ym(r.previstoEm) === ym))
    .map(rc => ({ id: 'v_' + rc.id + '_' + ym, virtual: true, tipo: 'recorrente', recorrenciaId: rc.id, linhaId: rc.linhaId, cliente: null, descricao: rc.descricao, previstoEm: ym + '-' + String(rc.dia || 15).padStart(2, '0'), previsto: +rc.valor || 0, status: 'previsto' }));
  Fat.doMes = ym => [...Store.all('recebiveis').filter(r => Fat.ym(r.previstoEm) === ym), ...Fat.virtuais(ym)];
  Fat.valorRecebido = r => r.status === 'recebido' ? (r.recebido != null ? +r.recebido : +r.previsto || 0) : 0;
  Fat.pendente = r => r.status !== 'recebido' && r.previstoEm < U.today();
  Fat.marcarRecebido = (r, valor, silent) => {
    const v = valor != null ? valor : r.previsto;
    if (r.virtual) Store.insert('recebiveis', { tipo: 'recorrente', recorrenciaId: r.recorrenciaId, linhaId: r.linhaId, descricao: r.descricao, previstoEm: r.previstoEm, previsto: r.previsto, recebido: v, status: 'recebido', recebidoEm: U.nowISO() }, { silent });
    else Store.update('recebiveis', r.id, { status: 'recebido', recebido: v, recebidoEm: U.nowISO() }, { silent });
  };
  Fat.desmarcar = r => {
    if (r.virtual) return;
    if (r.tipo === 'recorrente') Store.remove('recebiveis', r.id);
    else Store.update('recebiveis', r.id, { status: 'previsto', recebido: null, recebidoEm: null });
  };
  Fat.resumoMes = ym => {
    const itens = Fat.doMes(ym);
    const out = { itens, previsto: 0, recebido: 0, aberto: 0, pendentes: 0, porLinha: {} };
    itens.forEach(r => {
      const rec = Fat.valorRecebido(r), prev = +r.previsto || 0;
      out.previsto += prev; out.recebido += rec; if (r.status !== 'recebido') { out.aberto += prev; if (Fat.pendente(r)) out.pendentes++; }
      const l = out.porLinha[r.linhaId] || (out.porLinha[r.linhaId] = { previsto: 0, recebido: 0, aberto: 0, n: 0 });
      l.previsto += prev; l.recebido += rec; if (r.status !== 'recebido') l.aberto += prev; l.n++;
    });
    return out;
  };
  /* Valor do mês para gráficos: recebido + o que ainda está em aberto */
  Fat.totalMes = ym => { const r = Fat.resumoMes(ym); return { recebido: r.recebido, aberto: r.aberto }; };

  /* Produção (competência): líquido gerado por mês e por linha */
  Fat.producoesDoMes = ym => Store.all('producoes').filter(p => Fat.ym(p.data) === ym);
  Fat.producaoEntre = (ymIni, ymFim) => Store.all('producoes').filter(p => { const k = Fat.ym(p.data); return k >= ymIni && k <= ymFim; });

  App.Fat = Fat;
})(window.App = window.App || {});
